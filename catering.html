    // --- ERGONOMIC INPUT COMPONENTS ---

    // 1. Tactile Number Stepper with Free Typing & Quick Presets
    function NumberStepper({
      value,
      onChange,
      min = 0,
      max = 9999,
      step = 1,
      suffix = '',
      size = 'md',
      presets = []
    }) {
      const [draft, setDraft] = useState(String(value));

      useEffect(() => {
        setDraft(String(value));
      }, [value]);

      const clamp = (num) => Math.min(max, Math.max(min, num));

      const handleDecrement = () => {
        const next = clamp((Number(value) || 0) - step);
        onChange(next);
      };

      const handleIncrement = () => {
        const next = clamp((Number(value) || 0) + step);
        onChange(next);
      };

      const isSm = size === 'sm';

      return (
        <div className="space-y-1.5">
          <div
            className={`inline-flex items-center bg-slate-950 border border-slate-700/90 focus-within:border-gold-500 rounded-xl overflow-hidden ${
              isSm ? 'h-8' : 'h-10 w-full sm:w-auto'
            }`}
          >
            <button
              type="button"
              onClick={handleDecrement}
              disabled={value <= min}
              className={`${
                isSm ? 'w-7 h-8 text-xs' : 'w-10 h-10 text-sm'
              } flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-gold-400 disabled:opacity-35 transition select-none`}
              aria-label="Decrease"
            >
              <i className="fa-solid fa-minus"></i>
            </button>

            <div className="flex items-center justify-center px-2">
              <input
                type="number"
                min={min}
                max={max}
                value={draft}
                onChange={(e) => {
                  setDraft(e.target.value);
                  const parsed = parseInt(e.target.value, 10);
                  if (!isNaN(parsed)) {
                    onChange(clamp(parsed));
                  }
                }}
                onBlur={() => {
                  const parsed = parseInt(draft, 10);
                  const finalVal = isNaN(parsed) ? min : clamp(parsed);
                  setDraft(String(finalVal));
                  onChange(finalVal);
                }}
                className={`${
                  isSm ? 'w-11 text-xs' : 'w-16 text-sm'
                } bg-transparent text-center font-bold text-slate-100 focus:outline-none`}
              />
              {suffix && (
                <span className="text-[11px] text-slate-400 font-medium select-none pr-1">
                  {suffix}
                </span>
              )}
            </div>

            <button
              type="button"
              onClick={handleIncrement}
              disabled={value >= max}
              className={`${
                isSm ? 'w-7 h-8 text-xs' : 'w-10 h-10 text-sm'
              } flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-gold-400 disabled:opacity-35 transition select-none`}
              aria-label="Increase"
            >
              <i className="fa-solid fa-plus"></i>
            </button>
          </div>

          {presets.length > 0 && (
            <div className="flex flex-wrap gap-1.5">
              {presets.map((preset) => (
                <button
                  key={preset}
                  type="button"
                  onClick={() => onChange(clamp(preset))}
                  className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition border ${
                    value === preset
                      ? 'bg-gold-500 text-slate-950 border-gold-400'
                      : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-gold-500/50 hover:text-gold-300'
                  }`}
                >
                  {preset} {suffix}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    // 2. Enhanced Event Date Picker with Interactive Calendar Popover & Quick Presets
    function SophisticatedDateInput({ value, onChange }) {
      const containerRef = useRef(null);
      const [isOpen, setIsOpen] = useState(false);

      const initialDate = useMemo(() => {
        if (value) {
          const [y, m, d] = value.split('-').map(Number);
          if (y && m && d) return new Date(y, m - 1, d);
        }
        return new Date();
      }, []);

      const [viewYear, setViewYear] = useState(initialDate.getFullYear());
      const [viewMonth, setViewMonth] = useState(initialDate.getMonth());

      // Sync visible calendar month/year whenever value changes externally (e.g. via presets)
      useEffect(() => {
        if (value) {
          const [y, m, d] = value.split('-').map(Number);
          if (y && m && d) {
            setViewYear(y);
            setViewMonth(m - 1);
          }
        }
      }, [value]);

      // Close calendar popover when clicking or tapping outside
      useEffect(() => {
        if (!isOpen) return;
        const handleOutside = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleOutside);
        document.addEventListener('touchstart', handleOutside);
        return () => {
          document.removeEventListener('mousedown', handleOutside);
          document.removeEventListener('touchstart', handleOutside);
        };
      }, [isOpen]);

      const formattedDisplay = useMemo(() => {
        if (!value) return null;
        const [y, m, d] = value.split('-').map(Number);
        if (!y || !m || !d) return value;
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
      }, [value]);

      const daysCountdown = useMemo(() => {
        if (!value) return null;
        const [y, m, d] = value.split('-').map(Number);
        if (!y || !m || !d) return null;
        const target = new Date(y, m - 1, d);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return 'Tomorrow';
        if (diffDays > 1) return `In ${diffDays} days`;
        return `${Math.abs(diffDays)}d ago`;
      }, [value]);

      const formatYMD = (year, monthIndex, day) => {
        const mm = String(monthIndex + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        return `${year}-${mm}-${dd}`;
      };

      const setPresetDate = (type) => {
        const now = new Date();
        if (type === 'today') {
          // keep today
        } else if (type === 'nextSat') {
          const day = now.getDay();
          const daysUntilSat = (6 - day + 7) % 7 || 7;
          now.setDate(now.getDate() + daysUntilSat);
        } else if (type === 'plus1m') {
          now.setMonth(now.getMonth() + 1);
        } else if (type === 'plus3m') {
          now.setMonth(now.getMonth() + 3);
        } else if (type === 'clear') {
          onChange('');
          setIsOpen(false);
          return;
        }
        onChange(formatYMD(now.getFullYear(), now.getMonth(), now.getDate()));
        setIsOpen(false);
      };

      const handlePrevMonth = () => {
        if (viewMonth === 0) {
          setViewMonth(11);
          setViewYear((y) => y - 1);
        } else {
          setViewMonth((m) => m - 1);
        }
      };

      const handleNextMonth = () => {
        if (viewMonth === 11) {
          setViewMonth(0);
          setViewYear((y) => y + 1);
        } else {
          setViewMonth((m) => m + 1);
        }
      };

      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      const calendarCells = useMemo(() => {
        const firstDayOfWeek = new Date(viewYear, viewMonth, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

        const cells = [];
        // Leading previous-month days
        for (let i = firstDayOfWeek - 1; i >= 0; i--) {
          cells.push({
            day: daysInPrevMonth - i,
            inCurrentMonth: false,
            dateStr: null
          });
        }
        // Current-month days
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({
            day: d,
            inCurrentMonth: true,
            dateStr: formatYMD(viewYear, viewMonth, d)
          });
        }
        // Trailing next-month days to complete 35 or 42 grid cells
        const totalCells = cells.length <= 35 ? 35 : 42;
        let nextDay = 1;
        while (cells.length < totalCells) {
          cells.push({
            day: nextDay++,
            inCurrentMonth: false,
            dateStr: null
          });
        }
        return cells;
      }, [viewYear, viewMonth]);

      const todayStr = useMemo(() => {
        const t = new Date();
        return formatYMD(t.getFullYear(), t.getMonth(), t.getDate());
      }, []);

      const yearOptions = useMemo(() => {
        const baseYear = new Date().getFullYear();
        const list = [];
        for (let y = baseYear - 1; y <= baseYear + 5; y++) {
          list.push(y);
        }
        return list;
      }, []);

      return (
        <div ref={containerRef} className="relative space-y-1.5">
          {/* Trigger Bar */}
          <button
            type="button"
            onClick={() => setIsOpen((prev) => !prev)}
            className={`w-full h-10 bg-slate-950 border rounded-xl px-3 flex items-center justify-between cursor-pointer transition text-left ${
              isOpen ? 'border-gold-500 ring-2 ring-gold-500/20' : 'border-slate-700/90 hover:border-gold-500/70'
            }`}
            aria-expanded={isOpen}
            aria-label="Select Event Date"
          >
            <div className="flex items-center gap-2.5 truncate">
              <i className="fa-regular fa-calendar text-gold-400 text-xs"></i>
              {formattedDisplay ? (
                <span className="text-xs font-semibold text-slate-100 truncate">{formattedDisplay}</span>
              ) : (
                <span className="text-xs text-slate-500">Click to choose event date...</span>
              )}
            </div>
            <div className="flex items-center gap-2 flex-shrink-0 ml-2">
              {daysCountdown && (
                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gold-500/15 text-gold-300 border border-gold-500/30">
                  {daysCountdown}
                </span>

    const DEFAULT_GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/100fRNyT3vE96lz6TsaA-os9rwp0S4EUdqpJFaKR7S9k/edit?usp=sharing';
    const DEFAULT_APPS_SCRIPT_URL = '';

    const extractSpreadsheetId = (url) => {
      if (!url) return null;
      const match = String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : null;
    };

    const GOOGLE_APPS_SCRIPT_CODE = `function doGet(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = sheet.getDataRange().getValues();
    var dishes = [];
    for (var i = 1; i < data.length; i++) {
      if (data[i][1]) {
        dishes.push({
          id: String(data[i][0] || ('row_' + i)),
          name: String(data[i][1]),
          category: String(data[i][2] || 'Special / Custom'),
          price: Number(data[i][3]) || 0,
          createdAt: Number(data[i][4]) || 0
        });
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ status: 'success', dishes: dishes }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var payload = JSON.parse(e.postData.contents);

    if (sheet.getLastRow() === 0) {
      sheet.appendRow(['ID', 'Dish Name', 'Category', 'Price Per Pax', 'Created At']);
    }

    if (payload.action === 'add') {
      sheet.appendRow([payload.id, payload.name, payload.category, Number(payload.price), payload.createdAt || Date.now()]);
    } else if (payload.action === 'bulk_add' && Array.isArray(payload.items)) {
      payload.items.forEach(function(item) {
        sheet.appendRow([item.id, item.name, item.category, Number(item.price), Date.now()]);
      });
    } else if (payload.action === 'delete') {
      var data = sheet.getDataRange().getValues();
      var lastIndex = data.length - 1;
      for (var i = lastIndex; i >= 1; i--) {
        if (String(data[i][0]) === String(payload.id)) {
          sheet.deleteRow(i + 1);
          break;
        }
      }
    }

    return ContentService.createTextOutput(JSON.stringify({ status: 'success' }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

      const showToast = (msg) => {

        setTimeout(() => {
          setToastNotice(prev => (prev === msg ? '' : prev));
        }, 4200);
      };

      // Parse rows returned by Google Visualization JSONP API
      const parseGoogleSheetGvizRows = (table) => {
        if (!table || !Array.isArray(table.rows)) return [];
        const parsed = [];
        table.rows.forEach((row, idx) => {
          const cells = row.c || [];
          const c0 = cells[0]?.v != null ? String(cells[0].v).trim() : '';
          const c1 = cells[1]?.v != null ? String(cells[1].v).trim() : '';
          const c2 = cells[2]?.v != null ? String(cells[2].v).trim() : '';
          const c3 = cells[3]?.v != null ? cells[3].v : null;

          // Skip header rows
          if (
            c0.toLowerCase() === 'id' ||
            c0.toLowerCase() === 'dish name' ||
            c1.toLowerCase() === 'dish name'
          ) {
            return;
          }

          // Format A: [ID, Dish Name, Category, Price Per Pax, Created At]
          if (c1 && (c3 !== null && !isNaN(Number(c3)))) {
            parsed.push({
              id: c0 || `gs_row_${idx}`,
              name: c1,
              category: c2 || 'Special / Custom',
              price: Number(c3) || 0
            });
          } else if (c0 && c2 !== '' && !isNaN(Number(c2))) {
            // Format B: [Dish Name, Category, Price Per Pax]
            parsed.push({
              id: `gs_row_${idx}`,
              name: c0,
              category: c1 || 'Special / Custom',
              price: Number(c2) || 0
            });
          }
        });
        return parsed;
      };

      // CORS-safe JSONP loader for Google Sheets Visualization API
      const loadGoogleSheetJsonp = (spreadsheetId) => {
        return new Promise((resolve, reject) => {
          const callbackName = `__eynsSheetCb_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
          const script = document.createElement('script');
          let settled = false;

          const cleanup = () => {
            if (window[callbackName]) {
              try {
                delete window[callbackName];
              } catch (e) {
                window[callbackName] = undefined;
              }
            }
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }
          };

          const timeoutId = setTimeout(() => {
            if (!settled) {
              settled = true;
              cleanup();
              reject(new Error('Google Sheet request timed out. Ensure sharing is set to "Anyone with the link".'));
            }
          }, 7000);

          window[callbackName] = (response) => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            cleanup();
            if (response && response.status === 'ok' && response.table) {
              resolve(response.table);
            } else {
              const reason = response?.errors?.[0]?.detailed_message || 'Sheet is restricted or returned an error.';
              reject(new Error(reason));
            }
          };

          script.onerror = () => {
            if (!settled) {
              settled = true;
              clearTimeout(timeoutId);
              cleanup();
              reject(new Error('Sheet is restricted or unreachable. Set Share access to "Anyone with the link (Viewer)".'));
            }
          };

          script.src = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=responseHandler:${callbackName}&t=${Date.now()}`;
          document.head.appendChild(script);
        });
      };

      // Fetch A La Carte Menu Items from Google Sheets
      const fetchDishesFromSheet = async (targetSheetUrl = sheetUrl, targetScriptUrl = appsScriptUrl, silent = false) => {
        const cleanScriptUrl = (targetScriptUrl || '').trim();
        const cleanSheetUrl = (targetSheetUrl || '').trim();
        const effectiveScriptUrl = cleanScriptUrl || (cleanSheetUrl.includes('script.google.com') ? cleanSheetUrl : '');
        const spreadsheetId = extractSpreadsheetId(cleanSheetUrl);

        if (!effectiveScriptUrl && !spreadsheetId) return;

        if (effectiveScriptUrl && effectiveScriptUrl.endsWith('/dev')) {
          const devMsg = 'You entered a "/dev" Test Deployment URL. Google locks "/dev" links to your private login. Use Deploy → New deployment and copy the URL ending in "/exec".';
          setSheetSyncError(devMsg);
          if (!silent) showToast(devMsg);
          return;
        }

        setIsSyncingSheet(true);
        setSheetSyncError('');
        try {
          let normalized = [];

          if (effectiveScriptUrl) {
            const separator = effectiveScriptUrl.includes('?') ? '&' : '?';
            const response = await fetch(`${effectiveScriptUrl}${separator}t=${Date.now()}`, {
              method: 'GET',
              redirect: 'follow'
            });
            const data = await response.json();
            if (data && Array.isArray(data.dishes)) {
              normalized = data.dishes.map((d, idx) => ({
                id: String(d.id || `gs_${idx}_${Date.now()}`),
                name: String(d.name || '').trim(),
                category: String(d.category || 'Special / Custom').trim(),
                price: Number(d.price) || 0,
                createdAt: Number(d.createdAt) || 0
              })).filter(d => d.name);
            } else {
              throw new Error('Unexpected response structure from Apps Script.');
            }
          } else if (spreadsheetId) {
            const table = await loadGoogleSheetJsonp(spreadsheetId);
            normalized = parseGoogleSheetGvizRows(table);
          }

          setSheetDishes(normalized);
          setSheetSyncError('');
          setSheetLastSynced(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          if (!silent) {
            showToast(`Synced ${normalized.length} menu item(s) from your Google Sheet!`);
          }
        } catch (err) {
          const msg = err?.message || 'Could not read Google Sheet. Ensure sharing is set to "Anyone with the link can view".';
          setSheetSyncError(msg);
          if (!silent) {
            showToast(msg);
          }
        } finally {
          setIsSyncingSheet(false);
        }
      };

      // Load saved Google Sheet URL on startup and sync silently
      useEffect(() => {
        try {
          const savedSheet = localStorage.getItem('eyns_google_sheet_url');
          const savedScript = localStorage.getItem('eyns_google_apps_script_url');
          const activeSheet = savedSheet || DEFAULT_GOOGLE_SHEET_URL;
          const activeScript = savedScript || DEFAULT_APPS_SCRIPT_URL;
          setSheetUrl(activeSheet);
          setSheetUrlInput(activeSheet);
          setAppsScriptUrl(activeScript);
          setAppsScriptUrlInput(activeScript);
          fetchDishesFromSheet(activeSheet, activeScript, true);
        } catch (e) {
          fetchDishesFromSheet(DEFAULT_GOOGLE_SHEET_URL, DEFAULT_APPS_SCRIPT_URL, true);
        }
      }, []);

      // Save Google Sheet connection URLs
      const handleSaveSheetConnection = (e) => {
        e.preventDefault();
        const trimmedSheet = sheetUrlInput.trim();
        const trimmedScript = appsScriptUrlInput.trim();
        setSheetUrl(trimmedSheet);
        setAppsScriptUrl(trimmedScript);
        try {
          localStorage.setItem('eyns_google_sheet_url', trimmedSheet);
          localStorage.setItem('eyns_google_apps_script_url', trimmedScript);
        } catch (err) {}
        if (trimmedSheet || trimmedScript) {
          fetchDishesFromSheet(trimmedSheet, trimmedScript, false);
        } else {
          setSheetDishes([]);
          setSheetLastSynced('');
          setSheetSyncError('');
          showToast('Disconnected Google Sheet.');
        }
      };

      // Copy tab-separated rows ready to paste directly into cell A1 of Google Sheets
      const handleCopySheetRows = () => {
        const rows = [
          ['ID', 'Dish Name', 'Category', 'Price Per Pax', 'Created At'].join('\t')
        ];
        Object.entries(FULL_A_LA_CARTE_CATALOG).forEach(([cat, items]) => {
          items.forEach((item) => {
            rows.push([item.id, item.name, cat, item.price, Date.now()].join('\t'));
          });
        });
        const tsvContent = rows.join('\n');
        const textarea = document.createElement('textarea');
        textarea.value = tsvContent;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('Copied all menu rows! Open your Google Sheet, click cell A1, and press Ctrl+V.');

      // Download Starter CSV for Google Sheets
      const handleDownloadStarterCsv = () => {
        const rows = [['ID', 'Dish Name', 'Category', 'Price Per Pax', 'Created At']];
        Object.entries(FULL_A_LA_CARTE_CATALOG).forEach(([cat, items]) => {
          items.forEach((item) => {
            rows.push([item.id, `"${item.name.replace(/"/g, '""')}"`, `"${cat}"`, item.price, Date.now()]);
          });
        });
        const csvContent = rows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'EYNS_ALaCarte_Menu_Template.csv';
        link.click();
        showToast('Downloaded starter CSV! Import it into Google Sheets via File → Import.');
      };

      // Copy Apps Script Code to Clipboard
      const handleCopyAppsScript = () => {
        const textarea = document.createElement('textarea');
        textarea.value = GOOGLE_APPS_SCRIPT_CODE;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('Apps Script code copied! Paste it into Extensions → Apps Script in your Google Sheet.');
      };

      // Bulk-Seed Built-In Catalog to Connected Google Sheet
      const handleSeedCatalogToSheet = async () => {
        const effectiveScriptUrl = (appsScriptUrl || '').trim() || (sheetUrl.includes('script.google.com') ? sheetUrl.trim() : '');
        if (!effectiveScriptUrl) {
          showToast('To auto-export via script, paste your Apps Script /exec URL in field #2, OR click "Copy Menu Rows (Paste in A1)".');
          return;
        }
        setIsBulkSeeding(true);
        try {
          const items = [];
          Object.entries(FULL_A_LA_CARTE_CATALOG).forEach(([cat, list]) => {
            list.forEach((dish) => {
              items.push({ id: dish.id, name: dish.name, category: cat, price: dish.price });
            });
          });
          await fetch(effectiveScriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'bulk_add', items })
          });
          setTimeout(() => {
            fetchDishesFromSheet(sheetUrl, appsScriptUrl, true);
            setIsBulkSeeding(false);
            showToast(`Exported ${items.length} built-in dishes to your Google Sheet!`);
          }, 1500);
        } catch (err) {
          setIsBulkSeeding(false);
          showToast('Failed to export built-in menu to Google Sheet.');
        }
      };

      // Delete Custom Dish from Google Sheet
      const handleDeleteSheetDish = async (dishId) => {
        setSheetDishes(prev => prev.filter(d => d.id !== dishId));
        setConfirmDeleteDishId(null);
        const effectiveScriptUrl = (appsScriptUrl || '').trim() || (sheetUrl.includes('script.google.com') ? sheetUrl.trim() : '');
        if (!effectiveScriptUrl) return;
        try {
          await fetch(effectiveScriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', id: dishId })
          });
          showToast('Removed dish from Google Sheet.');
        } catch (err) {
          showToast('Could not remove row from Google Sheet.');
        }
      };

      // Merged Catalog (Built-In + Google Sheets Live Overrides/Additions)
      const mergedCatalogByCategory = useMemo(() => {
        const map = {};
        Object.entries(FULL_A_LA_CARTE_CATALOG).forEach(([cat, items]) => {
          map[cat] = items.map(item => ({ ...item, category: cat, isSheetItem: false }));
        });

        sheetDishes.forEach((sd) => {
          const cat = sd.category || 'Special / Custom';
          if (!map[cat]) map[cat] = [];
          const existingIdx = map[cat].findIndex(
            i => i.id === sd.id || i.name.toLowerCase() === sd.name.toLowerCase()
          );
          if (existingIdx >= 0) {
            map[cat][existingIdx] = {
              ...map[cat][existingIdx],
              id: sd.id,
              name: sd.name,
              price: sd.price,
              isSheetItem: true
            };
          } else {
            map[cat].push({
              id: sd.id,
              name: sd.name,
              price: sd.price,
              category: cat,
              isSheetItem: true
            });
          }
        });

        return map;
      }, [sheetDishes]);

      const allCatalogCategories = useMemo(() => {
        return ['All', ...Object.keys(mergedCatalogByCategory)];
      }, [mergedCatalogByCategory]);

      const filteredCatalogDishes = useMemo(() => {
        let list = [];
        if (catalogCategory === 'All') {
          Object.values(mergedCatalogByCategory).forEach(items => {
            list = list.concat(items);
          });
        } else {
          list = mergedCatalogByCategory[catalogCategory] || [];
        }
        if (catalogSearch.trim()) {
          const q = catalogSearch.toLowerCase();
          list = list.filter(d => d.name.toLowerCase().includes(q) || d.category.toLowerCase().includes(q));
        }
        return list;
      }, [mergedCatalogByCategory, catalogCategory, catalogSearch]);

      // --- QUOTATION HANDLERS ---

      const selectedPkg = useMemo(() => {
        return PACKAGES.find(p => p.id === selectedPackageId) || PACKAGES[0];
      }, [selectedPackageId]);

      // Add or increment dish in current quotation
      const handleAddCatalogDishToQuote = (dish) => {
        setCustomDishes(prev => {
          const existing = prev.find(d => d.id === dish.id || d.name.toLowerCase() === dish.name.toLowerCase());
          if (existing) {
            return prev.map(d => d.id === existing.id ? { ...d, pax: guestCount } : d);
          }
          return [...prev, { id: dish.id, name: dish.name, price: dish.price, pax: guestCount }];
        });
        if (selectedPackageId === 'entry' || selectedPackageId === 'essential') {
          setIsCustomMenu(true);
        }
        showToast(`Added "${dish.name}" (${guestCount} pax) to quotation.`);
      };

      const handleUpdateDishPax = (dishId, nextPax) => {
        if (nextPax <= 0) {
          setCustomDishes(prev => prev.filter(d => d.id !== dishId));
        } else {
          setCustomDishes(prev => prev.map(d => d.id === dishId ? { ...d, pax: nextPax } : d));
        }
      };

      const handleSyncAllDishesToGuestCount = () => {
        setCustomDishes(prev => prev.map(d => ({ ...d, pax: guestCount })));
        showToast(`Synced all selected dishes to ${guestCount} pax.`);
      };

      // Add Special / Custom Dish (with optional Google Sheet save)
      const handleCreateSpecialDish = async (e) => {
        e.preventDefault();
        const trimmedName = newDishName.trim();
        const priceVal = parseFloat(newDishPrice);
        const paxVal = parseInt(newDishPax, 10) || guestCount;

        if (!trimmedName || isNaN(priceVal) || priceVal < 0) {
          showToast('Please enter a valid dish name and per-pax price.');
          return;
        }

        const dishId = `custom_${Date.now()}`;
        const newEntry = {
          id: dishId,
          name: trimmedName,
          category: newDishCategory,
          price: priceVal,
          pax: paxVal
        };

        setCustomDishes(prev => [...prev, newEntry]);
        setNewDishName('');
        setNewDishPrice('');

        if (saveDishToCatalog) {
          const sheetRecord = {
            id: dishId,
            name: trimmedName,
            category: newDishCategory,
            price: priceVal,
            createdAt: Date.now()
          };
          setSheetDishes(prev => [...prev, sheetRecord]);

          const effectiveScriptUrl = (appsScriptUrl || '').trim() || (sheetUrl.includes('script.google.com') ? sheetUrl.trim() : '');
          if (effectiveScriptUrl) {
            try {
              await fetch(effectiveScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'add', ...sheetRecord })
              });
              showToast(`Added "${trimmedName}" to quotation & saved to Google Sheet!`);
            } catch (err) {
              showToast(`Added "${trimmedName}" to quotation (offline catalog save).`);
            }
          } else {
            showToast(`Added "${trimmedName}" to quotation & catalog! (Link Apps Script in Sheets DB for 2-way write).`);
          }
        } else {
          showToast(`Added "${trimmedName}" to current quotation.`);
        }
      };

      // Add Ad-Hoc Custom Line Item
      const handleAddAdHocItem = (e) => {
        e.preventDefault();
        const trimmed = newAdHocName.trim();
        const priceVal = parseFloat(newAdHocPrice);
        const qtyVal = parseInt(newAdHocQty, 10) || 1;
        if (!trimmed || isNaN(priceVal) || priceVal < 0) {
          showToast('Enter a valid custom item description and price.');
          return;
        }
        setAdHocItems(prev => [
          ...prev,
          {
            id: `adhoc_${Date.now()}`,
            name: trimmed,
            price: priceVal,
            qty: qtyVal,
            perPax: newAdHocPerPax
          }
        ]);
        setNewAdHocName('');
        setNewAdHocPrice('');
        setNewAdHocQty(1);
        setNewAdHocPerPax(false);
      };

      // Update Individual Room Nights
      const updateRoomQty = (roomId, nights) => {
        const val = Math.max(0, parseInt(nights, 10) || 0);
        setSelectedRooms(prev => {
          const next = { ...prev };
          if (val === 0) {
            delete next[roomId];
          } else {
            next[roomId] = val;
          }
          return next;
        });
      };

      // Reset Entire Quote
      const handleResetQuote = () => {
        setClientName('');
        setClientContact('');
        setEventDate('');
        setOccasion('Wedding Reception');
        setGuestCount(100);
        setSelectedPackageId('entry');
        setIsCustomMenu(false);
        setCustomDishes([]);
        setAutoScaleOps(true);
        setAddons({ tablesChairs: false, acRental: false, soundSystem: false, stage: 'none' });
        setAdHocItems([]);
        setSelectedRooms({});
        setTaxType('none');
        setDiscountAmount(0);
        setDiscountNote('');
        setAmountPaid(0);
        showToast('Started a fresh quotation.');
      };

      // --- FINANCIAL CALCULATIONS ---

      // 1. Base Package Cost
      const basePackageCost = useMemo(() => {
        if (selectedPackageId === 'food_packs' || selectedPackageId === 'from_scratch') return 0;
        if (selectedPackageId === 'styling_only') return selectedPkg.baseSetup;
        return selectedPkg.baseSetup + (selectedPkg.perPaxRate * guestCount);
      }, [selectedPackageId, selectedPkg, guestCount]);

      // 2. Custom Menu Food Credit (-₱300/pax for Entry & Essential when Build Custom Menu is enabled)
      const foodCreditDeduction = useMemo(() => {
        if (!isCustomMenu) return 0;
        if (selectedPackageId !== 'entry' && selectedPackageId !== 'essential') return 0;
        return 300 * guestCount;
      }, [isCustomMenu, selectedPackageId, guestCount]);

      // 3. Dishes Total (A La Carte + Special/Custom Dishes)
      const dishesTotal = useMemo(() => {
        return customDishes.reduce((sum, dish) => sum + (dish.price * dish.pax), 0);
      }, [customDishes]);

      // 4. Auto-Scaled Operational Charges (Triggers starting at 101+ guests unless overridden)
      const additionalTiers = useMemo(() => {
        if (selectedPackageId === 'food_packs' || selectedPackageId === 'from_scratch') return 0;
        return Math.max(0, Math.ceil(guestCount / 100) - 1);
      }, [guestCount, selectedPackageId]);

      const extraBuffetCost = useMemo(() => {
        return (additionalTiers > 0 && autoScaleOps) ? additionalTiers * 3500 : 0;
      }, [additionalTiers, autoScaleOps]);

      const extraStaffingCost = useMemo(() => {
        return (additionalTiers > 0 && autoScaleOps) ? additionalTiers * 7500 : 0;
      }, [additionalTiers, autoScaleOps]);

      // 5. Standard Add-ons Total
      const standardAddonsTotal = useMemo(() => {
        let sum = 0;
        if (addons.tablesChairs) sum += 50 * guestCount;
        if (addons.acRental) sum += 10000;
        if (addons.soundSystem) sum += 5000;
        if (addons.stage === 'simple') sum += 5000;
        if (addons.stage === 'thematic') sum += 15000;
        return sum;
      }, [addons, guestCount]);

      // 6. Ad-Hoc Custom Line Items Total
      const adHocTotal = useMemo(() => {
        return adHocItems.reduce((sum, item) => {
          const multiplier = item.perPax ? guestCount : item.qty;
          return sum + (item.price * multiplier);
        }, 0);
      }, [adHocItems, guestCount]);

      // 7. Individual Hotel Rooms Total
      const roomsTotal = useMemo(() => {
        return Object.entries(selectedRooms).reduce((sum, [roomId, nights]) => {
          const room = ROOMS.find(r => r.id === roomId);
          return sum + (room ? room.price * nights : 0);
        }, 0);
      }, [selectedRooms]);

      // 8. Subtotal, Discount, Tax, Grand Total & Balance
      const grossSubtotal = useMemo(() => {
        return Math.max(0, basePackageCost - foodCreditDeduction)
          + dishesTotal
          + extraBuffetCost
          + extraStaffingCost
          + standardAddonsTotal
          + adHocTotal
          + roomsTotal;
      }, [
        basePackageCost,
        foodCreditDeduction,
        dishesTotal,
        extraBuffetCost,
        extraStaffingCost,
        standardAddonsTotal,
        adHocTotal,
        roomsTotal
      ]);

      const effectiveDiscount = Math.min(grossSubtotal, Math.max(0, discountAmount));
      const netTaxableSubtotal = Math.max(0, grossSubtotal - effectiveDiscount);

      const taxAmount = useMemo(() => {
        if (taxType === 'vat') return netTaxableSubtotal * 0.12;
        if (taxType === 'gov') return netTaxableSubtotal * 0.07;
        return 0;
      }, [netTaxableSubtotal, taxType]);

      const grandTotal = netTaxableSubtotal + taxAmount;
      const balanceDue = Math.max(0, grandTotal - amountPaid);

      // Filtered Rooms for Step 5
      const filteredRooms = useMemo(() => {
        if (roomTierFilter === 'All') return ROOMS;
        if (roomTierFilter === 'Reserved') return ROOMS.filter(r => (selectedRooms[r.id] || 0) > 0);
        return ROOMS.filter(r => r.tier === roomTierFilter);
      }, [roomTierFilter, selectedRooms]);

      // --- EXPORT & PRINT HANDLERS ---

      // Print Official A4 Sheet via Hidden Iframe
      const handlePrintA4 = () => {
        if (!printRef.current) return;
        const contentHtml = printRef.current.innerHTML;
        const iframe = document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);

        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(`
          <!DOCTYPE html>
          <html>
            <head>
              <base href="${window.location.href}" />
              <title>EYNS ${docType} - ${clientName || 'Client'}</title>
              <script src="https://cdn.tailwindcss.com"><\/script>
              <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
              <style>
                @page { size: A4; margin: 12mm; }
                body { font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; background: #ffffff; }
                .font-serif { font-family: 'Playfair Display', serif; }
              </style>
            </head>
            <body onload="setTimeout(function() { window.print(); setTimeout(function() { window.frameElement.remove(); }, 800); }, 400);">
              <div class="max-w-3xl mx-auto p-4">
                ${contentHtml}
              </div>
            </body>
          </html>
        `);
        doc.close();
      };

      // Export High-Resolution JPEG via html2canvas
      const handleDownloadJpeg = async () => {
        if (!printRef.current || typeof html2canvas === 'undefined') {
          showToast('Image exporter is still loading. Please try again in a second.');
          return;
        }
        setIsExportingJpeg(true);
        try {
          const canvas = await html2canvas(printRef.current, {
            scale: 2.5,
            backgroundColor: '#ffffff',
            useCORS: true,
            logging: false
          });
          const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
          const link = document.createElement('a');
          const safeClient = (clientName || 'Client').replace(/[^a-zA-Z0-9_-]/g, '_');
          link.download = `EYNS_${docType}_${safeClient}.jpg`;
          link.href = dataUrl;
          link.click();
          showToast(`Saved ${docType} as high-res JPEG!`);
        } catch (err) {
          showToast('Could not generate JPEG image. Please try printing instead.');
        } finally {
          setIsExportingJpeg(false);
        }
      };

      // Format Event Date nicely for Document
      const formattedEventDateDoc = useMemo(() => {
        if (!eventDate) return 'To Be Determined';
        const [y, m, d] = eventDate.split('-').map(Number);
        if (!y || !m || !d) return eventDate;
        return new Date(y, m - 1, d).toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
      }, [eventDate]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">

          {/* TOP NAVIGATION HEADER */}
          <header className="no-print sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/90 px-4 lg:px-8 py-3">
            <div className="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-3">
              {/* Brand */}
              <div className="flex items-center gap-3">
                <EynsCrestLogo className="w-10 h-10 flex-shrink-0" />
                <div>
                  <h1 className="font-serif text-lg sm:text-xl font-bold tracking-wide text-gold-300 leading-tight">
                    EYNS HOTEL & RESTAURANT
                  </h1>
                  <p className="text-[11px] text-slate-400">
                    Banquet, Catering & Room Reservation Quotation System
                  </p>
                </div>
              </div>

              {/* Main Navigation Tabs */}
              <nav className="flex items-center gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800 overflow-x-auto max-w-full">
                {[
                  { id: 'builder', label: 'Quotation Builder', icon: 'fa-file-invoice-dollar' },
                  { id: 'packages', label: 'Official Packages', icon: 'fa-crown' },
                  { id: 'catalog', label: 'A La Carte Menu Catalog', icon: 'fa-utensils' },
                  { id: 'rooms', label: 'Hotel Rooms (1–18)', icon: 'fa-bed' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 whitespace-nowrap ${
                      activeTab === tab.id
                        ? 'bg-gold-500 text-slate-950 shadow'
                        : 'text-slate-300 hover:text-white hover:bg-slate-800/70'
                    }`}
                  >
                    <i className={`fa-solid ${tab.icon}`}></i>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* Right Utilities */}
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setShowSheetModal(true)}
                  className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-950/60 hover:bg-emerald-900/70 text-emerald-300 border border-emerald-500/40 transition flex items-center gap-1.5"
                >
                  <i className="fa-solid fa-table"></i>
                  <span>Sheets DB</span>
                  <span className={`w-2 h-2 rounded-full ${sheetSyncError ? 'bg-amber-400' : 'bg-emerald-400'}`}></span>
                </button>

                <button
                  type="button"
                  onClick={handleResetQuote}
                  className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 transition flex items-center gap-1.5"
                  title="Reset all inputs for a new quote"
                >
                  <i className="fa-solid fa-rotate-right"></i>
                  <span className="hidden sm:inline">New Quote</span>
                </button>
              </div>
            </div>
          </header>

          {/* TAB 1: OFFICIAL PACKAGES OVERVIEW */}
          {activeTab === 'packages' && (
            <main className="max-w-7xl mx-auto w-full p-4 sm:p-8 space-y-6">
              <div className="flex flex-wrap items-end justify-between gap-4 border-b border-slate-800 pb-4">
                <div>
                  <h2 className="font-serif text-2xl sm:text-3xl font-bold text-gold-300">Official Banquet & Catering Packages</h2>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1">
                    Select any package below to load it directly into the Quotation Builder.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => setActiveTab('builder')}
                  className="bg-gold-500 hover:bg-gold-400 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition"
                >
                  Go to Quotation Builder →
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {PACKAGES.map(pkg => (
                  <div
                    key={pkg.id}
                    className={`rounded-2xl border p-6 flex flex-col justify-between transition ${
                      selectedPackageId === pkg.id
                        ? 'bg-slate-900 border-gold-500 shadow-lg shadow-gold-500/10'
                        : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    <div className="space-y-4">
                      <div>
                        <span className="text-[10px] uppercase tracking-wider font-bold text-gold-400">{pkg.tagline}</span>
                        <h3 className="font-serif text-xl font-bold text-white mt-0.5">{pkg.name}</h3>
                        <p className="text-xs text-slate-400 mt-2 leading-relaxed">{pkg.desc}</p>
                      </div>

                      {/* Tier Price Matrix (Hidden for Custom Package) */}
                      {!pkg.hidePriceBox && pkg.id !== 'food_packs' && pkg.id !== 'styling_only' && (
                        <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-3 grid grid-cols-3 gap-2 text-center">
                          <div>
                            <div className="text-[10px] text-slate-400">50 Pax</div>
                            <div className="text-xs font-bold text-gold-300">₱{pkg.p50.toLocaleString()}</div>
                          </div>
                          <div className="border-x border-slate-800">
                            <div className="text-[10px] text-slate-400">100 Pax</div>
                            <div className="text-xs font-bold text-gold-300">₱{pkg.p100.toLocaleString()}</div>
                          </div>
                          <div>
                            <div className="text-[10px] text-slate-400">150 Pax</div>
                            <div className="text-xs font-bold text-gold-300">₱{pkg.p150.toLocaleString()}</div>
                          </div>
                        </div>
                      )}

                      {!pkg.hidePriceBox && pkg.id === 'styling_only' && (
                        <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-3 text-center">
                          <div className="text-[10px] text-slate-400">Base Setup & Styling Rate</div>
                          <div className="text-sm font-bold text-gold-300">₱25,000 Flat Setup + A La Carte Menu</div>
                        </div>
                      )}

                      {!pkg.hidePriceBox && pkg.id === 'food_packs' && (
                        <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-3 text-center">
                          <div className="text-[10px] text-slate-400">Pricing Structure</div>
                          <div className="text-sm font-bold text-gold-300">₱0 Base • Pay Strictly Per Dish</div>
                        </div>
                      )}

                      <div className="space-y-1.5 pt-1">
                        <p className="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Key Inclusions:</p>
                        <ul className="space-y-1.5">
                          {pkg.inclusions.map((inc, i) => (
                            <li key={i} className="text-xs text-slate-300 flex items-start gap-2">
                              <i className="fa-solid fa-check text-gold-400 text-[10px] mt-1"></i>
                              <span>{inc}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={() => {
                        setSelectedPackageId(pkg.id);
                        setActiveTab('builder');
                      }}
                      className="mt-6 w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-gold-500 hover:bg-gold-400 text-slate-950 transition"
                    >
                      Select {pkg.name}
                    </button>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* TAB 2: A LA CARTE MENU CATALOG */}
          {activeTab === 'catalog' && (
            <main className="max-w-7xl mx-auto w-full p-4 sm:p-8 space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div>
                  <h2 className="font-serif text-2xl sm:text-3xl font-bold text-gold-300">A La Carte Menu Catalog</h2>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1">
                    Synced with your Google Sheets database. Click any dish to add it to your active quotation.
                  </p>
                </div>

                  <a

                                </td>
                                <td className="py-1.5 text-center">{qty}</td>
                                <td className="py-1.5 text-right font-semibold">₱{(item.price * qty).toLocaleString()}</td>
                              </tr>
                            );
                          })}

                          {/* Individual Hotel Room Reservations */}
                          {Object.entries(selectedRooms).map(([roomId, nights]) => {
                            if (nights <= 0) return null;
                            const room = ROOMS.find(r => r.id === roomId);
                            if (!room) return null;
                            return (
                              <tr key={roomId}>
                                <td className="py-1.5 pl-2 text-slate-700">
                                  <span className="font-semibold text-slate-900">• {room.name}</span>
                                  <span className="text-[10px] text-slate-500 ml-1">({room.bed} @ ₱{room.price.toLocaleString()}/night)</span>
                                </td>
                                <td className="py-1.5 text-center">{nights} night{nights > 1 ? 's' : ''}</td>
                                <td className="py-1.5 text-right font-semibold">₱{(room.price * nights).toLocaleString()}</td>
                              </tr>
                            );
                          })}

                        </tbody>
                      </table>

                      {/* Totals & Balance Reconciliation */}
                      <div className="border-t-2 border-slate-300 pt-3 space-y-1.5 text-[11px]">
                        <div className="flex justify-between text-slate-600">
                          <span>Gross Subtotal:</span>
                          <span className="font-semibold text-slate-900">₱{grossSubtotal.toLocaleString()}</span>
                        </div>

                        {effectiveDiscount > 0 && (
                          <div className="flex justify-between text-emerald-700 font-medium">
                            <span>Less Discount {discountNote ? `(${discountNote})` : ''}:</span>
                            <span>-₱{effectiveDiscount.toLocaleString()}</span>
                          </div>
                        )}

                        {taxAmount > 0 && (
                          <div className="flex justify-between text-slate-600">
                            <span>Tax ({taxType === 'vat' ? '12% VAT' : '7% Government Tax'}):</span>
                            <span className="font-semibold text-slate-900">₱{taxAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                          </div>
                        )}

                        <div className="flex justify-between text-sm font-extrabold text-slate-900 border-t border-slate-300 pt-2">
                          <span>GRAND TOTAL:</span>
                          <span>₱{grandTotal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        </div>

                        {(docType === 'SOA' || amountPaid > 0) && (
                          <>
                            <div className="flex justify-between text-emerald-700 font-semibold pt-1">
                              <span>Less: Downpayment / Amount Paid:</span>
                              <span>-₱{amountPaid.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                            </div>
                            <div className="flex justify-between text-sm font-extrabold text-amber-900 bg-amber-50 px-2.5 py-1.5 rounded-lg border border-amber-300">
                              <span>REMAINING BALANCE DUE:</span>
                              <span>₱{balanceDue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                            </div>
                          </>
                        )}
                      </div>

                      {/* Terms & Footer */}
                      <div className="border-t border-slate-200 pt-3 text-[9px] text-slate-500 space-y-1">
                        <p className="font-semibold text-slate-700">Terms & Reservation Notes:</p>
                        <p>• Reservation is confirmed upon receipt of agreed downpayment. Final guest count must be confirmed 5 days prior to the event.</p>
                        <p className="text-center font-semibold text-slate-600 pt-2">
                          Thank you for celebrating with EYNS Hotel & Restaurant!
                        </p>
                      </div>

                    </div>
                  </div>

                </div>
              </aside>

            </main>
          )}

          {/* GOOGLE SHEETS DATABASE CONNECTION MODAL */}
          {showSheetModal && (
            <div className="no-print fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 space-y-5 shadow-2xl my-8">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2.5">
                    <i className="fa-solid fa-table text-emerald-400 text-lg"></i>
                    <h3 className="font-serif text-lg font-bold text-white">Google Sheets Menu Database</h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowSheetModal(false)}
                    className="text-slate-400 hover:text-white p-1"
                  >
                    <i className="fa-solid fa-xmark text-base"></i>
                  </button>
                </div>

                {/* Connection Form */}
                <form onSubmit={handleSaveSheetConnection} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-200 block mb-1">1. Google Sheet URL (Read Live Menu)</label>
                    <input
                      type="url"
                      value={sheetUrlInput}
                      onChange={(e) => setSheetUrlInput(e.target.value)}
                      placeholder="https://docs.google.com/spreadsheets/d/..."
                      className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="font-bold text-slate-200 block mb-1">2. Google Apps Script Web App URL (Optional 2-Way Write)</label>
                    <input
                      type="url"
                      value={appsScriptUrlInput}
                      onChange={(e) => setAppsScriptUrlInput(e.target.value)}
                      placeholder="https://script.google.com/macros/s/.../exec"
                      className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                    />
                    {appsScriptUrlInput.trim().endsWith('/dev') && (
                      <p className="mt-1.5 text-[11px] text-amber-300 bg-amber-950/50 border border-amber-500/40 rounded-lg px-2.5 py-1.5">
                        <strong>Notice:</strong> Your link ends in <code>/dev</code> (Test Deployment), which Google always restricts. Click <strong>Deploy → New deployment</strong> in Apps Script and copy the Web App URL ending in <code>/exec</code>.
                      </p>
                    )}
                  </div>

                  <div className="flex flex-wrap items-center gap-2 pt-1">
                    <button
                      type="submit"
                      disabled={isSyncingSheet}
                      className="px-4 py-2 rounded-xl font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1.5"
                    >
                      <i className={`fa-solid ${isSyncingSheet ? 'fa-spinner fa-spin' : 'fa-floppy-disk'}`}></i>
                      <span>{isSyncingSheet ? 'Syncing...' : 'Save & Sync Now'}</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => fetchDishesFromSheet(sheetUrl, appsScriptUrl, false)}
                      disabled={isSyncingSheet}
                      className="px-3.5 py-2 rounded-xl font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5"
                    >
                      <i className={`fa-solid fa-rotate ${isSyncingSheet ? 'fa-spin' : ''}`}></i>
                      <span>Refresh</span>
                    </button>

                    <button
                      type="button"
                      onClick={handleSeedCatalogToSheet}
                      disabled={isBulkSeeding}
                      className="px-3.5 py-2 rounded-xl font-bold bg-gold-500/20 hover:bg-gold-500 hover:text-slate-950 text-gold-300 border border-gold-500/40 transition flex items-center gap-1.5"
                    >
                      <i className={`fa-solid ${isBulkSeeding ? 'fa-spinner fa-spin' : 'fa-cloud-arrow-up'}`}></i>
                      <span>{isBulkSeeding ? 'Exporting...' : 'Export Built-In Menu to Sheet'}</span>
                    </button>
                  </div>
                </form>

                {/* Sync Status / Permission Feedback */}
                {sheetSyncError ? (
                  <div className="bg-amber-950/50 border border-amber-500/40 rounded-xl p-3 text-xs text-amber-200 flex items-start gap-2.5">
                    <i className="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5"></i>
                    <div>
                      <p className="font-bold">Google Sheet Sync Notice</p>
                      <p className="text-[11px] text-amber-300/90 mt-0.5">{sheetSyncError}</p>
                    </div>
                  </div>
                ) : (
                  <div className="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-3 text-xs text-emerald-200 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <i className="fa-solid fa-circle-check text-emerald-400"></i>
                      <span>
                        Connected • <strong>{sheetDishes.length}</strong> custom/sheet item(s) synced
                      </span>
                    </div>
                    {sheetLastSynced && (
                      <span className="text-[11px] text-emerald-400">Last synced: {sheetLastSynced}</span>
                    )}
                  </div>
                )}

                {/* Setup & Quick Population Guide */}
                <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-4 space-y-3 text-xs">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h4 className="font-bold text-gold-300 uppercase tracking-wider">Quick Populate & 2-Way Setup</h4>
                    <div className="flex flex-wrap items-center gap-2">
                      <a
                        href={extractSpreadsheetId(sheetUrlInput) ? `https://docs.google.com/spreadsheets/d/${extractSpreadsheetId(sheetUrlInput)}/edit` : 'https://sheets.new'}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-lg font-bold transition flex items-center gap-1.5"
                      >
                        <i className="fa-solid fa-up-right-from-square"></i>
                        <span>Open Your Google Sheet</span>
                      </a>
                      <button
                        type="button"
                        onClick={handleCopySheetRows}
                        className="bg-emerald-950/90 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/50 px-3 py-1 rounded-lg font-bold transition flex items-center gap-1.5"
                      >
                        <i className="fa-solid fa-table-cells"></i>
                        <span>Copy Menu Rows (Paste in A1)</span>
                      </button>
                      <button
                        type="button"
                        onClick={handleDownloadStarterCsv}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3 py-1 rounded-lg font-bold transition flex items-center gap-1.5"
                      >
                        <i className="fa-solid fa-file-csv text-emerald-400"></i>
                        <span>Download Starter CSV</span>
                      </button>
                      <button
                        type="button"
                        onClick={handleCopyAppsScript}
                        className="bg-gold-500/20 hover:bg-gold-500 hover:text-slate-950 text-gold-300 border border-gold-500/40 px-3 py-1 rounded-lg font-bold transition flex items-center gap-1.5"
                      >
                        <i className="fa-solid fa-copy"></i>
                        <span>Copy Apps Script Code</span>
                      </button>
                    </div>
                  </div>

                  <ol className="list-decimal list-inside space-y-1.5 text-slate-300 leading-relaxed">
                    <li>
                      <strong className="text-emerald-300">Populate Your Sheet in 5 Seconds:</strong> Click <strong className="text-white">Copy Menu Rows (Paste in A1)</strong> above, open your Google Sheet, click cell <code className="text-gold-300">A1</code>, and press <code className="text-white">Ctrl+V</code> (or <code className="text-white">Cmd+V</code>).
                    </li>
                    <li>
                      <strong className="text-gold-300">Enable 2-Way Writing (Optional):</strong> Open <strong className="text-white">Extensions → Apps Script</strong>, press <code className="text-amber-300">Ctrl+A</code> and <strong className="text-amber-300">delete the default <code>function myFunction()</code> completely</strong> (<code>doGet</code> and <code>doPost</code> must be top-level functions, never inside <code>myFunction</code>), then paste the copied code.
                    </li>
                    <li>
                      Click <strong className="text-white">Deploy → New deployment → Web app</strong> (<em>Execute as:</em> <strong className="text-gold-300">Me</strong>, <em>Who has access:</em> <strong className="text-gold-300">Anyone</strong>) and paste the <code className="text-white">.../exec</code> URL into field #2 above.
                    </li>
                  </ol>

                  <pre className="bg-slate-900 border border-slate-800 rounded-lg p-3 text-[10px] text-slate-300 overflow-x-auto max-h-40 font-mono">
                    {GOOGLE_APPS_SCRIPT_CODE}
                  </pre>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION BANNER */}
          {toastNotice && (
            <div className="no-print fixed bottom-5 right-5 z-50 bg-slate-900 border border-gold-500/60 text-gold-200 px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2.5 max-w-md">
              <i className="fa-solid fa-circle-info text-gold-400"></i>
              <span>{toastNotice}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
