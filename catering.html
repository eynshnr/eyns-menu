    function readCookieValue(name) {
      try {
        const prefix = encodeURIComponent(name) + '=';
        const parts = (document.cookie || '').split(';');
        for (let i = 0; i < parts.length; i++) {
          const trimmed = parts[i].trim();
          if (trimmed.startsWith(prefix)) {
            return decodeURIComponent(trimmed.slice(prefix.length));
          }
        }
      } catch (e) {}
      return '';
    }

    function writeCookieValue(name, value, days = 365) {
      try {
        const expires = value
          ? '; expires=' + new Date(Date.now() + days * 86400000).toUTCString()
          : '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        document.cookie =
          encodeURIComponent(name) +
          '=' +
          encodeURIComponent(value || '') +
          expires +
          '; path=/; SameSite=Lax';
      } catch (e) {}
    }

    function readWindowNameStore() {
      try {
        if (window.name && window.name.startsWith('{')) {
          const parsed = JSON.parse(window.name);
          if (parsed && typeof parsed === 'object') return parsed;
        }
      } catch (e) {}
      return {};
    }

    function writeWindowNameStore(patchObj) {
      try {
        const current = readWindowNameStore();
        window.name = JSON.stringify({ ...current, ...patchObj });
      } catch (e) {}
    }

    function readUrlParam(paramName) {
      try {
        const searchParams = new URLSearchParams(window.location.search || '');
        const fromSearch = (searchParams.get(paramName) || '').trim();
        if (fromSearch) return fromSearch;
        const rawHash = (window.location.hash || '').replace(/^#/, '');
        if (!rawHash) return '';
        const hashParams = new URLSearchParams(rawHash);
        return (hashParams.get(paramName) || '').trim();
      } catch (e) {
        return '';
      }
    }

    function syncHashStorageParams(menuUrl, servicesUrl, roomsUrl) {
      try {
        const params = new URLSearchParams();
        if (menuUrl) params.set('menu', menuUrl);
        if (servicesUrl) params.set('services', servicesUrl);
        if (roomsUrl) params.set('rooms', roomsUrl);
        const nextHash = params.toString();
        if (window.history && window.history.replaceState) {
          window.history.replaceState(
            null,
            '',
            nextHash ? '#' + nextHash : window.location.pathname + window.location.search
          );
        }
      } catch (e) {}
    }

    function recoverSavedString(candidateKeys, fallbackValue = '', urlParamName = '') {
      if (urlParamName) {
        const fromUrl = readUrlParam(urlParamName);
        if (fromUrl) return fromUrl;
      }
      try {
        for (const k of candidateKeys) {
          const val = localStorage.getItem(k) || sessionStorage.getItem(k) || readCookieValue(k);
          if (val && val.trim()) return val.trim();
        }
      } catch (e) {}

      const winStore = readWindowNameStore();
      for (const k of candidateKeys) {
        if (typeof winStore[k] === 'string' && winStore[k].trim()) {
          return winStore[k].trim();
        }
      }
      return fallbackValue;
    }

    function persistSavedString(primaryKey, legacyKeys, value) {
      const clean = String(value || '').trim();
      try {
        if (clean) {
          localStorage.setItem(primaryKey, clean);
          sessionStorage.setItem(primaryKey, clean);
          writeCookieValue(primaryKey, clean, 365);
        } else {
          legacyKeys.forEach(k => {
            localStorage.removeItem(k);
            sessionStorage.removeItem(k);
            writeCookieValue(k, '', 0);
          });
        }
      } catch (e) {}

      const winPatch = {};
      if (clean) {
        winPatch[primaryKey] = clean;
      } else {
        legacyKeys.forEach(k => {
          winPatch[k] = '';
        });
      }
      writeWindowNameStore(winPatch);
    }

    function recoverSavedJsonArray(candidateKeys, fallbackArray = []) {
      try {
        for (const k of candidateKeys) {
          const raw = localStorage.getItem(k);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        }
      } catch (e) {}
      return fallbackArray;
    }

    function generateDocNumber() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const rand = String(Math.floor(1000 + Math.random() * 9000));
      return `EYNS-${yy}${mm}${dd}-${rand}`;

    function formatCurrency(val) {

    function formatWholeCurrency(val) {

    function formatPrettyDate(isoStr) {
      if (!isoStr) return 'TBD';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function addDaysToIsoDate(isoStr, offsetDays) {
      if (!isoStr) return '';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      dt.setDate(dt.getDate() + offsetDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function computeDaysBetweenDates(startIso, endIso) {
      if (!startIso || !endIso) return 1;
      const s = new Date(startIso + 'T00:00:00');
      const e = new Date(endIso + 'T00:00:00');
      if (isNaN(s.getTime()) || isNaN(e.getTime())) return 1;
      return Math.max(1, Math.round((e.getTime() - s.getTime()) / 86400000));
    }

    function calculateTieredPackageBreakdown(pkg, tierPax, totalPax, excessRate) {
      const tiers = pkg?.tiers || [];
      const matchedTier = tiers.find(t => t.pax === tierPax) || tiers[0] || { pax: 50, price: 0 };
      const effectiveTotalPax = Math.max(matchedTier.pax, Number(totalPax) || matchedTier.pax);
      const excessPax = Math.max(0, effectiveTotalPax - matchedTier.pax);
      const rate = Math.max(0, Number(excessRate) || 0);
      const excessCharge = excessPax * rate;
      return {
        tierPax: matchedTier.pax,
        basePrice: matchedTier.price,
        excessPax,
        excessRate: rate,
        excessCharge,
        total: matchedTier.price + excessCharge
      };
    }

    function normalizeServiceSubcategory(raw) {
      const val = String(raw || '').trim().toLowerCase();
      if (val.includes('rent')) return 'Rental';
      if (val.includes('supp')) return 'Suppliers';
      return 'Catering';
    }

    function normalizeBillingType(raw) {
      const val = String(raw || '').trim().toLowerCase().replace(/\s+/g, '_');
      if (val.includes('pax') || val.includes('head') || val.includes('guest')) return 'per_pax';
      if (val.includes('day')) return 'per_day';
      if (val.includes('fix') || val.includes('flat') || val.includes('lot') || val.includes('once')) return 'fixed';
      return 'per_piece';
    }

    function billingBadgeLabel(billingType) {
      const norm = normalizeBillingType(billingType);
      if (norm === 'per_pax') return 'Per Pax';
      if (norm === 'per_day') return 'Per Day';
      if (norm === 'fixed') return 'Fixed / Lot';
      return 'Per Piece';
    }

    function getCategoryIcon(cat) {
      const lower = String(cat || '').toLowerCase();
      if (lower.includes('soup')) return 'fa-mug-hot';
      if (lower.includes('beef')) return 'fa-drumstick-bite';
      if (lower.includes('pork')) return 'fa-bacon';
      if (lower.includes('chicken')) return 'fa-feather-pointed';
      if (lower.includes('sea') || lower.includes('fish') || lower.includes('shrimp')) return 'fa-fish';
      if (lower.includes('veg')) return 'fa-leaf';
      if (lower.includes('pancit') || lower.includes('pasta')) return 'fa-bowl-food';
      if (lower.includes('rice')) return 'fa-bowl-rice';
      if (lower.includes('dessert')) return 'fa-ice-cream';
      if (lower.includes('bev') || lower.includes('snack')) return 'fa-glass-water';
      return 'fa-utensils';
    }

    function getServiceSubcategoryBadgeStyle(subcat) {
      if (subcat === 'Rental') return { pill: 'bg-sky-100 text-sky-900 border-sky-200' };
      if (subcat === 'Suppliers') return { pill: 'bg-purple-100 text-purple-900 border-purple-200' };
      return { pill: 'bg-amber-100 text-amber-900 border-amber-200' };

    function parseNumericAmount(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const num = parseFloat(String(val || '').replace(/[^0-9.]/g, ''));
      return isNaN(num) ? 0 : num;
    }

    function parseCsvToGrid(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map(l => l.replace(/\r$/, ''))
        .filter(l => l.trim().length > 0);
      if (lines.length === 0) return [];
      if (lines[0].includes('\t')) {
        return lines.map(line => line.split('\t').map(cell => cell.trim()));
      }
      return lines.map(line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      });
    }

    function parseGridRows(rawGrid) {
      const grid = (rawGrid || [])
        .map(row => (Array.isArray(row) ? row.map(c => (c == null ? '' : String(c).trim())) : []))
        .filter(row => row.some(cell => cell !== ''));
      if (grid.length === 0) return [];

      const cleanKey = str => String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const KNOWN = [
        'id', 'dishname', 'dish', 'menuitem', 'category', 'priceperpax', 'price', 'createdat',
        'serviceitemname', 'servicename', 'service', 'itemname', 'item',
        'eventservicescategory', 'subcategory', 'rate', 'billingtype', 'unit',
        'roomno', 'roomnumber', 'roomname', 'roomtype', 'ratepernight', 'capacity', 'inclusions'
      ];

      let headerRowIdx = -1;
      for (let r = 0; r < Math.min(3, grid.length); r++) {
        if (grid[r].filter(cell => KNOWN.includes(cleanKey(cell))).length >= 2) {
          headerRowIdx = r;
          break;
        }
      }

      if (headerRowIdx !== -1) {
        const headers = grid[headerRowIdx].map(cleanKey);
        return grid.slice(headerRowIdx + 1).map(cols => {
          const obj = { _cols: cols, _hasHeaders: true };
          headers.forEach((h, i) => {
            if (h) obj[h] = cols[i] ?? '';
          });
          return obj;
        });
      }
      return grid.map(cols => ({ _cols: cols, _hasHeaders: false }));
    }

    function normalizeObjectRecord(rawRow) {
      if (Array.isArray(rawRow)) {
        return { _cols: rawRow.map(v => (v == null ? '' : String(v).trim())) };
      }
      const norm = { _cols: [] };
      if (rawRow && typeof rawRow === 'object') {
        Object.entries(rawRow).forEach(([k, v]) => {
          const cleanKey = String(k).toLowerCase().replace(/[^a-z0-9]/g, '');
          const strVal = v == null ? '' : String(v).trim();
          if (cleanKey) norm[cleanKey] = strVal;
          norm._cols.push(strVal);
        });
      }
      return norm;
    }

    function extractNormalizedRowsFromResponse(rawText) {
      const trimmed = String(rawText || '').trim();
      if (!trimmed) return [];
      if (trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html')) {
        throw new Error('Google returned a sign-in page. Open the sheet → Share → Anyone with the link (Viewer).');
      }
      if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
        const parsed = JSON.parse(trimmed);
        let list = Array.isArray(parsed)
          ? parsed
          : parsed.items || parsed.data || parsed.services || parsed.menu || parsed.rooms || parsed.rows || Object.values(parsed).find(Array.isArray) || [];
        if (list.length > 0 && Array.isArray(list[0])) return parseGridRows(list);
        return list.map(normalizeObjectRecord);
      }
      return parseGridRows(parseCsvToGrid(trimmed));
    }

    function resolveGoogleSheetUrl(rawUrl) {
      const trimmed = String(rawUrl || '').trim();
      if (!trimmed) return { url: '', sheetId: '', gid: '' };

      if (trimmed.includes('/spreadsheets/d/e/')) {
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gidParam = gidMatch ? '&gid=' + gidMatch[1] : '';
        const csvUrl = trimmed.includes('/pubhtml')
          ? trimmed.replace('/pubhtml', '/pub?output=csv' + gidParam)
          : trimmed.includes('output=csv')
          ? trimmed
          : trimmed.replace(/\/pub(\?.*)?$/, '/pub?output=csv' + gidParam);
        return { url: csvUrl, sheetId: '', gid: gidMatch ? gidMatch[1] : '' };
      }

      const sheetMatch =
        trimmed.match(/docs\.google\.com\/spreadsheets\/(?:u\/\d+\/)?d\/(?!e\/)([a-zA-Z0-9-_]+)/) ||
        trimmed.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9-_]+)/);

      if (sheetMatch) {
        const sheetId = sheetMatch[1];
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gid = gidMatch ? gidMatch[1] : '';
        return {
          url: `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv${gid ? '&gid=' + gid : ''}`,
          sheetId,
          gid
        };
      }
      return { url: trimmed, sheetId: '', gid: '' };
    }

    async function fetchSheetRowsUniversal(rawUrl) {
      const resolved = resolveGoogleSheetUrl(rawUrl);
      if (!resolved.url) return { rows: [] };
      let lastErr = '';

      try {
        const sep = resolved.url.includes('?') ? '&' : '?';
        const res = await fetch(`${resolved.url}${sep}_ts=${Date.now()}`);
        if (res.ok) {
          const text = await res.text();
          if (text && !text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
            return { rows: extractNormalizedRowsFromResponse(text) };
          }
          lastErr = 'Google Sheet is Restricted. Set Share → Anyone with the link (Viewer).';
        } else {
          lastErr = `HTTP ${res.status}`;
        }
      } catch (e) {
        lastErr = e?.message || 'Network/CORS block';
      }

      if (resolved.sheetId) {
        return await new Promise((resolve, reject) => {
          const cbName = `__eyns_gviz_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
          const script = document.createElement('script');
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('Timed out reading Google Sheet. Set Share → Anyone with the link (Viewer).'));
          }, 10000);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = response => {
            cleanup();
            try {
              if (!response || response.status === 'error') {
                reject(new Error('Google Sheet is Restricted. Set Share → Anyone with the link (Viewer).'));
                return;
              }
              const table = response.table || {};
              const colLabels = (table.cols || []).map(c => (c && c.label ? String(c.label).trim() : ''));
              const dataRows = (table.rows || []).map(r =>
                (r.c || []).map(cell => {
                  if (!cell || cell.v === null || cell.v === undefined) return '';
                  return cell.f != null ? String(cell.f).trim() : String(cell.v).trim();
                })
              );
              const combined = colLabels.some(Boolean) ? [colLabels, ...dataRows] : dataRows;
              resolve({ rows: parseGridRows(combined) });
            } catch (err) {
              reject(err);
            }
          };

          const gidParam = resolved.gid ? `&gid=${resolved.gid}` : '';
          script.src = `https://docs.google.com/spreadsheets/d/${resolved.sheetId}/gviz/tq?tqx=out:json;responseHandler:${cbName}&headers=0${gidParam}`;
          script.onerror = () => {
            cleanup();
            reject(new Error('Google Sheet is Restricted or unreachable. Set Share → Anyone with the link (Viewer).'));
          };
          document.head.appendChild(script);
        });
      }

      if (resolved.url.includes('script.google.com')) {
        return await new Promise((resolve, reject) => {
          const cbName = `__eyns_gas_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
          const script = document.createElement('script');
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('Could not read Apps Script Web App. Use the regular Google Sheet link instead.'));
          }, 8000);
          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }
          window[cbName] = payload => {
            cleanup();
            try {
              const rows = typeof payload === 'string'
                ? extractNormalizedRowsFromResponse(payload)
                : extractNormalizedRowsFromResponse(JSON.stringify(payload));
              resolve({ rows });
            } catch (err) {
              reject(err);
            }
          };
          const sep = resolved.url.includes('?') ? '&' : '?';
          script.src = `${resolved.url}${sep}callback=${cbName}`;
          script.onerror = () => {
            cleanup();
            reject(new Error('Could not reach Apps Script URL. Use the regular Google Sheet link instead.'));
          };
          document.head.appendChild(script);
        });
      }

      throw new Error(`Could not connect (${lastErr}). Paste a valid Google Sheet link.`);
    }

    function isAppsScriptWebAppUrl(rawUrl) {
      const trimmed = String(rawUrl || '').trim();
      return trimmed.includes('script.google.com/') && trimmed.includes('/exec');
    }

    async function mutateSheetViaAppsScript(rawUrl, action, payload = {}) {
      const trimmed = String(rawUrl || '').trim();
      const params = new URLSearchParams();
      params.set('action', action);
      if (payload.item) params.set('item', JSON.stringify(payload.item));
      if (payload.id) params.set('id', String(payload.id));
      const fullUrl = `${trimmed}${trimmed.includes('?') ? '&' : '?'}${params.toString()}`;

      try {
        const res = await fetch(fullUrl);
        if (res.ok) {
          const text = await res.text();
          if (text && !text.trim().startsWith('<!DOCTYPE')) return extractNormalizedRowsFromResponse(text);
        }
      } catch (e) {}

      return await new Promise((resolve, reject) => {
        const cbName = `__eyns_mut_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Timed out writing to Google Sheet via Apps Script.'));
        }, 12000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cbName] = payloadResp => {
          cleanup();
          resolve(payloadResp);
        };
        script.src = `${fullUrl}&callback=${cbName}`;
        script.onerror = () => {
          cleanup();
          reject(new Error('Could not reach Apps Script Web App.'));
        };
        document.head.appendChild(script);
      });
    }

    // =========================================================================
    // 3.5 SMOOTH NUMERIC INPUT (NO SNAP-BACK WHILE CLEARING OR TYPING)
    // =========================================================================
    function SmoothNumberInput({
      value,
      onValueChange,
      min = 0,
      max,
      fallback,
      allowDecimal = false,
      allowEmpty = false,
      placeholder = '',
      className = '',
      ariaLabel
    }) {
      const formatExternal = v => {
        if (allowEmpty && (v === '' || v === null || v === undefined || Number(v) === 0)) {
          return '';
        }
        return v === null || v === undefined ? '' : String(v);
      };

      const [draft, setDraft] = useState(() => formatExternal(value));
      const isFocusedRef = useRef(false);
      const lastCommittedRef = useRef(value);

      useEffect(() => {
        if (!isFocusedRef.current || value !== lastCommittedRef.current) {
          setDraft(formatExternal(value));
          lastCommittedRef.current = value;
        }
      }, [value, allowEmpty]);

      const handleChange = e => {
        const raw = e.target.value;
        const regex = allowDecimal ? /^\d*\.?\d*$/ : /^\d*$/;
        if (!regex.test(raw)) return;

        setDraft(raw);

        if (raw === '' || raw === '.') {
          if (allowEmpty) {
            lastCommittedRef.current = 0;
            onValueChange(0);
          }
          return;
        }

        const parsed = allowDecimal ? parseFloat(raw) : parseInt(raw, 10);
        if (isNaN(parsed)) return;

        if (parsed >= min) {
          const clamped = max !== undefined ? Math.min(max, parsed) : parsed;
          lastCommittedRef.current = clamped;
          onValueChange(clamped);
        }
      };

      const commitValue = () => {
        if (draft === '' || draft === '.') {
          if (allowEmpty) {
            setDraft('');
            lastCommittedRef.current = 0;
            onValueChange(0);
          } else {
            const fb = fallback !== undefined ? fallback : min;
            setDraft(String(fb));
            lastCommittedRef.current = fb;
            onValueChange(fb);
          }
          return;
        }

        let parsed = allowDecimal ? parseFloat(draft) : parseInt(draft, 10);
        if (isNaN(parsed)) {
          parsed = fallback !== undefined ? fallback : min;
        }
        if (parsed < min) parsed = min;
        if (max !== undefined && parsed > max) parsed = max;

        const finalStr = allowEmpty && parsed === 0 ? '' : String(parsed);
        setDraft(finalStr);
        lastCommittedRef.current = parsed;
        onValueChange(parsed);
      };

      return (
        <input
          type="text"
          inputMode={allowDecimal ? 'decimal' : 'numeric'}
          value={draft}
          placeholder={placeholder}
          aria-label={ariaLabel}
          onFocus={e => {
            isFocusedRef.current = true;
            e.target.select();
          }}
          onChange={handleChange}
          onBlur={() => {
            isFocusedRef.current = false;
            commitValue();
          }}
          onKeyDown={e => {
            if (e.key === 'Enter') {
              e.target.blur();
            }
          }}
          className={className}
        />
      );
    }

            foodCreditDeduction,
            grossPackageTotal,
            total: Math.max(0, grossPackageTotal - foodCreditDeduction)
          };
        }
        const flat = Math.max(0, Number(customBaseFee) || 0);
        return {
          tierPax: 0,
          basePrice: flat,
          excessPax: 0,
          excessRate: 0,
          excessCharge: 0,
          menuUpgradePerPax: 0,
          menuUpgradeCharge: 0,
          foodCreditPerPax: 0,
          foodCreditDeduction: 0,
          grossPackageTotal: flat,
          total: flat
        };
      }, [showPackageStep, selectedPackage, isCustomReplaceMenu, selectedBuffetMenu, selectedTierPax, paxCount, excessRatePerPax, customBaseFee]);

      const effectiveDayForBuilder = bookingCategory === 'seminar' ? activeScheduleDay : 1;

      const getPaxForDay = dayNum =>
        bookingCategory === 'seminar' && dayPaxOverrides[dayNum] !== undefined
          ? Math.max(1, Number(dayPaxOverrides[dayNum]) || 1)
          : Math.max(1, Number(paxCount) || 1);

      const computedPackedMealsSummary = useMemo(() => {
        if (bookingCategory !== 'packed_meals') {
          return { batches: [], totalPacks: 0, totalAmount: 0, avgPerPack: 0 };
        }
        const menuMap = new Map(menuItems.map(m => [m.id, m]));
        const dayCounters = {};
        const sortedRaw = [...packedMealBatches]
          .filter(b => (Number(b.day) || 1) <= packedMealDaysCount)
          .sort((a, b) => (a.day || 1) - (b.day || 1));
        const batches = sortedRaw.map(batch => {
          const dayNum = Math.max(1, Number(batch.day) || 1);
          dayCounters[dayNum] = (dayCounters[dayNum] || 0) + 1;
          const mealIndexInDay = dayCounters[dayNum];
          const packs = Math.max(1, Number(batch.packs) || 1);
          const chosenDishes = (batch.dishIds || []).map(id => menuMap.get(id)).filter(Boolean);
          const dishesRateSum = chosenDishes.reduce((s, d) => s + (Number(d.price) || 0), 0);
          const customRate = Number(batch.unitRate) || 0;
          const hasCustomRate = customRate > 0;
          const effectiveRatePerPack = hasCustomRate ? customRate : dishesRateSum;
          const batchTotal = effectiveRatePerPack * packs;
          return {
            ...batch,
            day: dayNum,
            mealIndexInDay,
            displayLabel: `Packed Meal ${mealIndexInDay}`,
            packs,
            chosenDishes,
            dishesRateSum,
            hasCustomRate,
            effectiveRatePerPack,
            batchTotal
          };
        });
        const totalPacks = batches.reduce((s, b) => s + b.packs, 0);
        const totalAmount = batches.reduce((s, b) => s + b.batchTotal, 0);
        return {
          batches,
          totalPacks,
          totalAmount,
          avgPerPack: totalAmount / Math.max(1, totalPacks)
        };
      }, [bookingCategory, packedMealBatches, packedMealDaysCount, menuItems]);

      const activeDayPackedBatches = useMemo(
        () => computedPackedMealsSummary.batches.filter(b => (b.day || 1) === activePackedMealDay),
        [computedPackedMealsSummary.batches, activePackedMealDay]
      );

      const activePackedBatch = useMemo(
        () =>
          activeDayPackedBatches.find(b => b.id === activePackedMealId) ||
          activeDayPackedBatches[0] ||
          computedPackedMealsSummary.batches[0] ||
          null,
        [activeDayPackedBatches, computedPackedMealsSummary.batches, activePackedMealId]
      );

      const computedMenuSummary = useMemo(() => {
        if (bookingCategory === 'packed_meals') {
          return {
            lines: [],
            grossMenuTotal: computedPackedMealsSummary.totalAmount,
            perPaxRateSum: computedPackedMealsSummary.avgPerPack,
            netMenuTotal: computedPackedMealsSummary.totalAmount
          };
        }
        if (!showMenuStep) {
          return { lines: [], grossMenuTotal: 0, perPaxRateSum: 0, netMenuTotal: 0 };
        }
        const lines = selectedMenuLines.map(line => {
          const activeDays = bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : 1;
          const dayPax = getPaxForDay(line.day);
          const hasCustomPax = line.customPax !== undefined && line.customPax !== null;
          const effectivePax = hasCustomPax
            ? (line.customPax === '' ? 0 : Math.max(0, Number(line.customPax) || 0))
            : dayPax * Math.max(1, Number(line.qty) || 1);
          const lineTotal = line.price * effectivePax * activeDays;
          return {
            ...line,
            dayPax,
            effectivePax,
            isCustomPax: hasCustomPax && line.customPax !== '' && effectivePax !== dayPax,
            activeDays,
            lineTotal
          };
        });
        const grossMenuTotal = lines.reduce((s, l) => s + l.lineTotal, 0);
        const perPaxRateSum = lines.reduce((s, l) => s + (l.unit === 'per_pax' ? l.price : 0), 0);
        return {
          lines,
          grossMenuTotal,
          perPaxRateSum,
          netMenuTotal: grossMenuTotal
        };
      }, [bookingCategory, computedPackedMealsSummary, showMenuStep, selectedMenuLines, eventDays, dayPaxOverrides, paxCount]);

      const computedServiceLines = useMemo(() => {
        const pool = bookingCategory === 'rental'
          ? selectedServiceLines.filter(l => l.subcategory === 'Rental')
          : selectedServiceLines;
        return pool.map(line => {
          const activeDays = bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : 1;
          const dayPax = getPaxForDay(line.day);
          let lineTotal = 0;
          if (line.billingType === 'per_pax') {
            lineTotal = line.price * dayPax * line.qty * activeDays;
          } else if (line.billingType === 'per_day') {
            const multDays = bookingCategory === 'rental'
              ? rentalDurationDays * line.qty
              : (bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) * line.qty : line.qty);
            lineTotal = line.price * multDays;
          } else if (line.billingType === 'fixed') {
            lineTotal = line.price * line.qty;
          } else {
            lineTotal = line.price * line.qty * activeDays;
          }
          return { ...line, dayPax, lineTotal };
        });
      }, [selectedServiceLines, bookingCategory, eventDays, rentalDurationDays, dayPaxOverrides, paxCount]);

      const servicesSubtotal = useMemo(() => computedServiceLines.reduce((s, l) => s + l.lineTotal, 0), [computedServiceLines]);

      const selectedRoomsList = useMemo(() => {
        if (!showRoomsStep) return [];
        return roomItems.filter(r => (Number(roomNightsMap[r.id]) || 0) > 0).map(r => {
          const nights = Number(roomNightsMap[r.id]) || 0;
          const savedDates = roomDatesMap[r.id] || {};
          const checkIn = savedDates.checkIn || eventDate || todayIsoDate;
          const checkOut = savedDates.checkOut || addDaysToIsoDate(checkIn, nights);
          return { ...r, nights, checkIn, checkOut, total: r.rate * nights };
        });
      }, [showRoomsStep, roomItems, roomNightsMap, roomDatesMap, eventDate, todayIsoDate]);

      const roomsSubtotal = useMemo(() => selectedRoomsList.reduce((s, r) => s + r.total, 0), [selectedRoomsList]);

      const totals = useMemo(() => {
        const subtotal = packageBreakdown.total + computedMenuSummary.netMenuTotal + servicesSubtotal + roomsSubtotal;
        const discount = Math.max(0, Number(discountAmount) || 0);
        const taxable = Math.max(0, subtotal - discount);
        const taxAmount = taxable * ((Number(taxRatePercent) || 0) / 100);
        const deposit = bookingCategory === 'rental' ? Math.max(0, Number(securityDeposit) || 0) : 0;
        const grandTotal = taxable + taxAmount + deposit;
        const totalPaid = payments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
        return { subtotal, discount, taxAmount, deposit, grandTotal, totalPaid, balanceDue: Math.max(0, grandTotal - totalPaid) };
      }, [packageBreakdown, computedMenuSummary, servicesSubtotal, roomsSubtotal, discountAmount, taxRatePercent, bookingCategory, securityDeposit, payments]);

      const quoteValidUntilDate = useMemo(
        () => addDaysToIsoDate(todayIsoDate, Math.max(1, Number(quoteValidDays) || 15)),
        [todayIsoDate, quoteValidDays]
      );

      const effectivePerHeadCost = useMemo(() => {
        if (bookingCategory === 'rental') return 0;
        if (bookingCategory === 'packed_meals') {
          return totals.grandTotal / Math.max(1, computedPackedMealsSummary.totalPacks || 1);
        }
        return totals.grandTotal / Math.max(1, Number(paxCount) || 1);
      }, [bookingCategory, paxCount, totals.grandTotal, computedPackedMealsSummary.totalPacks]);

      // =======================================================================
      // 8. PACKED MEALS, ROOMS, MENU, SERVICES & CATEGORY HANDLERS
      // =======================================================================
      const handleSetPackedMealDaysCount = rawDays => {
        const targetDays = Math.max(1, Math.min(30, parseInt(rawDays, 10) || 1));
        const day1Date = packedMealBatches.find(b => (b.day || 1) === 1)?.date || eventDate || todayIsoDate;
        setPackedMealDaysCount(targetDays);
        if (activePackedMealDay > targetDays) setActivePackedMealDay(targetDays);
        setPackedMealBatches(prev => {
          const additions = [];
          const defaultMealsPerNewDay = Math.max(1, prev.filter(b => (b.day || 1) === 1).length || 1);
          for (let d = 1; d <= targetDays; d++) {
            if (!prev.some(b => (b.day || 1) === d)) {
              const autoDate = addDaysToIsoDate(day1Date, d - 1);
              for (let m = 0; m < defaultMealsPerNewDay; m++) {
                additions.push({
                  id: `pm_batch_${Date.now()}_d${d}_m${m}_${Math.floor(Math.random() * 1000)}`,
                  day: d,
                  mealType: `Packed Meal ${m + 1}`,
                  date: autoDate,
                  time: m === 0 ? '8:00 AM' : m === 1 ? '12:00 PM' : '3:30 PM',
                  packs: Math.max(1, Number(prev[0]?.packs) || 30),
                  unitRate: 0,
                  dishIds: [],
                  customItemsText: '',
                  notes: ''
                });
              }
            }
          }
          const merged = [...prev, ...additions].sort((a, b) => (a.day || 1) - (b.day || 1));
          const visible = merged.filter(b => (b.day || 1) <= targetDays);
          if (!visible.some(b => b.id === activePackedMealId) && visible[0]) {
            setActivePackedMealId(visible[0].id);
          }
          return merged;
        });
      };

      const handleSetPackedMealCountForDay = (dayNum, rawCount) => {
        const targetCount = Math.max(1, Math.min(15, parseInt(rawCount, 10) || 1));
        const dNum = Math.max(1, Number(dayNum) || 1);
        const day1Date = packedMealBatches.find(b => (b.day || 1) === 1)?.date || eventDate || todayIsoDate;
        setPackedMealBatches(prev => {
          const otherDays = prev.filter(b => (b.day || 1) !== dNum);
          const currentDayBatches = prev.filter(b => (b.day || 1) === dNum);
          const baseDate = currentDayBatches[0]?.date || addDaysToIsoDate(day1Date, dNum - 1);
          const defaultTimes = ['8:00 AM', '12:00 PM', '3:30 PM', '6:30 PM'];

          let nextDayBatches = [];
          if (targetCount <= currentDayBatches.length) {
            nextDayBatches = currentDayBatches.slice(0, targetCount).map((b, idx) => ({
              ...b,
              day: dNum,
              mealType: `Packed Meal ${idx + 1}`
            }));
          } else {
            const existing = currentDayBatches.map((b, idx) => ({
              ...b,
              day: dNum,
              mealType: `Packed Meal ${idx + 1}`
            }));
            const additions = [];
            for (let i = currentDayBatches.length; i < targetCount; i++) {
              additions.push({
                id: `pm_batch_${Date.now()}_d${dNum}_${i}_${Math.floor(Math.random() * 1000)}`,
                day: dNum,
                mealType: `Packed Meal ${i + 1}`,
                date: baseDate,
                time: defaultTimes[i] || '11:30 AM',
                packs: Math.max(1, Number(currentDayBatches[currentDayBatches.length - 1]?.packs) || Number(prev[0]?.packs) || 30),
                unitRate: 0,
                dishIds: [],
                customItemsText: '',
                notes: ''
              });
            }
            nextDayBatches = [...existing, ...additions];
          }
          const combined = [...otherDays, ...nextDayBatches].sort((a, b) => (a.day || 1) - (b.day || 1));
          if (!combined.some(b => b.id === activePackedMealId) && nextDayBatches[0]) {
            setActivePackedMealId(nextDayBatches[0].id);
          }
          return combined;
        });
      };

      const handleUpdatePackedMealBatch = (batchId, patchObj) => {
        setPackedMealBatches(prev => prev.map(b => (b.id === batchId ? { ...b, ...patchObj } : b)));
      };

      const handleRemovePackedMealBatch = batchId => {
        setPackedMealBatches(prev => {
          const target = prev.find(b => b.id === batchId);
          const dNum = target?.day || 1;
          const sameDay = prev.filter(b => (b.day || 1) === dNum);
          if (sameDay.length <= 1) {
            return prev.map(b =>
              b.id === batchId
                ? { ...b, mealType: 'Packed Meal 1', time: '11:30 AM', unitRate: 0, dishIds: [], customItemsText: '', notes: '' }
                : b
            );
          }
          const otherDays = prev.filter(b => (b.day || 1) !== dNum);
          const remainingSameDay = sameDay
            .filter(b => b.id !== batchId)
            .map((b, idx) => ({ ...b, day: dNum, mealType: `Packed Meal ${idx + 1}` }));
          const merged = [...otherDays, ...remainingSameDay].sort((a, b) => (a.day || 1) - (b.day || 1));
          if (activePackedMealId === batchId && remainingSameDay[0]) {
            setActivePackedMealId(remainingSameDay[0].id);
          }
          return merged;
        });
      };

      const handleToggleDishInPackedBatch = (batchId, dishId) => {
        setPackedMealBatches(prev =>
          prev.map(b => {
            if (b.id !== batchId) return b;
            const exists = (b.dishIds || []).includes(dishId);
            return {
              ...b,
              dishIds: exists ? b.dishIds.filter(id => id !== dishId) : [...(b.dishIds || []), dishId]
            };
          })
        );
      };

      const handleUpdateRoomNights = (roomId, nextNights) => {
        const cleanNights = Math.max(0, Number(nextNights) || 0);
        setRoomNightsMap(p => ({ ...p, [roomId]: cleanNights }));
        if (cleanNights > 0) {
          setRoomDatesMap(prev => {
            const existing = prev[roomId] || {};
            const checkIn = existing.checkIn || eventDate || todayIsoDate;
            return {
              ...prev,
              [roomId]: { checkIn, checkOut: addDaysToIsoDate(checkIn, cleanNights) }
            };
          });
        }
      };

      const handleUpdateRoomDates = (roomId, field, isoVal) => {
        if (!isoVal) return;
        const currentNights = Math.max(1, Number(roomNightsMap[roomId]) || 1);
        const existing = roomDatesMap[roomId] || {};
        let nextCheckIn = existing.checkIn || eventDate || todayIsoDate;
        let nextCheckOut = existing.checkOut || addDaysToIsoDate(nextCheckIn, currentNights);

        if (field === 'checkIn') {
          nextCheckIn = isoVal;
          nextCheckOut = addDaysToIsoDate(nextCheckIn, currentNights);
        } else {
          nextCheckOut = isoVal;
        }
        const computedNights = computeDaysBetweenDates(nextCheckIn, nextCheckOut);
        setRoomDatesMap(prev => ({
          ...prev,
          [roomId]: { checkIn: nextCheckIn, checkOut: nextCheckOut }
        }));
        setRoomNightsMap(prev => ({ ...prev, [roomId]: computedNights }));
      };

      const handleBookingCategoryChange = nextCat => {
        setBookingCategory(nextCat);
        if (nextCat === 'rental') {
          setDocType('Rental Agreement');
          setSelectedPackageId('from_scratch');
          setCustomBaseFee(0);
          setOccasion('Equipment / Venue Rental');
          setServiceSubcategoryFilter('Rental');
          setCustomServiceCategory('Rental');
          setRentalReturnDate(addDaysToIsoDate(eventDate, 1));
          setEventVenue('Client Location / Pick-up at EYNS');
        } else if (nextCat === 'packed_meals') {
          setDocType('Quotation');
          setSelectedPackageId('from_scratch');
          setCustomBaseFee(0);
          setOccasion('Packed Meals Order');
          setServiceSubcategoryFilter('All');
          setCustomServiceCategory('Catering');
          setEventVenue('Delivery / Pick-up at EYNS Restaurant');
          setPackedMealBatches(prev => {
            if (!prev || prev.length === 0) {
              const id = `pm_batch_${Date.now()}`;
              setActivePackedMealId(id);
              setPackedMealDaysCount(1);
              setActivePackedMealDay(1);
              return [{
                id,
                day: 1,
                mealType: 'Packed Meal 1',
                date: eventDate || todayIsoDate,
                time: '11:30 AM',
                packs: 30,
                unitRate: 0,
                dishIds: [],
                customItemsText: '',
                notes: ''
              }];
            }
            return prev;
          });
        } else if (nextCat === 'seminar') {
          setDocType('Quotation');
          setSelectedPackageId('seminar_custom');
          setCustomBaseFee(0);
          setOccasion('Seminar / Workshop / LGU Training');
          setServiceSubcategoryFilter('All');
          setCustomServiceCategory('Catering');
          setEventVenue('Eyns Air-Conditioned Function Hall');
        } else {
          setDocType('Quotation');
          const safePax = Math.max(50, Number(paxCount) || 100);
          setPaxCount(safePax);
          setSelectedPackageId('pkg_essential');
          setSelectedTierPax(getAutoTierForPax(safePax));
          setOccasion('Wedding Reception');
          setServiceSubcategoryFilter('All');
          setCustomServiceCategory('Catering');
          setEventVenue('Eyns Air-conditioned Venue (4 hrs)');
        }
      };

      const handlePaxChange = rawVal => {
        const parsed = Math.max(1, parseInt(rawVal, 10) || 1);
        setPaxCount(parsed);
        if (showPackageStep && isTieredAllInclusivePackage(selectedPackage.id)) {
          setSelectedTierPax(getAutoTierForPax(parsed));
        }
      };

      const handlePackageChange = pkgId => {
        setSelectedPackageId(pkgId);
        const pkg = PACKAGES.find(p => p.id === pkgId);
        if (!pkg) return;
        if (isTieredAllInclusivePackage(pkg.id)) {
          const safePax = Math.max(50, Number(paxCount) || 50);
          setPaxCount(safePax);
          setSelectedTierPax(getAutoTierForPax(safePax));
        } else {
          setCustomBaseFee(pkg.flatPrice || 0);
        }
        setEventVenue(pkg.venue);
      };

      const handleNewQuotationReset = () => {
        setDocNumber(generateDocNumber());
        setQuoteStatus('Draft');
        setClientName('');
        setClientOrg('');
        setClientContact('');
        setEventMotif('');
        setSpecialNotes('');
        setSelectedBuffetMenuId('menu_a_classic');
        setSelectedMenuLines([]);
        setSelectedServiceLines([]);
        setRoomNightsMap({});
        setRoomDatesMap({});
        setDiscountAmount(0);
        setPayments([]);
        setPoNumber('');
        setPoApprovedBudget('');
        setPoNotes('');
        const resetId = `pm_batch_${Date.now()}`;
        setPackedMealDaysCount(1);
        setActivePackedMealDay(1);
        setPackedMealBatches([
          {
            id: resetId,
            day: 1,
            mealType: 'Packed Meal 1',
            date: eventDate || todayIsoDate,
            time: '11:30 AM',
            packs: 30,
            unitRate: 0,
            dishIds: [],
            customItemsText: '',
            notes: ''
          }
        ]);
        setActivePackedMealId(resetId);
        setPreviewMode('client');
        showToast('Started a fresh quotation (your linked sheets stay synced).');
      };

      const handleOneClickAddDish = dish => {
        if (bookingCategory === 'packed_meals' && activePackedBatch) {
          handleToggleDishInPackedBatch(activePackedBatch.id, dish.id);
          showToast(`Toggled "${dish.name}" in Day ${activePackedBatch.day} — ${activePackedBatch.displayLabel}.`);
          return;
        }
        const lineKey = `${effectiveDayForBuilder}__${dish.id}`;
        if (selectedMenuLines.some(i => i.key === lineKey)) {
          showToast(`"${dish.name}" is already in Chosen Menu — adjust pax count below.`);
          return;
        }
        setSelectedMenuLines(prev => [
          ...prev,
          {
            key: lineKey,
            day: effectiveDayForBuilder,
            allDays: false,
            id: dish.id,
            name: dish.name,
            category: dish.category || 'Main Course',
            price: Number(dish.price) || 0,
            unit: dish.unit || 'per_pax',
            customPax: null,
            qty: 1
          }
        ]);
        showToast(`Added "${dish.name}" to Chosen Menu.`);
      };

      const handleUpdateMenuLinePax = (lineKey, rawVal) => {
        if (rawVal === '') {
          setSelectedMenuLines(prev =>
            prev.map(i => (i.key === lineKey ? { ...i, customPax: '' } : i))
          );
          return;
        }
        const parsed = Math.max(0, parseInt(rawVal, 10) || 0);
        setSelectedMenuLines(prev =>
          prev.map(i => (i.key === lineKey ? { ...i, customPax: parsed, qty: 1 } : i))
        );
      };

      const handleStepMenuLinePax = (lineKey, delta, currentEffectivePax) => {
        const nextPax = Math.max(1, (Number(currentEffectivePax) || 1) + delta);
        setSelectedMenuLines(prev =>
          prev.map(i => (i.key === lineKey ? { ...i, customPax: nextPax, qty: 1 } : i))
        );
      };

      const handleResetMenuLinePax = lineKey => {
        setSelectedMenuLines(prev =>
          prev.map(i => (i.key === lineKey ? { ...i, customPax: null, qty: 1 } : i))
        );
      };

      const handleRemoveMenuLine = lineKey => {
        setSelectedMenuLines(prev => prev.filter(i => i.key !== lineKey));
      };

      const handleToggleMenuLineAllDays = lineKey => {
        setSelectedMenuLines(prev => prev.map(i => (i.key === lineKey ? { ...i, allDays: !i.allDays } : i)));
      };

      const handleSaveMenuDish = async (e, autoAdd = false) => {
        e.preventDefault();
        const trimmedName = menuBuilderName.trim();
        if (!trimmedName) return;
        const dishPayload = {
          id: editingMenuId || `MENU-${Date.now()}`,
          name: trimmedName,
          category: menuBuilderCategory || 'Main Course',
          price: Math.max(0, parseNumericAmount(menuBuilderPrice)),
          unit: 'per_pax',
          description: '',
          createdAt: todayIsoDate
        };

        if (isAppsScriptWebAppUrl(menuSheetUrl)) {
          try {
            setIsMutatingSheet(true);
            await mutateSheetViaAppsScript(menuSheetUrl, 'upsert', { item: dishPayload });
            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true, roomsSheetUrl);
          } catch (err) {
            showToast(err.message);
          } finally {
            setIsMutatingSheet(false);
          }
        } else if (editingMenuId) {
          setMenuItems(prev => prev.map(m => (m.id === editingMenuId ? { ...m, ...dishPayload } : m)));
        } else {
          setMenuItems(prev => [dishPayload, ...prev]);
        }

        setEditingMenuId(null);
        setMenuBuilderName('');
        setMenuBuilderPrice('');
        if (autoAdd) {
          handleOneClickAddDish(dishPayload);
          setShowQuickNewDishInStep3(false);
        } else {
          showToast(`Saved "${trimmedName}".`);
        }
      };

      const handleDeleteMenuDish = async dish => {
        if (isAppsScriptWebAppUrl(menuSheetUrl)) {
          try {
            setIsMutatingSheet(true);
            await mutateSheetViaAppsScript(menuSheetUrl, 'delete', { id: dish.id });
            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true, roomsSheetUrl);
          } catch (err) {
            showToast(err.message);
          } finally {
            setIsMutatingSheet(false);
          }
        } else {
          setMenuItems(prev => prev.filter(m => m.id !== dish.id));
        }
        showToast(`Removed "${dish.name}".`);
      };

      const handleSaveServiceItem = async e => {
        e.preventDefault();
        const trimmedName = srvBuilderName.trim();
        if (!trimmedName) return;
        const srvPayload = {
          id: editingServiceId || `SRV-${Date.now()}`,
          name: trimmedName,
          subcategory: srvBuilderCategory,
          category: srvBuilderCategory,
          price: Math.max(0, parseNumericAmount(srvBuilderRate)),
          billingType: srvBuilderBilling,
          createdAt: todayIsoDate
        };

        if (isAppsScriptWebAppUrl(servicesSheetUrl)) {
          try {
            setIsMutatingSheet(true);
            await mutateSheetViaAppsScript(servicesSheetUrl, 'upsert', { item: srvPayload });
            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true, roomsSheetUrl);
          } catch (err) {
            showToast(err.message);
          } finally {
            setIsMutatingSheet(false);
          }
        } else if (editingServiceId) {
          setServiceItems(prev => prev.map(s => (s.id === editingServiceId ? { ...s, ...srvPayload } : s)));
        } else {
          setServiceItems(prev => [srvPayload, ...prev]);
        }
        setEditingServiceId(null);
        setSrvBuilderName('');
        setSrvBuilderRate('');
        showToast(`Saved "${trimmedName}".`);
      };

      const handleDeleteServiceItem = async srv => {
        if (isAppsScriptWebAppUrl(servicesSheetUrl)) {
          try {
            setIsMutatingSheet(true);
            await mutateSheetViaAppsScript(servicesSheetUrl, 'delete', { id: srv.id });
            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true, roomsSheetUrl);
          } catch (err) {
            showToast(err.message);
          } finally {
            setIsMutatingSheet(false);
          }
        } else {
          setServiceItems(prev => prev.filter(s => s.id !== srv.id));
        }
        showToast(`Removed "${srv.name}".`);
      };

      const handleToggleServiceItem = srv => {
        const lineKey = `${effectiveDayForBuilder}__${srv.id}`;
        setSelectedServiceLines(prev => {
          if (prev.some(i => i.key === lineKey)) return prev.filter(i => i.key !== lineKey);
          return [
            ...prev,
            {
              key: lineKey,
              day: effectiveDayForBuilder,
              allDays: false,
              id: srv.id,
              name: srv.name,
              subcategory: srv.subcategory || 'Catering',
              price: Number(srv.price) || 0,
              billingType: srv.billingType || 'per_piece',
              description: srv.description || '',
              qty: 1
            }
          ];
        });
      };

      const handleUpdateServiceLineQty = (lineKey, nextQty) => {
        const cleanQty = Number(nextQty) || 0;
        setSelectedServiceLines(prev =>
          cleanQty <= 0 ? prev.filter(i => i.key !== lineKey) : prev.map(i => (i.key === lineKey ? { ...i, qty: cleanQty } : i))
        );
      };

      const handleToggleServiceLineAllDays = lineKey => {
        setSelectedServiceLines(prev => prev.map(i => (i.key === lineKey ? { ...i, allDays: !i.allDays } : i)));
      };

      const handleAddCustomServiceLine = e => {
        e.preventDefault();
        if (!customServiceName.trim()) return;
        const uniqueId = `custom_srv_${Date.now()}`;
        setSelectedServiceLines(prev => [
          ...prev,
          {
            key: `${effectiveDayForBuilder}__${uniqueId}`,
            day: effectiveDayForBuilder,
            allDays: false,
            id: uniqueId,
            name: customServiceName.trim(),
            subcategory: bookingCategory === 'rental' ? 'Rental' : customServiceCategory,
            price: parseNumericAmount(customServicePrice),
            billingType: customServiceBilling,
            description: '',
            qty: 1
          }
        ]);
        setCustomServiceName('');
        setCustomServicePrice('');
        setShowCustomServiceForm(false);
        showToast(bookingCategory === 'rental' ? 'Custom rental item added.' : 'Custom service line added.');
      };

      const handleImportPastedServices = () => {
        if (!manualServicesPaste.trim()) return;
        const rows = parseGridRows(parseCsvToGrid(manualServicesPaste));
        const parsed = rows
          .map((row, idx) => {
            const cols = row._cols || [];
            const hasId = row.id !== undefined || cols.length >= 6;
            const name = row.serviceitemname || row.servicename || row.name || (hasId ? cols[1] : cols[0]) || '';
            if (!name || String(name).toLowerCase() === 'service / item name') return null;
            return {
              id: String(row.id || (hasId ? cols[0] : '') || `srv_paste_${idx + 1}`).trim(),
              name: String(name).trim(),
              subcategory: normalizeServiceSubcategory(row.eventservicescategory || row.category || (hasId ? cols[2] : cols[1]) || 'Catering'),
              price: parseNumericAmount(row.rate ?? row.price ?? (hasId ? cols[3] : cols[2]) ?? 0),
              billingType: normalizeBillingType(row.billingtype || row.unit || (hasId ? cols[4] : cols[3]) || 'per_piece'),
              description: ''
            };
          })
          .filter(Boolean);
        if (parsed.length > 0) {
          setServiceItems(parsed);
          setManualServicesPaste('');
          setShowManualPasteFallback(false);
          showToast(`Imported ${parsed.length} Event Services!`);
        } else {
          showToast('Could not detect service rows. Copy columns A–F from your sheet.');
        }
      };

      // =======================================================================
      // 9. SAVED QUOTES, CHAT SUMMARY, PAYMENTS & JPEG EXPORT
      // =======================================================================
      const handleSaveCurrentQuoteToLog = () => {
        const record = {
          id: docNumber,
          savedAt: new Date().toLocaleString(),
          bookingCategory, docType, quoteStatus, quoteValidDays, docNumber,
          clientName: clientName || 'Walk-In Client',
          clientOrg, clientContact, occasion, eventMotif, specialNotes,
          showPaymentTermsOnPrint,
          eventVenue, eventDate, rentalReturnDate, eventTime, paxCount, eventDays,
          securityDeposit, rentalTermsText, packedMealDaysCount, packedMealBatches,
          selectedPackageId, selectedBuffetMenuId, selectedTierPax, excessRatePerPax, customBaseFee,
          selectedMenuLines, selectedServiceLines, roomNightsMap, roomDatesMap,
          discountLabel, discountAmount, taxRatePercent, payments,
          poNumber, poApprovedBudget, poNotes,
          grandTotal: totals.grandTotal, balanceDue: totals.balanceDue
        };
        setSavedQuotes(prev => [record, ...prev.filter(q => q.docNumber !== docNumber)].slice(0, 60));
        showToast(`Saved ${docNumber} (${record.clientName}) to Quotes Log!`);
      };

      const handleLoadSavedQuote = (q, asDuplicate = false) => {
        setBookingCategory(q.bookingCategory || 'celebration');
        setDocType(q.docType || 'Quotation');
        setQuoteStatus(asDuplicate ? 'Draft' : q.quoteStatus || 'Draft');
        setQuoteValidDays(q.quoteValidDays ?? 15);
        setDocNumber(asDuplicate ? generateDocNumber() : q.docNumber || generateDocNumber());
        setClientName(q.clientName || '');
        setClientOrg(q.clientOrg || '');
        setClientContact(q.clientContact || '');
        setOccasion(q.occasion || '');
        setEventMotif(q.eventMotif || '');
        setSpecialNotes(q.specialNotes || '');
        setShowPaymentTermsOnPrint(q.showPaymentTermsOnPrint !== false);
        setEventVenue(q.eventVenue || '');
        setEventDate(q.eventDate || todayIsoDate);
        setRentalReturnDate(q.rentalReturnDate || addDaysToIsoDate(todayIsoDate, 1));
        setEventTime(q.eventTime || '');
        setPaxCount(q.paxCount || 50);
        setEventDays(q.eventDays || 1);
        setSecurityDeposit(q.securityDeposit ?? 2000);
        if (q.rentalTermsText) setRentalTermsText(q.rentalTermsText);
        if (Array.isArray(q.packedMealBatches) && q.packedMealBatches.length > 0) {
          const normalizedBatches = q.packedMealBatches.map(b => ({ ...b, day: b.day || 1 }));
          const maxDay = Math.max(q.packedMealDaysCount || 1, ...normalizedBatches.map(b => b.day || 1));
          setPackedMealDaysCount(maxDay);
          setActivePackedMealDay(1);
          setPackedMealBatches(normalizedBatches);
          setActivePackedMealId(normalizedBatches[0].id);
        }
        setSelectedPackageId(q.selectedPackageId || 'pkg_essential');
        setSelectedBuffetMenuId(q.selectedBuffetMenuId || 'menu_a_classic');
        setSelectedTierPax(q.selectedTierPax || 100);
        setExcessRatePerPax(q.excessRatePerPax ?? STANDARD_EXCESS_RATE);
        setCustomBaseFee(q.customBaseFee || 0);
        setSelectedMenuLines(q.selectedMenuLines || []);
        setSelectedServiceLines(q.selectedServiceLines || []);
        setRoomNightsMap(q.roomNightsMap || {});
        setRoomDatesMap(q.roomDatesMap || {});
        setDiscountLabel(q.discountLabel || 'Promo / Management Discount');
        setDiscountAmount(q.discountAmount || 0);
        setTaxRatePercent(q.taxRatePercent || 0);
        setPayments(asDuplicate ? [] : q.payments || []);
        setPoNumber(asDuplicate ? '' : q.poNumber || '');
        setPoApprovedBudget(q.poApprovedBudget || '');
        setPoNotes(q.poNotes || '');
        setIsSavedQuotesOpen(false);
        setActiveTab('builder');
        showToast(asDuplicate ? `Duplicated quote for ${q.clientName}.` : `Loaded ${q.docNumber}.`);
      };

      const handleCopyMessengerSummary = () => {
        const lines = [
          `✨ ${businessProfile.businessName || 'EYNS HOTEL & RESTAURANT'}`,
          `📄 ${docType.toUpperCase()} (${docNumber})`,
          `👤 Client: ${clientName || 'Valued Client'}${clientOrg ? ` (${clientOrg})` : ''}`
        ];
        if (bookingCategory === 'rental') {
          lines.push(`🚚 Purpose: ${occasion}`);
          lines.push(`📅 Dates: ${formatPrettyDate(eventDate)} → ${formatPrettyDate(rentalReturnDate)} (${rentalDurationDays}d)`);
        } else if (bookingCategory === 'packed_meals') {
          lines.push(`🍱 Order: ${occasion} — ${computedPackedMealsSummary.totalPacks} Total Packs (${packedMealDaysCount} ${packedMealDaysCount === 1 ? 'Day' : 'Days'}, ${computedPackedMealsSummary.batches.length} Meals)`);
          computedPackedMealsSummary.batches.forEach(b => {
            const dayTag = packedMealDaysCount > 1 ? `Day ${b.day} • ` : '';
            const dishNames = b.chosenDishes.map(d => d.name).join(', ');
            const itemSummary = [dishNames, b.customItemsText].filter(Boolean).join(' + ') || 'Custom Packed Meal';
            lines.push(`   • ${dayTag}${b.displayLabel} (${formatPrettyDate(b.date)} @ ${b.time || 'TBD'}) — ${b.packs} packs: ${itemSummary} (${formatCurrency(b.batchTotal)})`);
          });
        } else {
          lines.push(`🎉 Event: ${occasion} — ${paxCount} Pax${bookingCategory === 'seminar' && eventDays > 1 ? ` (${eventDays} Days)` : ''}`);
          lines.push(`📅 Date & Time: ${formatPrettyDate(eventDate)} | ${eventTime || 'TBD'}`);
        }
        lines.push(`📍 Location: ${eventVenue}`, '', '📋 SUMMARY OF CHARGES:');
        if (showPackageStep && (packageBreakdown.total > 0 || isTieredAllInclusivePackage(selectedPackage.id))) {
          const menuSuffix = selectedPackage.foodIncluded
            ? (isCustomReplaceMenu
                ? ` (Customized Menu: −₱${packageBreakdown.foodCreditPerPax}/pax credit applied)`
                : ` + ${selectedBuffetMenu.name}`)
            : '';
          lines.push(`• ${selectedPackage.name}${menuSuffix}: ${formatCurrency(packageBreakdown.total)}`);
        }
        if (bookingCategory !== 'packed_meals' && computedMenuSummary.lines.length > 0) {
          lines.push(`• Menu (${computedMenuSummary.lines.map(l => `${l.name} (${l.effectivePax} pax)`).join(', ')}): ${formatCurrency(computedMenuSummary.netMenuTotal)}`);
        }
        if (computedServiceLines.length > 0) {
          lines.push(`• ${bookingCategory === 'rental' ? 'Rentals' : 'Services'} (${computedServiceLines.map(l => `${l.name} x${l.qty}`).join(', ')}): ${formatCurrency(servicesSubtotal)}`);
        }
        if (selectedRoomsList.length > 0) {
          lines.push(`• Rooms (${selectedRoomsList.map(r => `${r.roomNo} [${formatPrettyDate(r.checkIn)}–${formatPrettyDate(r.checkOut)}]`).join(', ')}): ${formatCurrency(roomsSubtotal)}`);
        }
        if (totals.discount > 0) lines.push(`• Less ${discountLabel}: -${formatCurrency(totals.discount)}`);
        if (totals.deposit > 0) lines.push(`• Security Deposit: ${formatCurrency(totals.deposit)}`);
        lines.push('', `💰 GRAND TOTAL: ${formatCurrency(totals.grandTotal)}`);
        if (bookingCategory !== 'rental') {
          lines.push(`📊 Avg / ${bookingCategory === 'packed_meals' ? 'Pack' : 'Pax'}: ${formatCurrency(effectivePerHeadCost)}`);
        }
        if (totals.totalPaid > 0) {
          lines.push(`✅ Paid: ${formatCurrency(totals.totalPaid)} | 📌 Balance: ${formatCurrency(totals.balanceDue)}`);
        } else {
          lines.push(`📌 50% Reservation Downpayment: ${formatCurrency(totals.grandTotal * 0.5)}`);
        }
        lines.push(`⏳ Valid until ${formatPrettyDate(quoteValidUntilDate)}. Thank you!`);
        copyTextFallback(lines.join('\n'));
        showToast('Messenger / Viber quote summary copied!');
      };

      const handleAddPayment = e => {
        e.preventDefault();
        const amt = parseNumericAmount(newPayAmount);
        if (amt <= 0) return;
        setPayments(prev => [
          ...prev,
          { id: `pay_${Date.now()}`, date: newPayDate || todayIsoDate, method: newPayMethod, reference: newPayRef.trim() || 'Official Receipt', amount: amt }
        ]);
        setNewPayAmount('');
        setNewPayRef('');
        showToast('Payment entry recorded.');
      };

      const handleDownloadJpeg = async () => {
        if (!printRef.current || typeof html2canvas === 'undefined') {
          showToast('Export engine loading, try again in a second.');
          return;
        }
        try {
          showToast('Generating high-res A4 JPEG...');
          const canvas = await html2canvas(printRef.current, { scale: 2, useCORS: true, backgroundColor: '#FFFFFF' });
          const link = document.createElement('a');
          const safeClient = (clientName || 'Client').replace(/[^a-zA-Z0-9_-]/g, '_');
          link.download = `${docNumber}_${safeClient}${previewMode === 'beo' ? '_BEO' : ''}.jpg`;
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
          showToast('JPEG downloaded!');
        } catch (err) {
          showToast('Could not generate JPEG.');
        }
      };

      // =======================================================================
      // 10. FILTERED CATALOGS & METRICS
      // =======================================================================
      const menuCategoryStats = useMemo(() => {
        const counts = {};
        menuItems.forEach(m => {
          const c = m.category || 'Main Course';
          counts[c] = (counts[c] || 0) + 1;
        });
        return [{ name: 'All', count: menuItems.length }, ...Object.entries(counts).map(([name, count]) => ({ name, count }))];
      }, [menuItems]);

      const filteredMenuItems = useMemo(() => {
        const q = menuSearchQuery.trim().toLowerCase();
        return menuItems.filter(item =>
          (menuCategoryFilter === 'All' || item.category === menuCategoryFilter) &&
          (!q || item.name.toLowerCase().includes(q) || (item.category || '').toLowerCase().includes(q))
        );
      }, [menuItems, menuCategoryFilter, menuSearchQuery]);

      const serviceCategoryStats = useMemo(() => {
        return ['All', 'Catering', 'Rental', 'Suppliers'].map(name => ({
          name,
          count: name === 'All' ? serviceItems.length : serviceItems.filter(s => s.subcategory === name).length
        }));
      }, [serviceItems]);

      const filteredServiceItems = useMemo(() => {
        const pool = bookingCategory === 'rental' ? serviceItems.filter(s => s.subcategory === 'Rental') : serviceItems;
        const q = serviceSearchQuery.trim().toLowerCase();
        return pool.filter(item =>
          (bookingCategory === 'rental' || serviceSubcategoryFilter === 'All' || item.subcategory === serviceSubcategoryFilter) &&
          (!q || item.name.toLowerCase().includes(q) || (item.subcategory || '').toLowerCase().includes(q))
        );
      }, [bookingCategory, serviceItems, serviceSubcategoryFilter, serviceSearchQuery]);

      const savedQuotesMetrics = useMemo(() => ({
        confirmedCount: savedQuotes.filter(q => q.quoteStatus === 'Confirmed' || q.quoteStatus === 'Fully Paid').length,
        totalPipeline: savedQuotes.reduce((s, q) => s + (Number(q.grandTotal) || 0), 0),
        totalReceivables: savedQuotes.reduce((s, q) => s + (Number(q.balanceDue) || 0), 0)
      }), [savedQuotes]);

      const filteredSavedQuotes = useMemo(() => {
        const q = savedQuotesSearch.trim().toLowerCase();
        return savedQuotes.filter(item =>
          (savedQuotesStatusFilter === 'All' || (item.quoteStatus || 'Draft') === savedQuotesStatusFilter) &&
          (!q || (item.clientName || '').toLowerCase().includes(q) || (item.docNumber || '').toLowerCase().includes(q) || (item.occasion || '').toLowerCase().includes(q))
        );
      }, [savedQuotes, savedQuotesSearch, savedQuotesStatusFilter]);

      // =======================================================================
      // 11. RENDER UI
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast */}
          {toastMsg && (
            <div className="no-print fixed bottom-5 right-5 z-50 bg-espresso-950 text-cream-50 border border-gold-500/50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-sm font-semibold max-w-md">
              <i className="fa-solid fa-circle-check text-gold-400 shrink-0"></i>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Top Navigation */}
          <header className="no-print bg-espresso-950 text-cream-50 border-b border-gold-500/30 sticky top-0 z-40">
            <div className="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 text-espresso-950 flex items-center justify-center font-serif font-extrabold text-lg shadow">
                  E
                </div>
                <div>
                  <h1 className="font-serif text-lg sm:text-xl font-bold tracking-wide text-gold-300 leading-tight">
                    {businessProfile.businessName || 'EYNS HOTEL & RESTAURANT'}
                  </h1>
                  <p className="text-[11px] text-cream-200/80">Event Quotation, SOA, BEO &amp; Rental Builder</p>
                </div>
              </div>

              <nav className="flex flex-wrap items-center gap-1.5 bg-espresso-900/90 p-1 rounded-xl border border-espresso-800">
                {[
                  { id: 'builder', label: 'Quotation Builder', icon: 'fa-file-invoice-dollar' },
                  { id: 'packages', label: 'Official Packages', icon: 'fa-crown' },
                  { id: 'menu', label: 'A La Carte Menu (#3)', icon: 'fa-utensils', badge: menuItems.length },
                  { id: 'services', label: 'Event Services (#4)', icon: 'fa-champagne-glasses', badge: serviceItems.length },
                  { id: 'rooms', label: 'Hotel Rooms (#5)', icon: 'fa-bed', badge: roomItems.length }
                ].map(tab => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                      activeTab === tab.id ? 'bg-gold-500 text-espresso-950 shadow' : 'text-cream-100 hover:bg-espresso-800'
                    }`}
                  >
                    <i className={`fa-solid ${tab.icon}`}></i>
                    <span>{tab.label}</span>
                    {typeof tab.badge === 'number' && tab.badge > 0 && (
                      <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-mono ${activeTab === tab.id ? 'bg-espresso-950 text-gold-300' : 'bg-espresso-800 text-gold-300'}`}>
                        {tab.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>

              <div className="flex flex-wrap items-center gap-2">
                <button type="button" onClick={handleNewQuotationReset} className="px-2.5 py-2 rounded-xl bg-espresso-800 hover:bg-espresso-700 text-cream-100 border border-espresso-700 text-xs font-bold flex items-center gap-1.5">
                  <i className="fa-solid fa-file-circle-plus text-gold-400"></i>
                  <span className="hidden md:inline">New Quote</span>
                </button>
                <button type="button" onClick={() => setIsSavedQuotesOpen(true)} className="px-2.5 py-2 rounded-xl bg-espresso-800 hover:bg-espresso-700 text-cream-100 border border-espresso-700 text-xs font-bold flex items-center gap-1.5">
                  <i className="fa-solid fa-folder-open text-gold-400"></i>
                  <span className="hidden md:inline">Saved ({savedQuotes.length})</span>
                </button>
                <button type="button" onClick={() => setIsProfileModalOpen(true)} className="px-2.5 py-2 rounded-xl bg-espresso-800 hover:bg-espresso-700 text-cream-100 border border-espresso-700 text-xs font-bold flex items-center gap-1.5">
                  <i className="fa-solid fa-building-columns text-gold-400"></i>
                  <span className="hidden lg:inline">Profile</span>
                </button>
                <button type="button" onClick={() => setIsSyncModalOpen(true)} className="px-3 py-2 rounded-xl bg-espresso-800 hover:bg-espresso-700 text-gold-300 border border-gold-500/30 text-xs font-bold flex items-center gap-1.5">
                  <i className={`fa-solid fa-rotate ${isSyncingSheets ? 'animate-spin' : ''}`}></i>
                  <span>{menuSheetUrl || servicesSheetUrl || roomsSheetUrl ? (autoSyncEnabled ? 'Live Synced' : 'Sheets Linked') : 'Link Sheets'}</span>
                  <span className={`w-2 h-2 rounded-full ${menuSheetUrl || servicesSheetUrl || roomsSheetUrl ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                </button>
                <button type="button" onClick={handleCopyMessengerSummary} className="px-3 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold flex items-center gap-1.5 shadow">
                  <i className="fa-brands fa-facebook-messenger"></i>
                  <span className="hidden sm:inline">Chat Copy</span>
                </button>
                <button type="button" onClick={handleDownloadJpeg} className="px-3 py-2 rounded-xl bg-cream-100 hover:bg-white text-espresso-950 text-xs font-bold flex items-center gap-1.5 shadow">
                  <i className="fa-solid fa-image text-gold-600"></i>
                  <span>JPEG</span>
                </button>
                <button type="button" onClick={() => window.print()} className="px-3.5 py-2 rounded-xl bg-gold-500 hover:bg-gold-400 text-espresso-950 text-xs font-extrabold flex items-center gap-1.5 shadow">
                  <i className="fa-solid fa-print"></i>
                  <span>Print A4</span>
                </button>
              </div>
            </div>
          </header>

          {/* TAB 1: QUOTATION BUILDER & LIVE A4 / BEO PREVIEW */}
          {activeTab === 'builder' && (
            <main className="flex-1 max-w-[1600px] w-full mx-auto px-4 py-6 grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
              {/* LEFT PANE */}
              <div className="no-print xl:col-span-6 space-y-5">
                {/* Executive KPI Strip */}
                <section className="bg-espresso-950 text-cream-50 rounded-2xl p-4 border border-gold-500/30 shadow-md grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="bg-espresso-900/90 rounded-xl p-2.5 border border-espresso-800">
                    <div className="text-[10px] font-bold uppercase text-cream-200/70">Grand Total</div>
                    <div className="font-mono text-base font-extrabold text-gold-300 mt-0.5">{formatCurrency(totals.grandTotal)}</div>
                  </div>
                  <div className="bg-espresso-900/90 rounded-xl p-2.5 border border-espresso-800">
                    <div className="text-[10px] font-bold uppercase text-cream-200/70">
                      {bookingCategory === 'rental' ? 'Rental Duration' : bookingCategory === 'packed_meals' ? 'Avg / Pack' : 'Avg / Pax'}
                    </div>
                    <div className="font-mono text-base font-extrabold text-cream-50 mt-0.5">
                      {bookingCategory === 'rental' ? `${rentalDurationDays} ${rentalDurationDays === 1 ? 'Day' : 'Days'}` : formatCurrency(effectivePerHeadCost)}
                    </div>
                  </div>
                  <div className="bg-espresso-900/90 rounded-xl p-2.5 border border-espresso-800">
                    <div className="text-[10px] font-bold uppercase text-cream-200/70">{totals.totalPaid > 0 ? 'Balance Due' : '50% Downpayment'}</div>
                    <div className={`font-mono text-base font-extrabold mt-0.5 ${totals.totalPaid > 0 && totals.balanceDue === 0 ? 'text-emerald-400' : 'text-amber-300'}`}>
                      {totals.totalPaid > 0 ? formatCurrency(totals.balanceDue) : formatCurrency(totals.grandTotal * 0.5)}
                    </div>
                  </div>
                  <div className="bg-espresso-900/90 rounded-xl p-2.5 border border-espresso-800 flex flex-col justify-between">
                    <label className="text-[10px] font-bold uppercase text-cream-200/70">Deal Status</label>
                    <select value={quoteStatus} onChange={e => setQuoteStatus(e.target.value)} className="mt-0.5 bg-espresso-950 text-gold-300 border border-gold-500/30 rounded-lg px-2 py-1 text-xs font-extrabold">
                      <option value="Draft">Draft</option>
