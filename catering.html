    /**
     * Reads a cookie value safely by name.
     */
    function readCookieValue(name) {
      try {
        const prefix = encodeURIComponent(name) + '=';
        const parts = (document.cookie || '').split(';');
        for (let i = 0; i < parts.length; i++) {
          const trimmed = parts[i].trim();
          if (trimmed.startsWith(prefix)) {
            return decodeURIComponent(trimmed.slice(prefix.length));
          }
        }
      } catch (e) {}
      return '';
    }

    /**
     * Writes a cookie value safely with expiration days.
     */
    function writeCookieValue(name, value, days = 365) {
      try {
        const expires = value
          ? '; expires=' + new Date(Date.now() + days * 86400000).toUTCString()
          : '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        document.cookie =
          encodeURIComponent(name) +
          '=' +
          encodeURIComponent(value || '') +
          expires +
          '; path=/; SameSite=Lax';
      } catch (e) {}
    }

    /**
     * Reads an optional query or hash parameter from the URL.
     */
    function readUrlParam(paramName) {
      try {
        const searchParams = new URLSearchParams(window.location.search || '');
        const fromSearch = (searchParams.get(paramName) || '').trim();
        if (fromSearch) return fromSearch;
        const rawHash = (window.location.hash || '').replace(/^#/, '');
        if (!rawHash) return '';
        const hashParams = new URLSearchParams(rawHash);
        return (hashParams.get(paramName) || '').trim();
      } catch (e) {
        return '';
      }
    }

    /**
     * Recovers a persisted string from URL, localStorage, sessionStorage, or cookies.
     */
    function recoverSavedString(candidateKeys, fallbackValue = '', urlParamName = '') {
      if (urlParamName) {
        const fromUrl = readUrlParam(urlParamName);
        if (fromUrl) return fromUrl;
      }
      try {
        for (const k of candidateKeys) {
          const val = localStorage.getItem(k) || sessionStorage.getItem(k) || readCookieValue(k);
          if (val && val.trim()) return val.trim();
        }
      } catch (e) {}
      return fallbackValue;
    }

    /**
     * Persists a string across localStorage, sessionStorage, and cookies.
     */
    function persistSavedString(primaryKey, legacyKeys, value) {
      const clean = String(value || '').trim();
      try {
        if (clean) {
          localStorage.setItem(primaryKey, clean);
          sessionStorage.setItem(primaryKey, clean);
          writeCookieValue(primaryKey, clean, 365);
        } else {
          legacyKeys.forEach(k => {
            localStorage.removeItem(k);
            sessionStorage.removeItem(k);
            writeCookieValue(k, '', 0);
          });
        }
      } catch (e) {}
    }

    /**
     * Recovers a JSON array from localStorage safely.
     */
    function recoverSavedJsonArray(candidateKeys, fallbackArray = []) {
      try {
        for (const k of candidateKeys) {
          const raw = localStorage.getItem(k);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        }
      } catch (e) {}
      return fallbackArray;
    }

      } catch (e) {

    }

    function generateDocNumber() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const rand = String(Math.floor(1000 + Math.random() * 9000));
      return `EYNS-${yy}${mm}${dd}-${rand}`;

    function formatCurrency(val) {
      const num = Number(val) || 0;
      return '₱' + num.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function formatWholeCurrency(val) {
      return '₱' + Math.round(Number(val) || 0).toLocaleString('en-PH');

    function formatPrettyDate(isoStr) {
      if (!isoStr) return 'TBD';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function addDaysToIsoDate(isoStr, offsetDays) {
      if (!isoStr) return '';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      dt.setDate(dt.getDate() + offsetDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function computeDaysBetweenDates(startIso, endIso) {
      if (!startIso || !endIso) return 1;
      const s = new Date(startIso + 'T00:00:00');
      const e = new Date(endIso + 'T00:00:00');
      if (isNaN(s.getTime()) || isNaN(e.getTime())) return 1;
      return Math.max(1, Math.round((e.getTime() - s.getTime()) / 86400000));
    }

    /**
     * Smooth Numeric Input Component:
     * Allows clearing and typing multi-digit numbers freely without snapping back mid-edit.
     */
    function SmoothNumberInput({ value, onValueChange, min = 0, max, allowDecimal = false, className = '', placeholder = '' }) {
      const [rawText, setRawText] = useState(value === undefined || value === null ? '' : String(value));
      const [isFocused, setIsFocused] = useState(false);

      useEffect(() => {
        if (!isFocused) {
          setRawText(value === undefined || value === null ? '' : String(value));
        }
      }, [value, isFocused]);

      const commitParsed = str => {
        const cleaned = allowDecimal ? str.replace(/[^0-9.]/g, '') : str.replace(/[^0-9]/g, '');
        if (!cleaned) {
          onValueChange(min);
          setRawText(String(min));
          return;
        }
        let num = allowDecimal ? parseFloat(cleaned) : parseInt(cleaned, 10);
        if (isNaN(num)) num = min;
        if (min !== undefined && num < min) num = min;
        if (max !== undefined && num > max) num = max;
        onValueChange(num);
        setRawText(String(num));
      };

      return (
        <input
          type="text"
          inputMode={allowDecimal ? 'decimal' : 'numeric'}
          value={rawText}
          placeholder={placeholder}
          onFocus={e => {
            setIsFocused(true);
            e.target.select();
          }}
          onChange={e => {
            const next = e.target.value;
            setRawText(next);
            const cleaned = allowDecimal ? next.replace(/[^0-9.]/g, '') : next.replace(/[^0-9]/g, '');
            if (cleaned !== '') {
              let num = allowDecimal ? parseFloat(cleaned) : parseInt(cleaned, 10);
              if (!isNaN(num)) {
                if (max !== undefined && num > max) num = max;
                if (num >= min) onValueChange(num);
              }
            }
          }}
          onBlur={() => {
            setIsFocused(false);
            commitParsed(rawText);
          }}
          onKeyDown={e => {
            if (e.key === 'Enter') e.target.blur();
          }}
          className={className}
        />
      );
    }

      return WEDDING_ONLY_INCLUSION_KEYWORDS.some(kw => lower.includes(kw));

      let list = isWeddingReception
        ? [...pkg.inclusions]

      const matchedTier = tiers.find(t => t.pax === tierPax) || tiers[0] || { pax: 50, price: 0 };
      const effectiveTotalPax = Math.max(matchedTier.pax, Number(totalPax) || matchedTier.pax);
      const excessPax = Math.max(0, effectiveTotalPax - matchedTier.pax);
      const rate = Math.max(0, Number(excessRate) || 0);
      const excessCharge = excessPax * rate;
      const grossPackageTotal = matchedTier.price + excessCharge;

      const isCustomReplaced = buffetMenuId === 'custom_menu';
      const buffetPlan = SAMPLE_BUFFET_MENUS.find(m => m.id === buffetMenuId) || SAMPLE_BUFFET_MENUS[0];
      const menuUpgradeAddon = !isCustomReplaced && buffetPlan.addonPerPax > 0 ? buffetPlan.addonPerPax * effectiveTotalPax : 0;
      const customMenuCredit = isCustomReplaced ? BASE_FOOD_CREDIT_PER_PAX * effectiveTotalPax : 0;
      const total = Math.max(0, grossPackageTotal + menuUpgradeAddon - customMenuCredit);

      return {
        tierPax: matchedTier.pax,
        effectivePax: effectiveTotalPax,
        basePrice: matchedTier.price,
        excessPax,
        excessRate: rate,
        excessCharge,
        grossPackageTotal,
        buffetPlan,
        isCustomReplaced,
        menuUpgradeAddon,
        customMenuCredit,
        total
      };
    }

    function parseCsvToGrid(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map(l => l.replace(/\r$/, ''))
        .filter(l => l.trim().length > 0);
      if (lines.length === 0) return [];
      if (lines[0].includes('\t')) {
        return lines.map(line => line.split('\t').map(cell => cell.trim()));
      }
      return lines.map(line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      });
    }

    function parseGridRows(rawGrid) {
      const grid = (rawGrid || [])
        .map(row => (Array.isArray(row) ? row.map(c => (c == null ? '' : String(c).trim())) : []))
        .filter(row => row.some(cell => cell !== ''));
      if (grid.length === 0) return [];

      const cleanKey = str => String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const KNOWN = [
        'id', 'dishname', 'dish', 'menuitem', 'category', 'priceperpax', 'price',
        'serviceitemname', 'servicename', 'service', 'itemname', 'item',
        'eventservicescategory', 'subcategory', 'rate', 'billingtype', 'unit',
        'roomno', 'roomnumber', 'room', 'roomtype', 'type', 'ratepernight', 'capacity', 'inclusions'
      ];

      let headerRowIdx = -1;
      for (let r = 0; r < Math.min(3, grid.length); r++) {
        if (grid[r].filter(cell => KNOWN.includes(cleanKey(cell))).length >= 2) {
          headerRowIdx = r;
          break;
        }
      }

      if (headerRowIdx !== -1) {
        const headers = grid[headerRowIdx].map(cleanKey);
        return grid.slice(headerRowIdx + 1).map(cols => {
          const obj = { _cols: cols, _hasHeaders: true };
          headers.forEach((h, i) => {
            if (h) obj[h] = cols[i] ?? '';
          });
          return obj;
        });
      }
      return grid.map(cols => ({ _cols: cols, _hasHeaders: false }));
    }

    function resolveGoogleSheetUrl(rawUrl) {
      const trimmed = String(rawUrl || '').trim();
      if (!trimmed) return { url: '', sheetId: '', gid: '' };

      if (trimmed.includes('/spreadsheets/d/e/')) {
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gidParam = gidMatch ? '&gid=' + gidMatch[1] : '';
        const csvUrl = trimmed.includes('/pubhtml')
          ? trimmed.replace('/pubhtml', '/pub?output=csv' + gidParam)
          : trimmed.includes('output=csv')
          ? trimmed
          : trimmed.replace(/\/pub(\?.*)?$/, '/pub?output=csv' + gidParam);
        return { url: csvUrl, sheetId: '', gid: gidMatch ? gidMatch[1] : '' };
      }

      const sheetMatch =
        trimmed.match(/docs\.google\.com\/spreadsheets\/(?:u\/\d+\/)?d\/(?!e\/)([a-zA-Z0-9-_]+)/) ||
        trimmed.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9-_]+)/);

      if (sheetMatch) {
        const sheetId = sheetMatch[1];
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gid = gidMatch ? gidMatch[1] : '';
        return {
          url: `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv${gid ? '&gid=' + gid : ''}`,
          sheetId,
          gid
        };
      }
      return { url: trimmed, sheetId: '', gid: '' };
    }

    async function fetchSheetRowsUniversal(rawUrl) {
      const resolved = resolveGoogleSheetUrl(rawUrl);
      if (!resolved.url) return { rows: [] };
      let lastErr = '';

      try {
        const sep = resolved.url.includes('?') ? '&' : '?';
        const res = await fetch(`${resolved.url}${sep}_ts=${Date.now()}`);
        if (res.ok) {
          const text = await res.text();
          if (text && !text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
            return { rows: parseGridRows(parseCsvToGrid(text)) };
          }
          lastErr = 'Google Sheet is Restricted. Set Share → Anyone with the link (Viewer).';
        } else {
          lastErr = `HTTP ${res.status}`;
        }
      } catch (e) {
        lastErr = e?.message || 'Network/CORS block';
      }

      if (resolved.sheetId) {
        return await new Promise((resolve, reject) => {
          const cbName = `__eyns_gviz_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
          const script = document.createElement('script');
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('Timed out reading Google Sheet. Set Share → Anyone with the link (Viewer).'));
          }, 10000);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = response => {
            cleanup();
            try {
              if (!response || response.status === 'error') {
                reject(new Error('Google Sheet is Restricted. Set Share → Anyone with the link (Viewer).'));
                return;
              }
              const table = response.table || {};
              const colLabels = (table.cols || []).map(c => (c && c.label ? String(c.label).trim() : ''));
              const dataRows = (table.rows || []).map(r =>
                (r.c || []).map(cell => {
                  if (!cell || cell.v === null || cell.v === undefined) return '';
                  return cell.f != null ? String(cell.f).trim() : String(cell.v).trim();
                })
              );
              const combined = colLabels.some(Boolean) ? [colLabels, ...dataRows] : dataRows;
              resolve({ rows: parseGridRows(combined) });
            } catch (err) {
              reject(err);
            }
          };

          const gidParam = resolved.gid ? `&gid=${resolved.gid}` : '';
          script.src = `https://docs.google.com/spreadsheets/d/${resolved.sheetId}/gviz/tq?tqx=out:json;responseHandler:${cbName}&headers=0${gidParam}`;
          script.onerror = () => {
            cleanup();
            reject(new Error('Google Sheet is Restricted or unreachable. Set Share → Anyone with the link (Viewer).'));
          };
          document.head.appendChild(script);
        });
      }

      throw new Error(`Could not connect (${lastErr}). Paste a valid Google Sheet link.`);
    }

                    id: String(row.id || cols[0] || `menu_sheet_${idx + 1}`).trim(),

      const handleAddQuickCustomDish = e => {

          id: `custom_dish_${Date.now()}`,

      // Step 3: Redesigned Packed Meals Handlers (Pax -> Days -> Meal Types -> Dishes)
      const getPackedDateForDay = dayNum => {

        if (match) return match.date;
        const day1Date = packedMealBatches.find(b => (Number(b.day) || 1) === 1 && b.date)?.date || eventDate;
        return addDaysToIsoDate(day1Date, dayNum - 1);
      };

      const activeDayPackedBatches = useMemo(() => {
        return packedMealBatches
          .filter(b => (Number(b.day) || 1) === activePackedDay)
          .sort((a, b) => MEAL_PERIOD_ORDER.indexOf(a.mealType || 'Lunch') - MEAL_PERIOD_ORDER.indexOf(b.mealType || 'Lunch'));
      }, [packedMealBatches, activePackedDay]);

      useEffect(() => {
        if (bookingCategory === 'packed_meals' && activeDayPackedBatches.length > 0) {
          if (!activeDayPackedBatches.some(b => b.id === activePackedBatchId)) {
            setActivePackedBatchId(activeDayPackedBatches[0].id);
          }
        }
      }, [bookingCategory, activeDayPackedBatches, activePackedBatchId]);

      const activePackedBatch = useMemo(
        () => activeDayPackedBatches.find(b => b.id === activePackedBatchId) || activeDayPackedBatches[0] || null,
        [activeDayPackedBatches, activePackedBatchId]
      );

      const handleUpdatePackedDefaultPax = nextVal => {
        const clean = Math.max(1, Number(nextVal) || 1);
        setPackedDefaultPax(clean);
        setPackedMealBatches(prev =>
          prev.map(b => (b.hasCustomPacks ? b : { ...b, packs: clean }))
        );
      };

      const handleApplyDefaultPaxToAllMeals = () => {
        const clean = Math.max(1, Number(packedDefaultPax) || 1);
        setPackedMealBatches(prev =>
          prev.map(b => ({ ...b, packs: clean, hasCustomPacks: false }))
        );
        showToast(`Applied ${clean} packs to all meal batches.`);
      };

      const handleSetPackedTotalDaysCount = desiredDays => {
        const targetDays = Math.max(1, Math.min(30, Number(desiredDays) || 1));
        setPackedTotalDays(targetDays);
        if (activePackedDay > targetDays) setActivePackedDay(targetDays);
        setPackedMealBatches(prev => {
          let next = [...prev];
          const day1Template = next.filter(b => (Number(b.day) || 1) === 1);
          const day1Date = day1Template[0]?.date || eventDate;
          for (let d = 1; d <= targetDays; d++) {
            if (!next.some(b => (Number(b.day) || 1) === d)) {
              const dayDate = addDaysToIsoDate(day1Date, d - 1);
              if (day1Template.length > 0) {
                day1Template.forEach((tpl, idx) => {
                  next.push({
                    ...createDefaultPackedBatch(idx + 1, dayDate, tpl.mealType || 'Lunch', packedDefaultPax, d, tpl.label),
                    time: tpl.time,
                    boxInclusions: tpl.boxInclusions
                  });
                });
              } else {
                next.push(createDefaultPackedBatch(1, dayDate, 'Lunch', packedDefaultPax, d));
              }
            }
          }
          return next;
        });
      };

      const handleUpdatePackedDayDate = (dayNum, nextDate) => {
        setPackedMealBatches(prev =>
          prev.map(b => ((Number(b.day) || 1) === dayNum ? { ...b, date: nextDate } : b))
        );

      const handleTogglePackedMealType = (dayNum, mealTypeId) => {
        const dayBatches = packedMealBatches.filter(b => (Number(b.day) || 1) === dayNum);
        const matching = dayBatches.filter(b => (b.mealType || 'Lunch') === mealTypeId);

        if (matching.length > 0) {
          const remainingOnDay = dayBatches.filter(b => (b.mealType || 'Lunch') !== mealTypeId);
          if (remainingOnDay.length === 0) {
            showToast('At least one meal type must stay checked for this day.');
            return;
          }
          setPackedMealBatches(prev =>
            prev.filter(b => !((Number(b.day) || 1) === dayNum && (b.mealType || 'Lunch') === mealTypeId))
          );
          if (matching.some(m => m.id === activePackedBatchId)) {
            setActivePackedBatchId(remainingOnDay[0].id);
          }
        } else {
          const dayDate = getPackedDateForDay(dayNum);
          const fresh = createDefaultPackedBatch(dayBatches.length + 1, dayDate, mealTypeId, packedDefaultPax, dayNum, mealTypeId);
          setPackedMealBatches(prev => [...prev, fresh]);
          setActivePackedBatchId(fresh.id);
        }

      const handleAddPackedMealVariant = (dayNum, baseMealType = 'Lunch') => {
        const dayBatches = packedMealBatches.filter(b => (Number(b.day) || 1) === dayNum);
        const sameTypeCount = dayBatches.filter(b => (b.mealType || 'Lunch') === baseMealType).length;
        const dayDate = getPackedDateForDay(dayNum);
        const variantLabel = `${baseMealType} — Set ${sameTypeCount + 1}`;
        const fresh = createDefaultPackedBatch(dayBatches.length + 1, dayDate, baseMealType, packedDefaultPax, dayNum, variantLabel);
        setPackedMealBatches(prev => [...prev, fresh]);
        setActivePackedBatchId(fresh.id);
        showToast(`Added "${variantLabel}" to Day ${dayNum}.`);
      };

      const handleRemovePackedBatch = batchId => {
        const target = packedMealBatches.find(b => b.id === batchId);
        if (!target) return;
        const targetDay = Number(target.day) || 1;
        const remainingOnDay = packedMealBatches.filter(b => (Number(b.day) || 1) === targetDay && b.id !== batchId);
        if (remainingOnDay.length === 0) {
          showToast('Keep at least one meal on this day.');
          return;
        }
        setPackedMealBatches(prev => prev.filter(b => b.id !== batchId));
        if (activePackedBatchId === batchId) setActivePackedBatchId(remainingOnDay[0].id);

          for (let d = 1; d <= packedTotalDays; d++) {
            if (d === sourceDayNum) {
              rebuilt.push(...sourceBatches);
            } else {
              const targetDate =
                prev.find(b => (Number(b.day) || 1) === d && b.date)?.date ||
                addDaysToIsoDate(sourceBatches[0].date || eventDate, d - sourceDayNum);
              sourceBatches.forEach((src, idx) => {
                rebuilt.push({
                  ...src,

                  date: targetDate,
                  dishes: (src.dishes || []).map(dish => ({ ...dish }))
                });

          }

        );

      const handleAddCustomServiceLine = e => {

      // Hotel Room Booking Handlers (with Check-In & Check-Out Dates)
      const handleUpdateRoomBooking = (roomId, patch) => {
        setRoomBookingsMap(prev => {
          const defaultCheckIn = eventDate || new Date().toISOString().split('T')[0];
          const existing = prev[roomId] || {
            nights: 0,
            checkIn: defaultCheckIn,
            checkOut: addDaysToIsoDate(defaultCheckIn, 1)
          };
          const merged = { ...existing, ...patch };
          if (patch.nights !== undefined) {

            if (n <= 0) {
              const copy = { ...prev };
              delete copy[roomId];
              return copy;

            merged.nights = n;
            merged.checkOut = addDaysToIsoDate(merged.checkIn, n);
          } else if (patch.checkIn !== undefined || patch.checkOut !== undefined) {
            if (merged.checkIn && merged.checkOut) {

              merged.nights = computedNights;
              if (merged.checkOut <= merged.checkIn) {

          }
          return { ...prev, [roomId]: merged };

      // =======================================================================
      // 8. FINANCIAL CALCULATIONS & ZERO-PRICE BEO OPS COMPUTATION
      // =======================================================================
      const computedMenuSummary = useMemo(() => {
        if (!showMenuStep || bookingCategory === 'packed_meals') {
          return { lines: [], netMenuTotal: 0 };
        }
        const maxDay = bookingCategory === 'seminar' ? Math.max(1, eventDays) : 1;
        const lines = selectedMenuLines
          .filter(line => (Number(line.day) || 1) <= maxDay)
          .map(line => {

            const baseDayPax = getPaxForDay(line.day);
            const effectivePax =
              line.customPax !== null && line.customPax !== undefined
                ? Math.max(1, Number(line.customPax) || 1)
                : baseDayPax;
            const isCustomVipPax = line.customPax !== null && line.customPax !== undefined && effectivePax !== baseDayPax;
            const lineTotal = line.price * effectivePax * activeDays;
            return { ...line, baseDayPax, effectivePax, isCustomVipPax, activeDays, lineTotal };
          });
        const netMenuTotal = lines.reduce((s, l) => s + l.lineTotal, 0);

      const computedPackedMealsSummary = useMemo(() => {
        if (bookingCategory !== 'packed_meals') {
          return { batches: [], totalPacks: 0, totalAmount: 0 };
        }
        const visibleBatches = packedMealBatches
          .filter(b => (Number(b.day) || 1) <= packedTotalDays)
          .sort((a, b) => {
            const dayDiff = (Number(a.day) || 1) - (Number(b.day) || 1);
            if (dayDiff !== 0) return dayDiff;
            return MEAL_PERIOD_ORDER.indexOf(a.mealType || 'Lunch') - MEAL_PERIOD_ORDER.indexOf(b.mealType || 'Lunch');
          });
        const batches = visibleBatches.map(b => {
          const dayNum = Number(b.day) || 1;
          const mealType = b.mealType || 'Lunch';
          const hasDistinctLabel =
            b.label &&
            b.label.trim().toLowerCase() !== mealType.toLowerCase() &&
            !/^packed meal \d+$/i.test(b.label.trim());
          const cleanMealName = hasDistinctLabel ? b.label.trim() : mealType;
          const displayTitle = packedTotalDays > 1 ? `Day ${dayNum} — ${cleanMealName}` : cleanMealName;
          const dishRateSum = (b.dishes || []).reduce((s, d) => s + (Number(d.price) || 0), 0);
          const hasCustomRate = b.customRatePerPack !== null && b.customRatePerPack !== '' && !isNaN(Number(b.customRatePerPack));
          const effectiveRatePerPack = hasCustomRate ? Math.max(0, Number(b.customRatePerPack)) : dishRateSum;
          const packs = Math.max(1, Number(b.packs) || 1);
          const batchTotal = effectiveRatePerPack * packs;
          return {
            ...b,
            dayNum,
            cleanMealName,
            displayTitle,
            dishRateSum,
            effectiveRatePerPack,
            packs,
            batchTotal
          };
        });
        return {
          batches,
          totalPacks: batches.reduce((s, b) => s + b.packs, 0),
          totalAmount: batches.reduce((s, b) => s + b.batchTotal, 0)
        };
      }, [bookingCategory, packedMealBatches, packedTotalDays]);

      const computedServiceLines = useMemo(() => {
        const maxDay = bookingCategory === 'seminar' ? Math.max(1, eventDays) : 1;
        const pool = (bookingCategory === 'rental'
          ? selectedServiceLines.filter(l => l.subcategory === 'Rental')
          : selectedServiceLines
        ).filter(l => bookingCategory !== 'seminar' || (Number(l.day) || 1) <= maxDay);

        return pool.map(line => {
          const activeDays = bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : 1;
          const dayPax = getPaxForDay(line.day);
          let lineTotal = 0;
          if (line.billingType === 'per_pax') {
            lineTotal = line.price * dayPax * line.qty * activeDays;
          } else if (line.billingType === 'per_day') {
            const multDays = bookingCategory === 'rental'
              ? rentalDurationDays * line.qty
              : (bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) * line.qty : line.qty);
            lineTotal = line.price * multDays;
          } else if (line.billingType === 'fixed') {
            lineTotal = line.price * line.qty;
          } else {
            lineTotal = line.price * line.qty * activeDays;
          }
          return { ...line, dayPax, activeDays, lineTotal };
        });
      }, [selectedServiceLines, bookingCategory, eventDays, rentalDurationDays, dayPaxOverrides, paxCount]);

      const servicesSubtotal = useMemo(
        () => computedServiceLines.reduce((s, l) => s + l.lineTotal, 0),
        [computedServiceLines]
      );

      const selectedRoomsList = useMemo(() => {
        if (!showRoomsStep) return [];
        return roomCatalog
          .filter(r => (Number(roomBookingsMap[r.id]?.nights) || 0) > 0)
          .map(r => {
            const booking = roomBookingsMap[r.id];
            const nights = Number(booking.nights) || 0;
            return {
              ...r,
              nights,
              checkIn: booking.checkIn || eventDate,
              checkOut: booking.checkOut || addDaysToIsoDate(eventDate, nights),
              total: r.rate * nights
            };
          });
      }, [showRoomsStep, roomCatalog, roomBookingsMap, eventDate]);

      const roomsSubtotal = useMemo(
        () => selectedRoomsList.reduce((s, r) => s + r.total, 0),
        [selectedRoomsList]
      );

      // Step 2: Totals Engine — Rental Refundable Deposit is tracked separately so Rental Fee is never inflated
      const totals = useMemo(() => {
        const foodSubtotal = bookingCategory === 'packed_meals' ? computedPackedMealsSummary.totalAmount : computedMenuSummary.netMenuTotal;
        const subtotal = packageBreakdown.total + foodSubtotal + servicesSubtotal + roomsSubtotal;
        const discount = Math.max(0, Number(discountAmount) || 0);
        const taxable = Math.max(0, subtotal - discount);
        const taxAmount = taxable * ((Number(taxRatePercent) || 0) / 100);
        const netBeforeDeposit = taxable + taxAmount;
        const deposit = bookingCategory === 'rental' ? Math.max(0, Number(securityDeposit) || 0) : 0;
        const depositMode = bookingCategory === 'rental' ? securityDepositMode : 'refund';
        const depositRefundExcess = depositMode === 'deduct' ? Math.max(0, deposit - netBeforeDeposit) : 0;
        // When depositMode === 'refund', security deposit is a separate refundable bond — NOT added into the Rental Fee
        const grandTotal =
          depositMode === 'deduct'
            ? Math.max(0, netBeforeDeposit - deposit)
            : netBeforeDeposit;
        const totalPaid = payments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
        const balanceDue = Math.max(0, grandTotal - totalPaid);
        const totalCashOnPickup =
          bookingCategory === 'rental' && depositMode === 'refund' && deposit > 0
            ? balanceDue + deposit
            : balanceDue;
        return {
          subtotal,
          discount,
          taxAmount,
          netBeforeDeposit,
          deposit,
          depositMode,
          depositRefundExcess,
          grandTotal,
          totalPaid,
          balanceDue,
          totalCashOnPickup
        };
      }, [
        packageBreakdown, bookingCategory, computedPackedMealsSummary, computedMenuSummary,
        servicesSubtotal, roomsSubtotal, discountAmount, taxRatePercent,
        securityDeposit, securityDepositMode, payments
      ]);

      const todayIsoDate = useMemo(() => new Date().toISOString().split('T')[0], []);
      const quoteValidUntilDate = useMemo(
        () => addDaysToIsoDate(todayIsoDate, Math.max(1, Number(quoteValidDays) || 15)),
        [todayIsoDate, quoteValidDays]
      );

      const effectivePerHeadCost = useMemo(() => {
        if (bookingCategory === 'rental') return 0;
        if (bookingCategory === 'packed_meals') {
          return totals.grandTotal / Math.max(1, computedPackedMealsSummary.totalPacks);
        }
        if (bookingCategory === 'seminar') {
          return totals.grandTotal / Math.max(1, seminarScheduleSummary.totalDayPax);
        }
        return totals.grandTotal / Math.max(1, Number(paxCount) || 1);
      }, [bookingCategory, paxCount, computedPackedMealsSummary.totalPacks, seminarScheduleSummary.totalDayPax, totals.grandTotal]);

      // Step 4: Zero-Price Operational Data for Kitchen, Styling & Catering BEO Guides
      const beoOpsData = useMemo(() => {
        const activeInclusions = showPackageStep && selectedPackage.id !== 'from_scratch' ? effectivePackageInclusions : [];

        const stylingInclusions = activeInclusions.filter(inc => textMatchesAny(inc, STYLING_KEYWORDS));
        const cateringInclusions = activeInclusions.filter(inc => textMatchesAny(inc, CATERING_KEYWORDS));

        const kitchenAlerts = [];
        activeInclusions.forEach(inc => {
          if (textMatchesAny(inc, KITCHEN_SPECIAL_KEYWORDS)) kitchenAlerts.push(inc);
        });
        if (showPackageStep && isTieredAllInclusivePackage(selectedPackage.id) && selectedPackage.foodIncluded && !packageBreakdown.isCustomReplaced) {
          (packageBreakdown.buffetPlan?.dishes || []).forEach(d => {
            if (textMatchesAny(d, KITCHEN_SPECIAL_KEYWORDS)) kitchenAlerts.push(d);
          });
        }

        const stylingServices = computedServiceLines.filter(
          l => l.subcategory === 'Suppliers' || textMatchesAny(l.name, STYLING_KEYWORDS)
        );
        const cateringServices = computedServiceLines;

        // Peak pax for tableware & seating estimates
        let peakPax = 0;
        if (bookingCategory === 'celebration') {
          peakPax = Number(paxCount) || 0;
        } else if (bookingCategory === 'seminar') {
          const days = Array.from({ length: Math.max(1, eventDays) }, (_, i) => getPaxForDay(i + 1));
          peakPax = Math.max(0, ...days);
        } else if (bookingCategory === 'packed_meals') {
          peakPax = Math.max(0, ...computedPackedMealsSummary.batches.map(b => b.packs));
        }

        // Group A La Carte / Seminar dishes by Day + Meal Slot for Kitchen prep flow
        const menuGroupMap = {};
        computedMenuSummary.lines.forEach(l => {
          const dayNum = Number(l.day) || 1;
          const slot = bookingCategory === 'seminar' ? (l.mealSlot || 'Lunch') : 'Main Buffet / Add-On';
          const groupKey = `${dayNum}__${slot}`;
          if (!menuGroupMap[groupKey]) {
            const slotTime =
              bookingCategory === 'seminar'
                ? seminarSlotTimes[`${dayNum}__${slot}`] || MEAL_PERIOD_OPTIONS.find(m => m.id === slot)?.defaultTime || ''
                : eventTime || '';
            menuGroupMap[groupKey] = {
              key: groupKey,
              dayNum,
              dateLabel: bookingCategory === 'seminar' ? formatPrettyDate(getSeminarDateForDay(dayNum)) : formatPrettyDate(eventDate),
              slot,
              time: slotTime,
              items: []
            };
          }
          menuGroupMap[groupKey].items.push(l);
        });
        const groupedKitchenMenu = Object.values(menuGroupMap).sort((a, b) => {
          if (a.dayNum !== b.dayNum) return a.dayNum - b.dayNum;
          return MEAL_PERIOD_ORDER.indexOf(a.slot) - MEAL_PERIOD_ORDER.indexOf(b.slot);
        });

        // Bulk Dish Cooking Tally per Day for Packed Meals
        const packedDayTallies = {};
        if (bookingCategory === 'packed_meals') {
          computedPackedMealsSummary.batches.forEach(b => {
            const dKey = `Day ${b.dayNum} (${formatPrettyDate(b.date)})`;
            if (!packedDayTallies[dKey]) packedDayTallies[dKey] = {};
            (b.dishes || []).forEach(dish => {
              packedDayTallies[dKey][dish.name] = (packedDayTallies[dKey][dish.name] || 0) + b.packs;
            });
          });
        }

        const builtInBuffetDishes =
          showPackageStep && isTieredAllInclusivePackage(selectedPackage.id) && selectedPackage.foodIncluded && !packageBreakdown.isCustomReplaced
            ? packageBreakdown.buffetPlan?.dishes || []
            : [];
        const totalBuffetDishCount = builtInBuffetDishes.length + computedMenuSummary.lines.length;

        const scheduleSummary =
          bookingCategory === 'rental'
            ? `${formatPrettyDate(eventDate)} → ${formatPrettyDate(rentalReturnDate)} (${rentalDurationDays}d)`
            : bookingCategory === 'packed_meals'
            ? `${packedTotalDays} Day(s) • ${computedPackedMealsSummary.totalPacks} Total Packs`
            : bookingCategory === 'seminar'
            ? seminarScheduleSummary.datesList.map((dt, idx) => `D${idx + 1}: ${formatPrettyDate(dt)}`).join(' | ')
            : `${formatPrettyDate(eventDate)}${eventTime ? ` • ${eventTime}` : ''}`;

        const guestSummary =
          bookingCategory === 'rental'
            ? `${rentalDurationDays} Rental Day(s)`
            : bookingCategory === 'packed_meals'
            ? `${computedPackedMealsSummary.batches.length} Meal Batch(es) • ${computedPackedMealsSummary.totalPacks} Packs`
            : bookingCategory === 'seminar'
            ? seminarScheduleSummary.datesList.map((_, idx) => `D${idx + 1}: ${getPaxForDay(idx + 1)}p`).join(', ')
            : `${paxCount} Pax`;

        // Seating & Table Breakdown from Styling Specs (for Styling & Catering BEOs)
        const coupleSeaters = Math.max(0, Number(stylingSpecs.coupleSeaters) || 0);
        const presidentialTables = Math.max(0, Number(stylingSpecs.presidentialTables) || 0);
        const presidentialSeaters = Math.max(0, Number(stylingSpecs.presidentialSeaters) || 0);
        const guestTableCount = Math.max(0, Number(stylingSpecs.guestTableCount) || 0);
        const paxPerGuestTable = Math.max(1, Number(stylingSpecs.paxPerGuestTable) || 10);
        const totalGuestSeaters = guestTableCount * paxPerGuestTable;
        const totalConfiguredSeaters = coupleSeaters + presidentialSeaters + totalGuestSeaters;
        const seatingDelta = peakPax > 0 ? totalConfiguredSeaters - peakPax : 0;

        return {
          stylingInclusions,
          cateringInclusions,
          kitchenAlerts: Array.from(new Set(kitchenAlerts)),
          stylingServices,
          cateringServices,
          peakPax,
          minTables: peakPax > 0 ? Math.ceil(peakPax / 10) : 0,
          maxTables: peakPax > 0 ? Math.ceil(peakPax / 8) : 0,
          coupleSeaters,
          presidentialTables,
          presidentialSeaters,
          guestTableCount,
          paxPerGuestTable,
          totalGuestSeaters,
          totalConfiguredSeaters,
          seatingDelta,
          builtInBuffetDishes,
          totalBuffetDishCount,
          groupedKitchenMenu,
          packedDayTallies,
          scheduleSummary,
          guestSummary
        };
      }, [
        showPackageStep, selectedPackage, effectivePackageInclusions, packageBreakdown,
        computedServiceLines, bookingCategory, paxCount, eventDays, dayPaxOverrides,
        computedPackedMealsSummary, computedMenuSummary, seminarSlotTimes, seminarDayDates,
        eventDate, eventTime, rentalReturnDate, rentalDurationDays, packedTotalDays,
        seminarScheduleSummary, stylingSpecs
      ]);

      // =======================================================================
      // 9. SAVED QUOTES, CHAT COPY, PAYMENTS & JPEG EXPORT
      // =======================================================================
      const handleSaveCurrentQuoteToLog = () => {
        const record = {
          id: docNumber,
          savedAt: new Date().toLocaleString(),
          bookingCategory, docType, quoteStatus, quoteValidDays, docNumber,
          clientName: clientName || 'Walk-In Client',
          clientOrg, clientContact, occasion, eventMotif, specialNotes,
          showInclusionsOnPrint, showPaymentTermsOnPrint,
          eventVenue, eventDate, rentalReturnDate, eventTime, paxCount, eventDays,
          securityDeposit, securityDepositMode, rentalTermsText,
          selectedPackageId, selectedTierPax, excessRatePerPax, customBaseFee, selectedBuffetMenuId,
          seminarDayMealsMap, seminarSlotTimes, seminarDayDates, dayPaxOverrides,
          selectedMenuLines, packedDefaultPax, packedTotalDays, packedMealBatches,
          selectedServiceLines, roomBookingsMap,
          discountLabel, discountAmount, taxRatePercent, payments,
          poNumber, poApprovedBudget, poNotes,
          beoTeamNotes, stylingSpecs,
          grandTotal: totals.grandTotal, balanceDue: totals.balanceDue
        };
        setSavedQuotes(prev => [record, ...prev.filter(q => q.docNumber !== docNumber)].slice(0, 60));
        showToast(`Saved ${docNumber} (${record.clientName}) to Quotes Log!`);
      };

      const handleLoadSavedQuote = (q, asDuplicate = false) => {
        setBookingCategory(q.bookingCategory || 'celebration');
        setDocType(q.docType || 'Quotation');
        setQuoteStatus(asDuplicate ? 'Draft' : q.quoteStatus || 'Draft');
        setQuoteValidDays(q.quoteValidDays ?? 15);
        setDocNumber(asDuplicate ? generateDocNumber() : q.docNumber || generateDocNumber());
        setClientName(q.clientName || '');
        setClientOrg(q.clientOrg || '');
        setClientContact(q.clientContact || '');
        setOccasion(q.occasion || '');
        setEventMotif(q.eventMotif || '');
        setSpecialNotes(q.specialNotes || '');
        setShowInclusionsOnPrint(q.showInclusionsOnPrint !== false);
        setShowPaymentTermsOnPrint(q.showPaymentTermsOnPrint !== false);
        setEventVenue(q.eventVenue || '');
        setEventDate(q.eventDate || todayIsoDate);
        setRentalReturnDate(q.rentalReturnDate || addDaysToIsoDate(todayIsoDate, 1));
        setEventTime(q.eventTime || '');
        setPaxCount(q.paxCount || 50);
        setEventDays(q.eventDays || 1);
        setActiveScheduleDay(1);
        setSecurityDeposit(q.securityDeposit ?? 2000);
        setSecurityDepositMode(q.securityDepositMode || 'refund');
        if (q.rentalTermsText) setRentalTermsText(q.rentalTermsText);
        setSelectedPackageId(q.selectedPackageId || 'pkg_essential');
        setSelectedTierPax(q.selectedTierPax || 100);
        setExcessRatePerPax(q.excessRatePerPax ?? STANDARD_EXCESS_RATE);
        setCustomBaseFee(q.customBaseFee || 0);
        setSelectedBuffetMenuId(q.selectedBuffetMenuId || 'menu_a');
        if (q.seminarDayMealsMap) setSeminarDayMealsMap(q.seminarDayMealsMap);
        if (q.seminarSlotTimes) setSeminarSlotTimes(q.seminarSlotTimes);
        if (q.seminarDayDates) setSeminarDayDates(q.seminarDayDates);
        if (q.dayPaxOverrides) setDayPaxOverrides(q.dayPaxOverrides);
        setSelectedMenuLines(q.selectedMenuLines || []);
        if (q.packedDefaultPax) setPackedDefaultPax(q.packedDefaultPax);
        if (q.packedTotalDays) setPackedTotalDays(q.packedTotalDays);
        if (q.packedMealBatches) setPackedMealBatches(q.packedMealBatches);
        setSelectedServiceLines(q.selectedServiceLines || []);
        setRoomBookingsMap(q.roomBookingsMap || {});
        setDiscountLabel(q.discountLabel || 'Promo / Management Discount');
        setDiscountAmount(q.discountAmount || 0);
        setTaxRatePercent(q.taxRatePercent || 0);
        setPayments(asDuplicate ? [] : q.payments || []);
        setPoNumber(asDuplicate ? '' : q.poNumber || '');
        setPoApprovedBudget(q.poApprovedBudget || '');
        setPoNotes(q.poNotes || '');
        setBeoTeamNotes(q.beoTeamNotes || { kitchen: '', styling: '', catering: '' });
        setStylingSpecs({ ...DEFAULT_STYLING_SPECS, ...(q.stylingSpecs || {}) });
        setIsSavedQuotesOpen(false);
        setActiveTab('builder');
        showToast(asDuplicate ? `Duplicated quote for ${q.clientName}.` : `Loaded ${q.docNumber}.`);
      };

      const handleCopyMessengerSummary = () => {
        const lines = [
          `✨ ${businessProfile.businessName || 'EYNS HOTEL & RESTAURANT'}`,
          `📄 ${docType.toUpperCase()} (${docNumber})`,
          `👤 Client: ${clientName || 'Valued Client'}${clientOrg ? ` (${clientOrg})` : ''}`
        ];
        if (bookingCategory === 'rental') {
          lines.push(`🚚 Purpose: ${occasion}`);
          lines.push(`📅 Dates: ${formatPrettyDate(eventDate)} → ${formatPrettyDate(rentalReturnDate)} (${rentalDurationDays}d)`);
        } else if (bookingCategory === 'packed_meals') {
          lines.push(`🍱 Order: ${occasion} (${packedTotalDays} ${packedTotalDays === 1 ? 'Day' : 'Days'} • ${computedPackedMealsSummary.totalPacks} Total Packs)`);
        } else if (bookingCategory === 'seminar') {
          lines.push(`🎓 Seminar: ${occasion} (${eventDays} ${eventDays === 1 ? 'Day' : 'Days'} • ${seminarScheduleSummary.avgOrRangePax})`);
          lines.push(`📅 Session Dates: ${seminarScheduleSummary.datesList.map((dt, idx) => `Day ${idx + 1}: ${formatPrettyDate(dt)} (${getPaxForDay(idx + 1)}p)`).join(' | ')}`);
        } else {
          lines.push(`🎉 Event: ${occasion} — ${paxCount} Pax`);
          lines.push(`📅 Date & Time: ${formatPrettyDate(eventDate)} | ${eventTime || 'TBD'}`);
        }
        lines.push(`📍 Location: ${eventVenue}`, '', '📋 SUMMARY OF CHARGES:');
        if (showPackageStep && (packageBreakdown.total > 0 || isTieredAllInclusivePackage(selectedPackage.id))) {
          lines.push(`• ${selectedPackage.name}: ${formatCurrency(packageBreakdown.total)}`);
        }
        if (bookingCategory === 'packed_meals') {
          computedPackedMealsSummary.batches.forEach(b => {
            lines.push(`• ${b.displayTitle} (${formatPrettyDate(b.date)} @ ${b.time} • ${b.packs} packs): ${formatCurrency(b.batchTotal)}`);
          });
        } else if (computedMenuSummary.lines.length > 0) {
          lines.push(
            `• Menu (${computedMenuSummary.lines
              .map(l => `${bookingCategory === 'seminar' ? `D${l.day} (${formatPrettyDate(getSeminarDateForDay(l.day))}) ${l.mealSlot || 'Lunch'}: ` : ''}${l.name} (${l.effectivePax}p${l.activeDays > 1 ? ` × ${l.activeDays}d` : ''})`)
              .join(', ')}): ${formatCurrency(computedMenuSummary.netMenuTotal)}`
          );
        }
        if (computedServiceLines.length > 0) {
          lines.push(`• ${bookingCategory === 'rental' ? 'Rentals' : 'Services'}: ${formatCurrency(servicesSubtotal)}`);
        }
        if (selectedRoomsList.length > 0) {
          lines.push(
            `• Rooms (${selectedRoomsList.map(r => `${r.roomNo} [${formatPrettyDate(r.checkIn)}–${formatPrettyDate(r.checkOut)}]`).join(', ')}): ${formatCurrency(roomsSubtotal)}`
          );
        }
        if (totals.discount > 0) lines.push(`• Less ${discountLabel}: -${formatCurrency(totals.discount)}`);
        if (totals.deposit > 0) {
          if (totals.depositMode === 'deduct') {
            lines.push(`• Less Security Deposit (Applied to Bill): -${formatCurrency(totals.deposit)}`);
            if (totals.depositRefundExcess > 0) {
              lines.push(`• Excess Deposit Refundable to Client: ${formatCurrency(totals.depositRefundExcess)}`);
            }
          }
        }
        const totalLabel =
          bookingCategory === 'rental'
            ? totals.deposit > 0 && totals.depositMode === 'deduct'
              ? 'NET RENTAL BALANCE DUE'
              : 'TOTAL RENTAL FEE'
            : 'GRAND TOTAL';
        lines.push('', `💰 ${totalLabel}: ${formatCurrency(totals.grandTotal)}`);
        if (totals.totalPaid > 0) {
          lines.push(`✅ Paid: ${formatCurrency(totals.totalPaid)} | 📌 Rental Balance: ${formatCurrency(totals.balanceDue)}`);
        } else if (totals.grandTotal > 0) {
          lines.push(`📌 50% Reservation Downpayment: ${formatCurrency(totals.grandTotal * 0.5)}`);
        }
        if (bookingCategory === 'rental' && totals.deposit > 0 && totals.depositMode === 'refund') {
          lines.push(
            `🛡️ SEPARATE REFUNDABLE SECURITY BOND: ${formatCurrency(totals.deposit)} (Collected upon pick-up & 100% returned upon complete, undamaged return — NOT part of the rental fee).`
          );
          lines.push(`💵 Total Cash Outlay on Pick-Up (Balance + Bond): ${formatCurrency(totals.totalCashOnPickup)}`);
        }
        lines.push(`⏳ Valid until ${formatPrettyDate(quoteValidUntilDate)}. Thank you!`);
        copyTextFallback(lines.join('\n'));
        showToast('Messenger / Viber quote summary copied!');
      };

      const handleAddPayment = e => {
        e.preventDefault();
        const amt = parseNumericAmount(newPayAmount);
        if (amt <= 0) return;
        setPayments(prev => [
          ...prev,
          { id: `pay_${Date.now()}`, date: newPayDate || todayIsoDate, method: newPayMethod, reference: newPayRef.trim() || 'Official Receipt', amount: amt }
        ]);
        setNewPayAmount('');
        setNewPayRef('');
        showToast('Payment entry recorded.');
      };

      const handleDownloadJpeg = async () => {
        if (!printRef.current || typeof html2canvas === 'undefined') {
          showToast('Export engine loading, try again in a second.');
          return;
        }
        try {
          showToast('Generating high-res A4 JPEG...');
          const canvas = await html2canvas(printRef.current, {
            scale: 2,
            useCORS: true,
            logging: false,
            backgroundColor: '#FFFFFF'
          });
          const link = document.createElement('a');
          const safeClient = (clientName || 'Client').replace(/[^a-zA-Z0-9_-]/g, '_');
          const beoSuffix = previewMode === 'beo' ? `_BEO_${beoTeam.toUpperCase()}` : '';
          link.download = `${docNumber}_${safeClient}${beoSuffix}.jpg`;
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
          showToast('JPEG downloaded!');
        } catch (err) {
          showToast('Could not export JPEG (check external logo CORS or use Print A4 → Save as PDF).');
        }
      };

      // =======================================================================
      // 10. FILTERED CATALOGS & METRICS
      // =======================================================================
      const menuCategoryStats = useMemo(() => {
        const counts = {};
        menuItems.forEach(m => {
          const c = m.category || 'Main Course';
          counts[c] = (counts[c] || 0) + 1;
        });
        return [{ name: 'All', count: menuItems.length }, ...Object.entries(counts).map(([name, count]) => ({ name, count }))];
      }, [menuItems]);

      const filteredMenuItems = useMemo(() => {
        const q = menuSearchQuery.trim().toLowerCase();
        return menuItems.filter(item =>
          (menuCategoryFilter === 'All' || item.category === menuCategoryFilter) &&
          (!q || item.name.toLowerCase().includes(q) || (item.category || '').toLowerCase().includes(q))
        );
      }, [menuItems, menuCategoryFilter, menuSearchQuery]);

      const serviceCategoryStats = useMemo(() => {
        return ['All', 'Catering', 'Rental', 'Suppliers'].map(name => ({
          name,
          count: name === 'All' ? serviceItems.length : serviceItems.filter(s => s.subcategory === name).length
        }));
      }, [serviceItems]);

      const filteredServiceItems = useMemo(() => {
        const pool = bookingCategory === 'rental' ? serviceItems.filter(s => s.subcategory === 'Rental') : serviceItems;
        const q = serviceSearchQuery.trim().toLowerCase();
        return pool.filter(item =>
          (bookingCategory === 'rental' || serviceSubcategoryFilter === 'All' || item.subcategory === serviceSubcategoryFilter) &&
          (!q || item.name.toLowerCase().includes(q) || (item.subcategory || '').toLowerCase().includes(q))
        );
      }, [bookingCategory, serviceItems, serviceSubcategoryFilter, serviceSearchQuery]);

      const savedQuotesMetrics = useMemo(() => ({
        confirmedCount: savedQuotes.filter(q => q.quoteStatus === 'Confirmed' || q.quoteStatus === 'Fully Paid').length,
        totalPipeline: savedQuotes.reduce((s, q) => s + (Number(q.grandTotal) || 0), 0),
        totalReceivables: savedQuotes.reduce((s, q) => s + (Number(q.balanceDue) || 0), 0)
      }), [savedQuotes]);

      const filteredSavedQuotes = useMemo(() => {
        const q = savedQuotesSearch.trim().toLowerCase();
        return savedQuotes.filter(item =>
          (savedQuotesStatusFilter === 'All' || (item.quoteStatus || 'Draft') === savedQuotesStatusFilter) &&
          (!q || (item.clientName || '').toLowerCase().includes(q) || (item.docNumber || '').toLowerCase().includes(q) || (item.occasion || '').toLowerCase().includes(q))
        );
      }, [savedQuotes, savedQuotesSearch, savedQuotesStatusFilter]);

      const allSheetsSynced = syncDiagnostics.menuOk && syncDiagnostics.servicesOk && syncDiagnostics.roomsOk;

      // =======================================================================
      // 11. RENDER
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col">

                          <div key={teamKey} className={`a4-sheet beo-sheet-block p-8 flex flex-col justify-between ${pageBreakClass}`}>
                            <div className="space-y-4">
                              {renderDepartmentHeader(headerMeta.badge, headerMeta.title)}
                              {(teamKey === 'kitchen' || teamKey === 'combined') && renderKitchenSection()}
                              {(teamKey === 'styling' || teamKey === 'combined') && renderStylingSection()}
                              {(teamKey === 'catering' || teamKey === 'combined') && renderCateringSection()}
                            </div>
                            {renderSignatureFooter(teamKey)}
                          </div>
                        );
                      });
                    })()}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* TAB 2: OFFICIAL PACKAGES & SAMPLE MENUS RATE CARD */}
          {activeTab === 'packages' && (
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
              <div className="bg-espresso-950 text-cream-50 rounded-2xl p-6 border border-gold-500/30 flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h2 className="font-serif text-2xl font-bold text-gold-300">Official EYNS Catering &amp; Styling Packages</h2>
                  <p className="text-xs text-cream-200/80 mt-1">Standard excess guest rate above tier: <strong>+₱{STANDARD_EXCESS_RATE} per excess pax</strong>.</p>
                </div>
                <button type="button" onClick={() => setActiveTab('builder')} className="px-4 py-2 rounded-xl bg-gold-500 text-espresso-950 text-xs font-extrabold">
                  Back to Builder →
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {PACKAGES.filter(p => p.id !== 'seminar_custom' && p.id !== 'from_scratch').map(pkg => (
                  <div key={pkg.id} className="bg-white rounded-2xl p-5 border border-cream-200 shadow-sm space-y-3">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <span className="text-[10px] font-extrabold uppercase text-gold-600">{pkg.section}</span>
                        <h3 className="font-serif text-xl font-bold text-espresso-950">{pkg.name}</h3>
                        <p className="text-xs text-espresso-800/75">{pkg.tagline}</p>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          if (bookingCategory === 'rental' || bookingCategory === 'packed_meals') handleBookingCategoryChange('celebration');
                          handlePackageChange(pkg.id);
                          setActiveTab('builder');
                          showToast(`Loaded "${pkg.name}".`);
                        }}
                        className="px-3.5 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold shrink-0"
                      >
                        Use Package
                      </button>
                    </div>
                    {pkg.tiers ? (
                      <div className="grid grid-cols-3 gap-2">
                        {pkg.tiers.map(t => (
                          <div key={t.pax} className="bg-cream-50 p-2.5 rounded-xl border border-cream-200 text-center">
                            <div className="text-[11px] font-bold">{t.pax} Pax</div>
                            <div className="font-mono text-sm font-extrabold">{formatWholeCurrency(t.price)}</div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="bg-cream-50 p-2.5 rounded-xl border border-cream-200 font-mono text-sm font-extrabold">
                        Flat Rate: {formatWholeCurrency(pkg.flatPrice || 0)}
                      </div>
                    )}
                    <ul className="text-xs text-espresso-900 space-y-1 list-disc pl-5">
                      {pkg.inclusions.map((inc, i) => (
                        <li key={i}>
                          {inc}
                          {isWeddingOnlyInclusion(inc) && (
                            <span className="ml-1.5 inline-block px-1.5 py-0.5 rounded bg-amber-100 text-amber-900 text-[10px] font-bold">
                              Wedding Reception Only
                            </span>
                          )}
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>

              <div className="bg-white rounded-2xl p-6 border border-cream-200 shadow-sm space-y-4">
                <h3 className="font-serif text-xl font-bold text-espresso-950">3. Built-In Buffet Menu Selections</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {SAMPLE_BUFFET_MENUS.map(m => (
                    <div key={m.id} className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-2">
                      <span className="inline-block px-2.5 py-0.5 rounded-full bg-espresso-950 text-gold-300 font-mono text-[10px] font-extrabold">{m.badge}</span>
                      <h4 className="font-serif text-base font-bold text-espresso-950">{m.name}</h4>
                      <ul className="text-xs text-espresso-900 list-disc pl-5 space-y-1">
                        {m.dishes.map((d, idx) => <li key={idx}>{d}</li>)}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* MODAL: SAVED QUOTES & PIPELINE */}
          {isSavedQuotesOpen && (
            <div className="no-print fixed inset-0 z-50 bg-espresso-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-3xl w-full p-6 border border-cream-200 shadow-2xl space-y-4 max-h-[88vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                  <h3 className="font-serif text-xl font-bold text-espresso-950">Saved Quotes &amp; Pipeline ({savedQuotes.length})</h3>
                  <button type="button" onClick={() => setIsSavedQuotesOpen(false)} className="w-8 h-8 rounded-lg bg-cream-100 font-bold">×</button>
                </div>

                <div className="grid grid-cols-3 gap-2.5 text-xs">
                  <div className="bg-cream-50 p-3 rounded-xl border border-cream-200">
                    <div className="text-[10px] font-bold uppercase text-espresso-800/70">Confirmed Deals</div>
                    <div className="font-mono text-base font-extrabold">{savedQuotesMetrics.confirmedCount} / {savedQuotes.length}</div>
                  </div>
                  <div className="bg-cream-50 p-3 rounded-xl border border-cream-200">
                    <div className="text-[10px] font-bold uppercase text-espresso-800/70">Pipeline Value</div>
                    <div className="font-mono text-base font-extrabold text-gold-600">{formatCurrency(savedQuotesMetrics.totalPipeline)}</div>
                  </div>
                  <div className="bg-cream-50 p-3 rounded-xl border border-cream-200">
                    <div className="text-[10px] font-bold uppercase text-espresso-800/70">Receivables</div>
                    <div className="font-mono text-base font-extrabold text-emerald-700">{formatCurrency(savedQuotesMetrics.totalReceivables)}</div>
                  </div>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-2">
                  <button type="button" onClick={handleSaveCurrentQuoteToLog} className="px-3.5 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold">+ Save Active Quote ({docNumber})</button>
                  <div className="flex gap-2">
                    <input type="text" value={savedQuotesSearch} onChange={e => setSavedQuotesSearch(e.target.value)} placeholder="Search client or ref..." className="px-3 py-1.5 rounded-xl border border-cream-200 text-xs" />
                    <select value={savedQuotesStatusFilter} onChange={e => setSavedQuotesStatusFilter(e.target.value)} className="px-2.5 py-1.5 rounded-xl border border-cream-200 bg-white text-xs font-bold">
                      <option value="All">All</option>
                      <option value="Draft">Draft</option>
                      <option value="Sent">Sent</option>
                      <option value="Confirmed">Confirmed</option>
                      <option value="Fully Paid">Fully Paid</option>
                    </select>
                  </div>
                </div>

                {filteredSavedQuotes.length === 0 ? (
                  <p className="text-xs text-center py-6 text-espresso-800/70">No saved quotes yet.</p>
                ) : (
                  <div className="space-y-2">
                    {filteredSavedQuotes.map(q => (
                      <div key={q.docNumber} className="bg-cream-50 p-3 rounded-xl border border-cream-200 flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div>
                          <div className="font-bold text-espresso-950">{q.clientName} <span className="font-mono text-[10px] text-gold-600">({q.docNumber})</span></div>
                          <div className="text-[11px] text-espresso-800/75">{q.occasion} • {formatPrettyDate(q.eventDate)} • {q.quoteStatus}</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-mono font-extrabold">{formatCurrency(q.grandTotal)}</span>
                          <button type="button" onClick={() => handleLoadSavedQuote(q, false)} className="px-2.5 py-1 rounded-lg bg-espresso-950 text-gold-300 font-bold">Open</button>
                          <button type="button" onClick={() => handleLoadSavedQuote(q, true)} className="px-2.5 py-1 rounded-lg bg-white border border-cream-200 font-bold">Duplicate</button>
                          <button type="button" onClick={() => setSavedQuotes(p => p.filter(x => x.docNumber !== q.docNumber))} className="px-2 py-1 rounded-lg bg-red-50 text-red-600 font-bold">×</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL: BUSINESS PROFILE & LOGO */}
          {isProfileModalOpen && (
            <div className="no-print fixed inset-0 z-50 bg-espresso-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 border border-cream-200 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto text-xs">
                <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                  <h3 className="font-serif text-xl font-bold text-espresso-950">EYNS Business Profile &amp; Logo</h3>
                  <button type="button" onClick={() => setIsProfileModalOpen(false)} className="w-8 h-8 rounded-lg bg-cream-100 font-bold">×</button>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold mb-1">Business Name</label>
                    <input type="text" value={businessProfile.businessName} onChange={e => setBusinessProfile(p => ({ ...p, businessName: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Logo File Path or URL</label>
                    <input
                      type="text"
                      value={businessProfile.logoPath || 'assets/logo.png'}
                      onChange={e => {
                        setLogoBroken(false);
                        setBusinessProfile(p => ({ ...p, logoPath: e.target.value }));
                      }}
                      placeholder="assets/logo.png"
                      className="w-full px-3 py-2 rounded-xl border border-cream-200 font-mono"
                    />
                  </div>
                </div>
                <div>
                  <label className="block font-bold mb-1">Address</label>
                  <input type="text" value={businessProfile.address} onChange={e => setBusinessProfile(p => ({ ...p, address: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold mb-1">Contact Person &amp; Mobile</label>
                    <input type="text" value={businessProfile.contactLine} onChange={e => setBusinessProfile(p => ({ ...p, contactLine: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Prepared By Signatory</label>
                    <input type="text" value={businessProfile.preparedBy} onChange={e => setBusinessProfile(p => ({ ...p, preparedBy: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                  </div>
                </div>
                <div>
                  <label className="block font-bold mb-1">Official Bank / GCash Account Details</label>
                  <textarea rows="2" value={businessProfile.paymentAccounts} onChange={e => setBusinessProfile(p => ({ ...p, paymentAccounts: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200"></textarea>
                </div>
                <div>
                  <label className="block font-bold mb-1">Standard Booking &amp; Payment Terms</label>
                  <textarea rows="3" value={businessProfile.cateringTerms} onChange={e => setBusinessProfile(p => ({ ...p, cateringTerms: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200"></textarea>
                </div>
                <div className="flex justify-end pt-2 border-t border-cream-200">
                  <button type="button" onClick={() => { setIsProfileModalOpen(false); showToast('Business Profile saved!'); }} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Save Profile</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: 3 GOOGLE SHEETS LIVE SYNC */}
          {isSyncModalOpen && (
            <div className="no-print fixed inset-0 z-50 bg-espresso-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 border border-cream-200 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-xs">
                <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                  <div>
                    <h3 className="font-serif text-xl font-bold text-espresso-950">Live Google Sheets Connection (3 Catalogs)</h3>
                    <p className="text-espresso-800/80">All 3 sheets are permanently built in and auto-sync every 20 seconds across all devices.</p>
                  </div>
                  <button type="button" onClick={() => setIsSyncModalOpen(false)} className="w-8 h-8 rounded-lg bg-cream-100 font-bold">×</button>
                </div>

                {/* Sheet #3 */}
                <div className="bg-cream-50 p-3.5 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-sm">3. A La Carte Menu Sheet (#3)</span>
                    <a href={menuSheetUrl} target="_blank" rel="noopener noreferrer" className="font-bold text-gold-600 hover:underline">Open Sheet ↗</a>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={menuSheetUrl} onChange={e => setMenuSheetUrl(e.target.value)} className="flex-1 px-3 py-1.5 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-3.5 py-1.5 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Sync</button>
                  </div>
                  {syncDiagnostics.menu && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.menuOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.menuOk ? '✅ ' : '⚠️ '}{syncDiagnostics.menu}
                    </div>
                  )}
                </div>

                {/* Sheet #4 */}
                <div className="bg-cream-50 p-3.5 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-sm">4. Event Services &amp; Rentals Sheet (#4)</span>
                    <a href={servicesSheetUrl} target="_blank" rel="noopener noreferrer" className="font-bold text-gold-600 hover:underline">Open Sheet ↗</a>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={servicesSheetUrl} onChange={e => setServicesSheetUrl(e.target.value)} className="flex-1 px-3 py-1.5 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-3.5 py-1.5 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Sync</button>
                  </div>
                  {syncDiagnostics.services && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.servicesOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.servicesOk ? '✅ ' : '⚠️ '}{syncDiagnostics.services}
                    </div>
                  )}
                </div>

                {/* Sheet #5 */}
                <div className="bg-cream-50 p-3.5 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="font-extrabold text-sm">5. Hotel Rooms Sheet (#5)</span>
                    <div className="flex items-center gap-3">
                      <button
                        type="button"
                        onClick={() => {
                          const header = ['ID', 'Room No', 'Room Type', 'Rate Per Night', 'Capacity', 'Inclusions'];
                          const rows = DEFAULT_ROOM_CATALOG.map(r => [r.id, r.roomNo, r.type, r.rate, r.capacity, r.inclusions]);
                          copyTextFallback([header, ...rows].map(r => r.join('\t')).join('\n'));
                          showToast('Hotel Rooms template copied! Paste into cell A1 of Sheet #5.');
                        }}
                        className="font-bold text-espresso-900 hover:underline"
                      >
                        Copy Sheet #5 Template
                      </button>
                      <a href={roomsSheetUrl} target="_blank" rel="noopener noreferrer" className="font-bold text-gold-600 hover:underline">Open Sheet ↗</a>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={roomsSheetUrl} onChange={e => setRoomsSheetUrl(e.target.value)} className="flex-1 px-3 py-1.5 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-3.5 py-1.5 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Sync</button>
                  </div>
                  {syncDiagnostics.rooms && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.roomsOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.roomsOk ? '✅ ' : '⚠️ '}{syncDiagnostics.rooms}
                    </div>
                  )}
                </div>

                <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-cream-200">
                  <span className="text-[11px] text-espresso-800/80">
                    {lastSyncTime ? `Last synced at ${lastSyncTime}` : 'Auto-sync active every 20 seconds'}
                  </span>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">
                      Sync All 3 Sheets
                    </button>
                    <button type="button" onClick={() => setIsSyncModalOpen(false)} className="px-4 py-2 rounded-xl bg-cream-100 text-espresso-900 font-bold">
                      Done
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 5. ERROR BOUNDARY & SAFE REACT 18 MOUNT
    // =========================================================================
    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || 'Unexpected rendering error' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-cream-100">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full border border-cream-200 shadow-lg space-y-3 text-center">
                <h2 className="font-serif text-xl font-bold text-espresso-950">EYNS Builder Notice</h2>
                <p className="text-xs text-red-700 font-mono">{this.state.message}</p>
                <button type="button" onClick={() => window.location.reload()} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold">
                  Reload App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function mountApp() {
      const container = document.getElementById('root');
      if (!container) return;
      ReactDOM.createRoot(container).render(
        <AppErrorBoundary>
          <App />
        </AppErrorBoundary>
      );
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', mountApp);
    } else {
      mountApp();
    }
  </script>
</body>
</html>
