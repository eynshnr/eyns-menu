              <div><strong>PREPARED FOR:</strong> {clientName}</div>
              <div><strong>EVENT DATE & PAX:</strong> {eventDate || 'TBD'} ({guestCount} Pax)</div>
              <div className="text-right"><strong>EVENT TYPE:</strong> {eventType}</div>
            </div>

            {/* Section 1: Package Table */}
            <div className="mb-6">
              <h3 className="font-bold text-xs uppercase bg-gray-200 p-1.5 border border-gray-300 mb-2">1. Selected Catering & Styling Package</h3>
              <div className="p-3 border rounded text-xs space-y-1">
                <div className="flex justify-between font-bold text-sm">
                  <span>{selectedPkg?.name}</span>
                  <span>₱{packageBasePrice.toLocaleString()}</span>
                </div>
                <p className="text-gray-600 text-[11px]">{selectedPkg?.tagline}</p>
                <div className="mt-2 text-[11px]">
                  <strong>Inclusions:</strong> {selectedPkg?.inclusions.join(' • ')}
                </div>
              </div>
            </div>

            {/* Section 2: Menu Tier Table */}
            {selectedPkgId !== 'styling_only' && (
              <div className="mb-6">
                <h3 className="font-bold text-xs uppercase bg-gray-200 p-1.5 border border-gray-300 mb-2">2. Buffet Menu Selection</h3>
                <div className="p-3 border rounded text-xs space-y-1">
                  <div className="flex justify-between font-bold">
                    <span>{selectedMenuTier?.name}</span>
                    <span>₱{menuUpgradeSubtotal.toLocaleString()} (+₱{selectedMenuTier?.surcharge}/pax)</span>
                  </div>
                  <p className="text-gray-700 text-[11px] mt-1">
                    <strong>Dishes Included:</strong> {selectedMenuTier?.dishes.join(' • ')}
                  </p>
                </div>
              </div>
            )}

            {/* Section 3: Add-ons Table */}
            {selectedAddonIds.length > 0 && (
              <div className="mb-6">
                <h3 className="font-bold text-xs uppercase bg-gray-200 p-1.5 border border-gray-300 mb-2">3. A La Carte Enhancements & Add-Ons</h3>
                <table className="w-full text-xs border-collapse border">
                  <thead>
                    <tr className="bg-gray-100">
                      <th className="border p-1.5 text-left">Service Item</th>
                      <th className="border p-1.5 text-left">Category</th>
                      <th className="border p-1.5 text-right">Price</th>
                    </tr>
                  </thead>
                  <tbody>
                    {selectedAddonIds.map(id => {
                      const item = OFFICIAL_ADDONS.find(a => a.id === id);
                      return (
                        <tr key={id}>
                          <td className="border p-1.5">{item?.name}</td>
                          <td className="border p-1.5">{item?.cat}</td>
                          <td className="border p-1.5 text-right">₱{item?.price.toLocaleString()}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {/* Investment Summary */}
            <div className="border-t-2 border-black pt-4 text-right">
              <p className="text-xs">Base Package Subtotal: ₱{packageBasePrice.toLocaleString()}</p>
              {selectedPkgId !== 'styling_only' && <p className="text-xs">Menu Selection Subtotal: ₱{menuUpgradeSubtotal.toLocaleString()}</p>}
              {selectedAddonIds.length > 0 && <p className="text-xs">Add-ons Subtotal: ₱{addonsSubtotal.toLocaleString()}</p>}
              <h2 className="text-xl font-bold mt-2 text-burgundy-900">ESTIMATED GRAND TOTAL: ₱{grandTotal.toLocaleString()}</h2>
            </div>

            {/* Footnote & Signatures */}
            <p className="text-[10px] text-gray-500 italic mt-6 border-t pt-2">
              * Custom wedding and corporate menus available upon request. Transportation fee for out-of-town events varies by distance and fuel rates.
            </p>

            <div className="mt-12 pt-8 flex justify-between text-xs text-center">
              <div className="w-48">
                <p className="border-b border-black mb-1"></p>
                <p>Client Signature / Date</p>
              </div>
              <div className="w-48">
                <p className="border-b border-black mb-1 font-bold">Jem Medina</p>
                <p>EYNS Hotel & Restaurant Representative</p>
              </div>
            </div>

          </div>

          {}
          <footer className="no-print bg-burgundy-950 border-t border-slate-800 text-slate-400 py-6 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
              <div className="flex items-center gap-3">
                <EynsOfficialLogo logoUrl={logoUrl} className="w-10 h-10" />
                <div>
                  <h4 className="font-serif text-slate-200 font-bold text-sm">EYNS HOTEL & RESTAURANT</h4>
                  <p className="mt-0.5 text-slate-400">Creating Memorable Celebrations Since 1988 • Catanauan, Quezon</p>
                </div>
              </div>
              <div className="text-center md:text-right">
                <p className="text-gold-400 font-semibold">Contact Person: Jem Medina (0917-841-7553)</p>
                <p>Email: eyns.hnr@gmail.com</p>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
