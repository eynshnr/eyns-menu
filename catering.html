                </div>

                <div className="flex flex-wrap items-center justify-between gap-2">
                  <button type="button" onClick={handleSaveCurrentQuoteToLog} className="px-3.5 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold">
                    + Save Active Quote ({docNumber})
                  </button>
                  <div className="flex gap-2">
                    <input type="text" value={savedQuotesSearch} onChange={e => setSavedQuotesSearch(e.target.value)} placeholder="Search client or ref..." className="px-3 py-1.5 rounded-xl border border-cream-200 text-xs" />
                    <select value={savedQuotesStatusFilter} onChange={e => setSavedQuotesStatusFilter(e.target.value)} className="px-2.5 py-1.5 rounded-xl border border-cream-200 bg-white text-xs font-bold">
                      <option value="All">All</option>
                      <option value="Draft">Draft</option>
                      <option value="Sent">Sent</option>
                      <option value="Confirmed">Confirmed</option>
                      <option value="Fully Paid">Fully Paid</option>
                    </select>
                  </div>
                </div>

                {filteredSavedQuotes.length === 0 ? (
                  <p className="text-xs text-center py-6 text-espresso-800/70">No saved quotes yet.</p>
                ) : (
                  <div className="space-y-2">
                    {filteredSavedQuotes.map(q => (
                      <div key={q.docNumber} className="bg-cream-50 p-3 rounded-xl border border-cream-200 flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div>
                          <div className="font-bold text-espresso-950">
                            {q.clientName} <span className="font-mono text-[10px] text-gold-600">({q.docNumber})</span>
                          </div>
                          <div className="text-[11px] text-espresso-800/75">
                            {q.occasion} • {formatPrettyDate(q.eventDate)} • {q.quoteStatus}
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-mono font-extrabold">{formatCurrency(q.grandTotal)}</span>
                          <button type="button" onClick={() => handleLoadSavedQuote(q, false)} className="px-2.5 py-1 rounded-lg bg-espresso-950 text-gold-300 font-bold">Open</button>
                          <button type="button" onClick={() => handleLoadSavedQuote(q, true)} className="px-2.5 py-1 rounded-lg bg-white border border-cream-200 font-bold">Duplicate</button>
                          <button type="button" onClick={() => setSavedQuotes(p => p.filter(x => x.docNumber !== q.docNumber))} className="px-2 py-1 rounded-lg bg-red-50 text-red-600 font-bold">×</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: BUSINESS PROFILE                                           */}
          {/* ================================================================= */}
          {isProfileModalOpen && (
            <div className="no-print fixed inset-0 z-50 bg-espresso-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 border border-cream-200 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto text-xs">
                <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                  <h3 className="font-serif text-xl font-bold text-espresso-950">EYNS Business Profile &amp; Payment Channels</h3>
                  <button type="button" onClick={() => setIsProfileModalOpen(false)} className="w-8 h-8 rounded-lg bg-cream-100 font-bold">×</button>
                </div>
                <div>
                  <label className="block font-bold mb-1">Business Name</label>
                  <input type="text" value={businessProfile.businessName} onChange={e => setBusinessProfile(p => ({ ...p, businessName: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                </div>
                <div>
                  <label className="block font-bold mb-1">Address</label>
                  <input type="text" value={businessProfile.address} onChange={e => setBusinessProfile(p => ({ ...p, address: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold mb-1">Contact Person &amp; Mobile</label>
                    <input type="text" value={businessProfile.contactLine} onChange={e => setBusinessProfile(p => ({ ...p, contactLine: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Prepared By Signatory</label>
                    <input type="text" value={businessProfile.preparedBy} onChange={e => setBusinessProfile(p => ({ ...p, preparedBy: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                  </div>
                </div>
                <div>
                  <label className="block font-bold mb-1">Official Bank / GCash Account Details</label>
                  <textarea rows="2" value={businessProfile.paymentAccounts} onChange={e => setBusinessProfile(p => ({ ...p, paymentAccounts: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200"></textarea>
                </div>
                <div>
                  <label className="block font-bold mb-1">Standard Booking &amp; Payment Terms</label>
                  <textarea rows="3" value={businessProfile.cateringTerms} onChange={e => setBusinessProfile(p => ({ ...p, cateringTerms: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200"></textarea>
                </div>
                <div className="flex justify-end pt-2 border-t border-cream-200">
                  <button type="button" onClick={() => { setIsProfileModalOpen(false); showToast('Business Profile saved!'); }} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">
                    Save Profile
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: GOOGLE SHEETS LIVE SYNC (ALL 3 SHEETS PERMANENTLY LINKED)  */}
          {/* ================================================================= */}
          {isSyncModalOpen && (
            <div className="no-print fixed inset-0 z-50 bg-espresso-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 border border-cream-200 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-xs">
                <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                  <div>
                    <h3 className="font-serif text-xl font-bold text-espresso-950">Connected EYNS Google Sheets (3 Catalogs)</h3>
                    <p className="text-espresso-800/80">
                      All 3 sheets are permanently built in and auto-sync across every device.
                    </p>
                  </div>
                  <button type="button" onClick={() => setIsSyncModalOpen(false)} className="w-8 h-8 rounded-lg bg-cream-100 font-bold">×</button>
                </div>

                {/* Sheet #3: A La Carte Menu */}
                <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-sm">3. A La Carte Menu Sheet (#3)</span>
                    <a href={menuSheetUrl} target="_blank" rel="noopener noreferrer" className="text-[11px] font-bold text-gold-600 hover:underline">
                      Open Sheet ↗
                    </a>
                  </div>
                  <input type="text" value={menuSheetUrl} onChange={e => setMenuSheetUrl(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                  {syncDiagnostics.menu && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.menuOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.menuOk ? '✅ ' : '⚠️ '}{syncDiagnostics.menu}
                    </div>
                  )}
                </div>

                {/* Sheet #4: Event Services */}
                <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-sm">4. Event Services &amp; Rentals Sheet (#4)</span>
                    <a href={servicesSheetUrl} target="_blank" rel="noopener noreferrer" className="text-[11px] font-bold text-gold-600 hover:underline">
                      Open Sheet ↗
                    </a>
                  </div>
                  <input type="text" value={servicesSheetUrl} onChange={e => setServicesSheetUrl(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                  {syncDiagnostics.services && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.servicesOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.servicesOk ? '✅ ' : '⚠️ '}{syncDiagnostics.services}
                    </div>
                  )}
                </div>

                {/* Sheet #5: Hotel Rooms */}
                <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="font-extrabold text-sm">5. Hotel Rooms Sheet (#5)</span>
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          const header = ['ID', 'Room No', 'Room Type', 'Rate Per Night', 'Capacity', 'Inclusions'];
                          const rows = roomItems.map(r => [r.id, r.roomNo, r.type, r.rate, r.capacity, r.inclusions || '']);
                          copyTextFallback([header, ...rows].map(r => r.join('\t')).join('\n'));
                          showToast('Hotel Rooms template copied! Paste into cell A1 of Sheet #5.');
                        }}
                        className="px-2.5 py-1 rounded-lg bg-white border border-cream-200 text-[11px] font-bold text-espresso-950"
                      >
                        Copy Rooms Template
                      </button>
                      <a href={roomsSheetUrl} target="_blank" rel="noopener noreferrer" className="text-[11px] font-bold text-gold-600 hover:underline">
                        Open Sheet ↗
                      </a>
                    </div>
                  </div>
                  <input type="text" value={roomsSheetUrl} onChange={e => setRoomsSheetUrl(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                  {syncDiagnostics.rooms && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.roomsOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}`}>
                      {syncDiagnostics.roomsOk ? '✅ ' : 'ℹ️ '}{syncDiagnostics.rooms}
                    </div>
                  )}
                </div>

                {/* Auto-Sync Controls */}
                <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-200 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <div className="font-extrabold text-espresso-950">Live Auto-Sync: {autoSyncEnabled ? 'ACTIVE (Every 30s)' : 'PAUSED'}</div>
                    <div className="text-[11px] text-espresso-800/80">{lastSyncTime ? `Last synced at ${lastSyncTime}` : 'Ready to sync'}</div>
                  </div>
                  <div className="flex gap-1.5">
                    <button
                      type="button"
                      onClick={() => syncAllSheets({ menu: menuSheetUrl, services: servicesSheetUrl, rooms: roomsSheetUrl }, false)}
                      disabled={isSyncingSheets}
                      className="px-3.5 py-1.5 rounded-lg bg-espresso-950 text-gold-300 font-extrabold"
                    >
                      {isSyncingSheets ? 'Syncing...' : 'Sync All Now'}
                    </button>
                    <button type="button" onClick={() => setAutoSyncEnabled(v => !v)} className="px-3 py-1.5 rounded-lg bg-white border border-emerald-300 font-bold">
                      {autoSyncEnabled ? 'Pause' : 'Resume'}
                    </button>
                  </div>
                </div>

                <div className="flex justify-end pt-2 border-t border-cream-200">
                  <button type="button" onClick={() => setIsSyncModalOpen(false)} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. ERROR BOUNDARY & SAFE REACT 18 MOUNT
    // =========================================================================
    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || 'Unexpected rendering error' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-cream-100">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full border border-cream-200 shadow-lg space-y-3 text-center">
                <h2 className="font-serif text-xl font-bold text-espresso-950">EYNS Builder Notice</h2>
                <p className="text-xs text-red-700 font-mono">{this.state.message}</p>
                <button type="button" onClick={() => window.location.reload()} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold">
                  Reload App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function mountApp() {
      const container = document.getElementById('root');
      if (!container) return;
      ReactDOM.createRoot(container).render(
        <AppErrorBoundary>
          <App />
        </AppErrorBoundary>
      );
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', mountApp);
    } else {
      mountApp();
    }
  </script>
</body>
</html>
