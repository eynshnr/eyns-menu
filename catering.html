                  <input type="text" value={businessProfile.address} onChange={e => setBusinessProfile(p => ({ ...p, address: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold mb-1">Contact Person / Hotline</label>
                    <input type="text" value={businessProfile.contactLine} onChange={e => setBusinessProfile(p => ({ ...p, contactLine: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Prepared By Signatory</label>
                    <input type="text" value={businessProfile.preparedBy} onChange={e => setBusinessProfile(p => ({ ...p, preparedBy: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200" />
                  </div>
                </div>
                <div>
                  <label className="block font-bold mb-1">Official Bank / GCash Account Details</label>
                  <textarea rows="2" value={businessProfile.paymentAccounts} onChange={e => setBusinessProfile(p => ({ ...p, paymentAccounts: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200"></textarea>
                </div>
                <div>
                  <label className="block font-bold mb-1">Standard Booking &amp; Payment Terms</label>
                  <textarea rows="3" value={businessProfile.cateringTerms} onChange={e => setBusinessProfile(p => ({ ...p, cateringTerms: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-cream-200"></textarea>
                </div>
                <div className="flex justify-end pt-2 border-t border-cream-200">
                  <button type="button" onClick={() => { setIsProfileModalOpen(false); showToast('Business Profile saved!'); }} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Save Profile</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: GOOGLE SHEETS LIVE SYNC (3 SHEETS) */}
          {isSyncModalOpen && (
            <div className="no-print fixed inset-0 z-50 bg-espresso-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 border border-cream-200 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-xs">
                <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                  <div>
                    <h3 className="font-serif text-xl font-bold text-espresso-950">Connect Your 3 Google Sheets</h3>
                    <p className="text-espresso-800/80">Set Share → <strong>Anyone with the link (Viewer)</strong> on each sheet, then paste the links below.</p>
                  </div>
                  <button type="button" onClick={() => setIsSyncModalOpen(false)} className="w-8 h-8 rounded-lg bg-cream-100 font-bold">×</button>
                </div>

                {/* Sheet #3: Menu */}
                <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-2">
                  <div className="font-extrabold text-sm">3. A La Carte Menu Google Sheet (#3)</div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={menuSheetUrl}
                      onChange={e => setMenuSheetUrl(e.target.value)}
                      onPaste={e => {
                        const pasted = e.clipboardData?.getData('text')?.trim();
                        if (pasted && pasted.startsWith('http')) {
                          setMenuSheetUrl(pasted);
                          setTimeout(() => syncAllSheets(pasted, servicesSheetUrl, false, roomsSheetUrl), 150);
                        }
                      }}
                      placeholder="https://docs.google.com/spreadsheets/d/..."
                      className="flex-1 px-3 py-2 rounded-xl border border-cream-200 bg-white font-mono text-xs"
                    />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, false, roomsSheetUrl)} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Connect</button>
                  </div>
                  {syncDiagnostics.menu && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.menuOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.menuOk ? '✅ ' : '⚠️ '}{syncDiagnostics.menu}
                    </div>
                  )}
                </div>

                {/* Sheet #4: Services */}
                <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-2">
                  <div className="font-extrabold text-sm">4. Event Services Google Sheet (#4)</div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={servicesSheetUrl}
                      onChange={e => setServicesSheetUrl(e.target.value)}
                      onPaste={e => {
                        const pasted = e.clipboardData?.getData('text')?.trim();
                        if (pasted && pasted.startsWith('http')) {
                          setServicesSheetUrl(pasted);
                          setTimeout(() => syncAllSheets(menuSheetUrl, pasted, false, roomsSheetUrl), 150);
                        }
                      }}
                      placeholder="https://docs.google.com/spreadsheets/d/..."
                      className="flex-1 px-3 py-2 rounded-xl border border-cream-200 bg-white font-mono text-xs"
                    />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, false, roomsSheetUrl)} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Connect</button>
                  </div>
                  {syncDiagnostics.services && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.servicesOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.servicesOk ? '✅ ' : '⚠️ '}{syncDiagnostics.services}
                    </div>
                  )}
                </div>

                {/* Sheet #5: Hotel Rooms */}
                <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="font-extrabold text-sm">5. Hotel Rooms Google Sheet (#5)</div>
                    <button
                      type="button"
                      onClick={() => {
                        const rows = [
                          ['ID', 'Room No', 'Room Type', 'Rate Per Night', 'Capacity', 'Inclusions'],
                          ...roomItems.map(r => [r.id, r.roomNo, r.type, r.rate, r.capacity || '2 Pax', r.inclusions || 'Aircon, Wi-Fi, Private Bath'])
                        ];
                        copyTextFallback(rows.map(r => r.join('\t')).join('\n'));
                        showToast('Hotel Rooms template copied! Paste in cell A1 of your Google Sheet.');
                      }}
                      className="text-[11px] font-bold text-gold-600 hover:underline"
                    >
                      Copy Sheet #5 Template
                    </button>
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={roomsSheetUrl}
                      onChange={e => setRoomsSheetUrl(e.target.value)}
                      onPaste={e => {
                        const pasted = e.clipboardData?.getData('text')?.trim();
                        if (pasted && pasted.startsWith('http')) {
                          setRoomsSheetUrl(pasted);
                          setTimeout(() => syncAllSheets(menuSheetUrl, servicesSheetUrl, false, pasted), 150);
                        }
                      }}
                      placeholder="https://docs.google.com/spreadsheets/d/..."
                      className="flex-1 px-3 py-2 rounded-xl border border-cream-200 bg-white font-mono text-xs"
                    />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, false, roomsSheetUrl)} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Connect</button>
                  </div>
                  <p className="text-[10px] text-espresso-800/75">
                    Row 1 Columns: <strong>ID | Room No | Room Type | Rate Per Night | Capacity | Inclusions</strong>
                  </p>
                  {syncDiagnostics.rooms && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.roomsOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.roomsOk ? '✅ ' : '⚠️ '}{syncDiagnostics.rooms}
                    </div>
                  )}
                </div>

                {/* Auto-Sync & Bookmarkable Link */}
                <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-200 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <div className="font-extrabold text-espresso-950">Live Auto-Sync: {autoSyncEnabled ? 'ACTIVE (Every 20s)' : 'PAUSED'}</div>
                    <div className="text-[11px] text-espresso-800/80">{lastSyncTime ? `Last synced at ${lastSyncTime}` : 'Bookmark your Business Link so links stay saved.'}</div>
                  </div>
                  <div className="flex gap-1.5">
                    <button
                      type="button"
                      onClick={() => {
                        const base = window.location.href.split('#')[0];
                        const p = new URLSearchParams();
                        if (menuSheetUrl.trim()) p.set('menu', menuSheetUrl.trim());
                        if (servicesSheetUrl.trim()) p.set('services', servicesSheetUrl.trim());
                        if (roomsSheetUrl.trim()) p.set('rooms', roomsSheetUrl.trim());
                        copyTextFallback(p.toString() ? `${base}#${p.toString()}` : base);
                        showToast('Permanent Business Link copied!');
                      }}
                      className="px-3 py-1.5 rounded-lg bg-espresso-950 text-gold-300 font-bold"
                    >
                      Copy Business Link
                    </button>
                    <button type="button" onClick={() => setAutoSyncEnabled(v => !v)} className="px-3 py-1.5 rounded-lg bg-white border border-emerald-300 font-bold">
                      {autoSyncEnabled ? 'Pause' : 'Resume'}
                    </button>
                  </div>
                </div>

                {/* Copy-Paste Fallback */}
                <div className="bg-cream-50 p-3 rounded-xl border border-cream-200">
                  <button type="button" onClick={() => setShowManualPasteFallback(v => !v)} className="w-full flex justify-between font-bold">
                    <span>Fallback: Copy &amp; paste Event Services rows directly from Google Sheets</span>
                    <span>{showManualPasteFallback ? '▲' : '▼'}</span>
                  </button>
                  {showManualPasteFallback && (
                    <div className="mt-2 space-y-2">
                      <textarea rows="4" value={manualServicesPaste} onChange={e => setManualServicesPaste(e.target.value)} placeholder="Ctrl+A, Ctrl+C from your Event Services sheet and paste here..." className="w-full p-2 rounded-lg border border-cream-200 bg-white font-mono text-[10px]"></textarea>
                      <button type="button" onClick={handleImportPastedServices} className="px-3 py-1.5 rounded-lg bg-espresso-950 text-gold-300 font-bold">Import Pasted Services</button>
                    </div>
                  )}
                </div>

                <div className="flex justify-between pt-2 border-t border-cream-200">
                  <button
                    type="button"
                    onClick={() => {
                      persistSavedString(STORAGE_KEYS.MENU_SCRIPT_URL, LEGACY_MENU_URL_KEYS, '');
                      persistSavedString(STORAGE_KEYS.SERVICES_SCRIPT_URL, LEGACY_SERVICE_URL_KEYS, '');
                      persistSavedString(STORAGE_KEYS.ROOMS_SCRIPT_URL, LEGACY_ROOM_URL_KEYS, '');
                      setMenuSheetUrl('');
                      setServicesSheetUrl('');
                      setRoomsSheetUrl(HARDCODED_ROOMS_SHEET_URL);
                      setServiceItems([]);
                      setMenuItems(DEFAULT_MENU_ITEMS);
                      setRoomItems(DEFAULT_ROOM_CATALOG);
                      showToast('Sheet links reset.');
                    }}
                    className="px-3 py-2 rounded-xl bg-red-50 text-red-700 font-bold"
                  >
                    Reset Links
                  </button>
                  <button type="button" onClick={() => setIsSyncModalOpen(false)} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Done</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 5. ERROR BOUNDARY & SAFE REACT 18 MOUNT
    // =========================================================================
    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || 'Unexpected rendering error' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-cream-100">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full border border-cream-200 shadow-lg space-y-3 text-center">
                <h2 className="font-serif text-xl font-bold text-espresso-950">EYNS Builder Notice</h2>
                <p className="text-xs text-red-700 font-mono">{this.state.message}</p>
                <button type="button" onClick={() => window.location.reload()} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold">
                  Reload App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function mountApp() {
      const container = document.getElementById('root');
      if (!container) return;
      ReactDOM.createRoot(container).render(
        <AppErrorBoundary>
          <App />
        </AppErrorBoundary>
      );
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', mountApp);
    } else {
      mountApp();
    }
  </script>
</body>
</html>
