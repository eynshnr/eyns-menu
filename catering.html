    function App() {
      // Set to packages first
      const [activeTab, setActiveTab] = useState('packages'); 
      const [logoUrl, setLogoUrl] = useState('assets/logo.jpg');
      
      // Builder State
      const [clientName, setClientName] = useState('Valued Client');
      const [eventType, setEventType] = useState('Wedding / Banquet');
      const [eventDate, setEventDate] = useState('2026-12-18');
      const [guestCount, setGuestCount] = useState(100);
      const [quoteRef, setQuoteRef] = useState(`EYNS-${new Date().getFullYear()}-QT`);

      // Selections
      const [selectedPkgId, setSelectedPkgId] = useState('essential');
      const [isCustomMenu, setIsCustomMenu] = useState(false);
      const [selectedMenuTierId, setSelectedMenuTierId] = useState('menu_a');
      const [selectedAddonIds, setSelectedAddonsIds] = useState([]); 
      const [selectedAlacarte, setSelectedAlacarte] = useState([]); 
      const [taxMode, setTaxMode] = useState('none'); 
      
      // UI State for Filters
      const [addonCategory, setAddonCategory] = useState('All');
      const [catalogCategory, setCatalogCategory] = useState('All');

      // Auto-logic for selections
      useEffect(() => {
        if (selectedPkgId === 'no_package') {
          setIsCustomMenu(true);
        }
      }, [selectedPkgId]);

      const selectedPkg = OFFICIAL_PACKAGES.find(p => p.id === selectedPkgId);
      const selectedMenuTier = OFFICIAL_MENU_SELECTIONS.find(m => m.id === selectedMenuTierId);

      // Math Helpers
      const getDishPrice = (dishName) => {
        for (const cat in FULL_A_LA_CARTE_CATALOG) {
          const dish = FULL_A_LA_CARTE_CATALOG[cat].find(d => d.name === dishName);
          if (dish) return dish.price;
        }
        return 0;
      };

      const packageBasePrice = useMemo(() => {
        if (!selectedPkg) return 0;
        if (selectedPkgId === 'no_package') return 3000; // 3k Service charge
        if (selectedPkg.flatRate) return selectedPkg.flatRate;

        const count = Number(guestCount) || 50;
        const setupCost = selectedPkg.tierRates[50] - (50 * 300); // Extract pure setup cost (Food is exactly 300/head up to 150 pax)
        
        if (count <= 150) {
          return setupCost + (count * 300);
        } else {
          // For excess beyond 150, apply the specific excess rate (which covers both extra food and rentals)
          const excess = count - 150;
          return selectedPkg.tierRates[150] + (excess * selectedPkg.excessRate);
        }
      }, [selectedPkg, selectedPkgId, guestCount]);

      const menuUpgradeSubtotal = useMemo(() => {
        if (selectedPkgId === 'styling_only' || selectedPkgId === 'no_package' || isCustomMenu) return 0;
        return (selectedMenuTier?.surcharge || 0) * guestCount;
      }, [selectedPkgId, isCustomMenu, selectedMenuTier, guestCount]);

      const alacartePricePerPax = useMemo(() => {
        return selectedAlacarte.reduce((sum, dishName) => sum + getDishPrice(dishName), 0);
      }, [selectedAlacarte]);

      const alacarteSubtotal = alacartePricePerPax * guestCount;

      const BASE_FOOD_CREDIT_PER_PAX = 300; // Deducted when clients opt out of the standard package menu

      const foodCredit = useMemo(() => {
        // No credit for styling only (no food) or seminar (which is just a service charge)
        if (selectedPkgId === 'styling_only' || selectedPkgId === 'no_package') return 0; 
        if (!isCustomMenu) return 0;
        return BASE_FOOD_CREDIT_PER_PAX * guestCount;
      }, [selectedPkgId, isCustomMenu, guestCount]);

      const addonsSubtotal = useMemo(() => {
        return selectedAddonIds.reduce((sum, id) => {
          const item = OFFICIAL_ADDONS.find(a => a.id === id);
          if (!item) return sum;
          return sum + (item.perPax ? item.price * guestCount : item.price);
        }, 0);
      }, [selectedAddonIds, guestCount]);

      const subtotalBeforeTax = packageBasePrice - foodCredit + menuUpgradeSubtotal + (isCustomMenu || selectedPkgId === 'no_package' ? alacarteSubtotal : 0) + addonsSubtotal;

      const taxAmount = useMemo(() => {
        if (taxMode === 'vat12') return subtotalBeforeTax * 0.12;
        if (taxMode === 'gov7') return subtotalBeforeTax * 0.07;
        return 0;
      }, [subtotalBeforeTax, taxMode]);

      const grandTotal = subtotalBeforeTax + taxAmount;

      const toggleAddon = (id) => {
        setSelectedAddonsIds(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
      };

      const toggleAlacarte = (dishName) => {
        setSelectedAlacarte(prev => prev.includes(dishName) ? prev.filter(name => name !== dishName) : [...prev, dishName]);
      };

      const handlePrint = (e) => {
        e.preventDefault();
        
        const printContent = document.querySelector('.print-only');
        if (!printContent) {
          window.print();
          return;
        }

        // Open a new popup window to safely trigger the print dialog, bypassing iframe restrictions
        const printWindow = window.open('', '_blank', 'width=800,height=900');
        
        if (printWindow) {
          printWindow.document.write(`
            <!DOCTYPE html>
            <html>
              <head>
                <title>EYNS Quotation - ${clientName}</title>
                <script src="https://cdn.tailwindcss.com"><\/script>
                <style>
                  @page { size: A4 portrait; margin: 15mm; }
                  body { 
                    font-family: 'Plus Jakarta Sans', sans-serif; 
                    -webkit-print-color-adjust: exact; 
                    print-color-adjust: exact; 
                    background: white; 
                    color: black; 
                  }
                </style>
              </head>
              <body>
                <div style="max-width: 4xl; margin: auto;">
                  ${printContent.innerHTML}
                </div>
                <script>
                  // Wait briefly for Tailwind CSS to inject its styles before printing
                  setTimeout(() => {
                    window.print();
                    window.close();
                  }, 800);
                <\/script>
              </body>
            </html>
          `);
          printWindow.document.close();
        } else {
          // Fallback if user's browser blocked the popup
          window.print();
        }
      };

      const handleMessengerClick = (e) => {
        e.preventDefault();
        
        let menuText = '';
        if (selectedPkgId === 'styling_only') {
          menuText = '\n- Food: Excluded';
        } else if (selectedPkgId === 'no_package') {
          menuText = `\n- Custom Food Menu (${selectedAlacarte.length} dishes): ₱${alacarteSubtotal.toLocaleString()} (₱${alacartePricePerPax}/pax x ${guestCount} pax)`;
        } else if (isCustomMenu) {

                      </div>

                      <div className="mt-6 space-y-3">
                        <button onClick={handleMessengerClick} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 text-sm shadow-lg shadow-blue-900/40">
                          <i className="fa-brands fa-facebook-messenger text-lg"></i>
                          Copy & Send via Messenger
                        </button>
                        <button onClick={handlePrint} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-bold py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 text-sm">
                          <i className="fa-solid fa-print"></i>
                          Print Official Record
                        </button>
                      </div>

                    </div>
                  </div>
                </div>

              </div>
            )}

            {}
            {activeTab === 'catalog' && (
              <div className="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                <div className="text-center max-w-2xl mx-auto space-y-2 mb-8">
                  <h2 className="text-3xl font-serif font-bold gold-gradient-text">Complete A La Carte Menu</h2>
                  <p className="text-xs text-slate-300">Browse individual per-pax pricing for custom event catering and simple food orders.</p>
                </div>

                <div className="flex flex-wrap justify-center gap-2 text-xs mb-8">
                  {['All', ...Object.keys(FULL_A_LA_CARTE_CATALOG)].map(cat => (
                    <button key={cat} onClick={() => setCatalogCategory(cat)} className={`px-4 py-2 rounded-full border transition-all ${catalogCategory === cat ? 'bg-gold-500 text-slate-950 border-gold-400 font-bold shadow-md' : 'bg-slate-900 text-slate-300 border-slate-700 hover:border-gold-500/50'}`}>
                      {cat}
                    </button>
                  ))}
                </div>

                <div className="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
                  {Object.entries(FULL_A_LA_CARTE_CATALOG)
                    .filter(([cat]) => catalogCategory === 'All' || catalogCategory === cat)
                    .map(([category, items]) => (
                      <div key={category} className="glass-card rounded-2xl p-5 break-inside-avoid">
                        <h3 className="text-lg font-serif font-bold text-gold-400 border-b border-slate-700/50 pb-2 mb-4">{category}</h3>
                        <div className="space-y-2">
                          {items.map((dish, i) => (
                            <div key={i} className="flex justify-between items-center text-sm group">
                              <span className="text-slate-300 group-hover:text-white transition-colors">{dish.name}</span>
                              <span className="font-mono text-gold-400">₱{dish.price}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {}
          <div className="hidden print-only p-8 text-black bg-white max-w-4xl mx-auto font-sans">
            <div className="border-b-2 border-burgundy-900 pb-4 mb-4 flex justify-between items-center">
              <div className="flex items-center gap-4">
                <EynsOfficialLogo logoUrl={logoUrl} className="w-20 h-20" />
                <div>
                  <h1 className="text-2xl font-serif font-bold tracking-tight text-burgundy-900">EYNS HOTEL & RESTAURANT</h1>
                  <p className="text-xs uppercase tracking-widest font-semibold text-amber-800">Catering Services & Event Styling Quotation</p>
                  <p className="text-[11px] text-gray-600">Creating Memorable Celebrations Since 1988 • Catanauan, Quezon</p>
                </div>
              </div>
              <div className="text-right text-xs bg-gray-100 p-3 rounded border border-gray-300 shadow-sm">
                <p><strong>QUOTE REF:</strong> {quoteRef}</p>
                <p><strong>DATE:</strong> {new Date().toLocaleDateString()}</p>
                <p><strong>CONTACT:</strong> Jem Medina (0917-841-7553)</p>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 bg-burgundy-900 text-white p-3 rounded-md text-xs mb-6 shadow-sm">
              <div><strong className="text-gold-300">PREPARED FOR:</strong><br/>{clientName}</div>
              <div><strong className="text-gold-300">EVENT DATE & PAX:</strong><br/>{eventDate || 'TBD'} ({guestCount} Pax)</div>
              <div className="text-right"><strong className="text-gold-300">EVENT TYPE:</strong><br/>{eventType}</div>
            </div>

            <div className="space-y-6">
              
              {/* Package Details */}
              <div>
                <h3 className="font-bold text-xs uppercase bg-gray-200 p-2 border border-gray-300 mb-2 rounded-t-md">1. Base Package Allocation</h3>
                <div className="p-3 border rounded-b-md text-sm">
                  <div className="flex justify-between font-bold text-burgundy-900 mb-1">
                    <span>{selectedPkg?.id === 'no_package' ? 'Seminar / Service Charge' : selectedPkg?.name}</span>
                    <span>₱{packageBasePrice.toLocaleString()}</span>
                  </div>
                  <p className="text-gray-600 text-xs italic mb-2">{selectedPkg?.tagline}</p>
                  <div className="text-[11px] text-gray-700"><strong>Included:</strong> {selectedPkg?.inclusions.join(' • ')}</div>
                </div>
              </div>

              {/* Food Details */}
              {selectedPkgId !== 'styling_only' && (
                <div>
                  <h3 className="font-bold text-xs uppercase bg-gray-200 p-2 border border-gray-300 mb-2 rounded-t-md">2. Food & Beverage Selection</h3>
                  <div className="p-3 border rounded-b-md text-sm">
                    {isCustomMenu && selectedPkgId !== 'no_package' && (
                      <div className="flex justify-between font-bold text-green-700 mb-1 pb-1 border-b border-gray-200">
                        <span>Base Package Food Credit (-₱{BASE_FOOD_CREDIT_PER_PAX}/pax)</span>
                        <span>- ₱{foodCredit.toLocaleString()}</span>
                      </div>
                    )}
                    <div className="flex justify-between font-bold text-burgundy-900 mb-1 mt-1">
                      <span>{isCustomMenu || selectedPkgId === 'no_package' ? 'Custom A La Carte Menu' : selectedMenuTier?.name}</span>
                      <span>₱{(isCustomMenu || selectedPkgId === 'no_package' ? alacarteSubtotal : menuUpgradeSubtotal).toLocaleString()}</span>
                    </div>
                    {isCustomMenu || selectedPkgId === 'no_package' ? (
                      <p className="text-[11px] text-gray-700"><strong>Selected Dishes (₱{alacartePricePerPax}/pax):</strong> {selectedAlacarte.join(', ') || 'None selected'}</p>
                    ) : (
                      <p className="text-[11px] text-gray-700"><strong>Included Dishes (+₱{selectedMenuTier?.surcharge}/pax):</strong> {selectedMenuTier?.dishes.join(' • ')}</p>
                    )}
                  </div>
                </div>
              )}

              {/* Addons Details */}
              {selectedAddonIds.length > 0 && (
                <div>
                  <h3 className="font-bold text-xs uppercase bg-gray-200 p-2 border border-gray-300 mb-2 rounded-t-md">3. Venue Enhancements & Add-Ons</h3>
                  <table className="w-full text-xs border-collapse border rounded-b-md overflow-hidden">
                    <thead>
                      <tr className="bg-gray-100">
                        <th className="border p-2 text-left">Item / Service</th>
                        <th className="border p-2 text-left">Category</th>
                        <th className="border p-2 text-right">Price</th>
                      </tr>
                    </thead>
                    <tbody>
                      {selectedAddonIds.map(id => {
                        const item = OFFICIAL_ADDONS.find(a => a.id === id);
                        return (
                          <tr key={id}>
                            <td className="border p-2 font-medium">{item?.name}</td>
                            <td className="border p-2 text-gray-600">{item?.cat}</td>
                            <td className="border p-2 text-right">₱{(item?.perPax ? item.price * guestCount : item?.price).toLocaleString()}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            <div className="mt-6 border-t-2 border-black pt-4 w-1/2 ml-auto">
              <div className="flex justify-between text-xs mb-1">
                <span>Subtotal:</span>
                <span>₱{subtotalBeforeTax.toLocaleString()}</span>
              </div>
              {taxMode !== 'none' && (
                <div className="flex justify-between text-xs mb-2">
                  <span>{taxMode === 'vat12' ? '12% VAT:' : '7% Gov Tax:'}</span>
                  <span>₱{taxAmount.toLocaleString()}</span>
                </div>
              )}
              <div className="flex justify-between items-end border-t border-gray-300 pt-2 mt-2">
                <span className="font-bold text-sm text-burgundy-900 uppercase">Grand Total:</span>
                <span className="text-xl font-bold text-burgundy-900">₱{grandTotal.toLocaleString()}</span>
              </div>
            </div>

            <p className="text-[10px] text-gray-500 italic mt-8 text-center">
              * Valid for 30 days. Transportation fee for out-of-town events varies by distance. Official receipt issued upon final booking confirmation.
            </p>

            <div className="mt-16 pt-8 flex justify-between text-xs text-center px-12">
              <div className="w-48">
                <p className="border-b border-black mb-1"></p>
                <p>Client Signature over Printed Name</p>
              </div>
              <div className="w-48">
                <p className="border-b border-black mb-1 font-bold">Jem Medina</p>
                <p>EYNS Hotel & Restaurant Representative</p>
              </div>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
