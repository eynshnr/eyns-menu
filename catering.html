    function readCookieValue(name) {
      try {
        const prefix = encodeURIComponent(name) + '=';
        const parts = (document.cookie || '').split(';');
        for (let i = 0; i < parts.length; i++) {
          const trimmed = parts[i].trim();
          if (trimmed.startsWith(prefix)) {
            return decodeURIComponent(trimmed.slice(prefix.length));
          }
        }
      } catch (e) {}
      return '';
    }

    function writeCookieValue(name, value, days = 365) {
      try {
        const expires = value
          ? '; expires=' + new Date(Date.now() + days * 86400000).toUTCString()
          : '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        document.cookie =
          encodeURIComponent(name) +
          '=' +
          encodeURIComponent(value || '') +
          expires +
          '; path=/; SameSite=Lax';
      } catch (e) {}
    }

    function readUrlParam(paramName) {
      try {
        const searchParams = new URLSearchParams(window.location.search || '');
        const fromSearch = (searchParams.get(paramName) || '').trim();
        if (fromSearch) return fromSearch;
        const rawHash = (window.location.hash || '').replace(/^#/, '');
        if (!rawHash) return '';
        const hashParams = new URLSearchParams(rawHash);
        return (hashParams.get(paramName) || '').trim();
      } catch (e) {
        return '';
      }
    }

    function recoverSavedString(candidateKeys, fallbackValue = '', urlParamName = '') {
      if (urlParamName) {
        const fromUrl = readUrlParam(urlParamName);
        if (fromUrl) return fromUrl;
      }
      try {
        for (const k of candidateKeys) {
          const val = localStorage.getItem(k) || sessionStorage.getItem(k) || readCookieValue(k);
          if (val && val.trim()) return val.trim();
        }
      } catch (e) {}
      return fallbackValue;
    }

    function persistSavedString(primaryKey, legacyKeys, value) {
      const clean = String(value || '').trim();
      try {
        if (clean) {
          localStorage.setItem(primaryKey, clean);
          sessionStorage.setItem(primaryKey, clean);
          writeCookieValue(primaryKey, clean, 365);
        } else {
          legacyKeys.forEach(k => {
            localStorage.removeItem(k);
            sessionStorage.removeItem(k);
            writeCookieValue(k, '', 0);
          });
        }
      } catch (e) {}
    }

    function recoverSavedJsonArray(candidateKeys, fallbackArray = []) {
      try {
        for (const k of candidateKeys) {
          const raw = localStorage.getItem(k);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        }
      } catch (e) {}
      return fallbackArray;

    function generateDocNumber() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const rand = String(Math.floor(1000 + Math.random() * 9000));
      return `EYNS-${yy}${mm}${dd}-${rand}`;

    function formatWholeCurrency(val) {

    function formatPrettyDate(isoStr) {
      if (!isoStr) return 'TBD';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function addDaysToIsoDate(isoStr, offsetDays) {
      if (!isoStr) return '';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      dt.setDate(dt.getDate() + offsetDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function computeDaysBetweenDates(startIso, endIso) {
      if (!startIso || !endIso) return 1;
      const s = new Date(startIso + 'T00:00:00');
      const e = new Date(endIso + 'T00:00:00');
      if (isNaN(s.getTime()) || isNaN(e.getTime())) return 1;
      return Math.max(1, Math.round((e.getTime() - s.getTime()) / 86400000));
    }

    // Smooth Numeric Input Component (allows clearing & typing freely without snapping back to 1)
    function SmoothNumberInput({ value, onValueChange, min = 0, max, allowDecimal = false, className = '', placeholder = '' }) {
      const [rawText, setRawText] = useState(value === undefined || value === null ? '' : String(value));
      const [isFocused, setIsFocused] = useState(false);

      useEffect(() => {
        if (!isFocused) {
          setRawText(value === undefined || value === null ? '' : String(value));
        }
      }, [value, isFocused]);

      const commitParsed = str => {
        const cleaned = allowDecimal ? str.replace(/[^0-9.]/g, '') : str.replace(/[^0-9]/g, '');
        if (!cleaned) {
          onValueChange(min);
          setRawText(String(min));
          return;
        }
        let num = allowDecimal ? parseFloat(cleaned) : parseInt(cleaned, 10);
        if (isNaN(num)) num = min;
        if (min !== undefined && num < min) num = min;
        if (max !== undefined && num > max) num = max;
        onValueChange(num);
        setRawText(String(num));
      };

      return (
        <input
          type="text"
          inputMode={allowDecimal ? 'decimal' : 'numeric'}
          value={rawText}
          placeholder={placeholder}
          onFocus={e => {
            setIsFocused(true);
            e.target.select();
          }}
          onChange={e => {
            const next = e.target.value;
            setRawText(next);
            const cleaned = allowDecimal ? next.replace(/[^0-9.]/g, '') : next.replace(/[^0-9]/g, '');
            if (cleaned !== '') {
              let num = allowDecimal ? parseFloat(cleaned) : parseInt(cleaned, 10);
              if (!isNaN(num)) {
                if (max !== undefined && num > max) num = max;
                if (num >= min) onValueChange(num);
              }
            }
          }}
          onBlur={() => {
            setIsFocused(false);
            commitParsed(rawText);
          }}
          onKeyDown={e => {
            if (e.key === 'Enter') e.target.blur();
          }}
          className={className}
        />
      );
    }

    function calculateTieredPackageBreakdown(pkg, tierPax, totalPax, excessRate, buffetMenuId = 'menu_a') {
      const tiers = pkg?.tiers || [];
      const matchedTier = tiers.find(t => t.pax === tierPax) || tiers[0] || { pax: 50, price: 0 };
      const effectiveTotalPax = Math.max(matchedTier.pax, Number(totalPax) || matchedTier.pax);
      const excessPax = Math.max(0, effectiveTotalPax - matchedTier.pax);
      const rate = Math.max(0, Number(excessRate) || 0);
      const excessCharge = excessPax * rate;
      const grossPackageTotal = matchedTier.price + excessCharge;

      const isCustomReplaced = buffetMenuId === 'custom_menu';
      const buffetPlan = SAMPLE_BUFFET_MENUS.find(m => m.id === buffetMenuId) || SAMPLE_BUFFET_MENUS[0];
      const menuUpgradeAddon = !isCustomReplaced && buffetPlan.addonPerPax > 0 ? buffetPlan.addonPerPax * effectiveTotalPax : 0;
      const customMenuCredit = isCustomReplaced ? BASE_FOOD_CREDIT_PER_PAX * effectiveTotalPax : 0;
      const total = Math.max(0, grossPackageTotal + menuUpgradeAddon - customMenuCredit);

      return {
        tierPax: matchedTier.pax,
        effectivePax: effectiveTotalPax,
        basePrice: matchedTier.price,
        excessPax,
        excessRate: rate,
        excessCharge,
        grossPackageTotal,
        buffetPlan,
        isCustomReplaced,
        menuUpgradeAddon,
        customMenuCredit,
        total
      };
    }

    function normalizeServiceSubcategory(raw) {
      const val = String(raw || '').trim().toLowerCase();
      if (val.includes('rent')) return 'Rental';
      if (val.includes('supp')) return 'Suppliers';
      return 'Catering';
    }

    function normalizeBillingType(raw) {
      const val = String(raw || '').trim().toLowerCase().replace(/\s+/g, '_');
      if (val.includes('pax') || val.includes('head') || val.includes('guest')) return 'per_pax';
      if (val.includes('day')) return 'per_day';
      if (val.includes('fix') || val.includes('flat') || val.includes('lot') || val.includes('once')) return 'fixed';
      return 'per_piece';
    }

    function billingBadgeLabel(billingType) {
      const norm = normalizeBillingType(billingType);
      if (norm === 'per_pax') return 'Per Pax';
      if (norm === 'per_day') return 'Per Day';
      if (norm === 'fixed') return 'Fixed / Lot';
      return 'Per Piece';
    }

    function getCategoryIcon(cat) {
      const lower = String(cat || '').toLowerCase();
      if (lower.includes('soup')) return 'fa-mug-hot';
      if (lower.includes('beef')) return 'fa-drumstick-bite';
      if (lower.includes('pork')) return 'fa-bacon';
      if (lower.includes('chicken')) return 'fa-feather-pointed';
      if (lower.includes('sea') || lower.includes('fish') || lower.includes('shrimp')) return 'fa-fish';
      if (lower.includes('veg')) return 'fa-leaf';
      if (lower.includes('pancit') || lower.includes('pasta')) return 'fa-bowl-food';
      if (lower.includes('rice')) return 'fa-bowl-rice';
      if (lower.includes('dessert')) return 'fa-ice-cream';
      if (lower.includes('bev') || lower.includes('snack')) return 'fa-glass-water';
      return 'fa-utensils';
    }

    function getServiceSubcategoryBadgeStyle(subcat) {
      if (subcat === 'Rental') return { pill: 'bg-sky-100 text-sky-900 border-sky-200' };
      if (subcat === 'Suppliers') return { pill: 'bg-purple-100 text-purple-900 border-purple-200' };
      return { pill: 'bg-amber-100 text-amber-900 border-amber-200' };
    }

    function parseNumericAmount(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const num = parseFloat(String(val || '').replace(/[^0-9.]/g, ''));
      return isNaN(num) ? 0 : num;
    }

    function parseCsvToGrid(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map(l => l.replace(/\r$/, ''))
        .filter(l => l.trim().length > 0);
      if (lines.length === 0) return [];
      if (lines[0].includes('\t')) {
        return lines.map(line => line.split('\t').map(cell => cell.trim()));
      }
      return lines.map(line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      });
    }

    function parseGridRows(rawGrid) {
      const grid = (rawGrid || [])
        .map(row => (Array.isArray(row) ? row.map(c => (c == null ? '' : String(c).trim())) : []))
        .filter(row => row.some(cell => cell !== ''));
      if (grid.length === 0) return [];

      const cleanKey = str => String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const KNOWN = [
        'id', 'dishname', 'dish', 'menuitem', 'category', 'priceperpax', 'price',
        'serviceitemname', 'servicename', 'service', 'itemname', 'item',
        'eventservicescategory', 'subcategory', 'rate', 'billingtype', 'unit',
        'roomno', 'roomnumber', 'room', 'roomtype', 'type', 'ratepernight', 'capacity', 'inclusions'
      ];

      let headerRowIdx = -1;
      for (let r = 0; r < Math.min(3, grid.length); r++) {
        if (grid[r].filter(cell => KNOWN.includes(cleanKey(cell))).length >= 2) {
          headerRowIdx = r;
          break;
        }
      }

      if (headerRowIdx !== -1) {
        const headers = grid[headerRowIdx].map(cleanKey);
        return grid.slice(headerRowIdx + 1).map(cols => {
          const obj = { _cols: cols, _hasHeaders: true };
          headers.forEach((h, i) => {
            if (h) obj[h] = cols[i] ?? '';
          });
          return obj;
        });
      }
      return grid.map(cols => ({ _cols: cols, _hasHeaders: false }));
    }

    function resolveGoogleSheetUrl(rawUrl) {
      const trimmed = String(rawUrl || '').trim();
      if (!trimmed) return { url: '', sheetId: '', gid: '' };

      if (trimmed.includes('/spreadsheets/d/e/')) {
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gidParam = gidMatch ? '&gid=' + gidMatch[1] : '';
        const csvUrl = trimmed.includes('/pubhtml')
          ? trimmed.replace('/pubhtml', '/pub?output=csv' + gidParam)
          : trimmed.includes('output=csv')
          ? trimmed
          : trimmed.replace(/\/pub(\?.*)?$/, '/pub?output=csv' + gidParam);
        return { url: csvUrl, sheetId: '', gid: gidMatch ? gidMatch[1] : '' };
      }

      const sheetMatch =
        trimmed.match(/docs\.google\.com\/spreadsheets\/(?:u\/\d+\/)?d\/(?!e\/)([a-zA-Z0-9-_]+)/) ||
        trimmed.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9-_]+)/);

      if (sheetMatch) {
        const sheetId = sheetMatch[1];
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gid = gidMatch ? gidMatch[1] : '';
        return {
          url: `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv${gid ? '&gid=' + gid : ''}`,
          sheetId,
          gid
        };
      }
      return { url: trimmed, sheetId: '', gid: '' };
    }

    async function fetchSheetRowsUniversal(rawUrl) {
      const resolved = resolveGoogleSheetUrl(rawUrl);
      if (!resolved.url) return { rows: [] };
      let lastErr = '';

      try {
        const sep = resolved.url.includes('?') ? '&' : '?';
        const res = await fetch(`${resolved.url}${sep}_ts=${Date.now()}`);
        if (res.ok) {
          const text = await res.text();
          if (text && !text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
            return { rows: parseGridRows(parseCsvToGrid(text)) };
          }
          lastErr = 'Google Sheet is Restricted. Set Share → Anyone with the link (Viewer).';
        } else {
          lastErr = `HTTP ${res.status}`;
        }
      } catch (e) {
        lastErr = e?.message || 'Network/CORS block';
      }

      if (resolved.sheetId) {
        return await new Promise((resolve, reject) => {
          const cbName = `__eyns_gviz_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
          const script = document.createElement('script');
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('Timed out reading Google Sheet. Set Share → Anyone with the link (Viewer).'));
          }, 10000);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = response => {
            cleanup();
            try {
              if (!response || response.status === 'error') {
                reject(new Error('Google Sheet is Restricted. Set Share → Anyone with the link (Viewer).'));
                return;
              }
              const table = response.table || {};
              const colLabels = (table.cols || []).map(c => (c && c.label ? String(c.label).trim() : ''));
              const dataRows = (table.rows || []).map(r =>
                (r.c || []).map(cell => {
                  if (!cell || cell.v === null || cell.v === undefined) return '';
                  return cell.f != null ? String(cell.f).trim() : String(cell.v).trim();
                })
              );
              const combined = colLabels.some(Boolean) ? [colLabels, ...dataRows] : dataRows;
              resolve({ rows: parseGridRows(combined) });
            } catch (err) {
              reject(err);
            }
          };

          const gidParam = resolved.gid ? `&gid=${resolved.gid}` : '';
          script.src = `https://docs.google.com/spreadsheets/d/${resolved.sheetId}/gviz/tq?tqx=out:json;responseHandler:${cbName}&headers=0${gidParam}`;
          script.onerror = () => {
            cleanup();
            reject(new Error('Google Sheet is Restricted or unreachable. Set Share → Anyone with the link (Viewer).'));
          };
          document.head.appendChild(script);
        });
      }

      throw new Error(`Could not connect (${lastErr}). Paste a valid Google Sheet link.`);
    }

      const [packedTotalDays, setPackedTotalDays] = useState(1);
      const [activePackedDay, setActivePackedDay] = useState(1);
      const [packedMealBatches, setPackedMealBatches] = useState(() => [
        createDefaultPackedBatch(1, addDaysToIsoDate(new Date().toISOString().split('T')[0], 14), 'Lunch')
      ]);
      const [activePackedBatchId, setActivePackedBatchId] = useState(() => packedMealBatches[0]?.id || '');

      // Step 4: Event Services & Rentals
      const [serviceSubcategoryFilter, setServiceSubcategoryFilter] = useState('All');
      const [serviceSearchQuery, setServiceSearchQuery] = useState('');
      const [selectedServiceLines, setSelectedServiceLines] = useState([]);
      const [showCustomServiceForm, setShowCustomServiceForm] = useState(false);
      const [customServiceName, setCustomServiceName] = useState('');
      const [customServiceCategory, setCustomServiceCategory] = useState('Catering');
      const [customServiceBilling, setCustomServiceBilling] = useState('fixed');
      const [customServicePrice, setCustomServicePrice] = useState('');

      // Step 5: Hotel Rooms (with Check-In & Check-Out Dates)
      const [roomBookingsMap, setRoomBookingsMap] = useState({});

      // Step 6: Discounts, Taxes & Payments
      const [discountLabel, setDiscountLabel] = useState('Promo / Management Discount');
      const [discountAmount, setDiscountAmount] = useState(0);
      const [taxRatePercent, setTaxRatePercent] = useState(0);
      const [payments, setPayments] = useState([]);
      const [newPayDate, setNewPayDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [newPayMethod, setNewPayMethod] = useState('GCash / Bank Transfer');
      const [newPayRef, setNewPayRef] = useState('');
      const [newPayAmount, setNewPayAmount] = useState('');

      // Final Section: PO / LGU Tracking
      const [isPoOpen, setIsPoOpen] = useState(false);
      const [poNumber, setPoNumber] = useState('');
      const [poApprovedBudget, setPoApprovedBudget] = useState('');
      const [poNotes, setPoNotes] = useState('');

      // =======================================================================
      // 5. VISIBILITY & DYNAMIC STEP NUMBERING
      // =======================================================================
      const showPackageStep = bookingCategory === 'celebration';
      const showMenuStep = bookingCategory !== 'rental';
      const showRoomsStep = bookingCategory === 'celebration' || bookingCategory === 'seminar';
      const showPoStep = bookingCategory !== 'rental';

      const stepNumbers = useMemo(() => {
        let num = 1;
        const map = { client: num++ };
        if (showPackageStep) map.package = num++;
        if (showMenuStep) map.menu = num++;
        map.services = num++;
        if (showRoomsStep) map.rooms = num++;
        map.payments = num++;
        map.terms = num++;
        return map;
      }, [showPackageStep, showMenuStep, showRoomsStep]);

      const rentalDurationDays = useMemo(
        () => computeDaysBetweenDates(eventDate, rentalReturnDate),
        [eventDate, rentalReturnDate]
      );

      const getSeminarDateForDay = dayNum => {
        if (seminarDayDates[dayNum]) return seminarDayDates[dayNum];
        return addDaysToIsoDate(eventDate, (dayNum - 1) * 7);
      };

      const seminarScheduleSummary = useMemo(() => {
        if (bookingCategory !== 'seminar') return { datesList: [], avgOrRangePax: '', totalDayPax: 0 };
        const days = Array.from({ length: Math.max(1, eventDays) }, (_, i) => i + 1);
        const datesList = days.map(d => getSeminarDateForDay(d));
        const paxList = days.map(d => Math.max(1, Number(dayPaxOverrides[d]) || 50));
        const minP = Math.min(...paxList);
        const maxP = Math.max(...paxList);
        const totalDayPax = paxList.reduce((s, p) => s + p, 0);
        return {
          datesList,
          avgOrRangePax: minP === maxP ? `${minP} Pax/day` : `${minP}–${maxP} Pax/day`,
          totalDayPax
        };
      }, [bookingCategory, eventDays, seminarDayDates, eventDate, dayPaxOverrides]);

      const showToast = msg => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(prev => (prev === msg ? null : prev)), 3800);
      };

      // =======================================================================
      // 6. PERSISTENCE & 3-SHEET LIVE GOOGLE SHEETS SYNC
      // =======================================================================
      useEffect(() => {
        menuSheetUrlRef.current = menuSheetUrl;
        persistSavedString(STORAGE_KEYS.MENU_SCRIPT_URL, LEGACY_MENU_URL_KEYS, menuSheetUrl);
      }, [menuSheetUrl]);

      useEffect(() => {
        servicesSheetUrlRef.current = servicesSheetUrl;
        persistSavedString(STORAGE_KEYS.SERVICES_SCRIPT_URL, LEGACY_SERVICE_URL_KEYS, servicesSheetUrl);
      }, [servicesSheetUrl]);

      useEffect(() => {
        roomsSheetUrlRef.current = roomsSheetUrl;
        persistSavedString(STORAGE_KEYS.ROOMS_SCRIPT_URL, LEGACY_ROOM_URL_KEYS, roomsSheetUrl);
      }, [roomsSheetUrl]);

      useEffect(() => {
        try {
          if (serviceItems.length > 0) localStorage.setItem(STORAGE_KEYS.SERVICE_ITEMS, JSON.stringify(serviceItems));
          if (menuItems.length > 0) localStorage.setItem(STORAGE_KEYS.MENU_ITEMS, JSON.stringify(menuItems));
          if (roomCatalog.length > 0) localStorage.setItem(STORAGE_KEYS.ROOM_ITEMS, JSON.stringify(roomCatalog));
          localStorage.setItem(STORAGE_KEYS.SAVED_QUOTES, JSON.stringify(savedQuotes));
          localStorage.setItem(STORAGE_KEYS.BUSINESS_PROFILE, JSON.stringify(businessProfile));
        } catch (e) {}
      }, [serviceItems, menuItems, roomCatalog, savedQuotes, businessProfile]);

      async function syncAllSheets(overrideMenu, overrideServices, overrideRooms, silent = false) {
        if (isSyncingRef.current && silent) return;
        const targetMenu = (overrideMenu !== undefined ? overrideMenu : menuSheetUrl).trim();
        const targetServices = (overrideServices !== undefined ? overrideServices : servicesSheetUrl).trim();
        const targetRooms = (overrideRooms !== undefined ? overrideRooms : roomsSheetUrl).trim();

        isSyncingRef.current = true;
        setIsSyncingSheets(true);
        const nextDiag = { menu: '', menuOk: false, services: '', servicesOk: false, rooms: '', roomsOk: false };
        let mCount = 0;
        let sCount = 0;
        let rCount = 0;

        await Promise.all([
          (async () => {
            if (!targetMenu) return;
            try {
              const { rows } = await fetchSheetRowsUniversal(targetMenu);
              const parsed = rows
                .map((row, idx) => {
                  const cols = row._cols || [];
                  const name = row.dishname || row.dish || row.menuitem || row.name || cols[1] || '';
                  if (!name) return null;
                  const lower = String(name).trim().toLowerCase();
                  if (lower === 'dish name' || lower === 'dish' || lower === 'name' || lower === 'id') return null;
                  return {
                    id: String(row.id || cols[0] || `menu_sheet_${idx + 1}`).trim(),
                    category: String(row.category || cols[2] || 'Main Course').trim(),
                    name: String(name).trim(),
                    price: parseNumericAmount(row.priceperpax ?? row.price ?? row.rate ?? cols[3] ?? 0),
                    unit: 'per_pax'
                  };
                })
                .filter(Boolean);
              if (parsed.length > 0) {
                setMenuItems(parsed);
                mCount = parsed.length;
                nextDiag.menuOk = true;
                nextDiag.menu = `Connected! Synced ${parsed.length} dishes.`;
              } else {
                nextDiag.menu = 'Connected, but 0 dishes matched Row 1: ID | Dish Name | Category | Price Per Pax';
              }
            } catch (err) {
              nextDiag.menu = err.message;
            }
          })(),
          (async () => {
            if (!targetServices) return;
            try {
              const { rows } = await fetchSheetRowsUniversal(targetServices);
              const parsed = rows
                .map((row, idx) => {
                  const cols = row._cols || [];
                  const hasId = row.id !== undefined || cols.length >= 6 || /^(srv|svc|id)?[-_#]?\d+$/i.test(String(cols[0] || ''));
                  const name = row.serviceitemname || row.servicename || row.service || row.itemname || row.item || row.name || (hasId ? cols[1] : cols[0]) || '';
                  if (!name) return null;
                  const lower = String(name).trim().toLowerCase();
                  if (lower === 'service / item name' || lower === 'service item name' || lower === 'id') return null;
                  return {
                    id: String(row.id || (hasId ? cols[0] : '') || `srv_sheet_${idx + 1}`).trim(),
                    name: String(name).trim(),
                    subcategory: normalizeServiceSubcategory(row.eventservicescategory || row.category || row.subcategory || (hasId ? cols[2] : cols[1]) || 'Catering'),
                    price: parseNumericAmount(row.rate ?? row.price ?? row.amount ?? (hasId ? cols[3] : cols[2]) ?? 0),
                    billingType: normalizeBillingType(row.billingtype || row.unit || (hasId ? cols[4] : cols[3]) || 'per_piece'),
                    description: String(row.description || '').trim()
                  };
                })
                .filter(Boolean);
              if (parsed.length > 0) {
                setServiceItems(parsed);
                sCount = parsed.length;
                nextDiag.servicesOk = true;
                nextDiag.services = `Connected! Synced ${parsed.length} items.`;
              } else {
                nextDiag.services = 'Connected, but 0 rows matched Row 1: ID | Service / Item Name | Event Services Category | Rate | Billing Type';
              }
            } catch (err) {
              nextDiag.services = err.message;
            }
          })(),
          (async () => {
            if (!targetRooms) return;
            try {
              const { rows } = await fetchSheetRowsUniversal(targetRooms);
              const parsed = rows
                .map((row, idx) => {
                  const cols = row._cols || [];
                  const roomNo = row.roomno || row.roomnumber || row.room || cols[1] || '';
                  const roomType = row.roomtype || row.type || cols[2] || '';
                  const label = String(roomNo || roomType).trim();
                  if (!label) return null;
                  const lower = label.toLowerCase();
                  if (lower === 'room no' || lower === 'room number' || lower === 'id' || lower === 'room type') return null;
                  return {
                    id: String(row.id || cols[0] || `room_sheet_${idx + 1}`).trim(),
                    roomNo: String(roomNo || `Room ${idx + 1}`).trim(),
                    type: String(roomType || 'Standard Room').trim(),
                    rate: parseNumericAmount(row.ratepernight ?? row.rate ?? row.price ?? cols[3] ?? 0),
                    capacity: String(row.capacity || cols[4] || '2 Pax').trim(),
                    inclusions: String(row.inclusions || cols[5] || '').trim()
                  };
                })
                .filter(Boolean);
              if (parsed.length > 0) {
                setRoomCatalog(parsed);
                rCount = parsed.length;
                nextDiag.roomsOk = true;
                nextDiag.rooms = `Connected! Synced ${parsed.length} rooms.`;
              } else {
                nextDiag.rooms = 'Connected, but 0 rooms matched Row 1: ID | Room No | Room Type | Rate Per Night | Capacity | Inclusions';
              }
            } catch (err) {
              nextDiag.rooms = err.message;
            }
          })()
        ]);

        setSyncDiagnostics(nextDiag);
        setLastSyncTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        isSyncingRef.current = false;
        setIsSyncingSheets(false);

        if (!silent) {
          if (mCount > 0 || sCount > 0 || rCount > 0) {
            showToast(`Synced: ${mCount} Dishes, ${sCount} Services, ${rCount} Rooms!`);
          } else {
            showToast(nextDiag.menu || nextDiag.services || nextDiag.rooms || 'Check your sheet links.');
          }
        }
      }

      useEffect(() => {
        if (menuSheetUrl || servicesSheetUrl || roomsSheetUrl) {
          syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, true);
        }
      }, []);

      useEffect(() => {
        if (!autoSyncEnabled) return;
        const run = () => {
          if ((menuSheetUrlRef.current || servicesSheetUrlRef.current || roomsSheetUrlRef.current) && !isSyncingRef.current) {
            syncAllSheets(menuSheetUrlRef.current, servicesSheetUrlRef.current, roomsSheetUrlRef.current, true);
          }
        };
        const timer = setInterval(run, 20000);
        const onVis = () => {
          if (document.visibilityState === 'visible') run();
        };
        window.addEventListener('focus', run);
        document.addEventListener('visibilitychange', onVis);
        return () => {
          clearInterval(timer);
          window.removeEventListener('focus', run);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [autoSyncEnabled]);

      // =======================================================================
      // 7. PACKAGE, SEMINAR MEALS, PACKED MEALS, SERVICES & ROOMS LOGIC
      // =======================================================================
      const availablePackages = useMemo(() => {
        if (bookingCategory === 'seminar') {
          return PACKAGES.filter(p => p.id === 'seminar_custom' || p.id === 'from_scratch' || isTieredAllInclusivePackage(p.id));
        }
        return PACKAGES.filter(p => p.id !== 'seminar_custom');
      }, [bookingCategory]);

      const selectedPackage = useMemo(
        () => PACKAGES.find(p => p.id === selectedPackageId) || availablePackages[0] || PACKAGES[0],
        [selectedPackageId, availablePackages]
      );

      const packageBreakdown = useMemo(() => {
        if (!showPackageStep) {
          return {
            tierPax: 0,
            effectivePax: Number(paxCount) || 1,
            basePrice: 0,
            excessPax: 0,
            excessRate: 0,
            excessCharge: 0,
            grossPackageTotal: 0,
            buffetPlan: SAMPLE_BUFFET_MENUS[0],
            isCustomReplaced: false,
            menuUpgradeAddon: 0,
            customMenuCredit: 0,
            total: 0
          };
        }
        if (isTieredAllInclusivePackage(selectedPackage.id)) {
          return calculateTieredPackageBreakdown(selectedPackage, selectedTierPax, paxCount, excessRatePerPax, selectedBuffetMenuId);
        }
        const flat = Math.max(0, Number(customBaseFee) || 0);
        return {
          tierPax: 0,
          effectivePax: Number(paxCount) || 1,
          basePrice: flat,
          excessPax: 0,
          excessRate: 0,
          excessCharge: 0,
          grossPackageTotal: flat,
          buffetPlan: SAMPLE_BUFFET_MENUS[0],
          isCustomReplaced: false,
          menuUpgradeAddon: 0,
          customMenuCredit: 0,
          total: flat
        };
      }, [showPackageStep, selectedPackage, selectedTierPax, paxCount, excessRatePerPax, customBaseFee, selectedBuffetMenuId]);

      const isCustomReplacedMenu =
        showPackageStep &&
        isTieredAllInclusivePackage(selectedPackage.id) &&
        selectedPackage.foodIncluded &&
        selectedBuffetMenuId === 'custom_menu';

      const effectiveDayForBuilder = bookingCategory === 'seminar' ? activeScheduleDay : 1;
      const getPaxForDay = dayNum =>
        bookingCategory === 'seminar'
          ? Math.max(1, Number(dayPaxOverrides[dayNum]) || 50)
          : Math.max(1, Number(paxCount) || 1);

      const activeDaySeminarMeals = useMemo(() => {
        const list = seminarDayMealsMap[activeScheduleDay];
        return Array.isArray(list) && list.length > 0 ? list : ['AM Snack', 'Lunch', 'PM Snack'];
      }, [seminarDayMealsMap, activeScheduleDay]);

      useEffect(() => {
        if (bookingCategory === 'seminar' && !activeDaySeminarMeals.includes(activeSeminarMealSlot)) {
          setActiveSeminarMealSlot(activeDaySeminarMeals[0]);
        }
      }, [bookingCategory, activeDaySeminarMeals, activeSeminarMealSlot]);

      const handleToggleSeminarMealPeriod = (dayNum, periodId) => {
        setSeminarDayMealsMap(prev => {
          const current = prev[dayNum] || ['AM Snack', 'Lunch', 'PM Snack'];
          const exists = current.includes(periodId);
          let next;
          if (exists) {
            if (current.length <= 1) {
              showToast('At least one meal period must stay checked for the day.');
              return prev;
            }
            next = current.filter(p => p !== periodId);
            if (activeSeminarMealSlot === periodId) {
              setActiveSeminarMealSlot(next[0]);
            }
          } else {
            const order = MEAL_PERIOD_OPTIONS.map(m => m.id);
            next = [...current, periodId].sort((a, b) => order.indexOf(a) - order.indexOf(b));
            setActiveSeminarMealSlot(periodId);
          }
          return { ...prev, [dayNum]: next };
        });
      };

      const handleBookingCategoryChange = nextCat => {
        setBookingCategory(nextCat);
        if (nextCat === 'rental') {
          setDocType('Rental Agreement');
          setSelectedPackageId('from_scratch');
          setCustomBaseFee(0);
          setOccasion('Equipment / Venue Rental');
          setServiceSubcategoryFilter('Rental');
          setCustomServiceCategory('Rental');
          setRentalReturnDate(addDaysToIsoDate(eventDate, 1));
          setEventVenue('Client Location / Pick-up at EYNS');
        } else if (nextCat === 'packed_meals') {
          setDocType('Quotation');
          setSelectedPackageId('from_scratch');
          setCustomBaseFee(0);
          setOccasion('Packed Meals Order');
          setServiceSubcategoryFilter('All');
          setCustomServiceCategory('Catering');
          setEventVenue('Delivery / Pick-up at EYNS Restaurant');
          if (packedMealBatches.length === 0) {
            const fresh = createDefaultPackedBatch(1, eventDate, 'Lunch');
            setPackedMealBatches([fresh]);
            setActivePackedBatchId(fresh.id);
          }
        } else if (nextCat === 'seminar') {
          setDocType('Quotation');
          setSelectedPackageId('seminar_custom');
          setCustomBaseFee(0);
          setOccasion('Seminar / Workshop / LGU Training');
          setServiceSubcategoryFilter('All');
          setCustomServiceCategory('Catering');
          setEventVenue('Eyns Air-Conditioned Function Hall');
          setDayPaxOverrides(prev => (Object.keys(prev).length > 0 ? prev : { 1: 50 }));
        } else {
          setDocType('Quotation');
          const safePax = Math.max(50, Number(paxCount) || 100);
          setPaxCount(safePax);
          setSelectedPackageId('pkg_essential');
          setSelectedTierPax(getAutoTierForPax(safePax));
          setSelectedBuffetMenuId('menu_a');
          setOccasion('Wedding Reception');
          setServiceSubcategoryFilter('All');
          setCustomServiceCategory('Catering');
          setEventVenue('Eyns Air-Conditioned Venue (4 Hours)');
        }
      };

      const handlePaxChange = rawVal => {
        const parsed = Math.max(1, parseInt(rawVal, 10) || 1);
        setPaxCount(parsed);
        if (showPackageStep && isTieredAllInclusivePackage(selectedPackage.id)) {
          setSelectedTierPax(getAutoTierForPax(parsed));
        }
      };

      const handlePackageChange = pkgId => {
        setSelectedPackageId(pkgId);
        const pkg = PACKAGES.find(p => p.id === pkgId);
        if (!pkg) return;
        if (isTieredAllInclusivePackage(pkg.id)) {
          const safePax = Math.max(50, Number(paxCount) || 50);
          setPaxCount(safePax);
          setSelectedTierPax(getAutoTierForPax(safePax));
        } else {
          setCustomBaseFee(pkg.flatPrice || 0);
        }
        setEventVenue(pkg.venue);
      };

      const handleNewQuotationReset = () => {
        setDocNumber(generateDocNumber());
        setQuoteStatus('Draft');
        setClientName('');
        setClientOrg('');
        setClientContact('');
        setEventMotif('');
        setSpecialNotes('');
        setSelectedMenuLines([]);
        setSelectedBuffetMenuId('menu_a');
        setSeminarDayMealsMap({ 1: ['AM Snack', 'Lunch', 'PM Snack'] });
        setSeminarSlotTimes({});
        setSeminarDayDates({});
        setDayPaxOverrides({ 1: 50 });
        const freshBatch = createDefaultPackedBatch(1, eventDate, 'Lunch');
        setPackedTotalDays(1);
        setActivePackedDay(1);
        setPackedMealBatches([freshBatch]);
        setActivePackedBatchId(freshBatch.id);
        setSelectedServiceLines([]);
        setRoomBookingsMap({});
        setDiscountAmount(0);
        setPayments([]);
        setPoNumber('');
        setPoApprovedBudget('');
        setPoNotes('');
        setPreviewMode('client');
        showToast('Started a fresh quotation!');
      };

      // A La Carte Dish Handlers (with per-dish Pax count & Seminar Meal Period)
      const handleAddAlaCarteDish = dish => {
        const mealSlot = bookingCategory === 'seminar' ? activeSeminarMealSlot : '';
        const lineKey = bookingCategory === 'seminar'
          ? `${effectiveDayForBuilder}__${mealSlot}__${dish.id}`
          : `${effectiveDayForBuilder}__${dish.id}`;
        if (selectedMenuLines.some(i => i.key === lineKey)) {
          showToast(
            bookingCategory === 'seminar'
              ? `"${dish.name}" is already in Day ${effectiveDayForBuilder} ${mealSlot}.`
              : `"${dish.name}" is already in your menu list.`
          );
          return;
        }
        setSelectedMenuLines(prev => [
          ...prev,
          {
            key: lineKey,
            day: effectiveDayForBuilder,
            mealSlot,
            allDays: false,
            id: dish.id,
            name: dish.name,
            category: dish.category || 'Main Course',
            price: Number(dish.price) || 0,
            customPax: null
          }
        ]);
        showToast(
          bookingCategory === 'seminar'
            ? `Added "${dish.name}" to Day ${effectiveDayForBuilder} (${mealSlot}).`
            : `Added "${dish.name}".`
        );
      };

      const handleUpdateMenuLinePax = (lineKey, nextPax) => {
        const cleanPax = Math.max(1, Number(nextPax) || 1);
        setSelectedMenuLines(prev =>
          prev.map(i => (i.key === lineKey ? { ...i, customPax: cleanPax } : i))
        );
      };

      const handleResetMenuLinePax = lineKey => {
        setSelectedMenuLines(prev =>
          prev.map(i => (i.key === lineKey ? { ...i, customPax: null } : i))
        );
      };

      const handleToggleMenuLineAllDays = lineKey => {
        setSelectedMenuLines(prev =>
          prev.map(i => (i.key === lineKey ? { ...i, allDays: !i.allDays } : i))
        );
      };

      const handleRemoveMenuLine = lineKey => {
        setSelectedMenuLines(prev => prev.filter(i => i.key !== lineKey));
      };

      const handleAddQuickCustomDish = e => {
        e.preventDefault();
        const trimmedName = quickDishName.trim();
        if (!trimmedName) return;
        const dishObj = {
          id: `custom_dish_${Date.now()}`,
          name: trimmedName,
          category: quickDishCategory || 'Main Course',
          price: Math.max(0, parseNumericAmount(quickDishPrice)),
          unit: 'per_pax'
        };
        setMenuItems(prev => [dishObj, ...prev]);
        handleAddAlaCarteDish(dishObj);
        setQuickDishName('');
        setQuickDishPrice('');
        setShowQuickNewDishInStep3(false);
      };

      // Packed Meals Multi-Day & Multi-Batch Handlers
      const activeDayPackedBatches = useMemo(
        () => packedMealBatches.filter(b => (Number(b.day) || 1) === activePackedDay),
        [packedMealBatches, activePackedDay]
      );

      useEffect(() => {
        if (bookingCategory === 'packed_meals' && activeDayPackedBatches.length > 0) {
          if (!activeDayPackedBatches.some(b => b.id === activePackedBatchId)) {
            setActivePackedBatchId(activeDayPackedBatches[0].id);
          }
        }
      }, [bookingCategory, activeDayPackedBatches, activePackedBatchId]);

      const activePackedBatch = useMemo(
        () => activeDayPackedBatches.find(b => b.id === activePackedBatchId) || activeDayPackedBatches[0] || null,
        [activeDayPackedBatches, activePackedBatchId]
      );

      const handleSetPackedTotalDaysCount = desiredDays => {
        const targetDays = Math.max(1, Math.min(30, Number(desiredDays) || 1));
        setPackedTotalDays(targetDays);
        if (activePackedDay > targetDays) setActivePackedDay(targetDays);
        setPackedMealBatches(prev => {
          let next = [...prev];
          for (let d = 1; d <= targetDays; d++) {
            if (!next.some(b => (Number(b.day) || 1) === d)) {
              const dayDate = addDaysToIsoDate(eventDate, d - 1);
              next.push({
                ...createDefaultPackedBatch(1, dayDate, 'Lunch'),
                day: d,
                date: dayDate
              });
            }
          }
          return next;
        });
      };

      const handleSetDayMealsCount = (dayNum, desiredCount) => {
        const target = Math.max(1, Math.min(20, Number(desiredCount) || 1));
        const dayDate = addDaysToIsoDate(eventDate, dayNum - 1);
        const mealCycle = ['Lunch', 'AM Snack', 'PM Snack', 'Breakfast', 'Dinner'];
        setPackedMealBatches(prev => {
          const otherDays = prev.filter(b => (Number(b.day) || 1) !== dayNum);
          const dayList = prev.filter(b => (Number(b.day) || 1) === dayNum);
          let updatedDay = [...dayList];
          if (target > updatedDay.length) {
            for (let i = updatedDay.length; i < target; i++) {
              const mType = mealCycle[i % mealCycle.length];
              updatedDay.push({
                ...createDefaultPackedBatch(i + 1, dayDate, mType),
                day: dayNum,
                date: dayDate
              });
            }
          } else if (target < updatedDay.length) {
            updatedDay = updatedDay.slice(0, target);
          }
          updatedDay = updatedDay.map((b, idx) => ({ ...b, day: dayNum, label: `Packed Meal ${idx + 1}` }));
          return [...otherDays, ...updatedDay];
        });
      };

      const handleUpdatePackedMealBatch = (batchId, patch) => {
        setPackedMealBatches(prev => prev.map(b => (b.id === batchId ? { ...b, ...patch } : b)));
      };

      const handleToggleDishInPackedBatch = (batchId, dish) => {
        setPackedMealBatches(prev =>
          prev.map(b => {
            if (b.id !== batchId) return b;
            const exists = b.dishes.some(d => d.id === dish.id);
            const nextDishes = exists
              ? b.dishes.filter(d => d.id !== dish.id)
              : [...b.dishes, { id: dish.id, name: dish.name, category: dish.category, price: Number(dish.price) || 0 }];
            return { ...b, dishes: nextDishes };
          })
        );
      };

      // Event Services & Rentals Handlers
      const handleToggleServiceItem = srv => {
        const lineKey = `${effectiveDayForBuilder}__${srv.id}`;
        setSelectedServiceLines(prev => {
          if (prev.some(i => i.key === lineKey)) return prev.filter(i => i.key !== lineKey);
          return [
            ...prev,
            {
              key: lineKey,
              day: effectiveDayForBuilder,
              allDays: false,
              id: srv.id,
              name: srv.name,
              subcategory: srv.subcategory || 'Catering',
              price: Number(srv.price) || 0,
              billingType: srv.billingType || 'per_piece',
              description: srv.description || '',
              qty: 1
            }
          ];
        });
      };

      const handleUpdateServiceLineQty = (lineKey, nextQty) => {
        const cleanQty = Number(nextQty) || 0;
        setSelectedServiceLines(prev =>
          cleanQty <= 0 ? prev.filter(i => i.key !== lineKey) : prev.map(i => (i.key === lineKey ? { ...i, qty: cleanQty } : i))
        );
      };

      const handleToggleServiceLineAllDays = lineKey => {
        setSelectedServiceLines(prev =>
          prev.map(i => (i.key === lineKey ? { ...i, allDays: !i.allDays } : i))
        );
      };

      const handleAddCustomServiceLine = e => {
        e.preventDefault();
        if (!customServiceName.trim()) return;
        const uniqueId = `custom_srv_${Date.now()}`;
        setSelectedServiceLines(prev => [
          ...prev,
          {
            key: `${effectiveDayForBuilder}__${uniqueId}`,
            day: effectiveDayForBuilder,
            allDays: false,
            id: uniqueId,
            name: customServiceName.trim(),
            subcategory: bookingCategory === 'rental' ? 'Rental' : customServiceCategory,
            price: parseNumericAmount(customServicePrice),
            billingType: customServiceBilling,
            description: '',
            qty: 1
          }
        ]);
        setCustomServiceName('');
        setCustomServicePrice('');
        setShowCustomServiceForm(false);
        showToast(bookingCategory === 'rental' ? 'Custom rental item added.' : 'Custom service line added.');
      };

      // Hotel Room Booking Handlers (with Check-In & Check-Out Dates)
      const handleUpdateRoomBooking = (roomId, patch) => {
        setRoomBookingsMap(prev => {
          const defaultCheckIn = eventDate || new Date().toISOString().split('T')[0];
          const existing = prev[roomId] || {
            nights: 0,
            checkIn: defaultCheckIn,
            checkOut: addDaysToIsoDate(defaultCheckIn, 1)
          };
          const merged = { ...existing, ...patch };
          if (patch.nights !== undefined) {
            const n = Math.max(0, Number(patch.nights) || 0);
            if (n <= 0) {
              const copy = { ...prev };
              delete copy[roomId];
              return copy;
            }
            merged.nights = n;
            merged.checkOut = addDaysToIsoDate(merged.checkIn, n);
          } else if (patch.checkIn !== undefined || patch.checkOut !== undefined) {
            if (merged.checkIn && merged.checkOut) {
              const computedNights = computeDaysBetweenDates(merged.checkIn, merged.checkOut);
              merged.nights = computedNights;
              if (merged.checkOut <= merged.checkIn) {
                merged.checkOut = addDaysToIsoDate(merged.checkIn, 1);
                merged.nights = 1;
              }
            }
          }
          return { ...prev, [roomId]: merged };
        });
      };

      // =======================================================================
      // 8. FINANCIAL CALCULATIONS
      // =======================================================================
      const computedMenuSummary = useMemo(() => {
        if (!showMenuStep || bookingCategory === 'packed_meals') {
          return { lines: [], netMenuTotal: 0 };
        }
        const lines = selectedMenuLines.map(line => {
          const activeDays = bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : 1;
          const baseDayPax = getPaxForDay(line.day);
          const effectivePax = line.customPax !== null && line.customPax !== undefined ? Math.max(1, Number(line.customPax) || 1) : baseDayPax;
          const isCustomVipPax = line.customPax !== null && line.customPax !== undefined && effectivePax !== baseDayPax;
          const lineTotal = line.price * effectivePax * activeDays;
          return { ...line, baseDayPax, effectivePax, isCustomVipPax, activeDays, lineTotal };
        });
        const netMenuTotal = lines.reduce((s, l) => s + l.lineTotal, 0);
        return { lines, netMenuTotal };
      }, [showMenuStep, bookingCategory, selectedMenuLines, eventDays, dayPaxOverrides, paxCount]);

      const computedPackedMealsSummary = useMemo(() => {
        if (bookingCategory !== 'packed_meals') {
          return { batches: [], totalPacks: 0, totalAmount: 0 };
        }
        const visibleBatches = packedMealBatches.filter(b => (Number(b.day) || 1) <= packedTotalDays);
        const batches = visibleBatches.map((b, idx) => {
          const dayNum = Number(b.day) || 1;
          const dishRateSum = (b.dishes || []).reduce((s, d) => s + (Number(d.price) || 0), 0);
          const hasCustomRate = b.customRatePerPack !== null && b.customRatePerPack !== '' && !isNaN(Number(b.customRatePerPack));
          const effectiveRatePerPack = hasCustomRate ? Math.max(0, Number(b.customRatePerPack)) : dishRateSum;
          const packs = Math.max(1, Number(b.packs) || 1);
          const batchTotal = effectiveRatePerPack * packs;
          return {
            ...b,
            dayNum,
            displayTitle: `Day ${dayNum} — ${b.label || `Packed Meal ${idx + 1}`} (${b.mealType || 'Lunch'})`,
            dishRateSum,
            effectiveRatePerPack,
            packs,
            batchTotal
          };
        });
        return {
          batches,
          totalPacks: batches.reduce((s, b) => s + b.packs, 0),
          totalAmount: batches.reduce((s, b) => s + b.batchTotal, 0)
        };
      }, [bookingCategory, packedMealBatches, packedTotalDays]);

      const computedServiceLines = useMemo(() => {
        const pool = bookingCategory === 'rental'
          ? selectedServiceLines.filter(l => l.subcategory === 'Rental')
          : selectedServiceLines;
        return pool.map(line => {
          const activeDays = bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : 1;
          const dayPax = getPaxForDay(line.day);
          let lineTotal = 0;
          if (line.billingType === 'per_pax') {
            lineTotal = line.price * dayPax * line.qty * activeDays;
          } else if (line.billingType === 'per_day') {
            const multDays = bookingCategory === 'rental'
              ? rentalDurationDays * line.qty
              : (bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) * line.qty : line.qty);
            lineTotal = line.price * multDays;
          } else if (line.billingType === 'fixed') {
            lineTotal = line.price * line.qty;
          } else {
            lineTotal = line.price * line.qty * activeDays;
          }
          return { ...line, dayPax, lineTotal };
        });
      }, [selectedServiceLines, bookingCategory, eventDays, rentalDurationDays, dayPaxOverrides, paxCount]);

      const servicesSubtotal = useMemo(
        () => computedServiceLines.reduce((s, l) => s + l.lineTotal, 0),
        [computedServiceLines]
      );

      const selectedRoomsList = useMemo(() => {
        if (!showRoomsStep) return [];
        return roomCatalog
          .filter(r => (Number(roomBookingsMap[r.id]?.nights) || 0) > 0)
          .map(r => {
            const booking = roomBookingsMap[r.id];
            const nights = Number(booking.nights) || 0;
            return {
              ...r,
              nights,
              checkIn: booking.checkIn || eventDate,
              checkOut: booking.checkOut || addDaysToIsoDate(eventDate, nights),
              total: r.rate * nights
            };
          });
      }, [showRoomsStep, roomCatalog, roomBookingsMap, eventDate]);

      const roomsSubtotal = useMemo(
        () => selectedRoomsList.reduce((s, r) => s + r.total, 0),
        [selectedRoomsList]
      );

      const totals = useMemo(() => {
        const foodSubtotal = bookingCategory === 'packed_meals' ? computedPackedMealsSummary.totalAmount : computedMenuSummary.netMenuTotal;
        const subtotal = packageBreakdown.total + foodSubtotal + servicesSubtotal + roomsSubtotal;
        const discount = Math.max(0, Number(discountAmount) || 0);
        const taxable = Math.max(0, subtotal - discount);
        const taxAmount = taxable * ((Number(taxRatePercent) || 0) / 100);
        const deposit = bookingCategory === 'rental' ? Math.max(0, Number(securityDeposit) || 0) : 0;
        const grandTotal = taxable + taxAmount + deposit;
        const totalPaid = payments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
        return {
          subtotal,
          discount,
          taxAmount,
          deposit,
          grandTotal,
          totalPaid,
          balanceDue: Math.max(0, grandTotal - totalPaid)
        };
      }, [packageBreakdown, bookingCategory, computedPackedMealsSummary, computedMenuSummary, servicesSubtotal, roomsSubtotal, discountAmount, taxRatePercent, securityDeposit, payments]);

      const todayIsoDate = useMemo(() => new Date().toISOString().split('T')[0], []);
      const quoteValidUntilDate = useMemo(
        () => addDaysToIsoDate(todayIsoDate, Math.max(1, Number(quoteValidDays) || 15)),
        [todayIsoDate, quoteValidDays]
      );
      const effectivePerHeadCost = useMemo(() => {
        if (bookingCategory === 'rental') return 0;
        if (bookingCategory === 'packed_meals') {
          return totals.grandTotal / Math.max(1, computedPackedMealsSummary.totalPacks);
        }
        if (bookingCategory === 'seminar') {
          return totals.grandTotal / Math.max(1, seminarScheduleSummary.totalDayPax);
        }
        return totals.grandTotal / Math.max(1, Number(paxCount) || 1);
      }, [bookingCategory, paxCount, computedPackedMealsSummary.totalPacks, seminarScheduleSummary.totalDayPax, totals.grandTotal]);

      // =======================================================================
      // 9. SAVED QUOTES, CHAT COPY, PAYMENTS & JPEG EXPORT
      // =======================================================================
      const handleSaveCurrentQuoteToLog = () => {
        const record = {
          id: docNumber,
          savedAt: new Date().toLocaleString(),
          bookingCategory, docType, quoteStatus, quoteValidDays, docNumber,
          clientName: clientName || 'Walk-In Client',
          clientOrg, clientContact, occasion, eventMotif, specialNotes,
          showInclusionsOnPrint, showPaymentTermsOnPrint,
          eventVenue, eventDate, rentalReturnDate, eventTime, paxCount, eventDays,
          securityDeposit, rentalTermsText,
          selectedPackageId, selectedTierPax, excessRatePerPax, customBaseFee, selectedBuffetMenuId,
          seminarDayMealsMap, seminarSlotTimes, seminarDayDates, dayPaxOverrides,
          selectedMenuLines, packedTotalDays, packedMealBatches,
          selectedServiceLines, roomBookingsMap,
          discountLabel, discountAmount, taxRatePercent, payments,
          poNumber, poApprovedBudget, poNotes,
          grandTotal: totals.grandTotal, balanceDue: totals.balanceDue
        };
        setSavedQuotes(prev => [record, ...prev.filter(q => q.docNumber !== docNumber)].slice(0, 60));
        showToast(`Saved ${docNumber} (${record.clientName}) to Quotes Log!`);
      };

      const handleLoadSavedQuote = (q, asDuplicate = false) => {
        setBookingCategory(q.bookingCategory || 'celebration');
        setDocType(q.docType || 'Quotation');
        setQuoteStatus(asDuplicate ? 'Draft' : q.quoteStatus || 'Draft');
        setQuoteValidDays(q.quoteValidDays ?? 15);
        setDocNumber(asDuplicate ? generateDocNumber() : q.docNumber || generateDocNumber());
        setClientName(q.clientName || '');
        setClientOrg(q.clientOrg || '');
        setClientContact(q.clientContact || '');
        setOccasion(q.occasion || '');
        setEventMotif(q.eventMotif || '');
        setSpecialNotes(q.specialNotes || '');
        setShowInclusionsOnPrint(q.showInclusionsOnPrint !== false);
        setShowPaymentTermsOnPrint(q.showPaymentTermsOnPrint !== false);
        setEventVenue(q.eventVenue || '');
        setEventDate(q.eventDate || todayIsoDate);
        setRentalReturnDate(q.rentalReturnDate || addDaysToIsoDate(todayIsoDate, 1));
        setEventTime(q.eventTime || '');
        setPaxCount(q.paxCount || 50);
        setEventDays(q.eventDays || 1);
        setSecurityDeposit(q.securityDeposit ?? 2000);
        if (q.rentalTermsText) setRentalTermsText(q.rentalTermsText);
        setSelectedPackageId(q.selectedPackageId || 'pkg_essential');
        setSelectedTierPax(q.selectedTierPax || 100);
        setExcessRatePerPax(q.excessRatePerPax ?? STANDARD_EXCESS_RATE);
        setCustomBaseFee(q.customBaseFee || 0);
        setSelectedBuffetMenuId(q.selectedBuffetMenuId || 'menu_a');
        if (q.seminarDayMealsMap) setSeminarDayMealsMap(q.seminarDayMealsMap);
        if (q.seminarSlotTimes) setSeminarSlotTimes(q.seminarSlotTimes);
        if (q.seminarDayDates) setSeminarDayDates(q.seminarDayDates);
        if (q.dayPaxOverrides) setDayPaxOverrides(q.dayPaxOverrides);
        setSelectedMenuLines(q.selectedMenuLines || []);
        if (q.packedTotalDays) setPackedTotalDays(q.packedTotalDays);
        if (q.packedMealBatches) setPackedMealBatches(q.packedMealBatches);
        setSelectedServiceLines(q.selectedServiceLines || []);
        setRoomBookingsMap(q.roomBookingsMap || {});
        setDiscountLabel(q.discountLabel || 'Promo / Management Discount');
        setDiscountAmount(q.discountAmount || 0);
        setTaxRatePercent(q.taxRatePercent || 0);
        setPayments(asDuplicate ? [] : q.payments || []);
        setPoNumber(asDuplicate ? '' : q.poNumber || '');
        setPoApprovedBudget(q.poApprovedBudget || '');
        setPoNotes(q.poNotes || '');
        setIsSavedQuotesOpen(false);
        setActiveTab('builder');
        showToast(asDuplicate ? `Duplicated quote for ${q.clientName}.` : `Loaded ${q.docNumber}.`);
      };

      const handleCopyMessengerSummary = () => {
        const lines = [
          `✨ ${businessProfile.businessName || 'EYNS HOTEL & RESTAURANT'}`,
          `📄 ${docType.toUpperCase()} (${docNumber})`,
          `👤 Client: ${clientName || 'Valued Client'}${clientOrg ? ` (${clientOrg})` : ''}`
        ];
        if (bookingCategory === 'rental') {
          lines.push(`🚚 Purpose: ${occasion}`);
          lines.push(`📅 Dates: ${formatPrettyDate(eventDate)} → ${formatPrettyDate(rentalReturnDate)} (${rentalDurationDays}d)`);
        } else if (bookingCategory === 'packed_meals') {
          lines.push(`🍱 Order: ${occasion} (${packedTotalDays} ${packedTotalDays === 1 ? 'Day' : 'Days'} • ${computedPackedMealsSummary.totalPacks} Total Packs)`);
        } else if (bookingCategory === 'seminar') {
          lines.push(`🎓 Seminar: ${occasion} (${eventDays} ${eventDays === 1 ? 'Day' : 'Days'} • ${seminarScheduleSummary.avgOrRangePax})`);
          lines.push(`📅 Session Dates: ${seminarScheduleSummary.datesList.map((dt, idx) => `Day ${idx + 1}: ${formatPrettyDate(dt)} (${getPaxForDay(idx + 1)}p)`).join(' | ')}`);
        } else {
          lines.push(`🎉 Event: ${occasion} — ${paxCount} Pax`);
          lines.push(`📅 Date & Time: ${formatPrettyDate(eventDate)} | ${eventTime || 'TBD'}`);
        }
        lines.push(`📍 Location: ${eventVenue}`, '', '📋 SUMMARY OF CHARGES:');
        if (showPackageStep && (packageBreakdown.total > 0 || isTieredAllInclusivePackage(selectedPackage.id))) {
          lines.push(`• ${selectedPackage.name}: ${formatCurrency(packageBreakdown.total)}`);
        }
        if (bookingCategory === 'packed_meals') {
          computedPackedMealsSummary.batches.forEach(b => {
            lines.push(`• ${b.displayTitle} (${formatPrettyDate(b.date)} @ ${b.time} • ${b.packs} packs): ${formatCurrency(b.batchTotal)}`);
          });
        } else if (computedMenuSummary.lines.length > 0) {
          lines.push(
            `• Menu (${computedMenuSummary.lines
              .map(l => `${bookingCategory === 'seminar' ? `D${l.day} (${formatPrettyDate(getSeminarDateForDay(l.day))}) ${l.mealSlot || 'Lunch'}: ` : ''}${l.name} (${l.effectivePax}p)`)
              .join(', ')}): ${formatCurrency(computedMenuSummary.netMenuTotal)}`
          );
        }
        if (computedServiceLines.length > 0) {
          lines.push(`• ${bookingCategory === 'rental' ? 'Rentals' : 'Services'}: ${formatCurrency(servicesSubtotal)}`);
        }
        if (selectedRoomsList.length > 0) {
          lines.push(
            `• Rooms (${selectedRoomsList.map(r => `${r.roomNo} [${formatPrettyDate(r.checkIn)}–${formatPrettyDate(r.checkOut)}]`).join(', ')}): ${formatCurrency(roomsSubtotal)}`
          );
        }
        if (totals.discount > 0) lines.push(`• Less ${discountLabel}: -${formatCurrency(totals.discount)}`);
        if (totals.deposit > 0) lines.push(`• Security Deposit: ${formatCurrency(totals.deposit)}`);
        lines.push('', `💰 GRAND TOTAL: ${formatCurrency(totals.grandTotal)}`);
        if (totals.totalPaid > 0) {
          lines.push(`✅ Paid: ${formatCurrency(totals.totalPaid)} | 📌 Balance: ${formatCurrency(totals.balanceDue)}`);
        } else {
          lines.push(`📌 50% Reservation Downpayment: ${formatCurrency(totals.grandTotal * 0.5)}`);
        }
        lines.push(`⏳ Valid until ${formatPrettyDate(quoteValidUntilDate)}. Thank you!`);
        copyTextFallback(lines.join('\n'));
        showToast('Messenger / Viber quote summary copied!');
      };

      const handleAddPayment = e => {
        e.preventDefault();
        const amt = parseNumericAmount(newPayAmount);
        if (amt <= 0) return;
        setPayments(prev => [
          ...prev,
          { id: `pay_${Date.now()}`, date: newPayDate || todayIsoDate, method: newPayMethod, reference: newPayRef.trim() || 'Official Receipt', amount: amt }
        ]);
        setNewPayAmount('');
        setNewPayRef('');
        showToast('Payment entry recorded.');
      };

      const handleDownloadJpeg = async () => {
        if (!printRef.current || typeof html2canvas === 'undefined') {
          showToast('Export engine loading, try again in a second.');
          return;
        }
        try {
          showToast('Generating high-res A4 JPEG...');
          const canvas = await html2canvas(printRef.current, { scale: 2, useCORS: true, backgroundColor: '#FFFFFF' });
          const link = document.createElement('a');
          const safeClient = (clientName || 'Client').replace(/[^a-zA-Z0-9_-]/g, '_');
          link.download = `${docNumber}_${safeClient}${previewMode === 'beo' ? '_BEO' : ''}.jpg`;
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
          showToast('JPEG downloaded!');
        } catch (err) {
          showToast('Could not generate JPEG.');
        }
      };

      // =======================================================================
      // 10. FILTERED CATALOGS & METRICS
      // =======================================================================
      const menuCategoryStats = useMemo(() => {
        const counts = {};
        menuItems.forEach(m => {
          const c = m.category || 'Main Course';
          counts[c] = (counts[c] || 0) + 1;
        });
        return [{ name: 'All', count: menuItems.length }, ...Object.entries(counts).map(([name, count]) => ({ name, count }))];
      }, [menuItems]);

      const filteredMenuItems = useMemo(() => {
        const q = menuSearchQuery.trim().toLowerCase();
        return menuItems.filter(item =>
          (menuCategoryFilter === 'All' || item.category === menuCategoryFilter) &&
          (!q || item.name.toLowerCase().includes(q) || (item.category || '').toLowerCase().includes(q))
        );
      }, [menuItems, menuCategoryFilter, menuSearchQuery]);

      const serviceCategoryStats = useMemo(() => {
        return ['All', 'Catering', 'Rental', 'Suppliers'].map(name => ({
          name,
          count: name === 'All' ? serviceItems.length : serviceItems.filter(s => s.subcategory === name).length
        }));
      }, [serviceItems]);

      const filteredServiceItems = useMemo(() => {
        const pool = bookingCategory === 'rental' ? serviceItems.filter(s => s.subcategory === 'Rental') : serviceItems;
        const q = serviceSearchQuery.trim().toLowerCase();
        return pool.filter(item =>
          (bookingCategory === 'rental' || serviceSubcategoryFilter === 'All' || item.subcategory === serviceSubcategoryFilter) &&
          (!q || item.name.toLowerCase().includes(q) || (item.subcategory || '').toLowerCase().includes(q))
        );
      }, [bookingCategory, serviceItems, serviceSubcategoryFilter, serviceSearchQuery]);

      const savedQuotesMetrics = useMemo(() => ({
        confirmedCount: savedQuotes.filter(q => q.quoteStatus === 'Confirmed' || q.quoteStatus === 'Fully Paid').length,
        totalPipeline: savedQuotes.reduce((s, q) => s + (Number(q.grandTotal) || 0), 0),
        totalReceivables: savedQuotes.reduce((s, q) => s + (Number(q.balanceDue) || 0), 0)
      }), [savedQuotes]);

      const filteredSavedQuotes = useMemo(() => {
        const q = savedQuotesSearch.trim().toLowerCase();
        return savedQuotes.filter(item =>
          (savedQuotesStatusFilter === 'All' || (item.quoteStatus || 'Draft') === savedQuotesStatusFilter) &&
          (!q || (item.clientName || '').toLowerCase().includes(q) || (item.docNumber || '').toLowerCase().includes(q) || (item.occasion || '').toLowerCase().includes(q))
        );
      }, [savedQuotes, savedQuotesSearch, savedQuotesStatusFilter]);

      const allSheetsSynced = syncDiagnostics.menuOk && syncDiagnostics.servicesOk && syncDiagnostics.roomsOk;

      // =======================================================================
      // 11. RENDER
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast */}
          {toastMsg && (
            <div className="no-print fixed bottom-5 right-5 z-50 bg-espresso-950 text-cream-50 border border-gold-500/50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-sm font-semibold max-w-md">
              <i className="fa-solid fa-circle-check text-gold-400 shrink-0"></i>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Streamlined Top Navigation */}
          <header className="no-print bg-espresso-950 text-cream-50 border-b border-gold-500/30 sticky top-0 z-40">
            <div className="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                {!logoBroken ? (
                  <img
                    src={businessProfile.logoPath || 'assets/logo.png'}
                    alt="EYNS Logo"
                    onError={() => setLogoBroken(true)}
                    className="w-10 h-10 rounded-xl object-contain bg-white p-1 shadow"
                  />
                ) : (
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 text-espresso-950 flex items-center justify-center font-serif font-extrabold text-lg shadow">
                    E
                  </div>
                )}
                <div>
                  <h1 className="font-serif text-lg sm:text-xl font-bold tracking-wide text-gold-300 leading-tight">
                    {businessProfile.businessName || 'EYNS HOTEL & RESTAURANT'}
                  </h1>
                  <p className="text-[11px] text-cream-200/80">Event Quotation, SOA, BEO &amp; Rental Builder</p>
                </div>
              </div>

              <nav className="flex items-center gap-1.5 bg-espresso-900/90 p-1 rounded-xl border border-espresso-800">
                {[
                  { id: 'builder', label: 'Quotation Builder', icon: 'fa-file-invoice-dollar' },
                  { id: 'packages', label: 'Official Packages', icon: 'fa-crown' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                      activeTab === tab.id ? 'bg-gold-500 text-espresso-950 shadow' : 'text-cream-100 hover:bg-espresso-800'
                    }`}
                  >
                    <i className={`fa-solid ${tab.icon}`}></i>
                    <span>{tab.label}</span>
                  </button>
                ))}

                  <button type="button" onClick={() => setIsSyncModalOpen(false)} className="w-8 h-8 rounded-lg bg-cream-100 font-bold">×</button>
                </div>

                {/* Sheet #3 */}
                <div className="bg-cream-50 p-3.5 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-sm">3. A La Carte Menu Sheet (#3)</span>
                    <a href={menuSheetUrl} target="_blank" rel="noopener noreferrer" className="font-bold text-gold-600 hover:underline">Open Sheet ↗</a>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={menuSheetUrl} onChange={e => setMenuSheetUrl(e.target.value)} className="flex-1 px-3 py-1.5 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-3.5 py-1.5 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Sync</button>
                  </div>
                  {syncDiagnostics.menu && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.menuOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.menuOk ? '✅ ' : '⚠️ '}{syncDiagnostics.menu}
                    </div>
                  )}
                </div>

                {/* Sheet #4 */}
                <div className="bg-cream-50 p-3.5 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-sm">4. Event Services &amp; Rentals Sheet (#4)</span>
                    <a href={servicesSheetUrl} target="_blank" rel="noopener noreferrer" className="font-bold text-gold-600 hover:underline">Open Sheet ↗</a>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={servicesSheetUrl} onChange={e => setServicesSheetUrl(e.target.value)} className="flex-1 px-3 py-1.5 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-3.5 py-1.5 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Sync</button>
                  </div>
                  {syncDiagnostics.services && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.servicesOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.servicesOk ? '✅ ' : '⚠️ '}{syncDiagnostics.services}
                    </div>
                  )}
                </div>

                {/* Sheet #5 */}
                <div className="bg-cream-50 p-3.5 rounded-2xl border border-cream-200 space-y-2">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="font-extrabold text-sm">5. Hotel Rooms Sheet (#5)</span>
                    <div className="flex items-center gap-3">
                      <button
                        type="button"
                        onClick={() => {
                          const header = ['ID', 'Room No', 'Room Type', 'Rate Per Night', 'Capacity', 'Inclusions'];
                          const rows = DEFAULT_ROOM_CATALOG.map(r => [r.id, r.roomNo, r.type, r.rate, r.capacity, r.inclusions]);
                          copyTextFallback([header, ...rows].map(r => r.join('\t')).join('\n'));
                          showToast('Hotel Rooms template copied! Paste into cell A1 of Sheet #5.');
                        }}
                        className="font-bold text-espresso-900 hover:underline"
                      >
                        Copy Sheet #5 Template
                      </button>
                      <a href={roomsSheetUrl} target="_blank" rel="noopener noreferrer" className="font-bold text-gold-600 hover:underline">Open Sheet ↗</a>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={roomsSheetUrl} onChange={e => setRoomsSheetUrl(e.target.value)} className="flex-1 px-3 py-1.5 rounded-xl border border-cream-200 bg-white font-mono text-[11px]" />
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-3.5 py-1.5 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">Sync</button>
                  </div>
                  {syncDiagnostics.rooms && (
                    <div className={`p-2 rounded-lg border ${syncDiagnostics.roomsOk ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                      {syncDiagnostics.roomsOk ? '✅ ' : '⚠️ '}{syncDiagnostics.rooms}
                    </div>
                  )}
                </div>

                <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-cream-200">
                  <span className="text-[11px] text-espresso-800/80">
                    {lastSyncTime ? `Last synced at ${lastSyncTime}` : 'Auto-sync active every 20 seconds'}
                  </span>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, roomsSheetUrl, false)} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 font-extrabold">
                      Sync All 3 Sheets
                    </button>
                    <button type="button" onClick={() => setIsSyncModalOpen(false)} className="px-4 py-2 rounded-xl bg-cream-100 text-espresso-900 font-bold">
                      Done
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 5. ERROR BOUNDARY & SAFE REACT 18 MOUNT
    // =========================================================================
    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || 'Unexpected rendering error' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-cream-100">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full border border-cream-200 shadow-lg space-y-3 text-center">
                <h2 className="font-serif text-xl font-bold text-espresso-950">EYNS Builder Notice</h2>
                <p className="text-xs text-red-700 font-mono">{this.state.message}</p>
                <button type="button" onClick={() => window.location.reload()} className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold">
                  Reload App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function mountApp() {
      const container = document.getElementById('root');
      if (!container) return;
      ReactDOM.createRoot(container).render(
        <AppErrorBoundary>
          <App />
        </AppErrorBoundary>
      );
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', mountApp);
    } else {
      mountApp();
    }
  </script>
</body>
</html>
