          return rates[100] + (rates[150] - rates[100]) * ratio;

                        <td className="border p-1.5">{item.name}</td>
                        <td className="border p-1.5 text-center">{item.pax}</td>
                        <td className="border p-1.5 text-right">₱{item.price}</td>
                        <td className="border p-1.5 text-right">₱{(item.price * item.pax).toLocaleString()}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {selectedAddonIds.length > 0 && (
              <div className="mb-6">
                <h3 className="font-bold text-xs uppercase bg-gray-200 p-1.5 border border-gray-300 mb-2">3. Add-Ons & Enhancements</h3>
                <table className="w-full text-xs border-collapse border">
                  <thead>
                    <tr className="bg-gray-100">
                      <th className="border p-1.5 text-left">Service Item</th>
                      <th className="border p-1.5 text-right">Price</th>
                    </tr>
                  </thead>
                  <tbody>
                    {selectedAddonIds.map(id => {
                      const item = OFFICIAL_ADDONS.find(a => a.id === id);
                      return (
                        <tr key={id}>
                          <td className="border p-1.5">{item?.name}</td>
                          <td className="border p-1.5 text-right">₱{(item?.perPax ? item.price * guestCount : item?.price).toLocaleString()}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {Object.keys(roomCounts).length > 0 && (
              <div className="mb-6">
                <h3 className="font-bold text-xs uppercase bg-gray-200 p-1.5 border border-gray-300 mb-2">4. Hotel Accommodations</h3>
                <table className="w-full text-xs border-collapse border">
                  <thead>
                    <tr className="bg-gray-100">
                      <th className="border p-1.5 text-left">Room Type</th>
                      <th className="border p-1.5 text-center">Qty</th>
                      <th className="border p-1.5 text-right">Subtotal</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Object.entries(roomCounts).map(([id, qty]) => {
                      const room = HOTEL_ROOMS.find(r => r.id === id);
                      return (
                        <tr key={id}>
                          <td className="border p-1.5">{room?.name}</td>
                          <td className="border p-1.5 text-center">{qty}</td>
                          <td className="border p-1.5 text-right">₱{(room?.price * qty).toLocaleString()}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            <div className="border-t-2 border-black pt-4 text-right space-y-1">
              <p className="text-xs">Subtotal: ₱{subtotalBeforeTax.toLocaleString()}</p>
              {taxAmount > 0 && <p className="text-xs">{taxMode === 'vat' ? '12% VAT' : '7% Gov Tax'}: ₱{taxAmount.toLocaleString()}</p>}
              <h2 className="text-lg font-bold text-burgundy-900">GRAND TOTAL: ₱{grandTotal.toLocaleString()}</h2>
              {amountPaid > 0 && (
                <>
                  <p className="text-xs text-emerald-700">Amount Paid: ₱{amountPaid.toLocaleString()}</p>
                  <p className="text-sm font-bold text-burgundy-900">BALANCE DUE: ₱{balanceDue.toLocaleString()}</p>
                </>
              )}
            </div>

            <div className="mt-12 pt-8 flex justify-between text-xs text-center">
              <div className="w-48">
                <p className="border-b border-black mb-1"></p>
                <p>Client Signature / Date</p>
              </div>
              <div className="w-48">
                <p className="border-b border-black mb-1 font-bold">Jem Medina</p>
                <p>EYNS Hotel & Restaurant</p>
              </div>
            </div>
          </div>

          <footer className="no-print bg-burgundy-950 border-t border-slate-800 text-slate-400 py-6 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
              <div className="flex items-center gap-3">
                <EynsOfficialLogo className="w-10 h-10" />
                <div>
                  <h4 className="font-serif text-slate-200 font-bold text-sm">EYNS HOTEL & RESTAURANT</h4>
                  <p className="mt-0.5 text-slate-400">Creating Memorable Celebrations Since 1988 • Catanauan, Quezon</p>
                </div>
              </div>
              <div className="text-center md:text-right">
                <p className="text-gold-400 font-semibold">Contact Person: Jem Medina (0917-841-7553)</p>
                <p>Email: eyns.hnr@gmail.com</p>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
