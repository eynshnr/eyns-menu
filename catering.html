    const LOCAL_DISHES_STORAGE_KEY = 'eyns_saved_custom_dishes_v1';

    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('builder'); // 'packages' | 'builder' | 'catalog' | 'rooms'

      // Document & Client Info
      const [docType, setDocType] = useState('Quotation'); // 'Quotation' | 'SOA'
      const [clientName, setClientName] = useState('');
      const [clientContact, setClientContact] = useState('');
      const [eventDate, setEventDate] = useState('');
      const [eventVenue, setEventVenue] = useState('EYNS Grand Function Hall');
      const [occasion, setOccasion] = useState('Wedding');
      const [guestCount, setGuestCount] = useState(100);

      // Package Selection
      const [packageType, setPackageType] = useState('entry');

      // Custom Menu State
      const [isCustomMenu, setIsCustomMenu] = useState(false);
      const [customMenuItems, setCustomMenuItems] = useState([]);
      const [newDishName, setNewDishName] = useState('');
      const [newDishPrice, setNewDishPrice] = useState('');
      const [newDishPax, setNewDishPax] = useState(100);
      const [newDishCategory, setNewDishCategory] = useState('Meat');
      const [saveDishToCatalog, setSaveDishToCatalog] = useState(true);

      // Catalog Filter & Search State
      const [catalogCategory, setCatalogCategory] = useState('All');
      const [catalogSearch, setCatalogSearch] = useState('');

      // Cloud & Local-Synced Custom Catalog Dishes
      const [cloudUser, setCloudUser] = useState(null);
      const [savedCustomDishes, setSavedCustomDishes] = useState(() => {
        try {
          const raw = localStorage.getItem(LOCAL_DISHES_STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      });
      const [confirmDeleteDishId, setConfirmDeleteDishId] = useState(null);
      const [toastNotice, setToastNotice] = useState('');
      const cloudDbRef = useRef(null);

      // Setups & Equipment State
      const [addons, setAddons] = useState({
        extraTablesChairs: false,
        acRental: false,
        soundSystem: false,
        stage: 'none' // 'none' | 'simple' | 'thematic'
      });

      // Custom Ad-Hoc Line Items State (For Custom Package / Additional Fees)
      const [adhocItems, setAdhocItems] = useState([]);
      const [adhocName, setAdhocName] = useState('');
      const [adhocPrice, setAdhocPrice] = useState('');
      const [adhocQty, setAdhocQty] = useState(1);
      const [adhocIsPerPax, setAdhocIsPerPax] = useState(false);

      // Individual Rooms Reservation State { roomId: nights }
      const [selectedRooms, setSelectedRooms] = useState({});

      // Taxation, Discount & Payment State
      const [taxType, setTaxType] = useState('none'); // 'none' | 'vat' | 'gov'
      const [discountAmount, setDiscountAmount] = useState(0);
      const [discountNote, setDiscountNote] = useState('');
      const [amountPaid, setAmountPaid] = useState(0);

      // Operational Auto-Scaling Toggle (101+ pax)
      const [autoScaleOps, setAutoScaleOps] = useState(true);

      // Refs for Printing & JPEG Export
      const printSheetRef = useRef(null);
      const [isExportingJpeg, setIsExportingJpeg] = useState(false);

      const showToast = (msg) => {
        setToastNotice(msg);
        setTimeout(() => {
          setToastNotice(prev => (prev === msg ? '' : prev));
        }, 3500);
      };

      // Initialize Cloud Auth & Database (with automatic localStorage fallback)
      useEffect(() => {
        let isMounted = true;

        const setupCloud = async () => {
          try {
            if (!window.CloudStorageSDK) return;
            if (typeof __firebase_config === 'undefined' || !__firebase_config) return;

            const config = JSON.parse(__firebase_config);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const {
              initializeApp,
              getAuth,
              signInAnonymously,
              signInWithCustomToken,
              onAuthStateChanged,
              getFirestore
            } = window.CloudStorageSDK;

            const app = initializeApp(config);
            const auth = getAuth(app);
            const db = getFirestore(app);
            cloudDbRef.current = { db, appId };

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
              if (isMounted) setCloudUser(user);
            });
          } catch (err) {
            console.error("Cloud initialization error:", err);
          }
        };

        if (window.CloudStorageSDK) {
          setupCloud();
        } else {
          window.addEventListener('cloud-sdk-ready', setupCloud);
        }

        return () => {
          isMounted = false;
          window.removeEventListener('cloud-sdk-ready', setupCloud);
        };
      }, []);

      // Subscribe to Saved Custom Dishes in Real-Time when Cloud is connected
      useEffect(() => {
        if (!cloudUser || !cloudDbRef.current || !window.CloudStorageSDK) return;

        const { db, appId } = cloudDbRef.current;
        const { collection, onSnapshot } = window.CloudStorageSDK;
        const dishesCol = collection(db, 'artifacts', appId, 'public', 'data', 'custom_dishes');

        const unsubscribe = onSnapshot(
          dishesCol,
          (snapshot) => {
            const list = snapshot.docs.map(docSnap => ({
              id: docSnap.id,
              ...docSnap.data()
            }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setSavedCustomDishes(list);
            try {
              localStorage.setItem(LOCAL_DISHES_STORAGE_KEY, JSON.stringify(list));
            } catch (e) {}
          },
          (error) => {
            console.error("Error syncing saved menu catalog:", error);
          }
        );

        return () => unsubscribe();
      }, [cloudUser]);

      // Merge Built-In Catalog with Saved Custom Dishes
      const mergedCatalog = useMemo(() => {
        const combined = {};
        Object.entries(FULL_A_LA_CARTE_CATALOG).forEach(([cat, items]) => {
          combined[cat] = [...items];
        });

        savedCustomDishes.forEach(dish => {
          const targetCat = dish.category || 'Special / Custom';
          if (!combined[targetCat]) {
            combined[targetCat] = [];
          }
          combined[targetCat].unshift({
            id: dish.id,
            name: dish.name,
            price: Number(dish.price) || 0,
            isSavedCustom: true
          });
        });

        return combined;
      }, [savedCustomDishes]);

      // Active Package Object
      const selectedPkg = useMemo(() => {
        return OFFICIAL_PACKAGES.find(p => p.id === packageType) || OFFICIAL_PACKAGES[0];
      }, [packageType]);

      // --- PRICING CALCULATIONS ---

      // 1. Base Package Cost
      const basePackageCost = useMemo(() => {
        if (packageType === 'food_packs' || packageType === 'from_scratch') return 0;
        if (packageType === 'backyard') return selectedPkg.flatBase || 25000;
        // Exact tier matching: 50->45k/55k, 100->60k/75k, 150->75k/95k => Base Setup + (300 * pax)
        const baseSetup = selectedPkg.p100 - (300 * 100);
        return baseSetup + (300 * guestCount);
      }, [packageType, selectedPkg, guestCount]);

      // 2. Custom Menu Food Credit (-₱300/pax for Entry & Essential when building custom menu)
      const foodCredit = useMemo(() => {
        if (!selectedPkg.hasFoodCredit || !isCustomMenu) return 0;
        return 300 * guestCount;
      }, [selectedPkg, isCustomMenu, guestCount]);

      // 3. Selected Dishes Total (A la carte / special dishes)
      const customDishesTotal = useMemo(() => {
        return customMenuItems.reduce((sum, item) => sum + (item.price * item.pax), 0);
      }, [customMenuItems]);

      // 4. Auto-Scaling Buffet & Staffing (Triggers starting at 101+ pax unless toggled OFF)
      const additionalTiers = useMemo(() => {
        if (packageType === 'food_packs' || packageType === 'from_scratch') return 0;
        return Math.max(0, Math.ceil(guestCount / 100) - 1);
      }, [guestCount, packageType]);

      const extraBuffetCost = useMemo(() => {
        return (additionalTiers > 0 && autoScaleOps) ? additionalTiers * 3500 : 0;
      }, [additionalTiers, autoScaleOps]);

      const extraStaffingCost = useMemo(() => {
        return (additionalTiers > 0 && autoScaleOps) ? additionalTiers * 7500 : 0;
      }, [additionalTiers, autoScaleOps]);

      // 5. Setups, Equipment & Ad-Hoc Items Total
      const setupsTotal = useMemo(() => {
        let sum = 0;
        if (addons.extraTablesChairs) sum += 50 * guestCount;
        if (addons.acRental) sum += 10000;
        if (addons.soundSystem) sum += 5000;
        if (addons.stage === 'simple') sum += 5000;
        if (addons.stage === 'thematic') sum += 15000;
        return sum;
      }, [addons, guestCount]);

      const adhocTotal = useMemo(() => {
        return adhocItems.reduce((sum, item) => {
          const multiplier = item.isPerPax ? guestCount : item.qty;
          return sum + (item.price * multiplier);
        }, 0);
      }, [adhocItems, guestCount]);

      // 6. Individual Hotel Rooms Total
      const roomsTotal = useMemo(() => {
        return Object.entries(selectedRooms).reduce((sum, [roomId, nights]) => {
          const room = ROOMS.find(r => r.id === roomId);
          return sum + (room && nights > 0 ? room.price * nights : 0);
        }, 0);
      }, [selectedRooms]);

      // 7. Subtotal, Discount, Tax, Grand Total & Balance
      const subtotal = useMemo(() => {
        return (basePackageCost - foodCredit) + customDishesTotal + extraBuffetCost + extraStaffingCost + setupsTotal + adhocTotal + roomsTotal;
      }, [basePackageCost, foodCredit, customDishesTotal, extraBuffetCost, extraStaffingCost, setupsTotal, adhocTotal, roomsTotal]);

      const effectiveDiscount = useMemo(() => {
        return Math.max(0, Math.min(subtotal, Number(discountAmount) || 0));
      }, [subtotal, discountAmount]);

      const discountedSubtotal = subtotal - effectiveDiscount;

      const taxAmount = useMemo(() => {
        if (taxType === 'vat') return discountedSubtotal * 0.12;
        if (taxType === 'gov') return discountedSubtotal * 0.07;
        return 0;
      }, [discountedSubtotal, taxType]);

      const grandTotal = discountedSubtotal + taxAmount;

          ...prev,
          { id: Date.now() + Math.random(), name, price: Number(price), pax: Math.max(1, Number(customPax) || guestCount) }
        ]);
      };

      const handleAddSpecialDish = async () => {
        const trimmedName = newDishName.trim();
        const numericPrice = Number(newDishPrice);
        if (!trimmedName || isNaN(numericPrice) || numericPrice <= 0) return;

        addCustomDish(trimmedName, numericPrice, newDishPax || guestCount);

        if (saveDishToCatalog) {
          const newSavedEntry = {
            id: 'local_' + Date.now(),
            name: trimmedName,
            price: numericPrice,
            category: newDishCategory || 'Special / Custom',
            createdAt: Date.now()
          };

          if (cloudUser && cloudDbRef.current && window.CloudStorageSDK) {
            try {
              const { db, appId } = cloudDbRef.current;
              const { collection, addDoc } = window.CloudStorageSDK;
              const dishesCol = collection(db, 'artifacts', appId, 'public', 'data', 'custom_dishes');
              await addDoc(dishesCol, {
                name: trimmedName,
                price: numericPrice,
                category: newDishCategory || 'Special / Custom',
                createdAt: Date.now()
              });
              showToast(`"${trimmedName}" added & saved to ${newDishCategory} catalog!`);
            } catch (err) {
              console.error("Failed to save dish to cloud catalog:", err);
              setSavedCustomDishes(prev => {
                const updated = [newSavedEntry, ...prev];
                try { localStorage.setItem(LOCAL_DISHES_STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}
                return updated;
              });
              showToast(`"${trimmedName}" added & saved locally to ${newDishCategory} catalog!`);
            }
          } else {
            setSavedCustomDishes(prev => {
              const updated = [newSavedEntry, ...prev];
              try { localStorage.setItem(LOCAL_DISHES_STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}
              return updated;
            });
            showToast(`"${trimmedName}" added & saved to ${newDishCategory} catalog!`);
          }

          showToast(`Added "${trimmedName}" to current quotation.`);

        setNewDishName('');
        setNewDishPrice('');
        setNewDishPax(guestCount);

      const handleDeleteSavedDish = async (dishId, dishName) => {
        if (confirmDeleteDishId !== dishId) {
          setConfirmDeleteDishId(dishId);
          setTimeout(() => {
            setConfirmDeleteDishId(prev => (prev === dishId ? null : prev));
          }, 3000);
          return;

        if (cloudUser && cloudDbRef.current && window.CloudStorageSDK && !String(dishId).startsWith('local_')) {
          try {
            const { db, appId } = cloudDbRef.current;
            const { doc, deleteDoc } = window.CloudStorageSDK;

            showToast(`Removed "${dishName}" from saved menu catalog.`);

            return updated;

        const price = Number(adhocPrice);

                          onChange={(e) => setDiscountAmount(Math.max(0, Number(e.target.value) || 0))}
                          placeholder="0"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-gold-500"
                        />
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1">Discount Note / Promo Label (Optional)</label>
                        <input
                          type="text"
                          value={discountNote}
                          onChange={(e) => setDiscountNote(e.target.value)}
                          placeholder="e.g., Early Bird / Loyal Client Discount"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-gold-500"
                        />
                      </div>
                    </div>
                  </section>

                </div>

                {/* RIGHT COLUMN: LIVE ORDER SUMMARY & PRINTABLE SHEET */}
                <div className="w-full lg:w-[490px] flex-shrink-0 space-y-4 lg:sticky lg:top-20">
                  
                  {/* Export Action Buttons */}
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      onClick={handlePrintA4}
                      className="bg-gold-500 hover:bg-gold-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-print"></i>
                      <span>Print A4 {docType}</span>
                    </button>
                    <button
                      onClick={handleSaveJpeg}
                      disabled={isExportingJpeg}
                      className="bg-slate-800 hover:bg-slate-700 border border-gold-500/40 text-gold-300 font-bold py-3 px-4 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      <i className="fa-solid fa-image"></i>
                      <span>{isExportingJpeg ? 'Saving JPEG...' : 'Save as JPEG'}</span>
                    </button>
                  </div>

                  {/* OFFICIAL PRINTABLE & JPEG CAPTURE DOCUMENT */}
                  <div ref={printSheetRef} className="bg-white text-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-200 text-xs space-y-4">
                    
                    {/* Document Header */}
                    <div className="flex justify-between items-start border-b-2 border-amber-800 pb-4">
                      <div className="flex items-center gap-3">
                        <EynsOfficialLogo className="w-12 h-12 flex-shrink-0" />
                        <div>
                          <h2 className="text-lg font-serif font-bold text-amber-950 leading-tight">EYNS HOTEL & RESTAURANT</h2>
                          <p className="text-[10px] text-slate-500">Catanauan, Quezon, Philippines • Est. 1988</p>
                          <p className="text-[10px] text-slate-500">Contact: Jem Medina (0917-841-7553)</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <span className="inline-block bg-amber-900 text-white font-bold text-[10px] px-2.5 py-1 rounded uppercase tracking-wider">
                          {docType === 'SOA' ? 'Statement of Account' : 'Official Quotation'}
                        </span>
                        <p className="text-[10px] text-slate-500 mt-1">Issued: {new Date().toLocaleDateString()}</p>
                      </div>
                    </div>

                    {/* Client & Event Summary Box */}
                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 grid grid-cols-2 gap-y-1.5 gap-x-3 text-[11px]">
                      <div><span className="font-bold text-slate-600">Client:</span> <span className="font-semibold text-slate-900">{clientName || 'Valued Client'}</span></div>
                      <div><span className="font-bold text-slate-600">Event Date:</span> <span className="font-semibold text-slate-900">{eventDate || 'TBD'}</span></div>
                      <div><span className="font-bold text-slate-600">Occasion:</span> <span className="font-semibold text-slate-900">{occasion}</span></div>
                      <div><span className="font-bold text-slate-600">Guests:</span> <span className="font-semibold text-slate-900">{guestCount} Pax</span></div>
                      {clientContact && (
                        <div><span className="font-bold text-slate-600">Contact:</span> <span className="text-slate-800">{clientContact}</span></div>
                      )}
                      <div className={clientContact ? '' : 'col-span-2'}>
                        <span className="font-bold text-slate-600">Venue:</span> <span className="text-slate-800">{eventVenue}</span>
                      </div>
                    </div>

                    {/* COMPLETE ITEMIZED BREAKDOWN TABLE */}
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b-2 border-slate-300 text-[10px] text-slate-500 uppercase tracking-wider">
                          <th className="py-1.5">Itemized Description & Inclusions</th>
                          <th className="py-1.5 text-center w-16">Qty</th>
                          <th className="py-1.5 text-right w-24">Subtotal</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-[11px]">
                        
                        {/* 1. Chosen Base Package with Complete Package Inclusions */}
                        <tr>
                          <td className="py-2.5 align-top pr-2">
                            <div className="font-bold text-slate-900">
                              {selectedPkg.name} {selectedPkg.p100 ? `(${guestCount} pax)` : ''}
                            </div>
                            <div className="text-[10px] text-slate-600 mt-1 pl-2 border-l-2 border-amber-700 space-y-0.5">
                              <p className="font-semibold text-slate-700">Package Inclusions:</p>
                              <ul className="list-disc list-inside text-slate-500 space-y-0.5">
                                {selectedPkg.inclusions.map((inc, idx) => (
                                  <li key={idx}>{inc}</li>
                                ))}
                              </ul>
                            </div>
                          </td>
                          <td className="py-2.5 text-center align-top font-medium text-slate-700">1</td>
                          <td className="py-2.5 text-right align-top font-bold text-slate-900">
                            ₱{basePackageCost.toLocaleString()}
                          </td>
                        </tr>

                        {/* 2. Custom Menu Food Credit Deduction */}
                        {foodCredit > 0 && (
                          <tr className="bg-red-50/50 text-red-700">
                            <td className="py-2 pl-2">
                              Less: Custom Menu Food Credit (-₱300/pax)
                            </td>
                            <td className="py-2 text-center">{guestCount} pax</td>
                            <td className="py-2 text-right font-semibold">-₱{foodCredit.toLocaleString()}</td>
                          </tr>
                        )}

                        {/* 3. Itemized A La Carte & Special Dishes */}
                        {customMenuItems.map((item, idx) => (
                          <tr key={item.id || idx}>
                            <td className="py-2 pl-2">
                              <span className="font-medium text-slate-800">• {item.name}</span>
                              <span className="block text-[10px] text-slate-500 pl-2.5">
                                Rate: ₱{item.price.toLocaleString()}/pax
                              </span>
                            </td>
                            <td className="py-2 text-center text-slate-700">{item.pax} pax</td>
                            <td className="py-2 text-right font-semibold text-slate-800">
                              ₱{(item.price * item.pax).toLocaleString()}
                            </td>
                          </tr>
                        ))}

                        {/* 4. Auto-Scaled Extra Buffet & Staffing (ONLY shown if > 100 pax AND autoScaleOps is ON) */}
                        {additionalTiers > 0 && autoScaleOps && (
                          <>
                            <tr className="bg-amber-50/60 text-amber-950">
                              <td className="py-2 pl-2">
                                <span className="font-medium">• Additional Buffet Station Setup</span>
                                <span className="block text-[10px] text-amber-800 pl-2.5">
                                  ₱3,500 per extra 100-pax tier
                                </span>
                              </td>
                              <td className="py-2 text-center">{additionalTiers}</td>
                              <td className="py-2 text-right font-semibold">₱{extraBuffetCost.toLocaleString()}</td>
                            </tr>
                            <tr className="bg-amber-50/60 text-amber-950">
                              <td className="py-2 pl-2">
                                <span className="font-medium">• Additional Banquet Service Team</span>
                                <span className="block text-[10px] text-amber-800 pl-2.5">
                                  ₱7,500 per extra 100-pax tier
                                </span>
                              </td>
                              <td className="py-2 text-center">{additionalTiers}</td>
                              <td className="py-2 text-right font-semibold">₱{extraStaffingCost.toLocaleString()}</td>
                            </tr>
                          </>
                        )}

                        {/* 5. Setups & Equipment Add-Ons */}
                        {addons.extraTablesChairs && (
                          <tr>
                            <td className="py-2 pl-2">
                              <span className="font-medium text-slate-800">• Guest Tables & Chairs Setup</span>
                              <span className="block text-[10px] text-slate-500 pl-2.5">Rate: ₱50/pax</span>
                            </td>
                            <td className="py-2 text-center text-slate-700">{guestCount} pax</td>
                            <td className="py-2 text-right font-semibold text-slate-800">₱{(50 * guestCount).toLocaleString()}</td>
                          </tr>
                        )}
                        {addons.acRental && (
                          <tr>
                            <td className="py-2 pl-2 font-medium text-slate-800">• Air-Conditioned Venue Hall Rental</td>
                            <td className="py-2 text-center text-slate-700">1</td>
                            <td className="py-2 text-right font-semibold text-slate-800">₱10,000</td>
                          </tr>
                        )}
                        {addons.soundSystem && (
                          <tr>
                            <td className="py-2 pl-2 font-medium text-slate-800">• Professional Sound System & Lights</td>
                            <td className="py-2 text-center text-slate-700">1</td>
                            <td className="py-2 text-right font-semibold text-slate-800">₱5,000</td>
                          </tr>
                        )}
                        {addons.stage !== 'none' && (
                          <tr>
                            <td className="py-2 pl-2 font-medium text-slate-800">
                              • {addons.stage === 'simple' ? 'Simple Backdrop Stage Setup' : 'Full Thematic Stage Design'}
                            </td>
                            <td className="py-2 text-center text-slate-700">1</td>
                            <td className="py-2 text-right font-semibold text-slate-800">
                              ₱{(addons.stage === 'simple' ? 5000 : 15000).toLocaleString()}
                            </td>
                          </tr>
                        )}

                        {/* 6. Ad-Hoc Custom Line Items */}
                        {adhocItems.map((item, idx) => {
                          const mult = item.isPerPax ? guestCount : item.qty;
                          return (
                            <tr key={item.id || idx}>
                              <td className="py-2 pl-2">
                                <span className="font-medium text-slate-800">• {item.name}</span>
                                <span className="block text-[10px] text-slate-500 pl-2.5">
                                  Rate: ₱{item.price.toLocaleString()} {item.isPerPax ? '/ pax' : '/ unit'}
                                </span>
                              </td>
                              <td className="py-2 text-center text-slate-700">{mult} {item.isPerPax ? 'pax' : ''}</td>
                              <td className="py-2 text-right font-semibold text-slate-800">
                                ₱{(item.price * mult).toLocaleString()}
                              </td>
                            </tr>
                          );
                        })}

                        {/* 7. Individual Reserved Hotel Rooms */}
                        {reservedRoomEntries.map(([roomId, nights]) => {
                          const room = ROOMS.find(r => r.id === roomId);
                          if (!room) return null;
                          return (
                            <tr key={roomId}>
                              <td className="py-2 pl-2">
                                <span className="font-medium text-slate-800">• {room.name} ({room.type})</span>
                                <span className="block text-[10px] text-slate-500 pl-2.5">
                                  Rate: ₱{room.price.toLocaleString()}/night ({room.pax})
                                </span>
                              </td>
                              <td className="py-2 text-center text-slate-700">{nights} {nights === 1 ? 'night' : 'nights'}</td>
                              <td className="py-2 text-right font-semibold text-slate-800">
                                ₱{(room.price * nights).toLocaleString()}
                              </td>
                            </tr>
                          );
                        })}

                      </tbody>
                    </table>

                    {/* FINANCIAL SUMMARY & RECONCILIATION */}
                    <div className="border-t-2 border-slate-300 pt-3 space-y-1.5 text-[11px]">
                      <div className="flex justify-between text-slate-600">
                        <span>Gross Subtotal:</span>
                        <span className="font-semibold text-slate-900">₱{subtotal.toLocaleString()}</span>
                      </div>

                      {effectiveDiscount > 0 && (
                        <div className="flex justify-between text-emerald-700 font-medium">
                          <span>Less: Discount {discountNote ? `(${discountNote})` : ''}:</span>
                          <span>-₱{effectiveDiscount.toLocaleString()}</span>
                        </div>
                      )}

                      {taxAmount > 0 && (
                        <div className="flex justify-between text-slate-600">
                          <span>Tax ({taxType === 'vat' ? '12% VAT' : '7% Government Tax'}):</span>
                          <span>+₱{taxAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        </div>
                      )}

                      <div className="flex justify-between text-sm font-bold text-slate-950 border-t border-slate-300 pt-2">
                        <span>GRAND TOTAL:</span>
                        <span className="text-amber-900">₱{grandTotal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                      </div>

                      {(docType === 'SOA' || amountPaid > 0) && (
                        <>
                          <div className="flex justify-between text-emerald-700 font-semibold">
                            <span>Less: Downpayment / Amount Paid:</span>
                            <span>-₱{Number(amountPaid).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                          </div>
                          <div className="flex justify-between text-base font-bold text-amber-950 bg-amber-100/80 px-2.5 py-1.5 rounded-lg border border-amber-300">
                            <span>REMAINING BALANCE DUE:</span>
                            <span>₱{remainingBalance.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                          </div>
                        </>
                      )}
                    </div>

                    {/* Footer & Signatories */}
                    <div className="border-t border-slate-200 pt-4 mt-4 grid grid-cols-2 gap-4 text-[10px] text-slate-500">
                      <div>
                        <p className="font-semibold text-slate-700 mb-4">Prepared By:</p>
                        <div className="border-b border-slate-400 w-36 mb-1"></div>
                        <p className="font-bold text-slate-800">EYNS Banquet & Reservations</p>
                      </div>
                      <div className="text-right">
                        <p className="font-semibold text-slate-700 mb-4">Conforme / Client Signature:</p>
                        <div className="border-b border-slate-400 w-36 ml-auto mb-1"></div>
                        <p className="font-bold text-slate-800">{clientName || 'Client Name & Date'}</p>
                      </div>
                    </div>

                  </div>
                </div>

              </div>
            )}

            {/* TAB 3: FULL A LA CARTE MENU CATALOG */}
            {activeTab === 'catalog' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h2 className="text-2xl font-serif font-bold text-gold-400">A La Carte & Special Menu Catalog</h2>
                    <p className="text-xs text-slate-400">Browse all official per-pax dishes, beverages, and your saved custom specialties.</p>
                  </div>

                  <div className="relative w-full sm:w-64">
                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                    <input
                      type="text"
                      value={catalogSearch}
                      onChange={(e) => setCatalogSearch(e.target.value)}
                      placeholder="Search dish or beverage..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-8 pr-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-gold-500"
                    />
                  </div>
                </div>

                <div className="flex flex-wrap gap-2 text-xs">
                  {['All', ...Object.keys(mergedCatalog)].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setCatalogCategory(cat)}
                      className={`px-3 py-1.5 rounded-lg border transition ${
                        catalogCategory === cat
                          ? 'bg-gold-500 text-slate-950 border-gold-400 font-bold'
                          : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-gold-500/50'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                <div className="space-y-6">
                  {Object.entries(mergedCatalog)
                    .filter(([category]) => catalogCategory === 'All' || catalogCategory === category)
                    .map(([category, items]) => {
                      const filteredItems = items.filter(item =>
                        item.name.toLowerCase().includes(catalogSearch.toLowerCase())
                      );

                      if (filteredItems.length === 0) return null;

                      return (
                        <div key={category} className="glass-card rounded-2xl p-5">
                          <h3 className="text-lg font-serif font-bold text-gold-400 border-b border-slate-800 pb-2 mb-4 flex items-center justify-between">
                            <span>{category} Selections</span>
                            <span className="text-xs font-sans text-slate-500 font-normal">{filteredItems.length} items</span>
                          </h3>

                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            {filteredItems.map((dish, i) => (
                              <div
                                key={dish.id || i}
                                className="bg-slate-950/70 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs hover:border-gold-500/40 transition"
                              >
                                <div className="flex items-center gap-2 pr-2">
                                  <span className="font-medium text-slate-200">{dish.name}</span>
                                  {dish.isSavedCustom && (
                                    <span className="text-[9px] bg-gold-500/20 text-gold-300 border border-gold-500/30 px-1.5 py-0.5 rounded">
                                      Saved
                                    </span>
                                  )}
                                </div>
                                <div className="flex items-center gap-2 flex-shrink-0">
                                  <span className="font-bold text-gold-400 bg-gold-500/10 px-2 py-0.5 rounded border border-gold-500/20">
                                    ₱{dish.price}/pax
                                  </span>
                                  {dish.isSavedCustom && (
                                    <button
                                      onClick={() => handleDeleteSavedDish(dish.id, dish.name)}
                                      title="Remove saved custom dish"
                                      className={`px-2 py-1 rounded text-[10px] transition ${
                                        confirmDeleteDishId === dish.id
                                          ? 'bg-red-600 text-white font-bold'
                                          : 'text-slate-400 hover:text-red-400 hover:bg-slate-800'
                                      }`}
                                    >
                                      {confirmDeleteDishId === dish.id ? 'Confirm?' : <i className="fa-solid fa-trash-can"></i>}
                                    </button>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {/* TAB 4: INDIVIDUAL HOTEL ROOMS DIRECTORY (ROOMS 1 - 18) */}
            {activeTab === 'rooms' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                  <div>
                    <h2 className="text-2xl font-serif font-bold text-gold-400">EYNS Hotel Room Directory (Rooms 1–18)</h2>
                    <p className="text-xs text-slate-400">Individual room rates and specifications for exact event reservation allocation.</p>
                  </div>
                  <button
                    onClick={() => setActiveTab('builder')}
                    className="bg-gold-500 hover:bg-gold-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition"
                  >
                    Go to Quotation Builder ({reservedRoomEntries.length} Rooms Selected)
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {ROOMS.map(room => {
                    const nights = selectedRooms[room.id] || 0;
                    return (
                      <div key={room.id} className={`glass-card rounded-2xl p-5 flex flex-col justify-between transition ${nights > 0 ? 'border-gold-400 bg-gold-500/10' : ''}`}>
                        <div className="space-y-2">
                          <div className="flex justify-between items-center">
                            <h3 className="text-lg font-serif font-bold text-white">{room.name}</h3>
                            <span className="text-xs font-bold text-gold-400 bg-gold-500/15 px-2.5 py-1 rounded-lg border border-gold-500/30">
                              ₱{room.price.toLocaleString()} / night
                            </span>
                          </div>
                          <p className="text-xs font-semibold text-gold-200">{room.type} • {room.pax}</p>
                          <p className="text-[11px] text-slate-400 flex items-center gap-1.5">
                            <i className="fa-solid fa-sparkles text-gold-400"></i>
                            <span>{room.icons}</span>
                          </p>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
                          <span className="text-[11px] text-slate-400">
                            {nights > 0 ? `Reserved: ${nights} night(s)` : 'Available to assign'}
                          </span>
                          <div className="flex items-center gap-1.5">
                            {nights > 0 && (
                              <button
                                onClick={() => updateRoomNights(room.id, -1)}
                                className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold"
                              >
                                -
                              </button>
                            )}
                            <button
                              onClick={() => updateRoomNights(room.id, 1)}
                              className="px-3 py-1.5 rounded-lg bg-gold-500 hover:bg-gold-400 text-slate-950 text-xs font-bold transition"
                            >
                              {nights > 0 ? '+1 Night' : '+ Reserve Room'}
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="no-print bg-burgundy-950 border-t border-slate-800 text-slate-400 py-6 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
              <div className="flex items-center gap-3">
                <EynsOfficialLogo className="w-10 h-10" />
                <div>
                  <h4 className="font-serif text-slate-200 font-bold text-sm">EYNS HOTEL & RESTAURANT</h4>
                  <p className="mt-0.5 text-slate-400">Creating Memorable Celebrations Since 1988 • Catanauan, Quezon</p>
                </div>
              </div>
              <div className="text-center md:text-right">
                <p className="text-gold-400 font-semibold">Contact Person: Jem Medina (0917-841-7553)</p>
                <p>Email: eyns.hnr@gmail.com</p>
              </div>
            </div>
          </footer>

          {/* Toast Notification Banner */}
          {toastNotice && (
            <div className="no-print fixed bottom-5 right-5 z-50 bg-slate-900 border border-gold-500/60 text-gold-200 px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2.5">
              <i className="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
              <span>{toastNotice}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
