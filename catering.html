    // 1. Tactile Number Stepper with Free Typing & Quick Presets
    function NumberStepper({
      value,
      onChange,
      min = 0,
      max = 9999,
      step = 1,
      suffix = '',
      size = 'md',
      presets = []
    }) {
      const [draft, setDraft] = useState(String(value));

      useEffect(() => {
        setDraft(String(value));
      }, [value]);

      const clamp = (num) => Math.min(max, Math.max(min, num));

      const handleDecrement = () => {
        const next = clamp((Number(value) || 0) - step);
        onChange(next);
      };

      const handleIncrement = () => {
        const next = clamp((Number(value) || 0) + step);
        onChange(next);
      };

      const isSm = size === 'sm';

      return (
        <div className="space-y-1.5">
          <div
            className={`inline-flex items-center bg-slate-950 border border-slate-700/90 focus-within:border-gold-500 rounded-xl overflow-hidden ${
              isSm ? 'h-8' : 'h-10 w-full sm:w-auto'
            }`}
          >
            <button
              type="button"
              onClick={handleDecrement}
              disabled={value <= min}
              className={`${
                isSm ? 'w-7 h-8 text-xs' : 'w-10 h-10 text-sm'
              } flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-gold-400 disabled:opacity-35 transition select-none`}
              aria-label="Decrease"
            >
              <i className="fa-solid fa-minus"></i>
            </button>

            <div className="flex items-center justify-center px-2">
              <input
                type="number"
                min={min}
                max={max}
                value={draft}
                onChange={(e) => {
                  setDraft(e.target.value);
                  const parsed = parseInt(e.target.value, 10);
                  if (!isNaN(parsed)) {
                    onChange(clamp(parsed));
                  }
                }}
                onBlur={() => {
                  const parsed = parseInt(draft, 10);
                  const finalVal = isNaN(parsed) ? min : clamp(parsed);
                  setDraft(String(finalVal));
                  onChange(finalVal);
                }}
                className={`${
                  isSm ? 'w-11 text-xs' : 'w-16 text-sm'
                } bg-transparent text-center font-bold text-slate-100 focus:outline-none`}
              />
              {suffix && (
                <span className="text-[11px] text-slate-400 font-medium select-none pr-1">
                  {suffix}
                </span>
              )}
            </div>

            <button
              type="button"
              onClick={handleIncrement}
              disabled={value >= max}
              className={`${
                isSm ? 'w-7 h-8 text-xs' : 'w-10 h-10 text-sm'
              } flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-gold-400 disabled:opacity-35 transition select-none`}
              aria-label="Increase"
            >
              <i className="fa-solid fa-plus"></i>
            </button>
          </div>

          {presets.length > 0 && (
            <div className="flex flex-wrap gap-1.5">
              {presets.map((preset) => (
                <button
                  key={preset}
                  type="button"
                  onClick={() => onChange(clamp(preset))}
                  className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition border ${
                    value === preset
                      ? 'bg-gold-500 text-slate-950 border-gold-400'
                      : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-gold-500/50 hover:text-gold-300'
                  }`}
                >
                  {preset} {suffix}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    // 2. Enhanced Event Date Picker with Interactive Calendar Popover & Quick Presets
    function SophisticatedDateInput({ value, onChange }) {
      const containerRef = useRef(null);
      const [isOpen, setIsOpen] = useState(false);

      const initialDate = useMemo(() => {
        if (value) {
          const [y, m, d] = value.split('-').map(Number);
          if (y && m && d) return new Date(y, m - 1, d);
        }
        return new Date();
      }, []);

      const [viewYear, setViewYear] = useState(initialDate.getFullYear());
      const [viewMonth, setViewMonth] = useState(initialDate.getMonth());

      useEffect(() => {
        if (value) {
          const [y, m, d] = value.split('-').map(Number);
          if (y && m && d) {
            setViewYear(y);
            setViewMonth(m - 1);
          }
        }
      }, [value]);

      useEffect(() => {
        if (!isOpen) return;
        const handleOutside = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleOutside);
        document.addEventListener('touchstart', handleOutside);
        return () => {
          document.removeEventListener('mousedown', handleOutside);
          document.removeEventListener('touchstart', handleOutside);
        };
      }, [isOpen]);

      const formattedDisplay = useMemo(() => {
        if (!value) return null;
        const [y, m, d] = value.split('-').map(Number);
        if (!y || !m || !d) return value;
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
      }, [value]);

      const daysCountdown = useMemo(() => {
        if (!value) return null;
        const [y, m, d] = value.split('-').map(Number);
        if (!y || !m || !d) return null;
        const target = new Date(y, m - 1, d);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return 'Tomorrow';
        if (diffDays > 1) return `In ${diffDays} days`;
        return `${Math.abs(diffDays)}d ago`;
      }, [value]);

      const formatYMD = (year, monthIndex, day) => {
        const mm = String(monthIndex + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        return `${year}-${mm}-${dd}`;
      };

      const setPresetDate = (type) => {
        const now = new Date();
        if (type === 'today') {
          // keep today
        } else if (type === 'nextSat') {
          const day = now.getDay();
          const daysUntilSat = (6 - day + 7) % 7 || 7;
          now.setDate(now.getDate() + daysUntilSat);
        } else if (type === 'plus1m') {
          now.setMonth(now.getMonth() + 1);
        } else if (type === 'plus3m') {
          now.setMonth(now.getMonth() + 3);
        } else if (type === 'clear') {
          onChange('');
          setIsOpen(false);
          return;
        }
        onChange(formatYMD(now.getFullYear(), now.getMonth(), now.getDate()));
        setIsOpen(false);
      };

      const handlePrevMonth = () => {
        if (viewMonth === 0) {
          setViewMonth(11);
          setViewYear((y) => y - 1);
        } else {
          setViewMonth((m) => m - 1);
        }
      };

      const handleNextMonth = () => {
        if (viewMonth === 11) {
          setViewMonth(0);
          setViewYear((y) => y + 1);
        } else {
          setViewMonth((m) => m + 1);
        }
      };

      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      const calendarCells = useMemo(() => {
        const firstDayOfWeek = new Date(viewYear, viewMonth, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

        const cells = [];
        for (let i = firstDayOfWeek - 1; i >= 0; i--) {
          cells.push({
            day: daysInPrevMonth - i,
            inCurrentMonth: false,
            dateStr: null
          });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({
            day: d,
            inCurrentMonth: true,
            dateStr: formatYMD(viewYear, viewMonth, d)
          });
        }
        const totalCells = cells.length <= 35 ? 35 : 42;
        let nextDay = 1;
        while (cells.length < totalCells) {
          cells.push({
            day: nextDay++,
            inCurrentMonth: false,
            dateStr: null
          });
        }
        return cells;
      }, [viewYear, viewMonth]);

      const todayStr = useMemo(() => {
        const t = new Date();
        return formatYMD(t.getFullYear(), t.getMonth(), t.getDate());
      }, []);

      const yearOptions = useMemo(() => {
        const baseYear = new Date().getFullYear();
        const list = [];
        for (let y = baseYear - 1; y <= baseYear + 5; y++) {
          list.push(y);
        }
        return list;
      }, []);

      return (
        <div ref={containerRef} className="relative space-y-1.5">
          {/* Trigger Bar */}
          <button
            type="button"
            onClick={() => setIsOpen((prev) => !prev)}
            className={`w-full h-10 bg-slate-950 border rounded-xl px-3 flex items-center justify-between cursor-pointer transition text-left ${
              isOpen ? 'border-gold-500 ring-2 ring-gold-500/20' : 'border-slate-700/90 hover:border-gold-500/70'
            }`}
            aria-expanded={isOpen}
            aria-label="Select Event Date"
          >
            <div className="flex items-center gap-2.5 truncate">
              <i className="fa-regular fa-calendar text-gold-400 text-xs"></i>
              {formattedDisplay ? (
                <span className="text-xs font-semibold text-slate-100 truncate">{formattedDisplay}</span>
              ) : (
                <span className="text-xs text-slate-500">Click to choose event date...</span>
              )}
            </div>
            <div className="flex items-center gap-2 flex-shrink-0 ml-2">
              {daysCountdown && (
                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gold-500/15 text-gold-300 border border-gold-500/30">
                  {daysCountdown}
                </span>
              )}
              <i className={`fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform ${isOpen ? 'rotate-180 text-gold-400' : ''}`}></i>
            </div>
          </button>

          {/* Interactive Calendar Popover */}
          {isOpen && (
            <div className="absolute left-0 top-11 z-50 w-72 sm:w-80 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-3.5 space-y-3">
              {/* Month & Year Header */}
              <div className="flex items-center justify-between gap-1.5">
                <button
                  type="button"
                  onClick={handlePrevMonth}
                  className="w-8 h-8 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-gold-400 flex items-center justify-center transition"
                  aria-label="Previous Month"
                >
                  <i className="fa-solid fa-chevron-left text-xs"></i>
                </button>

                <div className="flex items-center gap-1.5">
                  <select
                    value={viewMonth}
                    onChange={(e) => setViewMonth(Number(e.target.value))}
                    className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs font-bold text-slate-100 focus:outline-none focus:border-gold-500 cursor-pointer"
                  >
                    {monthNames.map((mName, idx) => (
                      <option key={mName} value={idx}>{mName}</option>
                    ))}
                  </select>

                  <select
                    value={viewYear}
                    onChange={(e) => setViewYear(Number(e.target.value))}
                    className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs font-bold text-gold-300 focus:outline-none focus:border-gold-500 cursor-pointer"
                  >
                    {yearOptions.map((yr) => (
                      <option key={yr} value={yr}>{yr}</option>
                    ))}
                  </select>
                </div>

                <button
                  type="button"
                  onClick={handleNextMonth}
                  className="w-8 h-8 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-gold-400 flex items-center justify-center transition"
                  aria-label="Next Month"
                >
                  <i className="fa-solid fa-chevron-right text-xs"></i>
                </button>
              </div>

              {/* Weekday Headers */}
              <div className="grid grid-cols-7 text-center text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-1.5">
                <span>Su</span>
                <span>Mo</span>
                <span>Tu</span>
                <span>We</span>
                <span>Th</span>
                <span>Fr</span>
                <span className="text-gold-400">Sa</span>
              </div>

              {/* Calendar Days Grid */}
              <div className="grid grid-cols-7 gap-1 text-center">
                {calendarCells.map((cell, idx) => {
                  if (!cell.inCurrentMonth) {
                    return (
                      <span
                        key={idx}
                        className="h-8 flex items-center justify-center text-[11px] text-slate-600 select-none"
                      >
                        {cell.day}
                      </span>
                    );
                  }

                  const isSelected = value === cell.dateStr;
                  const isToday = todayStr === cell.dateStr;

                  return (
                    <button
                      key={idx}
                      type="button"
                      onClick={() => {
                        onChange(cell.dateStr);
                        setIsOpen(false);
                      }}
                      className={`h-8 rounded-lg text-xs font-semibold transition flex items-center justify-center relative ${
                        isSelected
                          ? 'bg-gold-500 text-slate-950 font-extrabold shadow'
                          : isToday
                            ? 'bg-slate-800 text-gold-300 border border-gold-500/50 hover:bg-gold-500/20'
                            : 'text-slate-200 hover:bg-slate-800 hover:text-white'
                      }`}
                    >
                      {cell.day}
                    </button>
                  );
                })}
              </div>

              {/* Popover Footer Actions */}
              <div className="flex items-center justify-between pt-2 border-t border-slate-800 text-[11px]">
                <button
                  type="button"
                  onClick={() => setPresetDate('today')}
                  className="px-2.5 py-1 rounded-lg bg-slate-950 hover:bg-slate-800 text-gold-300 font-semibold border border-slate-800 transition"
                >
                  Today
                </button>
                <div className="flex items-center gap-1.5">
                  {value && (
                    <button
                      type="button"
                      onClick={() => setPresetDate('clear')}
                      className="px-2.5 py-1 rounded-lg text-red-400 hover:bg-red-950/40 font-semibold transition"
                    >
                      Clear
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => setIsOpen(false)}
                    className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold transition"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Quick Preset Pills */}
          <div className="flex flex-wrap gap-1">
            <button
              type="button"
              onClick={() => setPresetDate('nextSat')}
              className="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-900/90 text-slate-400 border border-slate-800 hover:border-slate-600 hover:text-slate-200 transition"
            >
              Next Sat
            </button>
            <button
              type="button"
              onClick={() => setPresetDate('plus1m')}
              className="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-900/90 text-slate-400 border border-slate-800 hover:border-slate-600 hover:text-slate-200 transition"
            >
              +1 Mo
            </button>
            <button
              type="button"
              onClick={() => setPresetDate('plus3m')}
              className="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-900/90 text-slate-400 border border-slate-800 hover:border-slate-600 hover:text-slate-200 transition"
            >
              +3 Mos
            </button>
            {value && (
              <button
                type="button"
                onClick={() => setPresetDate('clear')}
                className="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-900/90 text-red-400 border border-slate-800 hover:border-red-500/40 transition"
              >
                Clear
              </button>
            )}
          </div>
        </div>
      );
    }

    // 3. Formatted Currency Input with Quick Calculation Chips
    function CurrencyInput({ value, onChange, placeholder = '0', chips = [] }) {

              type="number"
              min="0"
              step="any"
              value={draft}
              placeholder={placeholder}
              onChange={(e) => {
                setDraft(e.target.value);

    // --- GOOGLE SHEETS DATABASE CONFIGURATION ---
    const DEFAULT_GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/100fRNyT3vE96lz6TsaA-os9rwp0S4EUdqpJFaKR7S9k/edit?usp=sharing';
    const DEFAULT_SERVICES_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1ru6tBcBPMrbP66VlYHZT-vrcT0mGSfgfUbVM2VBOjZw/edit?usp=sharing';
    const DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNKebrYXLp20mWa43E1eJ2XGFnPtUDJMqUm0VlRtMsHNJ-zDA0hYsxBF79rTRIS7ij/exec';
    const DEFAULT_SERVICES_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPNtjCNcFt-NetYj-mFfopAInpyoEmX_9caehjwdIlHctqtk0SU4JBgx4URxt8YSTIIA/exec';

    const extractSpreadsheetId = (url) => {
      if (!url) return null;
      const match = String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : null;
    };

    const GOOGLE_APPS_SCRIPT_CODE = `var ADMIN_PIN = 'CHANGE_THIS_SECRET_PIN'; // Set your private password here
var SERVICES_SHEET_ID = '1ru6tBcBPMrbP66VlYHZT-vrcT0mGSfgfUbVM2VBOjZw'; // Dedicated Services, Suppliers & Rentals Sheet

function getServicesTargetSheet(ss) {
  if (SERVICES_SHEET_ID) {
    if (ss.getId() === SERVICES_SHEET_ID) {
      return ss.getSheets()[0];
    }
    return SpreadsheetApp.openById(SERVICES_SHEET_ID).getSheets()[0];
  }
  var fallback = ss.getSheetByName('Services & Rentals');
  if (!fallback) {
    fallback = ss.insertSheet('Services & Rentals');
  }
  return fallback;
}

function doGet(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var isServices = (e && e.parameter && e.parameter.sheet === 'services') || (SERVICES_SHEET_ID && ss.getId() === SERVICES_SHEET_ID);

    if (isServices) {
      var srvSheet = getServicesTargetSheet(ss);
      var srvData = srvSheet.getDataRange().getValues();
      var services = [];
      for (var s = 1; s < srvData.length; s++) {
        if (srvData[s][1]) {
          services.push({
            id: String(srvData[s][0] || ('srv_row_' + s)),
            name: String(srvData[s][1]).trim(),
            category: String(srvData[s][2] || 'Custom Service / Rental').trim(),
            price: Number(srvData[s][3]) || 0,
            billingType: String(srvData[s][4] || 'fixed').trim() === 'per_pax' ? 'per_pax' : 'fixed',
            createdAt: Number(srvData[s][5]) || 0
          });
        }
      }
      return ContentService.createTextOutput(JSON.stringify({ status: 'success', services: services }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    var sheet = ss.getSheets()[0];
    var data = sheet.getDataRange().getValues();
    var dishes = [];
    for (var i = 1; i < data.length; i++) {
      if (data[i][1]) {
        dishes.push({
          id: String(data[i][0] || ('row_' + i)),
          name: String(data[i][1]).trim(),
          category: String(data[i][2] || 'Special / Custom').trim(),
          price: Number(data[i][3]) || 0,
          createdAt: Number(data[i][4]) || 0
        });
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ status: 'success', dishes: dishes }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var payload = JSON.parse(e.postData.contents);

    if (!ADMIN_PIN || payload.pin !== ADMIN_PIN) {
      return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: 'Unauthorized: Invalid Admin PIN' }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    if (payload.targetSheet === 'services' || (SERVICES_SHEET_ID && ss.getId() === SERVICES_SHEET_ID)) {
      var srvSheet = getServicesTargetSheet(ss);
      if (srvSheet.getLastRow() === 0) {
        srvSheet.appendRow(['ID', 'Service / Item Name', 'Category', 'Rate', 'Billing Type', 'Created At']);
      }

      if (payload.action === 'add') {
        srvSheet.appendRow([payload.id, payload.name, payload.category, Number(payload.price), payload.billingType || 'fixed', payload.createdAt || Date.now()]);
      } else if (payload.action === 'update') {
        var sUpd = srvSheet.getDataRange().getValues();
        for (var sr = 1; sr < sUpd.length; sr++) {
          if (String(sUpd[sr][0]) === String(payload.id)) {
            srvSheet.getRange(sr + 1, 2, 1, 4).setValues([[payload.name, payload.category, Number(payload.price), payload.billingType || 'fixed']]);
            break;
          }
        }
      } else if (payload.action === 'delete') {
        var sDel = srvSheet.getDataRange().getValues();
        for (var si = sDel.length - 1; si >= 1; si--) {
          if (String(sDel[si][0]) === String(payload.id)) {

      // --- FINANCIAL CALCULATIONS ---

      const basePackageCost = useMemo(() => {

        if (selectedPackageId === 'styling_only') {

        return 'Custom Backyard Styling Scope';

      const foodCreditDeduction = useMemo(() => {
        if (!isCustomMenu) return 0;
        if (selectedPackageId !== 'entry' && selectedPackageId !== 'essential') return 0;
        return 300 * guestCount;

      const dishesTotal = useMemo(() => {
        return customDishes.reduce((sum, dish) => sum + (dish.price * dish.pax), 0);
      }, [customDishes]);

      // 4. Auto-Scaled Operational Charges (Triggers starting at 101+ guests unless overridden)
      const additionalTiers = useMemo(() => {
        if (selectedPackageId === 'food_packs' || selectedPackageId === 'from_scratch') return 0;
        return Math.max(0, Math.ceil(guestCount / 100) - 1);
      }, [guestCount, selectedPackageId]);

      const extraBuffetCost = useMemo(() => {
        return (additionalTiers > 0 && autoScaleOps) ? additionalTiers * 3500 : 0;
      }, [additionalTiers, autoScaleOps]);

        return (additionalTiers > 0 && autoScaleOps) ? additionalTiers * 7500 : 0;
      }, [additionalTiers, autoScaleOps]);

      // 5. Services, Suppliers & Rentals Total
      const servicesTotal = useMemo(() => {
        return selectedServices.reduce((sum, item) => {
          const multiplier = item.perPax ? guestCount : item.qty;
          return sum + (item.price * multiplier);

      const roomsTotal = useMemo(() => {
        return Object.entries(selectedRooms).reduce((sum, [roomId, nights]) => {

      // 7. Subtotal, Discount, Tax, Grand Total & Balance
      const grossSubtotal = useMemo(() => {
        return Math.max(0, basePackageCost - foodCreditDeduction)
          + dishesTotal
          + extraBuffetCost
          + extraStaffingCost
          + servicesTotal
          + roomsTotal;
      }, [
        basePackageCost,
        foodCreditDeduction,
        dishesTotal,
        extraBuffetCost,
        extraStaffingCost,
        servicesTotal,

              >
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-serif text-lg font-bold text-gold-300">Edit Menu Dish</h3>
                  <button
                    type="button"
                    onClick={() => setEditingDish(null)}
                    className="text-slate-400 hover:text-white p-1"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveEditedDish} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-200 block mb-1">Dish Name</label>
                    <input
                      type="text"
                      value={editingDish.name}
                      onChange={(e) => setEditingDish(p => ({ ...p, name: e.target.value }))}
                      className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                    />
                  </div>

                  <div>
                    <label className="font-bold text-slate-200 block mb-1">Category</label>
                    <select
                      value={editingDish.category}
                      onChange={(e) => setEditingDish(p => ({ ...p, category: e.target.value }))}
                      className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                    >
                      {specialDishCategoryOptions.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-200 block mb-1">Price Per Pax (₱)</label>
                    <input
                      type="number"
                      min="0"
                      step="any"
                      value={editingDish.price}
                      onChange={(e) => setEditingDish(p => ({ ...p, price: e.target.value }))}
                      className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setEditingDish(null)}
                      className="px-4 py-2 rounded-xl font-bold bg-slate-800 text-slate-300 hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl font-bold bg-gold-500 hover:bg-gold-400 text-slate-950"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* EDIT SERVICE / RENTAL MODAL (ADMIN ONLY) */}
          {editingService && isAdminUnlocked && (
            <div
              onClick={() => setEditingService(null)}
              className="no-print fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl"
              >
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-serif text-lg font-bold text-gold-300">Edit Service / Rental</h3>
                  <button
                    type="button"
                    onClick={() => setEditingService(null)}
                    className="text-slate-400 hover:text-white p-1"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveEditedService} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-200 block mb-1">Service / Rental Name</label>
                    <input
                      type="text"
                      value={editingService.name}
                      onChange={(e) => setEditingService(p => ({ ...p, name: e.target.value }))}
                      className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                    />
                  </div>

                  <div>
                    <label className="font-bold text-slate-200 block mb-1">Category</label>
                    <select
                      value={editingService.category}
                      onChange={(e) => setEditingService(p => ({ ...p, category: e.target.value }))}
                      className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                    >
                      {serviceCategoryOptions.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="font-bold text-slate-200 block mb-1">Rate (₱)</label>
                      <input
                        type="number"
                        min="0"
                        step="any"
                        value={editingService.price}
                        onChange={(e) => setEditingService(p => ({ ...p, price: e.target.value }))}
                        className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-200 block mb-1">Billing Mode</label>
                      <select
                        value={editingService.billingType}
                        onChange={(e) => setEditingService(p => ({ ...p, billingType: e.target.value }))}
                        className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                      >
                        <option value="fixed">Fixed / Per Unit</option>
                        <option value="per_pax">Per Pax (Guest Count)</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setEditingService(null)}
                      className="px-4 py-2 rounded-xl font-bold bg-slate-800 text-slate-300 hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl font-bold bg-gold-500 hover:bg-gold-400 text-slate-950"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* GOOGLE SHEETS DATABASE & ADMIN ACCESS MODAL */}
          {showSheetModal && (
            <div
              onClick={() => setShowSheetModal(false)}
              className="no-print fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden"
              >
                {/* Sticky Modal Header */}
                <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-900 flex-shrink-0">
                  <div className="flex items-center gap-2.5">
                    <i className="fa-solid fa-table text-emerald-400 text-lg"></i>
                    <h3 className="font-serif text-lg font-bold text-white">Google Sheets & Admin Access</h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowSheetModal(false)}
                    className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-bold flex items-center gap-1.5 transition"
                    aria-label="Close Google Sheets window"
                  >
                    <span>Close</span>
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* Scrollable Modal Body */}
                <div className="p-5 overflow-y-auto space-y-4 text-xs flex-1">
                  {/* Step A: Everyday Admin PIN Unlock Card */}
                  <div className={`rounded-xl p-4 border space-y-3 ${
                    isAdminUnlocked
                      ? 'bg-gold-500/10 border-gold-500/40 text-gold-200'
                      : 'bg-slate-950/90 border-slate-800 text-slate-200'
                  }`}>
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-2.5">
                        <i className={`fa-solid ${isAdminUnlocked ? 'fa-lock-open text-gold-400' : 'fa-shield-halved text-emerald-400'} text-base`}></i>
                        <div>
                          <p className="font-bold text-white">
                            {isAdminUnlocked ? 'Admin Edit Mode Unlocked' : 'Client Read-Only Mode (Protected)'}
                          </p>
                          <p className="text-[11px] text-slate-400">
                            {isAdminUnlocked
                              ? 'You can now edit categories, prices, and save new items to your spreadsheets.'
                              : 'Enter your Admin PIN below if you want to edit your Menu or Services catalogs.'}
                          </p>
                        </div>
                      </div>
                      {isAdminUnlocked && (
                        <button
                          type="button"
                          onClick={handleLockAdminMode}
                          className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-[11px] transition"
                        >
                          Lock Back
                        </button>
                      )}
                    </div>

                    {!isAdminUnlocked && (
                      <form onSubmit={handleQuickUnlockAdmin} className="flex gap-2">
                        <input
                          type="password"
                          value={adminPinInput}
                          onChange={(e) => setAdminPinInput(e.target.value)}
                          placeholder="Enter your secret ADMIN_PIN..."
                          className="flex-1 h-9 bg-slate-900 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                        />
                        <button
                          type="submit"
                          className="px-4 h-9 rounded-xl font-bold bg-gold-500 hover:bg-gold-400 text-slate-950 transition flex items-center gap-1.5"
                        >
                          <i className="fa-solid fa-key"></i>
                          <span>Unlock Admin</span>
                        </button>
                      </form>
                    )}
                  </div>

                  {/* Step B: Connected Google Spreadsheets (1 & 2) */}
                  <form onSubmit={handleSaveSheetConnection} className="space-y-3">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="font-bold text-slate-200">1. A La Carte Menu Google Sheet (Step 3)</label>
                        <div className="flex items-center gap-2.5">
                          <button
                            type="button"
                            onClick={handleCopySheetRows}
                            className="text-[11px] font-bold text-slate-300 hover:text-emerald-300 transition"
                          >
                            Copy Menu Rows
                          </button>
                          <a
                            href={googleSheetOpenHref}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-[11px] font-bold text-emerald-400 hover:text-emerald-300 flex items-center gap-1 transition"
                          >
                            <span>Open Menu Sheet</span>
                            <i className="fa-solid fa-up-right-from-square text-[10px]"></i>
                          </a>
                        </div>
                      </div>
                      <input
                        type="url"
                        value={sheetUrlInput}
                        onChange={(e) => setSheetUrlInput(e.target.value)}
                        placeholder="https://docs.google.com/spreadsheets/d/..."
                        className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="font-bold text-slate-200">2. Services, Suppliers & Rentals Google Sheet (Step 4)</label>
                        <div className="flex items-center gap-2.5">
                          <button
                            type="button"
                            onClick={handleCopyServiceSheetRows}
                            className="text-[11px] font-bold text-slate-300 hover:text-gold-300 transition"
                          >
                            Copy Service Rows
                          </button>
                          <a
                            href={servicesGoogleSheetOpenHref}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-[11px] font-bold text-gold-400 hover:text-gold-300 flex items-center gap-1 transition"
                          >
                            <span>Open Services Sheet</span>
                            <i className="fa-solid fa-up-right-from-square text-[10px]"></i>
                          </a>
                        </div>
                      </div>
                      <input
                        type="url"
                        value={servicesSheetUrlInput}
                        onChange={(e) => setServicesSheetUrlInput(e.target.value)}
                        placeholder="https://docs.google.com/spreadsheets/d/..."
                        className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                      />
                    </div>

                    {/* Step C: Collapsible #3 Apps Script Bridge (Already Pre-Filled) */}
                    <div className="border border-slate-800 rounded-xl overflow-hidden">
                      <button
                        type="button"
                        onClick={() => setShowAdvancedScriptSettings(prev => !prev)}
                        className="w-full px-3.5 py-2.5 bg-slate-950/90 hover:bg-slate-800/70 flex items-center justify-between text-left transition"
                      >
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-200">3. Apps Script Bridge (2-Way Sync)</span>
                          {appsScriptUrl.trim() && !appsScriptUrl.trim().endsWith('/dev') && (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-500/40">
                              Already Linked ✓
                            </span>
                          )}
                        </div>
                        <i className={`fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform ${showAdvancedScriptSettings ? 'rotate-180' : ''}`}></i>
                      </button>

                      {showAdvancedScriptSettings && (
                        <div className="p-3.5 bg-slate-950/50 border-t border-slate-800 space-y-3">
                          <p className="text-[11px] text-slate-400 leading-relaxed">
                            This <code className="text-emerald-300">/exec</code> link connects the app to your Google Sheets so Admin edits save automatically. <strong className="text-slate-200">You only need to change this if you deploy a new Apps Script link.</strong>
                          </p>

                          <div>
                            <label className="font-bold text-slate-300 block mb-1">Main Apps Script Web App URL</label>
                            <input
                              type="url"
                              value={appsScriptUrlInput}
                              onChange={(e) => setAppsScriptUrlInput(e.target.value)}
                              placeholder="https://script.google.com/macros/s/.../exec"
                              className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                            />
                            {appsScriptUrlInput.trim().endsWith('/dev') && (
                              <p className="mt-1.5 text-[11px] text-amber-300 bg-amber-950/50 border border-amber-500/40 rounded-lg px-2.5 py-1.5">
                                <strong>Notice:</strong> Your link ends in <code>/dev</code> (Test Deployment). Use <strong>Deploy → New deployment</strong> and copy the URL ending in <code>/exec</code>.
                              </p>
                            )}
                          </div>

                          <div>
                            <label className="font-bold text-slate-300 block mb-1">Optional Separate Services Apps Script URL</label>
                            <input
                              type="url"
                              value={servicesAppsScriptUrlInput}
                              onChange={(e) => setServicesAppsScriptUrlInput(e.target.value)}
                              placeholder="Leave blank to use the Main Apps Script URL above"
                              className="w-full h-9 bg-slate-950 border border-slate-700 rounded-xl px-3 text-slate-100 focus:outline-none focus:border-gold-500"
                            />
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="flex flex-wrap items-center gap-2 pt-1">
                      <button
                        type="submit"
                        disabled={isSyncingSheet}
                        className="px-4 py-2 rounded-xl font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1.5"
                      >
                        <i className={`fa-solid ${isSyncingSheet ? 'fa-spinner fa-spin' : 'fa-floppy-disk'}`}></i>
                        <span>{isSyncingSheet ? 'Syncing...' : 'Save & Sync Both Sheets'}</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          fetchDishesFromSheet(sheetUrl, appsScriptUrl, false);
                          fetchServicesFromSheet(servicesSheetUrl, servicesAppsScriptUrl, appsScriptUrl);
                        }}
                        disabled={isSyncingSheet}
                        className="px-3.5 py-2 rounded-xl font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5"
                      >
                        <i className={`fa-solid fa-rotate ${isSyncingSheet ? 'fa-spin' : ''}`}></i>
                        <span>Refresh Sync</span>
                      </button>
                    </div>
                  </form>

                  {/* Sync Status Feedback */}
                  {(sheetSyncError || servicesSheetSyncError) ? (
                    <div className="bg-amber-950/50 border border-amber-500/40 rounded-xl p-3 text-amber-200 flex items-start gap-2.5">
                      <i className="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5"></i>
                      <div className="space-y-1">
                        <p className="font-bold">Google Sheet Sync Notice</p>
                        {sheetSyncError && <p className="text-[11px] text-amber-300/90">{sheetSyncError}</p>}
                        {servicesSheetSyncError && <p className="text-[11px] text-amber-300/90">{servicesSheetSyncError}</p>}
                      </div>
                    </div>
                  ) : (
                    <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-3 text-slate-300 flex items-center justify-between">
                      <span>
                        Active Catalog: <strong className="text-emerald-300">{sheetDishes.length > 0 ? `${sheetDishes.length} live Menu sheet dishes` : 'Built-in fallback menu'}</strong>
                        {' • '}
                        <strong className="text-gold-300">{sheetServices.length > 0 ? `${sheetServices.length} live Services sheet items` : 'Built-in services & rentals'}</strong>
                      </span>
                      {sheetLastSynced && (
                        <span className="text-[11px] text-slate-400">Synced: {sheetLastSynced}</span>
                      )}
                    </div>
                  )}

                  {/* Collapsible Developer / Apps Script Setup Section */}
                  <div className="border border-slate-800 rounded-xl overflow-hidden">
                    <button
                      type="button"
                      onClick={() => setShowAppsScriptGuide(prev => !prev)}
                      className="w-full px-3.5 py-2.5 bg-slate-950/90 hover:bg-slate-800/70 flex items-center justify-between text-left font-bold text-slate-300 transition"
                    >
                      <span>
                        <i className="fa-solid fa-code text-gold-400 mr-2"></i>
                        How to Update Apps Script Code (Copy Script)
                      </span>
                      <i className={`fa-solid fa-chevron-down text-[10px] transition-transform ${showAppsScriptGuide ? 'rotate-180' : ''}`}></i>
                    </button>

                    {showAppsScriptGuide && (
                      <div className="p-3.5 bg-slate-950/60 border-t border-slate-800 space-y-2.5">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <span className="text-[11px] text-slate-400">
                            In your Menu Google Sheet, go to <strong>Extensions → Apps Script</strong>, replace the code, and click <strong>Deploy → Manage deployments → Edit → New version</strong>:
                          </span>
                          <button
                            type="button"
                            onClick={handleCopyAppsScript}
                            className="bg-gold-500/20 hover:bg-gold-500 hover:text-slate-950 text-gold-300 border border-gold-500/40 px-2.5 py-1 rounded-lg font-bold transition flex items-center gap-1"
                          >
                            <i className="fa-solid fa-copy"></i>
                            <span>Copy Script</span>
                          </button>
                        </div>
                        <pre className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-[10px] text-slate-300 overflow-x-auto max-h-36 font-mono">
                          {GOOGLE_APPS_SCRIPT_CODE}
                        </pre>
                      </div>
                    )}
                  </div>
                </div>

                {/* Sticky Modal Footer */}
                <div className="px-5 py-3 border-t border-slate-800 bg-slate-900 flex justify-end flex-shrink-0">
                  <button
                    type="button"
                    onClick={() => setShowSheetModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-gold-500 hover:bg-gold-400 text-slate-950 transition"
                  >
                    Done & Return to Builder
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION BANNER */}
          {toastNotice && (
            <div className="no-print fixed bottom-5 right-5 z-50 bg-slate-900 border border-gold-500/60 text-gold-200 px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2.5 max-w-md">
              <i className="fa-solid fa-circle-info text-gold-400"></i>
              <span>{toastNotice}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
