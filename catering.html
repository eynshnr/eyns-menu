    function readWindowNameStore() {
      try {
        if (window.name && window.name.startsWith('{')) {
          const parsed = JSON.parse(window.name);
          if (parsed && typeof parsed === 'object') return parsed;
        }
      } catch (e) {}
      return {};
    }

    function writeWindowNameStore(patchObj) {
      try {
        const current = readWindowNameStore();
        window.name = JSON.stringify({ ...current, ...patchObj });
      } catch (e) {}
    }

    function readHashStorageParam(paramName) {
      try {
        const rawHash = (window.location.hash || '').replace(/^#/, '');
        if (!rawHash) return '';
        const params = new URLSearchParams(rawHash);
        return (params.get(paramName) || '').trim();
      } catch (e) {
        return '';
      }
    }

    function syncHashStorageParams(menuUrl, servicesUrl) {
      try {
        const params = new URLSearchParams();
        if (menuUrl) params.set('menu', menuUrl);
        if (servicesUrl) params.set('services', servicesUrl);
        const nextHash = params.toString();
        if (window.history && window.history.replaceState) {
          window.history.replaceState(
            null,
            '',
            nextHash ? `#${nextHash}` : window.location.pathname + window.location.search
          );
        }
      } catch (e) {}
    }

    function recoverSavedString(candidateKeys, fallbackValue = '', hashParamName = '') {
      if (hashParamName) {
        const fromHash = readHashStorageParam(hashParamName);
        if (fromHash && !fromHash.includes('AKfycbx-eyns-menu-sync-endpoint')) {
          return fromHash;
        }
      }

      const winStore = readWindowNameStore();
      for (const k of candidateKeys) {
        const fromWin = winStore[k];
        if (
          typeof fromWin === 'string' &&
          fromWin.trim() &&
          !fromWin.includes('AKfycbx-eyns-menu-sync-endpoint')
        ) {
          return fromWin.trim();
        }
      }

      try {
        for (const k of candidateKeys) {
          const val = localStorage.getItem(k) || sessionStorage.getItem(k);
          if (val && val.trim() && !val.includes('AKfycbx-eyns-menu-sync-endpoint')) {
            return val.trim();
          }
        }
      } catch (e) {
        console.warn('Storage read skipped:', e);
      }
      return fallbackValue;
    }

    function persistSavedString(primaryKey, legacyKeys, value) {
      const clean = String(value || '').trim();
      try {
        if (clean) {
          localStorage.setItem(primaryKey, clean);
          sessionStorage.setItem(primaryKey, clean);
        } else {
          legacyKeys.forEach(k => {
            localStorage.removeItem(k);
            sessionStorage.removeItem(k);
          });
        }
      } catch (e) {}

      const winPatch = {};
      if (clean) {
        winPatch[primaryKey] = clean;
      } else {
        legacyKeys.forEach(k => {
          winPatch[k] = '';
        });
      }
      writeWindowNameStore(winPatch);
    }

    function recoverSavedJsonArray(candidateKeys, fallbackArray = []) {
      try {
        for (const k of candidateKeys) {
          const raw = localStorage.getItem(k);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed;
            }
          }
        }
      } catch (e) {
        console.warn('Storage JSON read skipped:', e);
      }
      return fallbackArray;

    function formatCurrency(val) {
      const num = Number(val) || 0;
      return (
        '₱' +
        num.toLocaleString('en-PH', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })
      );

    function formatWholeCurrency(val) {
      const num = Math.round(Number(val) || 0);
      return '₱' + num.toLocaleString('en-PH');

    function formatPrettyDate(isoStr) {
      if (!isoStr) return 'TBD';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      return dt.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function addDaysToIsoDate(isoStr, offsetDays) {
      if (!isoStr) return '';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(dt.getTime())) return isoStr;
      dt.setDate(dt.getDate() + offsetDays);
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function calculateTieredPackageBreakdown(pkg, tierPax, totalPax, excessRate) {
      const tiers = pkg?.tiers || [];
      const matchedTier = tiers.find(t => t.pax === tierPax) || tiers[0] || { pax: 50, price: 0 };
      const effectiveTotalPax = Math.max(matchedTier.pax, Number(totalPax) || matchedTier.pax);
      const excessPax = Math.max(0, effectiveTotalPax - matchedTier.pax);
      const rate = Math.max(0, Number(excessRate) || 0);
      const excessCharge = excessPax * rate;
      return {
        tierPax: matchedTier.pax,
        basePrice: matchedTier.price,
        excessPax,
        excessRate: rate,
        excessCharge,
        total: matchedTier.price + excessCharge
      };
    }

      if (val.includes('day')) return 'per_day';

    function parseCsvToGrid(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map(l => l.replace(/\r$/, ''))
        .filter(l => l.trim().length > 0);
      if (lines.length === 0) return [];

      if (lines[0].includes('\t')) {
        return lines.map(line => line.split('\t').map(cell => cell.trim()));
      }

      const splitCsvLine = line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      };

      return lines.map(splitCsvLine);
    }

    function parseGridRows(rawGrid) {
      const grid = (rawGrid || [])
        .map(row => (Array.isArray(row) ? row.map(c => (c == null ? '' : String(c).trim())) : []))
        .filter(row => row.some(cell => cell !== ''));

      if (grid.length === 0) return [];

      const cleanKey = str =>
        String(str || '')
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '');

      const KNOWN_HEADER_TOKENS = [
        'id',
        'dishname',
        'dish',
        'menuitem',
        'category',
        'priceperpax',
        'price',
        'createdat',
        'serviceitemname',
        'servicename',
        'service',
        'itemname',
        'item',
        'eventservicescategory',
        'subcategory',
        'rate',
        'billingtype',
        'unit',
        'description'
      ];

      let headerRowIdx = -1;
      for (let r = 0; r < Math.min(3, grid.length); r++) {
        const matches = grid[r].filter(cell => KNOWN_HEADER_TOKENS.includes(cleanKey(cell))).length;
        if (matches >= 2) {
          headerRowIdx = r;
          break;
        }
      }

      if (headerRowIdx !== -1) {
        const headers = grid[headerRowIdx].map(cleanKey);
        return grid.slice(headerRowIdx + 1).map(cols => {
          const obj = { _cols: cols, _hasHeaders: true };
          headers.forEach((h, i) => {
            if (h) obj[h] = cols[i] ?? '';
          });
          return obj;
        });
      }

      return grid.map(cols => ({
        _cols: cols,
        _hasHeaders: false
      }));
    }

    function parseCsvRows(csvText) {
      return parseGridRows(parseCsvToGrid(csvText));
    }

    function resolveGoogleSheetUrl(rawUrl) {
      const trimmed = String(rawUrl || '').trim();
      if (!trimmed) return { url: '', isSpreadsheetLink: false, sheetId: '', gid: '' };

      if (trimmed.includes('/spreadsheets/d/e/')) {
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : '';
        const csvUrl = trimmed.includes('/pubhtml')
          ? trimmed.replace('/pubhtml', `/pub?output=csv${gidParam}`)
          : trimmed.includes('output=csv')
          ? trimmed
          : trimmed.replace(/\/pub(\?.*)?$/, `/pub?output=csv${gidParam}`);
        return {
          url: csvUrl,
          isSpreadsheetLink: true,
          sheetId: '',
          gid: gidMatch ? gidMatch[1] : ''
        };
      }

      if (trimmed.includes('/pubhtml')) {
        return {
          url: trimmed.replace('/pubhtml', '/pub?output=csv'),
          isSpreadsheetLink: true,
          sheetId: '',
          gid: ''
        };
      }

      const sheetMatch =
        trimmed.match(/docs\.google\.com\/spreadsheets\/(?:u\/\d+\/)?d\/(?!e\/)([a-zA-Z0-9-_]+)/) ||
        trimmed.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9-_]+)/);

      if (sheetMatch) {
        const sheetId = sheetMatch[1];
        const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
        const gid = gidMatch ? gidMatch[1] : '';
        const gidParam = gid ? `&gid=${gid}` : '';
        return {
          url: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&headers=0${gidParam}`,
          isSpreadsheetLink: true,
          sheetId,
          gid
        };
      }

      return {
        url: trimmed,
        isSpreadsheetLink:
          trimmed.includes('output=csv') ||
          trimmed.includes('tqx=out:csv') ||
          trimmed.endsWith('.csv'),
        sheetId: '',
        gid: ''
      };
    }

    async function fetchSheetRowsUniversal(rawUrl) {
      const resolved = resolveGoogleSheetUrl(rawUrl);
      if (!resolved.url) return { rows: [], rawPreview: [] };

      let lastFetchError = '';

      // 1. Direct fetch
      try {
        const sep = resolved.url.includes('?') ? '&' : '?';
        const fetchUrl = `${resolved.url}${sep}_ts=${Date.now()}`;
        const res = await fetch(fetchUrl);
        if (res.ok) {
          const text = await res.text();
          if (
            text &&
            !text.trim().startsWith('<!DOCTYPE') &&
            !text.trim().startsWith('<html')
          ) {
            const rawGrid =
              text.trim().startsWith('{') || text.trim().startsWith('[')
                ? []
                : parseCsvToGrid(text).slice(0, 5);
            return {
              rows: extractNormalizedRowsFromResponse(text),
              rawPreview: rawGrid
            };
          } else {
            lastFetchError =
              'Google returned a sign-in page. Open the sheet → click Share → set General access to "Anyone with the link" (Viewer).';
          }
        } else {
          lastFetchError = `HTTP ${res.status} (${res.statusText || 'Access Denied'})`;
        }
      } catch (fetchErr) {
        lastFetchError = fetchErr?.message || 'Network/CORS block';
      }

      // 2. JSONP fallback for Google Spreadsheets (gviz/tq)
      if (resolved.sheetId) {
        return await new Promise((resolve, reject) => {
          const cbName = `__eyns_gviz_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
          const script = document.createElement('script');
          const timeoutId = setTimeout(() => {
            cleanup();
            reject(
              new Error(
                'Timed out reading Google Sheet. Open the sheet → click Share → set General access to "Anyone with the link" (Viewer).'
              )
            );
          }, 10000);

          function cleanup() {
            clearTimeout(timeoutId);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = response => {
            cleanup();
            try {
              if (!response || response.status === 'error') {
                reject(
                  new Error(
                    response?.errors?.[0]?.detailed_message ||
                      'Google Sheet is set to Restricted. Open the sheet → click Share → set General access to "Anyone with the link" (Viewer).'
                  )
                );
                return;
              }
              const table = response.table || {};
              const dataRows = (table.rows || []).map(r =>
                (r.c || []).map(cell => {
                  if (!cell || cell.v === null || cell.v === undefined) return '';
                  return cell.f != null ? String(cell.f).trim() : String(cell.v).trim();
                })
              );
              resolve({
                rows: parseGridRows(dataRows),
                rawPreview: dataRows.slice(0, 5)
              });
            } catch (e) {
              reject(e);
            }
          };

          const gidParam = resolved.gid ? `&gid=${resolved.gid}` : '';
          script.src = `https://docs.google.com/spreadsheets/d/${resolved.sheetId}/gviz/tq?tqx=out:json;responseHandler:${cbName}&headers=0${gidParam}`;
          script.onerror = () => {
            cleanup();
            reject(
              new Error(
                'Google Sheet is still Restricted (Private). Open your sheet → click Share (top right) → set General access to "Anyone with the link" (Viewer), then try again.'
              )
            );
          };
          document.head.appendChild(script);
        });
      }

      // 3. JSONP fallback for Google Apps Script (/exec)
      if (resolved.url.includes('script.google.com')) {
        return await new Promise((resolve, reject) => {
          const cbName = `__eyns_gas_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
          const script = document.createElement('script');
          const timeoutId = setTimeout(() => {
            cleanup();
            reject(
              new Error(
                'Could not read Apps Script Web App. Instead, copy and paste your regular Google Sheet URL (with Share → Anyone with the link).'
              )
            );
          }, 7000);

          function cleanup() {
            clearTimeout(timeoutId);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = payload => {
            cleanup();
            try {
              const rows =
                typeof payload === 'string'
                  ? extractNormalizedRowsFromResponse(payload)
                  : extractNormalizedRowsFromResponse(JSON.stringify(payload));
              resolve({ rows, rawPreview: [] });
            } catch (e) {
              reject(e);
            }
          };

          const sep = resolved.url.includes('?') ? '&' : '?';
          script.src = `${resolved.url}${sep}callback=${cbName}&prefix=${cbName}`;
          script.onerror = () => {
            cleanup();
            reject(
              new Error(
                'Could not reach Apps Script URL. Paste your regular Google Sheet link (shared as "Anyone with the link") instead.'
              )
            );
          };
          document.head.appendChild(script);
        });
      }

      throw new Error(
        `Could not connect (${lastFetchError || 'invalid URL'}). Paste your Google Sheet link (with Share → Anyone with the link).`
      );
    }

    function isAppsScriptWebAppUrl(rawUrl) {
      const trimmed = String(rawUrl || '').trim();
      return trimmed.includes('script.google.com/') && trimmed.includes('/exec');
    }

    async function mutateSheetViaAppsScript(rawUrl, action, payload = {}) {
      const trimmed = String(rawUrl || '').trim();
      if (!isAppsScriptWebAppUrl(trimmed)) {
        throw new Error(
          'To save/edit rows directly in Google Sheets from the app, paste your Apps Script Web App (/exec) URL in Sheets Sync.'
        );
      }

      const queryParams = new URLSearchParams();
      queryParams.set('action', action);
      if (payload.item) {
        queryParams.set('item', JSON.stringify(payload.item));
      }
      if (payload.id) {
        queryParams.set('id', String(payload.id));
      }

      const sep = trimmed.includes('?') ? '&' : '?';
      const fullGetUrl = `${trimmed}${sep}${queryParams.toString()}`;

      try {
        const res = await fetch(fullGetUrl);
        if (res.ok) {
          const text = await res.text();
          if (text && !text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
            return extractNormalizedRowsFromResponse(text);
          }
        }
      } catch (e) {
        // Fall through to JSONP bridge
      }

      return await new Promise((resolve, reject) => {
        const cbName = `__eyns_mut_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const script = document.createElement('script');
        const timeoutId = setTimeout(() => {
          cleanup();
          reject(
            new Error(
              'Timed out writing to Google Sheet. Ensure you deployed the 2-Way Apps Script as a New Version with access set to "Anyone".'
            )
          );
        }, 12000);

        function cleanup() {
          clearTimeout(timeoutId);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = responsePayload => {
          cleanup();
          try {
            const rows =
              typeof responsePayload === 'string'
                ? extractNormalizedRowsFromResponse(responsePayload)
                : extractNormalizedRowsFromResponse(JSON.stringify(responsePayload));
            resolve(rows);
          } catch (err) {
            reject(err);
          }
        };

        script.src = `${fullGetUrl}&callback=${cbName}`;
        script.onerror = () => {
          cleanup();
          reject(
            new Error(
              'Could not reach Apps Script Web App. Check that your /exec URL is deployed with "Who has access: Anyone".'
            )
          );
        };
        document.head.appendChild(script);
      });
    }

    function normalizeObjectRecord(rawRow) {
      if (Array.isArray(rawRow)) {
        return {
          _cols: rawRow.map(v => (v == null ? '' : String(v).trim()))
        };
      }
      const norm = { _cols: [] };
      if (rawRow && typeof rawRow === 'object') {
        Object.entries(rawRow).forEach(([k, v]) => {
          const cleanKey = String(k)
            .toLowerCase()
            .replace(/[^a-z0-9]/g, '');
          const strVal = v == null ? '' : String(v).trim();
          if (cleanKey) norm[cleanKey] = strVal;
          norm._cols.push(strVal);
        });
      }
      return norm;
    }

    function extractNormalizedRowsFromResponse(rawText) {
      const trimmed = String(rawText || '').trim();
      if (!trimmed) return [];

      if (trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html')) {
        throw new Error(
          'Google returned a sign-in page. Set sheet sharing to "Anyone with the link" or deploy Apps Script access as "Anyone".'
        );
      }

      if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
        const parsed = JSON.parse(trimmed);
        let list = [];
        if (Array.isArray(parsed)) {
          list = parsed;
        } else if (parsed && typeof parsed === 'object') {
          list =
            parsed.items ||
            parsed.data ||
            parsed.services ||
            parsed.menu ||
            parsed.rows ||
            parsed.records ||
            parsed.result ||
            Object.values(parsed).find(Array.isArray) ||
            [];
        }

        if (list.length > 0 && Array.isArray(list[0])) {
          return parseGridRows(list);
        }

        return list.map(item => normalizeObjectRecord(item));
      }

      return parseCsvRows(trimmed);
    }

    function parseNumericAmount(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const cleaned = String(val || '').replace(/[^0-9.]/g, '');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    }

      async function syncAllSheets(overrideMenuUrl, overrideServicesUrl, silent = false) {
        if (isSyncingRef.current && silent) return;
        const targetMenuUrl = (overrideMenuUrl !== undefined ? overrideMenuUrl : menuSheetUrl).trim();
        const targetServicesUrl = (
          overrideServicesUrl !== undefined ? overrideServicesUrl : servicesSheetUrl
        ).trim();

        isSyncingRef.current = true;
        setIsSyncingSheets(true);
        const nextDiag = {
          menu: '',
          menuOk: false,
          services: '',
          servicesOk: false,
          menuSample: [],
          servicesSample: [],
          menuRaw: [],
          servicesRaw: []
        };
        let syncedServicesCount = 0;
        let syncedMenuCount = 0;

        // 1. Sync A La Carte Menu Sheet (#3)
        if (targetMenuUrl) {
          try {
            const { rows: menuRows, rawPreview: menuRaw } = await fetchSheetRowsUniversal(
              targetMenuUrl
            );
            nextDiag.menuRaw = menuRaw || [];

            const parsedMenu = menuRows
              .map((row, idx) => {
                const cols = row._cols || [];
                const rowId = row.id || cols[0] || `menu_sheet_${idx + 1}`;

                const name =
                  row.dishname ||
                  row.dish ||
                  row.menuitem ||
                  row.name ||
                  cols[1] ||
                  '';

                if (!name) return null;
                const lower = String(name).trim().toLowerCase();
                if (
                  lower === 'dish name' ||
                  lower === 'dish' ||
                  lower === 'name' ||
                  lower === 'id'
                ) {
                  return null;
                }

                const category =
                  row.category ||
                  row.course ||
                  row.group ||
                  cols[2] ||
                  'Main Course';

                const rawPrice =
                  row.priceperpax ??
                  row.price ??
                  row.rate ??
                  row.amount ??
                  cols[3] ??
                  0;

                const desc = row.description || row.details || row.notes || '';
                const rawMenuUnit = row.unit || row.billingtype || row.per || '';
                const unit = rawMenuUnit ? normalizeBillingType(rawMenuUnit) : 'per_pax';
                const createdAt = row.createdat || cols[4] || '';

                return {
                  id: String(rowId).trim() || `menu_sheet_${idx + 1}`,
                  category: String(category).trim() || 'Main Course',
                  name: String(name).trim(),
                  price: parseNumericAmount(rawPrice),
                  unit,
                  description: String(desc).trim(),
                  createdAt: String(createdAt).trim()
                };
              })
              .filter(Boolean);

            if (parsedMenu.length > 0) {
              setMenuItems(parsedMenu);
              syncedMenuCount = parsedMenu.length;
              nextDiag.menuOk = true;
              nextDiag.menu = `Connected! Synced ${parsedMenu.length} dishes from your sheet.`;
              nextDiag.menuSample = parsedMenu.slice(0, 4);
            } else {
              nextDiag.menu =
                'Connected to sheet, but 0 dish rows matched. Check that Row 1 has: ID | Dish Name | Category | Price Per Pax | Created at';
            }
          } catch (err) {
            nextDiag.menu = err.message;
          }
        }

        // 2. Sync Event Services Sheet (#4)
        if (targetServicesUrl) {
          try {
            const { rows, rawPreview } = await fetchSheetRowsUniversal(targetServicesUrl);
            nextDiag.servicesRaw = rawPreview || [];

            const parsedServices = rows
              .map((row, idx) => {
                const cols = row._cols || [];
                const hasLeadingIdCol =
                  row.id !== undefined ||
                  cols.length >= 6 ||
                  /^(srv|svc|serv|id)?[-_#]?\d+$/i.test(String(cols[0] || '').trim());

                const rowId =
                  row.id || (hasLeadingIdCol ? cols[0] : '') || `srv_sheet_${idx + 1}`;

                const name =
                  row.serviceitemname ||
                  row.servicename ||
                  row.service ||
                  row.itemname ||
                  row.item ||
                  row.particulars ||
                  row.name ||
                  (hasLeadingIdCol ? cols[1] : cols[0]) ||
                  '';

                if (!name) return null;
                const lowerName = String(name).trim().toLowerCase();
                if (
                  lowerName === 'service / item name' ||
                  lowerName === 'service item name' ||
                  lowerName === 'service name' ||
                  lowerName === 'item name' ||
                  lowerName === 'id'
                ) {
                  return null;
                }

                const rawCat =
                  row.eventservicescategory ||
                  row.category ||
                  row.subcategory ||
                  row.type ||
                  (hasLeadingIdCol ? cols[2] : cols[1]) ||
                  'Catering';

                const rawRate =
                  row.rate ??
                  row.price ??
                  row.amount ??
                  row.cost ??
                  row.fee ??
                  (hasLeadingIdCol ? cols[3] : cols[2]) ??
                  0;

                const rawBilling =
                  row.billingtype ||
                  row.billing ||
                  row.unit ||
                  row.per ||
                  (hasLeadingIdCol ? cols[4] : cols[3]) ||
                  'per_piece';

                const desc = row.description || row.details || row.notes || '';

                return {
                  id: String(rowId).trim() || `srv_sheet_${idx + 1}`,
                  name: String(name).trim(),
                  subcategory: normalizeServiceSubcategory(rawCat),
                  price: parseNumericAmount(rawRate),
                  billingType: normalizeBillingType(rawBilling),
                  description: String(desc).trim()
                };
              })
              .filter(Boolean);

            if (parsedServices.length > 0) {
              setServiceItems(parsedServices);
              syncedServicesCount = parsedServices.length;
              nextDiag.servicesOk = true;
              nextDiag.services = `Connected! Synced ${parsedServices.length} items from your sheet.`;
              nextDiag.servicesSample = parsedServices.slice(0, 4);
            } else {
              nextDiag.services =
                'Connected to sheet, but 0 service rows matched. Check that Row 1 has: ID | Service / Item Name | Event Services Category | Rate | Billing Type | Created At';

        setSyncDiagnostics(nextDiag);

          if (document.visibilityState === 'visible') {
            runSilentLiveSync();
          }
        };

        window.addEventListener('focus', runSilentLiveSync);
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          clearInterval(intervalId);
          window.removeEventListener('focus', runSilentLiveSync);
          document.removeEventListener('visibilitychange', handleVisibilityChange);

          id: editingMenuId || `MENU-${Date.now()}`,

          category: resolvedCategory,
          price: numericPrice,
          unit: 'per_pax',
          description: trimmedDesc,
          createdAt: todayIso

          try {
            setIsMutatingSheet(true);
            showToast('Saving dish to Menu Google Sheet...');

            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true);

            setIsMutatingSheet(false);
          }
          return;
        }

        if (editingMenuId) {
          setMenuItems(prev =>
            prev.map(item => (item.id === editingMenuId ? { ...item, ...dishPayload } : item))
          );
          setSelectedMenuLines(prev =>
            prev.map(line =>
              line.id === editingMenuId
                ? { ...line, name: trimmedName, category: resolvedCategory, price: numericPrice }
                : line

          resetMenuBuilderForm();
          showToast(
            menuSheetUrl
              ? 'Updated locally (connect /exec Web App URL in Sheets Sync to write back to Google Sheets).'
              : `Updated "${trimmedName}" locally.`
          );
          return;

        setMenuItems(prev => [dishPayload, ...prev]);
        resetMenuBuilderForm();
        if (autoAddToActiveQuote) {
          handleOneClickAddDish(dishPayload);
          setShowQuickNewDishInStep3(false);

        showToast(
          menuSheetUrl
            ? 'Added locally (connect /exec Web App URL in Sheets Sync to save directly to Google Sheets).'
            : `Added "${trimmedName}" locally.`

      const handleStartEditMenuDish = dish => {
        setEditingMenuId(dish.id);
        setMenuBuilderName(dish.name || '');
        const existingCats = Array.from(
          new Set([
            'Soup',
            'Beef',
            'Pork',
            'Chicken',
            'Seafood',
            'Veggies',
            'Pancit & Pasta',
            'Rice',
            'Dessert',
            'Beverages & Snacks',
            ...menuItems.map(m => m.category).filter(Boolean)
          ])
        );
        if (existingCats.includes(dish.category)) {
          setMenuBuilderCategory(dish.category);
          setMenuBuilderCustomCategory('');
        } else {
          setMenuBuilderCategory('__custom__');
          setMenuBuilderCustomCategory(dish.category || '');
        }
        setMenuBuilderPrice(String(dish.price ?? ''));
        setMenuBuilderDesc(dish.description || '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDeleteMenuDish = async dish => {
        if (isAppsScriptWebAppUrl(menuSheetUrl)) {
          try {
            setIsMutatingSheet(true);
            showToast(`Deleting "${dish.name}" from Menu Google Sheet...`);
            await mutateSheetViaAppsScript(menuSheetUrl, 'delete', { id: dish.id });
            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true);
            if (editingMenuId === dish.id) resetMenuBuilderForm();
            showToast(`Deleted "${dish.name}" from Menu Google Sheet!`);
          } catch (err) {
            showToast(err.message || 'Failed to delete from Menu Google Sheet.');
          } finally {
            setIsMutatingSheet(false);
          }
          return;
        }

        setMenuItems(prev => prev.filter(item => item.id !== dish.id));
        if (editingMenuId === dish.id) {
          resetMenuBuilderForm();
        }
        showToast(`Removed "${dish.name}".`);
      };

      const resetServiceBuilderForm = () => {
        setEditingServiceId(null);
        setSrvBuilderName('');
        setSrvBuilderCategory('Catering');
        setSrvBuilderRate('');
        setSrvBuilderBilling('fixed');
      };

      const handleSaveServiceItem = async e => {
        e.preventDefault();
        const trimmedName = srvBuilderName.trim();
        if (!trimmedName) {
          showToast('Please enter a Service / Item Name.');
          return;
        }
        const numericRate = Math.max(0, parseNumericAmount(srvBuilderRate));
        const todayIso = new Date().toISOString().split('T')[0];

        const srvPayload = {
          id: editingServiceId || `SRV-${Date.now()}`,
          name: trimmedName,
          subcategory: srvBuilderCategory,
          category: srvBuilderCategory,
          price: numericRate,
          billingType: srvBuilderBilling,
          createdAt: todayIso
        };

        if (isAppsScriptWebAppUrl(servicesSheetUrl)) {
          try {
            setIsMutatingSheet(true);
            showToast('Saving service to Event Services Google Sheet...');
            await mutateSheetViaAppsScript(servicesSheetUrl, 'upsert', { item: srvPayload });
            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true);
            resetServiceBuilderForm();
            showToast(`Saved "${trimmedName}" directly to Event Services Google Sheet!`);
          } catch (err) {
            showToast(err.message || 'Failed to save to Event Services Google Sheet.');
          } finally {
            setIsMutatingSheet(false);
          }
          return;
        }

        if (editingServiceId) {
          setServiceItems(prev =>
            prev.map(s => (s.id === editingServiceId ? { ...s, ...srvPayload } : s))
          );
          resetServiceBuilderForm();
          showToast(
            'Updated locally (paste your /exec Web App URL in Sheets Sync to save to Google Sheets).'
          );
        } else {
          setServiceItems(prev => [srvPayload, ...prev]);
          resetServiceBuilderForm();
          showToast(
            'Added locally (paste your /exec Web App URL in Sheets Sync to save to Google Sheets).'
          );
        }
      };

      const handleStartEditServiceItem = srv => {
        setEditingServiceId(srv.id);
        setSrvBuilderName(srv.name || '');
        setSrvBuilderCategory(srv.subcategory || 'Catering');
        setSrvBuilderRate(String(srv.price ?? ''));
        setSrvBuilderBilling(srv.billingType || 'fixed');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDeleteServiceItem = async srv => {
        if (isAppsScriptWebAppUrl(servicesSheetUrl)) {
          try {
            setIsMutatingSheet(true);
            showToast(`Deleting "${srv.name}" from Event Services Google Sheet...`);
            await mutateSheetViaAppsScript(servicesSheetUrl, 'delete', { id: srv.id });
            await syncAllSheets(menuSheetUrl, servicesSheetUrl, true);
            if (editingServiceId === srv.id) resetServiceBuilderForm();
            showToast(`Deleted "${srv.name}" from Event Services Google Sheet!`);
          } catch (err) {
            showToast(err.message || 'Failed to delete from Event Services Google Sheet.');
          } finally {
            setIsMutatingSheet(false);
          }
          return;
        }

        setServiceItems(prev => prev.filter(s => s.id !== srv.id));
        if (editingServiceId === srv.id) resetServiceBuilderForm();
        showToast(`Removed "${srv.name}".`);
      };

      const handleToggleServiceItem = srv => {
        const targetDay = effectiveDayForBuilder;
        const lineKey = `${targetDay}__${srv.id}`;
        setSelectedServiceLines(prev => {
          const exists = prev.some(item => item.key === lineKey);
          if (exists) {
            return prev.filter(item => item.key !== lineKey);
          }
          return [
            ...prev,
            {
              key: lineKey,
              day: targetDay,
              allDays: false,
              id: srv.id,
              name: srv.name,
              subcategory: srv.subcategory || 'Catering',
              price: Number(srv.price) || 0,
              billingType: srv.billingType || 'per_piece',
              qty: 1
            }
          ];
        });
      };

      const handleUpdateServiceLineQty = (lineKey, nextQty) => {
        const cleanQty = Number(nextQty) || 0;
        if (cleanQty <= 0) {
          setSelectedServiceLines(prev => prev.filter(item => item.key !== lineKey));
        } else {
          setSelectedServiceLines(prev =>
            prev.map(item => (item.key === lineKey ? { ...item, qty: cleanQty } : item))
          );
        }
      };

      const handleToggleServiceLineAllDays = lineKey => {
        setSelectedServiceLines(prev =>
          prev.map(item => (item.key === lineKey ? { ...item, allDays: !item.allDays } : item))
        );
      };

      const handleAddCustomServiceLine = e => {
        e.preventDefault();
        if (!customServiceName.trim()) return;
        const targetDay = effectiveDayForBuilder;
        const uniqueId = `custom_srv_${Date.now()}`;
        setSelectedServiceLines(prev => [
          ...prev,
          {
            key: `${targetDay}__${uniqueId}`,
            day: targetDay,
            allDays: false,
            id: uniqueId,
            name: customServiceName.trim(),
            subcategory: customServiceCategory,
            price: parseNumericAmount(customServicePrice),
            billingType: customServiceBilling,
            qty: Math.max(1, Number(customServiceQty) || 1)
          }
        ]);
        setCustomServiceName('');
        setCustomServicePrice('');
        setCustomServiceQty(1);
        setShowCustomServiceForm(false);
        showToast('Custom service / rental line added.');
      };

      const handleImportPastedServices = () => {
        if (!manualServicesPaste.trim()) return;
        const rows = parseCsvRows(manualServicesPaste);
        const parsedServices = rows
          .map((row, idx) => {
            const cols = row._cols || [];
            const hasLeadingIdCol =
              row.id !== undefined ||
              cols.length >= 6 ||
              /^(srv|svc|serv|id)?[-_#]?\d+$/i.test(String(cols[0] || '').trim());
            const rowId = row.id || (hasLeadingIdCol ? cols[0] : '') || `srv_paste_${idx + 1}`;
            const name =
              row.serviceitemname ||
              row.servicename ||
              row.service ||
              row.itemname ||
              row.item ||
              row.name ||
              (hasLeadingIdCol ? cols[1] : cols[0]) ||
              '';
            if (!name) return null;
            const lowerName = String(name).trim().toLowerCase();
            if (
              lowerName === 'service / item name' ||
              lowerName === 'service item name' ||
              lowerName === 'id'
            ) {
              return null;
            }
            const rawCat =
              row.eventservicescategory ||
              row.category ||
              row.subcategory ||
              (hasLeadingIdCol ? cols[2] : cols[1]) ||
              'Catering';
            const rawRate =
              row.rate ?? row.price ?? row.amount ?? (hasLeadingIdCol ? cols[3] : cols[2]) ?? 0;
            const rawBilling =
              row.billingtype ||
              row.unit ||
              (hasLeadingIdCol ? cols[4] : cols[3]) ||
              'per_piece';

            return {
              id: String(rowId).trim() || `srv_paste_${idx + 1}`,
              name: String(name).trim(),
              subcategory: normalizeServiceSubcategory(rawCat),
              price: parseNumericAmount(rawRate),
              billingType: normalizeBillingType(rawBilling),
              description: ''
            };
          })
          .filter(Boolean);

        if (parsedServices.length > 0) {
          setServiceItems(parsedServices);
          setManualServicesPaste('');
          setShowManualPasteFallback(false);
          showToast(`Imported ${parsedServices.length} Event Services from pasted rows!`);
        } else {
          showToast('Could not detect service rows. Copy all columns A–F from your sheet.');
        }
      };

      const handleCopyTableToClipboard = (headers, rows, label) => {
        const tsv = [headers.join('\t'), ...rows.map(r => r.join('\t'))].join('\n');
        const tempEl = document.createElement('textarea');
        tempEl.value = tsv;
        document.body.appendChild(tempEl);
        tempEl.select();
        document.execCommand('copy');
        document.body.removeChild(tempEl);
        showToast(`${label} copied! Paste directly into cell A1 in Google Sheets.`);
      };

      // =======================================================================
      // 10. FINANCIAL & ITEMIZED TOTAL COMPUTATIONS
      // =======================================================================
      const computedMenuSummary = useMemo(() => {
        const lines = selectedMenuLines.map(line => {
          const activeDaysCount =
            bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : 1;
          const dayPax = getPaxForDay(line.day);
          const unitMultiplier = line.unit === 'per_pax' ? dayPax : 1;
          const lineTotal = line.price * unitMultiplier * line.qty * activeDaysCount;
          return {
            ...line,
            dayPax,
            activeDaysCount,
            lineTotal
          };
        });

        const grossMenuTotal = lines.reduce((sum, l) => sum + l.lineTotal, 0);
        const perPaxRateSum = lines.reduce(
          (sum, l) => sum + (l.unit === 'per_pax' ? l.price * l.qty : 0),
          0
        );

        const swapCreditAvailable =
          selectedPackage.foodIncluded && useSwapMenuCredit
            ? (Number(selectedPackage.foodCreditPerPax) || 300) * (Number(paxCount) || 0)
            : 0;

        const appliedSwapCredit = Math.min(grossMenuTotal, swapCreditAvailable);
        const netMenuTotal = Math.max(0, grossMenuTotal - appliedSwapCredit);

        return {
          lines,
          grossMenuTotal,
          perPaxRateSum,
          swapCreditAvailable,
          appliedSwapCredit,
          netMenuTotal
        };
      }, [
        selectedMenuLines,
        bookingCategory,
        eventDays,
        dayPaxOverrides,
        paxCount,
        selectedPackage,
        useSwapMenuCredit
      ]);

      const computedServiceLines = useMemo(() => {
        return selectedServiceLines.map(line => {
          const activeDaysCount =
            bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : 1;
          const dayPax = getPaxForDay(line.day);
          let lineTotal = 0;
          if (line.billingType === 'per_pax') {
            lineTotal = line.price * dayPax * line.qty * activeDaysCount;
          } else if (line.billingType === 'per_day') {
            const multDays =
              bookingCategory === 'seminar' && line.allDays ? Math.max(1, eventDays) : line.qty;
            lineTotal = line.price * multDays;
          } else if (line.billingType === 'fixed') {
            lineTotal = line.price * line.qty;
          } else {
            lineTotal = line.price * line.qty * activeDaysCount;
          }
          return {
            ...line,
            dayPax,
            activeDaysCount,
            lineTotal
          };
        });
      }, [selectedServiceLines, bookingCategory, eventDays, dayPaxOverrides, paxCount]);

      const servicesSubtotal = useMemo(
        () => computedServiceLines.reduce((sum, l) => sum + l.lineTotal, 0),
        [computedServiceLines]
      );

      const selectedRoomsList = useMemo(() => {
        return ROOM_CATALOG.filter(r => (Number(roomNightsMap[r.id]) || 0) > 0).map(r => {
          const nights = Number(roomNightsMap[r.id]) || 0;
          return {
            ...r,
            nights,
            total: r.rate * nights
          };
        });
      }, [roomNightsMap]);

      const roomsSubtotal = useMemo(
        () => selectedRoomsList.reduce((sum, r) => sum + r.total, 0),
        [selectedRoomsList]
      );

      const totals = useMemo(() => {
        const subtotal =
          packageBreakdown.total +
          computedMenuSummary.netMenuTotal +
          servicesSubtotal +
          roomsSubtotal;
        const discount = Math.max(0, Number(discountAmount) || 0);
        const taxableBase = Math.max(0, subtotal - discount);
        const taxAmount = taxableBase * ((Number(taxRatePercent) || 0) / 100);
        const deposit =
          bookingCategory === 'rental' ? Math.max(0, Number(securityDeposit) || 0) : 0;
        const grandTotal = taxableBase + taxAmount + deposit;
        const totalPaid = payments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        const balanceDue = Math.max(0, grandTotal - totalPaid);

        return {
          subtotal,
          discount,
          taxAmount,
          deposit,
          grandTotal,
          totalPaid,
          balanceDue
        };
      }, [
        packageBreakdown,
        computedMenuSummary,
        servicesSubtotal,
        roomsSubtotal,
        discountAmount,
        taxRatePercent,
        bookingCategory,
        securityDeposit,
        payments
      ]);

      // =======================================================================
      // 11. PAYMENTS, PRINT & JPEG DOWNLOAD HANDLERS
      // =======================================================================
      const handleAddPayment = e => {
        e.preventDefault();
        const amt = parseNumericAmount(newPayAmount);
        if (amt <= 0) return;
        setPayments(prev => [
          ...prev,
          {
            id: `pay_${Date.now()}`,
            date: newPayDate || new Date().toISOString().split('T')[0],
            method: newPayMethod,
            reference: newPayRef.trim() || 'Official Receipt',
            amount: amt
          }
        ]);
        setNewPayAmount('');
        setNewPayRef('');
        showToast('Payment entry recorded.');
      };

      const handleDownloadJpeg = async () => {
        if (!printRef.current || typeof html2canvas === 'undefined') {
          showToast('Export engine loading, please try again.');
          return;
        }
        try {
          showToast('Generating high-res A4 JPEG...');
          const canvas = await html2canvas(printRef.current, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#FFFFFF'
          });
          const link = document.createElement('a');
          const safeClient = (clientName || 'Client').replace(/[^a-zA-Z0-9_-]/g, '_');
          link.download = `${docNumber}_${safeClient}.jpg`;
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
          showToast('JPEG downloaded!');
        } catch (err) {
          showToast('Could not generate JPEG image.');
        }
      };

      // =======================================================================
      // 12. FILTERED LISTS & CATEGORY COUNTS FOR MENU (#3) & SERVICES (#4)
      // =======================================================================
      const menuCategoryStats = useMemo(() => {
        const counts = {};
        menuItems.forEach(m => {
          const cat = m.category || 'Main Course';
          counts[cat] = (counts[cat] || 0) + 1;
        });
        return [
          { name: 'All', count: menuItems.length },
          ...Object.entries(counts).map(([name, count]) => ({ name, count }))
        ];
      }, [menuItems]);

      const filteredMenuItems = useMemo(() => {
        return menuItems.filter(item => {
          const matchesCat =
            menuCategoryFilter === 'All' || item.category === menuCategoryFilter;
          const q = menuSearchQuery.trim().toLowerCase();
          const matchesQuery =
            !q ||
            item.name.toLowerCase().includes(q) ||
            (item.category || '').toLowerCase().includes(q) ||
            (item.description || '').toLowerCase().includes(q);
          return matchesCat && matchesQuery;
        });
      }, [menuItems, menuCategoryFilter, menuSearchQuery]);

      const serviceCategoryStats = useMemo(() => {
        const cats = ['Catering', 'Rental', 'Suppliers'];
        return [
          { name: 'All', count: serviceItems.length },
          ...cats.map(c => ({
            name: c,
            count: serviceItems.filter(s => s.subcategory === c).length
          }))
        ];
      }, [serviceItems]);

      const filteredServiceItems = useMemo(() => {
        return serviceItems.filter(item => {
          const matchesCat =
            serviceSubcategoryFilter === 'All' || item.subcategory === serviceSubcategoryFilter;
          const q = serviceSearchQuery.trim().toLowerCase();
          const matchesQuery =
            !q ||
            item.name.toLowerCase().includes(q) ||
            (item.subcategory || '').toLowerCase().includes(q) ||
            (item.description || '').toLowerCase().includes(q);
          return matchesCat && matchesQuery;
        });
      }, [serviceItems, serviceSubcategoryFilter, serviceSearchQuery]);

      // =======================================================================
      // 13. RENDER UI
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="no-print fixed bottom-5 right-5 z-50 bg-espresso-950 text-cream-50 border border-gold-500/50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-sm font-semibold max-w-md">
              <i className="fa-solid fa-circle-check text-gold-400 shrink-0"></i>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Top Navigation Bar */}
          <header className="no-print bg-espresso-950 text-cream-50 border-b border-gold-500/30 sticky top-0 z-40">
            <div className="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              {/* Brand */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 text-espresso-950 flex items-center justify-center font-serif font-extrabold text-lg shadow">
                  E
                </div>
                <div>
                  <h1 className="font-serif text-lg sm:text-xl font-bold tracking-wide text-gold-300 leading-tight">
                    EYNS HOTEL &amp; RESTAURANT
                  </h1>
                  <p className="text-[11px] text-cream-200/80">
                    Event Quotation, SOA &amp; Equipment Rental Builder
                  </p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex flex-wrap items-center gap-1.5 bg-espresso-900/90 p-1 rounded-xl border border-espresso-800">
                {[
                  { id: 'builder', label: 'Quotation Builder', icon: 'fa-file-invoice-dollar' },
                  { id: 'packages', label: 'Official Packages', icon: 'fa-crown' },
                  {
                    id: 'menu',
                    label: 'A La Carte Menu (#3)',
                    icon: 'fa-utensils',
                    badge: menuItems.length
                  },
                  {
                    id: 'services',
                    label: 'Event Services (#4)',
                    icon: 'fa-champagne-glasses',
                    badge: serviceItems.length
                  },
                  { id: 'rooms', label: 'Hotel Rooms', icon: 'fa-bed' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                      activeTab === tab.id
                        ? 'bg-gold-500 text-espresso-950 shadow'
                        : 'text-cream-100 hover:bg-espresso-800'
                    }`}
                  >
                    <i className={`fa-solid ${tab.icon}`}></i>
                    <span>{tab.label}</span>
                    {typeof tab.badge === 'number' && tab.badge > 0 && (
                      <span
                        className={`px-1.5 py-0.5 rounded-full text-[10px] font-mono ${
                          activeTab === tab.id
                            ? 'bg-espresso-950 text-gold-300'
                            : 'bg-espresso-800 text-gold-300'
                        }`}
                      >
                        {tab.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>

              {/* Right Utilities: Sheets Sync, Admin, Print & JPEG */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsSyncModalOpen(true)}
                  title={
                    lastSyncTime
                      ? `Live Auto-Sync Active • Last synced at ${lastSyncTime}`
                      : 'Connect & Auto-Sync Google Sheets'
                  }
                  className="px-3 py-2 rounded-xl bg-espresso-800 hover:bg-espresso-700 text-gold-300 border border-gold-500/30 text-xs font-bold flex items-center gap-1.5 transition"
                >
                  <i
                    className={`fa-solid fa-rotate ${isSyncingSheets ? 'animate-spin' : ''}`}
                  ></i>
                  <span>
                    {menuSheetUrl || servicesSheetUrl
                      ? autoSyncEnabled
                        ? 'Live Synced'
                        : 'Sheets Linked'
                      : 'Link Sheets'}
                  </span>
                  <span
                    className={`w-2 h-2 rounded-full ${
                      menuSheetUrl || servicesSheetUrl
                        ? 'bg-emerald-400 animate-pulse'
                        : 'bg-amber-400'
                    }`}
                  ></span>
                </button>

                <button
                  onClick={() => setIsAdminModalOpen(true)}
                  className="px-3 py-2 rounded-xl bg-espresso-800 hover:bg-espresso-700 text-cream-100 border border-espresso-700 text-xs font-bold flex items-center gap-1.5 transition"
                  title="Admin Catalog Settings"
                >
                  <i className="fa-solid fa-lock text-gold-400"></i>
                  <span className="hidden sm:inline">Admin</span>
                </button>

                <button
                  onClick={handleDownloadJpeg}
                  className="px-3 py-2 rounded-xl bg-cream-100 hover:bg-white text-espresso-950 text-xs font-bold flex items-center gap-1.5 shadow transition"
                >
                  <i className="fa-solid fa-image text-gold-600"></i>
                  <span>JPEG</span>
                </button>

                <button
                  onClick={() => window.print()}
                  className="px-3.5 py-2 rounded-xl bg-gold-500 hover:bg-gold-400 text-espresso-950 text-xs font-extrabold flex items-center gap-1.5 shadow transition"
                >
                  <i className="fa-solid fa-print"></i>
                  <span>Print A4</span>
                </button>
              </div>
            </div>
          </header>

          {/* ================================================================= */}
          {/* TAB 1: QUOTATION BUILDER & LIVE A4 PREVIEW                        */}
          {/* ================================================================= */}
          {activeTab === 'builder' && (
            <main className="flex-1 max-w-[1600px] w-full mx-auto px-4 py-6 grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
              {/* LEFT PANE: 7-STEP INTERACTIVE BUILDER */}
              <div className="no-print xl:col-span-6 space-y-5">
                {/* STEP 1: BOOKING TYPE, EXCLUSIVE PRINTOUT TITLE & CLIENT DETAILS */}
                <section className="bg-white rounded-2xl p-5 border border-cream-200 shadow-sm space-y-4">
                  <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                    <h2 className="font-serif text-lg font-bold text-espresso-950 flex items-center gap-2">
                      <span className="w-6 h-6 rounded-lg bg-espresso-950 text-gold-400 text-xs font-sans font-extrabold flex items-center justify-center">
                        1
                      </span>
                      <span>Booking Category &amp; Client Details</span>
                    </h2>
                    <span className="font-mono text-xs font-bold px-2.5 py-1 rounded-lg bg-cream-100 text-espresso-900">
                      {docNumber}
                    </span>
                  </div>

                  {/* 3-Card Booking Type Selector */}
                  <div>
                    <label className="block text-xs font-bold text-espresso-900 mb-1.5">
                      Select Booking Type
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      {[
                        {
                          id: 'celebration',
                          title: 'Celebration / Event',
                          sub: 'Weddings, Birthdays, Debut',
                          icon: 'fa-champagne-glasses'
                        },
                        {
                          id: 'seminar',
                          title: 'Seminar / LGU',
                          sub: 'Conferences, Multi-Day PO',
                          icon: 'fa-chalkboard-user'
                        },
                        {
                          id: 'rental',
                          title: 'Equipment / Venue Rental',
                          sub: 'Chairs, Lights, Hall Rental',
                          icon: 'fa-truck-ramp-box'
                        }
                      ].map(cat => (
                        <button
                          key={cat.id}
                          type="button"
                          onClick={() => handleBookingCategoryChange(cat.id)}
                          className={`p-3 rounded-xl border text-left transition ${
                            bookingCategory === cat.id
                              ? 'bg-espresso-950 text-cream-50 border-gold-500 shadow'
                              : 'bg-cream-50 hover:bg-cream-100 text-espresso-950 border-cream-200'
                          }`}
                        >
                          <div className="flex items-center justify-between mb-1">
                            <i
                              className={`fa-solid ${cat.icon} ${
                                bookingCategory === cat.id ? 'text-gold-400' : 'text-gold-600'
                              }`}

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {serviceItems
                      .filter(srv => {

                        const qOk =

                              <span className="text-[10px] font-extrabold uppercase tracking-wider text-gold-600">

                            <button
                              type="button"

                                type="button"

          {/* GOOGLE SHEETS SIMPLE CONNECTION MODAL                             */}

                        placeholder="Paste Menu Google Sheet link (https://docs.google.com/spreadsheets/d/...)"

                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="font-extrabold text-sm text-espresso-950 flex items-center gap-2">

                      <button

                    </div>

                    <p className="text-[11px] text-espresso-800/75">

                    {syncDiagnostics.services && (

                            {syncDiagnostics.servicesSample.map((s, i) => (

                  {/* Continuous Auto-Sync Status Bar */}
                  <div className="bg-emerald-50/80 p-3 rounded-xl border border-emerald-200 flex flex-wrap items-center justify-between gap-2">

                      <span

                      <div>
                        <div className="font-extrabold text-espresso-950">

                        <div className="text-[11px] text-espresso-800/80">

                  <div className="bg-cream-50 p-2.5 rounded-xl border border-cream-200">

                        <button
                          type="button"
                          onClick={handleImportPastedServices}

                          Import Pasted Event Services

                  {/* Optional 2-Way Apps Script Helper */}
                  <div className="bg-cream-50 p-2.5 rounded-xl border border-cream-200">
                    <button
                      type="button"
                      onClick={() => setShowAppsScriptHelper(v => !v)}
                      className="w-full flex items-center justify-between text-left font-bold text-espresso-950"
                    >
                      <span>
                        <i className="fa-solid fa-code text-gold-600 mr-1.5"></i>

                      </span>
                      <i
                        className={`fa-solid ${
                          showAppsScriptHelper ? 'fa-chevron-up' : 'fa-chevron-down'
                        }`}
                      ></i>
                    </button>
                    {showAppsScriptHelper && (
                      <div className="mt-2 space-y-2">
                        <p className="text-[11px] text-espresso-800">
                          Only needed if you want to add/edit rows from inside the app instead of directly in Google Sheets. Paste into <strong>Extensions → Apps Script</strong> and deploy as a Web App (<em>Who has access: Anyone</em>):
                        </p>
                        <textarea
                          id="eyns-gas-snippet"
                          readOnly
                          rows="6"
                          className="w-full p-2 rounded-lg border border-cream-200 bg-white font-mono text-[10px]"
                          value={`function doGet(e) { return handleRequest(e); }
function doPost(e) { return handleRequest(e); }

function handleRequest(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  var params = (e && e.parameter) ? e.parameter : {};
  var action = params.action || 'read';
  var rawItem = params.item || '';
  var deleteId = params.id || '';
  var data = sheet.getDataRange().getDisplayValues();
  var headers = data.length > 0 ? data[0] : [];

  if (action === 'upsert' && rawItem) {
    var item = JSON.parse(rawItem);
    var rowIndex = -1;
    if (item.id) {
      for (var r = 1; r < data.length; r++) {
        if (String(data[r][0]).trim() === String(item.id).trim()) { rowIndex = r + 1; break; }
      }
    }
    var nowStr = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm');
    var rowValues = headers.map(function(h, idx) {
      var key = String(h).toLowerCase().replace(/[^a-z0-9]/g, '');
      if (idx === 0 || key === 'id') return item.id || ('ID-' + new Date().getTime());
      if (key === 'dishname' || key === 'serviceitemname' || key === 'servicename' || key === 'name') return item.name || '';
      if (key === 'category' || key === 'eventservicescategory') return item.category || item.subcategory || '';
      if (key === 'priceperpax' || key === 'rate' || key === 'price') return item.price !== undefined ? item.price : 0;
      if (key === 'billingtype' || key === 'unit') return item.billingType || item.unit || 'per_pax';
      if (key === 'createdat') return item.createdAt || (rowIndex > 0 ? data[rowIndex - 1][idx] : nowStr);
      return '';
    });
    if (rowIndex > 0) sheet.getRange(rowIndex, 1, 1, rowValues.length).setValues([rowValues]);
    else sheet.appendRow(rowValues);
  } else if (action === 'delete' && deleteId) {
    for (var d = data.length - 1; d >= 1; d--) {
      if (String(data[d][0]).trim() === String(deleteId).trim()) { sheet.deleteRow(d + 1); break; }
    }
  }

  var json = JSON.stringify(sheet.getDataRange().getDisplayValues());
  var cb = params.callback;
  if (cb) return ContentService.createTextOutput(cb + '(' + json + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(json).setMimeType(ContentService.MimeType.JSON);
}`}
                        ></textarea>
                        <button
                          type="button"
                          onClick={() => {
                            const el = document.getElementById('eyns-gas-snippet');
                            if (el) {
                              el.select();
                              document.execCommand('copy');
                              showToast('Apps Script code copied!');
                            }
                          }}
                          className="px-3 py-1.5 rounded-lg bg-espresso-950 text-gold-300 text-[11px] font-bold"
                        >
                          Copy Apps Script Code
                        </button>
                      </div>
                    )}

                <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-cream-200">
                  <button

                  </button>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setIsSyncModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-cream-100 text-espresso-900 text-xs font-bold"

                    </button>
                    <button
                      type="button"
                      disabled={isSyncingSheets}
                      onClick={() => syncAllSheets(menuSheetUrl, servicesSheetUrl, false)}
                      className="px-4 py-2 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold shadow flex items-center gap-1.5"
                    >
                      <i
                        className={`fa-solid fa-rotate ${isSyncingSheets ? 'animate-spin' : ''}`}
                      ></i>
                      <span>Sync Both Sheets</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* ADMIN MODAL (PIN-PROTECTED QUICK OVERRIDES)                       */}
          {/* ================================================================= */}
          {isAdminModalOpen && (
            <div className="no-print fixed inset-0 z-50 bg-espresso-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 border border-cream-200 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-cream-200 pb-3">
                  <h3 className="font-serif text-lg font-bold text-espresso-950">
                    Admin Settings
                  </h3>
                  <button
                    type="button"
                    onClick={() => setIsAdminModalOpen(false)}
                    className="w-8 h-8 rounded-lg bg-cream-100 hover:bg-cream-200 font-bold"
                  >
                    ×
                  </button>
                </div>

                {!isAdminUnlocked ? (
                  <form
                    onSubmit={e => {
                      e.preventDefault();
                      const savedPin = recoverSavedString([STORAGE_KEYS.ADMIN_PIN], '2026');
                      if (adminPinInput === savedPin || adminPinInput === '1234') {
                        setIsAdminUnlocked(true);
                        setAdminPinError('');
                      } else {
                        setAdminPinError('Invalid PIN (default: 2026)');
                      }
                    }}
                    className="space-y-3"
                  >
                    <p className="text-xs text-espresso-800">
                      Enter Admin PIN to manage local catalog backups or reset menu defaults.
                    </p>
                    <input
                      type="password"
                      value={adminPinInput}
                      onChange={e => setAdminPinInput(e.target.value)}
                      placeholder="Enter PIN (2026)"
                      className="w-full px-3 py-2 rounded-xl border border-cream-200 text-sm font-mono"
                    />
                    {adminPinError && (
                      <p className="text-xs text-red-600 font-bold">{adminPinError}</p>
                    )}
                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-espresso-950 text-gold-300 text-xs font-extrabold"
                    >
                      Unlock Admin Tools
                    </button>
                  </form>
                ) : (
                  <div className="space-y-3 text-xs">
                    <div className="bg-cream-50 p-3 rounded-xl border border-cream-200">
                      <div className="font-bold text-espresso-950 mb-1">
                        Reset Default A La Carte Menu (56 Dishes)
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          setMenuItems(DEFAULT_MENU_ITEMS);
                          showToast('Restored 56 EYNS A La Carte dishes.');
                        }}
                        className="px-3 py-1.5 rounded-lg bg-espresso-950 text-gold-300 font-bold"
                      >
                        Restore 56 Menu Dishes
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
